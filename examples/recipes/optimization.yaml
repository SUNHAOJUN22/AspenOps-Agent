backend: mock
case: ../mock_case.json
variables:
  - key: block.input.temperature
    identifiers: {block: R-101}
    unit: C
    lower: 360
    upper: 520
  - key: block.input.residence_time
    identifiers: {block: R-101}
    unit: h
    lower: 0.5
    upper: 6.0
objective: "-product_yield_rate + 20 * reactor_duty"
constraints:
  - expression: conversion
    relation: ">="
    rhs: 0.90
optimizer:
  population_size: 12
  generations: 20
  seed: 2026
