version: 1
nodes:
  stream.input.temperature:
    access: read_write
    quantity: temperature
    default_unit: C
    minimum: -273.15
    maximum: 2000
    status: verify_case
    candidates:
      - "\\Data\\Streams\\{stream}\\Input\\TEMP\\MIXED"
      - "\\Data\\Streams\\{stream}\\Input\\TEMP"
      - "mock.feed.temperature"

  stream.input.pressure:
    access: read_write
    quantity: pressure
    default_unit: bar
    minimum: 0.000001
    maximum: 1000
    status: verify_case
    candidates:
      - "\\Data\\Streams\\{stream}\\Input\\PRES\\MIXED"
      - "\\Data\\Streams\\{stream}\\Input\\PRES"
      - "mock.feed.pressure"

  stream.input.mass_flow:
    access: read_write
    quantity: mass_flow
    default_unit: kg/h
    minimum: 0
    maximum: 1000000000
    status: verify_case
    candidates:
      - "\\Data\\Streams\\{stream}\\Input\\TOTFLOW\\MIXED"
      - "\\Data\\Streams\\{stream}\\Input\\FLOW\\MIXED"
      - "mock.feed.mass_flow"

  stream.output.temperature:
    access: read_only
    quantity: temperature
    default_unit: C
    status: verify_case
    candidates:
      - "\\Data\\Streams\\{stream}\\Output\\TEMP_OUT\\MIXED"
      - "\\Data\\Streams\\{stream}\\Output\\TEMP\\MIXED"
      - "mock.product.temperature"

  stream.output.mass_flow:
    access: read_only
    quantity: mass_flow
    default_unit: kg/h
    status: verify_case
    candidates:
      - "\\Data\\Streams\\{stream}\\Output\\MASSFLMX\\MIXED"
      - "\\Data\\Streams\\{stream}\\Output\\TOTFLOW\\MIXED"
      - "mock.product.mass_flow"

  block.input.temperature:
    access: read_write
    quantity: temperature
    default_unit: C
    minimum: -273.15
    maximum: 2000
    status: verify_case
    candidates:
      - "\\Data\\Blocks\\{block}\\Input\\TEMP"
      - "\\Data\\Blocks\\{block}\\Input\\TEMP1"
      - "mock.reactor.temperature"

  block.input.residence_time:
    access: read_write
    quantity: time
    default_unit: h
    minimum: 0.000001
    maximum: 10000
    status: project_specific
    candidates:
      - "\\Data\\Blocks\\{block}\\Input\\RES_TIME"
      - "mock.reactor.residence_time"

  block.output.conversion:
    access: read_only
    quantity: fraction
    default_unit: fraction
    minimum: 0
    maximum: 1
    status: project_specific
    candidates:
      - "\\Data\\Blocks\\{block}\\Output\\CONV"
      - "mock.reactor.conversion"

  block.output.duty:
    access: read_only
    quantity: power
    default_unit: kW
    status: verify_case
    candidates:
      - "\\Data\\Blocks\\{block}\\Output\\QCALC"
      - "\\Data\\Blocks\\{block}\\Output\\DUTY"
      - "mock.reactor.duty"

  metric.product_yield_rate:
    access: read_only
    quantity: mass_flow
    default_unit: kg/h
    status: mock_or_project_specific
    candidates:
      - "mock.product.yield_rate"

  run.status:
    access: read_only
    quantity: string
    status: diagnostic
    candidates:
      - "mock.run.status"
