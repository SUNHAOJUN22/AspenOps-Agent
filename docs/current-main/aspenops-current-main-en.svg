  <path d="M 319 335 H 349" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 629 335 H 659" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 939 335 H 969" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1249 335 H 1279" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <g><rect x="45" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="69" y="278" class="stage">Process intent</text><text x="69" y="322" class="detail">IR and unit contracts</text><text x="69" y="392" class="index">01</text></g><g><rect x="355" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="379" y="278" class="stage">Solvability</text><text x="379" y="322" class="detail">DOF, cycles and tears</text><text x="379" y="392" class="index">02</text></g><g><rect x="665" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="689" y="278" class="stage">Execution isolation</text><text x="689" y="322" class="detail">COM workers and licences</text><text x="689" y="392" class="index">03</text></g><g><rect x="975" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="999" y="278" class="stage">Physical gates</text><text x="999" y="322" class="detail">Convergence, constraints, balances</text><text x="999" y="392" class="index">04</text></g><g><rect x="1285" y="228" width="270" height="214" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="1309" y="278" class="stage">Evidence delivery</text><text x="1309" y="322" class="detail">Hashes, signatures, authority</text><text x="1309" y="392" class="index">05</text></g>
  <g><rect x="45" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#8b5cf6" stroke-width="2"/><text x="69" y="574" class="formula">OK = C_comm ∧ C_engine ∧ C_conv ∧ C_finite ∧ C_constraint ∧ C_balance</text><text x="69" y="620" class="micro">CODE CONTRACT 01</text></g><g><rect x="550" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#8b5cf6" stroke-width="2"/><text x="574" y="574" class="formula">dN_i/dt = Σ_in ṅ_i − Σ_out ṅ_i + V Σ_r ν_ir r_r</text><text x="574" y="620" class="micro">CODE CONTRACT 02</text></g><g><rect x="1055" y="520" width="465" height="130" rx="22" fill="#08152f" stroke="#8b5cf6" stroke-width="2"/><text x="1079" y="574" class="formula">W_eff = min(W_config, W_license, W_memory, W_stable)</text><text x="1079" y="620" class="micro">CODE CONTRACT 03</text></g>
  <rect x="45" y="710" width="1510" height="104" rx="24" fill="#071124" stroke="#334155"/>
  <text x="76" y="756" class="micro">QUALIFICATION BOUNDARY</text>
  <text x="76" y="790" class="boundary">Software gates are not licensed Aspen Plus/HYSYS engineering certification; the external state remains PENDING_REAL_ASPEN_CERTIFICATION.</text>
  <text x="48" y="866" class="micro">CURRENT MAIN · EXACT TREE · FINITE NUMERICS · BILINGUAL EVIDENCE</text>
