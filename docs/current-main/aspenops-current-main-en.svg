  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="92" r="120" fill="#2563eb" opacity="0.16" filter="url(#glow)"/>
  <circle cx="210" cy="790" r="170" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <text x="48" y="88" class="title">AspenOps 2.0</text>
  <text x="48" y="132" class="subtitle">From process intent, conservation and constraints to auditable Aspen execution evidence</text>
