<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Delivery Acceptance</title>
<desc id="desc">Machine-verifiable handover gates for documentation, tests, workflows and external hold.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102b3f"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173b56"/><stop offset="1" stop-color="#0d2233"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d7ff"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Delivery Acceptance</text><text x="60" y="108" fill="#9cc7dc" font-family="Arial, sans-serif" font-size="18">PASS means software delivery is complete; licensed engineering certification remains separate.</text>
<path d="M265 242 L305 242" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M515 242 L555 242" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M765 242 L805 242" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M910 315 L725 405" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="55" y="170" width="210" height="145" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="91" cy="208" r="15" fill="#36c5f0"/><text x="119" y="214" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Static Gates</text><text x="83" y="252" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Ruff, mypy, compileall, AST, Bandit</text></g>
<g filter="url(#shadow)"><rect x="305" y="170" width="210" height="145" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="341" cy="208" r="15" fill="#36c5f0"/><text x="369" y="214" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Full Suite</text><text x="333" y="252" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Coverage and order independence</text></g>
<g filter="url(#shadow)"><rect x="555" y="170" width="210" height="145" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="591" cy="208" r="15" fill="#36c5f0"/><text x="619" y="214" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Artifacts</text><text x="583" y="252" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Wheel, README, diagrams, evidence JSON</text></g>
<g filter="url(#shadow)"><rect x="805" y="170" width="210" height="145" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="841" cy="208" r="15" fill="#36c5f0"/><text x="869" y="214" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Governance</text><text x="833" y="252" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Four read-only permanent workflows</text></g>
<g filter="url(#shadow)"><rect x="410" y="405" width="380" height="120" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="446" cy="443" r="15" fill="#36c5f0"/><text x="474" y="449" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">External Hold</text><text x="438" y="487" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Licensed Aspen inputs and human approval</text></g>
<rect x="55" y="610" width="1090" height="2" fill="#2e6078"/><text x="60" y="642" fill="#83afc4" font-family="Arial, sans-serif" font-size="16">Software contracts only. Licensed simulator evidence and human engineering approval remain independent.</text></svg>
