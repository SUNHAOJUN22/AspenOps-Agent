<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Warm-Start Trajectory</title>
<desc id="desc">Single-worker path-dependent warm-start execution without cache or singleflight reuse.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102b3f"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173b56"/><stop offset="1" stop-color="#0d2233"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d7ff"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Warm-Start Trajectory</text><text x="60" y="108" fill="#9cc7dc" font-family="Arial, sans-serif" font-size="18">Optimization is reinitialized; warm-start remains an ordered experimental trajectory.</text>
<path d="M290 260 L350 260" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M570 260 L630 260" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M850 260 L910 260" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M740 330 L650 410" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="70" y="190" width="220" height="140" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="106" cy="228" r="15" fill="#36c5f0"/><text x="134" y="234" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Session</text><text x="98" y="272" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Explicit trajectory identity</text></g>
<g filter="url(#shadow)"><rect x="350" y="190" width="220" height="140" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="386" cy="228" r="15" fill="#36c5f0"/><text x="414" y="234" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Step k</text><text x="378" y="272" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">State x(k), input u(k)</text></g>
<g filter="url(#shadow)"><rect x="630" y="190" width="220" height="140" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="666" cy="228" r="15" fill="#36c5f0"/><text x="694" y="234" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Single Worker</text><text x="658" y="272" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Sequential simulator owner</text></g>
<g filter="url(#shadow)"><rect x="910" y="190" width="220" height="140" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="946" cy="228" r="15" fill="#36c5f0"/><text x="974" y="234" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Step k+1</text><text x="938" y="272" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">x(k+1) = F(x(k),u(k))</text></g>
<g filter="url(#shadow)"><rect x="360" y="410" width="480" height="120" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="396" cy="448" r="15" fill="#36c5f0"/><text x="424" y="454" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Reuse Disabled</text><text x="388" y="492" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">No persistent cache, batch dedup or singleflight</text></g>
<rect x="55" y="610" width="1090" height="2" fill="#2e6078"/><text x="60" y="642" fill="#83afc4" font-family="Arial, sans-serif" font-size="16">Software contracts only. Licensed simulator evidence and human engineering approval remain independent.</text></svg>
