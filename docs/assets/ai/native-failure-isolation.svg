<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Native Failure Isolation</title>
<desc id="desc">Private-case discard and transactional rollback contracts for native adapters.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102b3f"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173b56"/><stop offset="1" stop-color="#0d2233"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67d7ff"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Native Failure Isolation</text><text x="60" y="108" fill="#9cc7dc" font-family="Arial, sans-serif" font-size="18">Cleanup failure is a build failure and cannot be downgraded to an ordinary solver error.</text>
<path d="M305 250 L365 250" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M595 220 L655 185" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M595 280 L655 395" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M905 185 L965 260" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M905 395 L965 300" stroke="#67d7ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="65" y="175" width="240" height="150" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="101" cy="213" r="15" fill="#36c5f0"/><text x="129" y="219" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Plan Step</text><text x="93" y="257" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Authorized native operation</text></g>
<g filter="url(#shadow)"><rect x="365" y="175" width="230" height="150" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="401" cy="213" r="15" fill="#36c5f0"/><text x="429" y="219" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Apply</text><text x="393" y="257" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Write and mandatory readback</text></g>
<g filter="url(#shadow)"><rect x="655" y="120" width="250" height="130" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="691" cy="158" r="15" fill="#36c5f0"/><text x="719" y="164" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Success</text><text x="683" y="202" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Commit transaction</text></g>
<g filter="url(#shadow)"><rect x="655" y="330" width="250" height="130" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="691" cy="368" r="15" fill="#36c5f0"/><text x="719" y="374" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Failure</text><text x="683" y="412" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Rollback or discard private case</text></g>
<g filter="url(#shadow)"><rect x="965" y="225" width="170" height="150" rx="18" fill="url(#card)" stroke="#3a8fb7" stroke-width="2"/><circle cx="1001" cy="263" r="15" fill="#36c5f0"/><text x="1029" y="269" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Evidence</text><text x="993" y="307" fill="#b8d7e6" font-family="Arial, sans-serif" font-size="16">Cleanup result must be explicit true</text></g>
<rect x="55" y="610" width="1090" height="2" fill="#2e6078"/><text x="60" y="642" fill="#83afc4" font-family="Arial, sans-serif" font-size="16">Software contracts only. Licensed simulator evidence and human engineering approval remain independent.</text></svg>
