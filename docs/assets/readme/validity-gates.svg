<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Independent Simulation Validity Gates</title><desc id="desc">A simulator return is not engineering acceptance.</desc><style>.h{font:700 28px system-ui,sans-serif;fill:#F8FAFC}.e{font:700 12px system-ui,sans-serif;fill:#38BDF8;letter-spacing:2px}.l{font:650 15px system-ui,sans-serif;fill:#F8FAFC}.s{font:500 12px system-ui,sans-serif;fill:#A7B5C8}.m{font:600 12px monospace;fill:#C9D7E8}.c{fill:#102036;stroke:#2A405F}.d{fill:#142944;stroke:#3B567A}</style><rect width="1200" height="560" rx="24" fill="#07111F"/><text x="44" y="42" class="e">VALIDITY MODEL</text><text x="44" y="78" class="h">Independent Simulation Validity Gates</text><path d="M44 98H1156" stroke="#38BDF8" stroke-width="2"/><path d="M650 98H1156" stroke="#818CF8" stroke-width="2"/><rect x="44.0" y="160" width="165.3" height="112" rx="16" class="d"/><rect x="44.0" y="160" width="6" height="112" rx="3" fill="#38BDF8"/><text x="64.0" y="198" class="l">Communication</text><text x="64.0" y="224" class="s">IPC reply</text><path d="M209.3 216.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="233.3" y="160" width="165.3" height="112" rx="16" class="c"/><rect x="233.3" y="160" width="6" height="112" rx="3" fill="#38BDF8"/><text x="253.3" y="198" class="l">Engine</text><text x="253.3" y="224" class="s">method returned</text><path d="M398.7 216.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="422.7" y="160" width="165.3" height="112" rx="16" class="c"/><rect x="422.7" y="160" width="6" height="112" rx="3" fill="#818CF8"/><text x="442.7" y="198" class="l">Convergence</text><text x="442.7" y="224" class="s">known solver state</text><path d="M588.0 216.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="612.0" y="160" width="165.3" height="112" rx="16" class="c"/><rect x="612.0" y="160" width="6" height="112" rx="3" fill="#FBBF24"/><text x="632.0" y="198" class="l">Constraints</text><text x="632.0" y="224" class="s">bounded variables</text><path d="M777.3 216.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="801.3" y="160" width="165.3" height="112" rx="16" class="c"/><rect x="801.3" y="160" width="6" height="112" rx="3" fill="#FBBF24"/><text x="821.3" y="198" class="l">Balances</text><text x="821.3" y="224" class="s">mass + energy</text><path d="M966.7 216.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="990.7" y="160" width="165.3" height="112" rx="16" class="d"/><rect x="990.7" y="160" width="6" height="112" rx="3" fill="#34D399"/><text x="1010.7" y="198" class="l">JSON-Safe Evidence</text><text x="1010.7" y="224" class="s">Finite Evidence</text><rect x="44" y="478" width="1112" height="46" rx="12" class="d"/><text x="600" y="507" class="m" text-anchor="middle">ok = communication ∧ engine ∧ convergence ∧ feasibility</text></svg>
