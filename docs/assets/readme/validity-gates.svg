<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="validity-title validity-desc">
<title id="validity-title">Independent Simulation Validity Gates</title>
<desc id="validity-desc">AspenOps keeps communication, engine return, convergence, constraints, balances, finite numerical evidence and human approval as independent gates before a result can be accepted.</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="validity-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:20px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Independent Simulation Validity Gates</text>
<text x="64" y="98" class="sub">Software completion is not convergence • convergence is not feasibility • feasibility is not engineering approval</text>
<rect x="55" y="155" width="205" height="400" rx="22" class="panel" filter="url(#validity-shadow)"/>
<text x="157" y="198" class="h" text-anchor="middle">1. Transport</text>
<rect x="82" y="230" width="150" height="90" rx="14" class="panel2"/>
<text x="157" y="260" class="b" text-anchor="middle">Communication</text><text x="157" y="285" class="small" text-anchor="middle">IPC correlation</text><text x="157" y="306" class="small" text-anchor="middle">protocol and timeout</text>
<rect x="82" y="355" width="150" height="90" rx="14" class="panel2"/>
<text x="157" y="385" class="b" text-anchor="middle">Engine Return</text><text x="157" y="410" class="small" text-anchor="middle">strict Boolean</text><text x="157" y="431" class="small" text-anchor="middle">no truthy strings</text>
<line x1="260" y1="355" x2="300" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="300,355 289.6,361 289.6,349" fill="#4cc9f0"/>
<rect x="300" y="155" width="205" height="400" rx="22" class="panel" filter="url(#validity-shadow)"/>
<text x="402" y="198" class="h" text-anchor="middle">2. Solve State</text>
<rect x="327" y="230" width="150" height="90" rx="14" class="panel2"/>
<text x="402" y="260" class="b" text-anchor="middle">Convergence</text><text x="402" y="285" class="small" text-anchor="middle">explicit evidence</text><text x="402" y="306" class="small" text-anchor="middle">stable idle window</text>
<rect x="327" y="355" width="150" height="90" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="402" y="385" class="b" text-anchor="middle">Unknown Fails</text><text x="402" y="410" class="small" text-anchor="middle">running / timeout</text><text x="402" y="431" class="small" text-anchor="middle">negative markers</text>
<line x1="505" y1="355" x2="545" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="545,355 534.6,361 534.6,349" fill="#4cc9f0"/>
<rect x="545" y="155" width="260" height="400" rx="22" class="panel" filter="url(#validity-shadow)"/>
<text x="675" y="198" class="h" text-anchor="middle">3. Engineering Math</text>
<rect x="575" y="230" width="200" height="78" rx="14" class="panel2"/>
<text x="675" y="260" class="b" text-anchor="middle">Constraints</text><text x="675" y="285" class="small" text-anchor="middle">operator + tolerance</text>
<rect x="575" y="330" width="200" height="78" rx="14" class="panel2"/>
<text x="675" y="360" class="b" text-anchor="middle">Material / Energy</text><text x="675" y="385" class="small" text-anchor="middle">absolute or relative closure</text>
<rect x="575" y="430" width="200" height="78" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="675" y="460" class="b" text-anchor="middle">Finite Evidence</text><text x="675" y="485" class="small" text-anchor="middle">NaN / Infinity rejected</text>
<line x1="805" y1="355" x2="845" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="845,355 834.6,361 834.6,349" fill="#4cc9f0"/>
<rect x="845" y="155" width="240" height="400" rx="22" class="panel" filter="url(#validity-shadow)"/>
<text x="965" y="198" class="h" text-anchor="middle">4. Result Contract</text>
<rect x="875" y="230" width="180" height="130" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="965" y="260" class="b" text-anchor="middle">ok = AND</text><text x="965" y="286" class="small" text-anchor="middle">communication</text><text x="965" y="307" class="small" text-anchor="middle">engine + convergence</text><text x="965" y="328" class="small" text-anchor="middle">constraints + balances</text>
<rect x="875" y="390" width="180" height="100" rx="14" class="panel2"/>
<text x="965" y="420" class="b" text-anchor="middle">JSON-Safe Evidence</text><text x="965" y="445" class="small" text-anchor="middle">null + reason codes</text><text x="965" y="466" class="small" text-anchor="middle">allow_nan = false</text>
<line x1="1085" y1="355" x2="1125" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="1125,355 1114.6,361 1114.6,349" fill="#4cc9f0"/>
<rect x="1125" y="155" width="220" height="400" rx="22" class="panel" filter="url(#validity-shadow)"/>
<text x="1235" y="198" class="h" text-anchor="middle">5. Acceptance</text>
<rect x="1155" y="230" width="160" height="100" rx="14" class="panel2"/>
<text x="1235" y="260" class="b" text-anchor="middle">Software Evidence</text><text x="1235" y="285" class="small" text-anchor="middle">hashes + diagnostics</text><text x="1235" y="306" class="small" text-anchor="middle">reproducible bundle</text>
<rect x="1155" y="365" width="160" height="125" rx="14" fill="#fbbf24" opacity=".12" stroke="#fbbf24"/>
<text x="1235" y="395" class="b" text-anchor="middle">Human Review</text><text x="1235" y="420" class="small" text-anchor="middle">licensed runtime</text><text x="1235" y="441" class="small" text-anchor="middle">model qualification</text><text x="1235" y="462" class="small" text-anchor="middle">engineering approval</text>
<rect x="130" y="610" width="1140" height="58" rx="19" class="panel2"/>
<text x="700" y="644" class="b" text-anchor="middle">A solver message alone never grants ok=true, physical validity, or permission to operate a process</text>
</svg>