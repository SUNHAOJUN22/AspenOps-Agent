<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Industrial Operating Scenarios</title>
<desc id="desc">AspenOps applies deterministic automation to approved models for parameter studies, optimization, regression evidence and operational decision support</desc>
<rect width="1400" height="760" rx="28" fill="#0b1020"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.m{fill:#9fb0c8;font-size:14px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Industrial Operating Scenarios</text>
<text x="64" y="96" class="sub">Existing approved models • semantic variables • bounded execution • evidence before engineering use</text>
<rect x="55" y="145" width="300" height="475" rx="22" class="panel" filter="url(#shadow)"/>
<text x="205" y="190" class="h" text-anchor="middle">Parameter Studies</text>
<rect x="85" y="225" width="240" height="65" rx="14" class="panel2"/><text x="105" y="253" class="b">Batch sweep</text><text x="105" y="275" class="m">temperature • pressure • ratio</text>
<polyline points="100,385 140,350 180,365 220,315 260,330 310,275" fill="none" stroke="#4cc9f0" stroke-width="4"/>
<line x1="95" y1="410" x2="315" y2="410" stroke="#52617a" stroke-width="2"/><line x1="95" y1="310" x2="95" y2="410" stroke="#52617a" stroke-width="2"/>
<rect x="85" y="465" width="240" height="58" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/><text x="205" y="500" class="m" text-anchor="middle">parallel, license-bounded points</text>
<text x="205" y="565" class="small" text-anchor="middle">Outputs remain tied to request and model hashes</text>
<rect x="385" y="145" width="300" height="475" rx="22" class="panel" filter="url(#shadow)"/>
<text x="535" y="190" class="h" text-anchor="middle">Constrained Optimization</text>
<rect x="415" y="225" width="240" height="65" rx="14" class="panel2"/><text x="435" y="253" class="b">Budgeted search</text><text x="435" y="275" class="m">objectives + hard constraints</text>
<circle cx="475" cy="365" r="12" fill="#4cc9f0"/><circle cx="525" cy="330" r="10" fill="#7b61ff"/><circle cx="575" cy="385" r="11" fill="#fbbf24"/><circle cx="615" cy="315" r="13" fill="#4ade80"/>
<path d="M440 420 C485 370 545 350 640 285" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="415" y="465" width="240" height="58" rx="14" fill="#7b61ff" opacity=".12" stroke="#7b61ff"/><text x="535" y="500" class="m" text-anchor="middle">Pareto and feasibility evidence</text>
<text x="535" y="565" class="small" text-anchor="middle">No point is accepted without convergence and balances</text>
<rect x="715" y="145" width="300" height="475" rx="22" class="panel" filter="url(#shadow)"/>
<text x="865" y="190" class="h" text-anchor="middle">Regression and Qualification</text>
<rect x="745" y="225" width="240" height="65" rx="14" class="panel2"/><text x="765" y="253" class="b">Repeatable cases</text><text x="765" y="275" class="m">baseline • candidate • tolerances</text>
<rect x="765" y="330" width="200" height="42" rx="10" class="panel2"/><rect x="780" y="343" width="118" height="16" rx="8" fill="#4ade80"/><text x="945" y="357" class="small" text-anchor="end">PASS</text>
<rect x="765" y="392" width="200" height="42" rx="10" class="panel2"/><rect x="780" y="405" width="72" height="16" rx="8" fill="#fbbf24"/><text x="945" y="419" class="small" text-anchor="end">REVIEW</text>
<rect x="745" y="465" width="240" height="58" rx="14" fill="#fbbf24" opacity=".12" stroke="#fbbf24"/><text x="865" y="500" class="m" text-anchor="middle">software gate != physics approval</text>
<text x="865" y="565" class="small" text-anchor="middle">Licensed evidence still requires human acceptance</text>
<rect x="1045" y="145" width="300" height="475" rx="22" class="panel" filter="url(#shadow)"/>
<text x="1195" y="190" class="h" text-anchor="middle">Operational Decision Support</text>
<rect x="1075" y="225" width="240" height="65" rx="14" class="panel2"/><text x="1095" y="253" class="b">What-if analysis</text><text x="1095" y="275" class="m">approved model, bounded inputs</text>
<rect x="1085" y="330" width="95" height="95" rx="16" class="panel2"/><text x="1132" y="370" class="b" text-anchor="middle">Feed</text><text x="1132" y="395" class="small" text-anchor="middle">scenario</text>
<line x1="1180" y1="378" x2="1210" y2="378" stroke="#4cc9f0" stroke-width="3"/><polygon points="1210,378 1199.6,384 1199.6,372" fill="#4cc9f0"/>
<rect x="1210" y="330" width="95" height="95" rx="16" class="panel2"/><text x="1257" y="370" class="b" text-anchor="middle">Model</text><text x="1257" y="395" class="small" text-anchor="middle">solve</text>
<rect x="1075" y="465" width="240" height="58" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/><text x="1195" y="500" class="m" text-anchor="middle">decision aid, not autonomous control</text>
<text x="1195" y="565" class="small" text-anchor="middle">Never writes directly to production DCS</text>
<rect x="155" y="665" width="1090" height="48" rx="20" class="panel2"/>
<text x="700" y="695" class="b" text-anchor="middle">AspenOps automates governed simulation evidence; qualified engineers retain responsibility for process decisions</text>
</svg>