<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="opt-title opt-desc">
<title id="opt-title">Budgeted Constrained Optimization Lifecycle</title>
<desc id="opt-desc">AspenOps validates mixed variable types and budgets, evaluates candidates through governed Worker pools, tracks constraints and balances, writes atomic checkpoints, supports cancellation, and returns best and Pareto evidence without granting engineering certification.</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="opt-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Budgeted Constrained Optimization Lifecycle</text>
<text x="64" y="98" class="sub">Mixed variables • finite solve budgets • governed batches • cancellation • checkpoint and Pareto evidence</text>
<rect x="55" y="145" width="245" height="430" rx="22" class="panel" filter="url(#opt-shadow)"/>
<text x="177" y="190" class="h" text-anchor="middle">1. Problem Contract</text>
<rect x="82" y="220" width="190" height="108" rx="14" class="panel2"/>
<text x="177" y="250" class="b" text-anchor="middle">Variables</text>
<text x="177" y="276" class="small" text-anchor="middle">continuous • integer</text>
<text x="177" y="298" class="small" text-anchor="middle">categorical • ordinal</text>
<rect x="82" y="350" width="190" height="78" rx="14" class="panel2"/>
<text x="177" y="380" class="b" text-anchor="middle">Objectives</text><text x="177" y="405" class="small" text-anchor="middle">minimize / maximize + weight</text>
<rect x="82" y="450" width="190" height="85" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="177" y="480" class="b" text-anchor="middle">Reject Invalid</text><text x="177" y="505" class="small" text-anchor="middle">duplicates, bounds, NaN, empty</text>
<line x1="300" y1="360" x2="350" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="350,360 339.6,366 339.6,354" fill="#4cc9f0"/>
<rect x="350" y="145" width="245" height="430" rx="22" class="panel" filter="url(#opt-shadow)"/>
<text x="472" y="190" class="h" text-anchor="middle">2. Bounded Search</text>
<rect x="377" y="220" width="190" height="100" rx="14" class="panel2"/>
<text x="472" y="250" class="b" text-anchor="middle">Budget Gate</text>
<text x="472" y="276" class="small" text-anchor="middle">variables • objectives</text>
<text x="472" y="298" class="small" text-anchor="middle">population • generations • evals</text>
<rect x="377" y="345" width="190" height="78" rx="14" class="panel2"/>
<text x="472" y="375" class="b" text-anchor="middle">Differential Evolution</text><text x="472" y="400" class="small" text-anchor="middle">seeded and deterministic</text>
<rect x="377" y="448" width="190" height="87" rx="14" class="panel2"/>
<text x="472" y="478" class="b" text-anchor="middle">Atomic Checkpoint</text><text x="472" y="503" class="small" text-anchor="middle">temp file → os.replace</text>
<line x1="595" y1="360" x2="645" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="645,360 634.6,366 634.6,354" fill="#4cc9f0"/>
<rect x="645" y="145" width="300" height="430" rx="22" class="panel" filter="url(#opt-shadow)"/>
<text x="795" y="190" class="h" text-anchor="middle">3. Governed Evaluation</text>
<rect x="675" y="220" width="240" height="78" rx="14" class="panel2"/>
<text x="795" y="250" class="b" text-anchor="middle">Decode Candidate</text><text x="795" y="275" class="small" text-anchor="middle">semantic writes + declared units</text>
<rect x="675" y="320" width="240" height="78" rx="14" class="panel2"/>
<text x="795" y="350" class="b" text-anchor="middle">Batch through CasePool</text><text x="795" y="375" class="small" text-anchor="middle">license and Worker limits</text>
<rect x="675" y="420" width="240" height="115" rx="14" class="panel2"/>
<text x="795" y="450" class="b" text-anchor="middle">Independent Validity</text>
<text x="795" y="476" class="small" text-anchor="middle">communication • engine • convergence</text>
<text x="795" y="498" class="small" text-anchor="middle">constraints • material and energy</text>
<line x1="945" y1="360" x2="995" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="995,360 984.6,366 984.6,354" fill="#4cc9f0"/>
<rect x="995" y="145" width="350" height="430" rx="22" class="panel" filter="url(#opt-shadow)"/>
<text x="1170" y="190" class="h" text-anchor="middle">4. Evidence Result</text>
<rect x="1025" y="220" width="290" height="78" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="1170" y="250" class="b" text-anchor="middle">Best Feasible Candidate</text><text x="1170" y="275" class="small" text-anchor="middle">decoded values + objectives</text>
<rect x="1025" y="320" width="290" height="78" rx="14" class="panel2"/>
<text x="1170" y="350" class="b" text-anchor="middle">Pareto Front</text><text x="1170" y="375" class="small" text-anchor="middle">objectives + violation evidence</text>
<rect x="1025" y="420" width="290" height="115" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="1170" y="450" class="b" text-anchor="middle">Cancellation and Boundary</text>
<text x="1170" y="476" class="small" text-anchor="middle">status = cancelled when requested</text>
<text x="1170" y="498" class="small" text-anchor="middle">real Aspen remains pending review</text>
<rect x="135" y="620" width="1130" height="55" rx="18" class="panel2"/>
<text x="700" y="653" class="b" text-anchor="middle">Optimization proposes governed evidence; it never replaces equipment, safety or human engineering approval</text>
</svg>