</style><rect width="1440" height="720" rx="28" fill="#050A12"/><defs><pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#23344E" stroke-width=".6" opacity=".22"/></pattern></defs><rect x="1" y="1" width="1438" height="718" rx="27" fill="url(#microgrid)" opacity=".45"/><text x="52" y="46" class="eyebrow">POLICY PIPELINE</text><text x="52" y="86" class="title">Configuration and Path Safety</text><text x="52" y="112" class="subtitle">No raw simulator paths cross the public control surface.</text><path d="M52 132H1388" stroke="#334A6B" stroke-width="1"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><rect x="52" y="184" width="304" height="220" rx="16" class="panel2"/><rect x="76" y="210" width="52" height="52" rx="12" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1.2"/><path d="M89.0 228.0l8 8-8 8M101.0 244.0h14" fill="none" stroke="#60A5FA" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="294" class="small">01</text><text x="76" y="326" class="label">Python Settings</text><text x="76" y="350" class="body">typed construction</text><rect x="76" y="368" width="142" height="30" rx="15" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1"/><text x="147.0" y="388" class="small" text-anchor="middle" fill="#F8FAFC">validate types</text><path d="M356 294L380 294" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M380 294L373.1 298.0M380 294L373.1 290.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="380" y="184" width="304" height="220" rx="16" class="panel"/><rect x="404" y="210" width="52" height="52" rx="12" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-width="1.2"/><path d="M418.0 220.0h16l8 8v24h-24zM434.0 220.0v8h8M424.0 237.0h12M424.0 244.0h12" fill="none" stroke="#22D3EE" stroke-width="2"/><text x="404" y="294" class="small">02</text><text x="404" y="326" class="label">Canonical Paths</text><text x="404" y="350" class="body">expand + resolve</text><rect x="404" y="368" width="142" height="30" rx="15" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-width="1"/><text x="475.0" y="388" class="small" text-anchor="middle" fill="#F8FAFC">normalize</text><path d="M684 294L708 294" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M708 294L701.1 298.0M708 294L701.1 290.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="708" y="184" width="304" height="220" rx="16" class="panel"/><rect x="732" y="210" width="52" height="52" rx="12" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-width="1.2"/><path d="M758.0 221.0l13 5v10c0 10-6 16-13 20-7-4-13-10-13-20v-10z" fill="none" stroke="#2DD4BF" stroke-width="2.2"/><path d="M752.0 236.0l4 5 9-11" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round"/><text x="732" y="294" class="small">03</text><text x="732" y="326" class="label">Allowed Roots</text><text x="732" y="350" class="body">realpath containment</text><rect x="732" y="368" width="142" height="30" rx="15" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-width="1"/><text x="803.0" y="388" class="small" text-anchor="middle" fill="#F8FAFC">contain</text><path d="M1012 294L1036 294" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M1036 294L1029.1 298.0M1036 294L1029.1 290.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="1036" y="184" width="304" height="220" rx="16" class="panel2"/><rect x="1060" y="210" width="52" height="52" rx="12" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-width="1.2"/><circle cx="1086.0" cy="226.0" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/><circle cx="1074.0" cy="247.0" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/><circle cx="1098.0" cy="247.0" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/><path d="M1083.0 231.0l-6 10M1089.0 231.0l6 10M1080.0 247.0h12" fill="none" stroke="#F59E0B" stroke-width="2"/><text x="1060" y="294" class="small">04</text><text x="1060" y="326" class="label">Operation Gates</text><text x="1060" y="350" class="body">readonly / default / enhanced</text><rect x="1060" y="368" width="142" height="30" rx="15" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-width="1"/><text x="1131.0" y="388" class="small" text-anchor="middle" fill="#F8FAFC">authorize</text><rect x="52" y="452" width="952" height="74" rx="14" fill="#0D1524" stroke="#22C55E" stroke-width="1.2"/><circle cx="78" cy="489" r="5" fill="#22C55E"/><text x="96" y="494" class="body">Approved absolute path enters the governed execution transaction.</text><rect x="1030" y="452" width="358" height="74" rx="14" fill="#0D1524" stroke="#F43F5E" stroke-width="1.2"/><circle cx="1056" cy="489" r="5" fill="#F43F5E"/><text x="1074" y="484" class="body">Traversal / junction / unknown mode</text><text x="1074" y="504" class="small">rejected before COM or evidence</text><rect x="52.0" y="570" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="70.0" y="598" class="small">BOOLEAN INPUT</text><text x="70.0" y="634" class="value">strict type</text><rect x="468.6666666666667" y="588" width="4" height="60" rx="2" fill="#60A5FA"/><rect x="502.6666666666667" y="570" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="520.6666666666667" y="598" class="small">ROOT POLICY</text><text x="520.6666666666667" y="634" class="value">absolute + contained</text><rect x="919.3333333333334" y="588" width="4" height="60" rx="2" fill="#2DD4BF"/><rect x="953.3333333333334" y="570" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="971.3333333333334" y="598" class="small">UNKNOWN MODE</text><text x="971.3333333333334" y="634" class="value">rejected</text><rect x="1370.0" y="588" width="4" height="60" rx="2" fill="#F43F5E"/></svg>
