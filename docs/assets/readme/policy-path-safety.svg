<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Configuration and Path Safety</title><desc id="desc">Every execution path is normalized, allowlisted, and operation-gated before Worker creation.</desc><style>
.txt{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
