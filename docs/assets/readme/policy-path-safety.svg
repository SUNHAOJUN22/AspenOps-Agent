<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="policy-title policy-desc">
<title id="policy-title">Fail-Closed Configuration and Path Policy</title>
<desc id="policy-desc">AspenOps validates every environment and direct Settings construction, resolves controlled paths, applies mode gates, and rejects unknown backends, invalid budgets, unsafe roots, and path escapes.</desc>
<rect width="1400" height="700" rx="28" fill="#0b1020"/>
<defs>
  <filter id="policy-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.m{fill:#9fb0c8;font-size:14px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Fail-Closed Configuration and Path Policy</text>
<text x="64" y="98" class="sub">One validation boundary for environment variables, Python API calls, paths, modes and budgets</text>
<rect x="55" y="150" width="250" height="410" rx="22" class="panel" filter="url(#policy-shadow)"/>
<text x="180" y="194" class="h" text-anchor="middle">1. Configuration Input</text>
<rect x="82" y="225" width="196" height="65" rx="14" class="panel2"/>
<text x="100" y="253" class="b">Environment</text><text x="100" y="276" class="small">strict parse and names</text>
<rect x="82" y="315" width="196" height="65" rx="14" class="panel2"/>
<text x="100" y="343" class="b">Python Settings</text><text x="100" y="366" class="small">same validation contract</text>
<rect x="82" y="405" width="196" height="115" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="180" y="438" class="b" text-anchor="middle">Reject Ambiguity</text>
<text x="180" y="465" class="small" text-anchor="middle">unknown backend or mode</text>
<text x="180" y="486" class="small" text-anchor="middle">truthy string booleans</text>
<text x="180" y="507" class="small" text-anchor="middle">non-finite or zero budgets</text>
<line x1="305" y1="355" x2="360" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="360,355 349.6,361 349.6,349" fill="#4cc9f0"/>
<rect x="360" y="150" width="300" height="410" rx="22" class="panel" filter="url(#policy-shadow)"/>
<text x="510" y="194" class="h" text-anchor="middle">2. Backend Boundary</text>
<rect x="390" y="225" width="240" height="70" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="510" y="254" class="b" text-anchor="middle">Mock</text><text x="510" y="278" class="small" text-anchor="middle">portable software validation</text>
<rect x="390" y="320" width="240" height="105" rx="14" class="panel2"/>
<text x="510" y="350" class="b" text-anchor="middle">Aspen Plus / HYSYS</text>
<text x="510" y="376" class="small" text-anchor="middle">absolute allowed roots</text>
<text x="510" y="398" class="small" text-anchor="middle">state directory inside roots</text>
<rect x="390" y="450" width="240" height="70" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="510" y="479" class="b" text-anchor="middle">No Root, No Runtime</text><text x="510" y="503" class="small" text-anchor="middle">real backend fails closed</text>
<line x1="660" y1="355" x2="715" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="715,355 704.6,361 704.6,349" fill="#4cc9f0"/>
<rect x="715" y="150" width="300" height="410" rx="22" class="panel" filter="url(#policy-shadow)"/>
<text x="865" y="194" class="h" text-anchor="middle">3. Canonical Paths</text>
<rect x="745" y="225" width="240" height="70" rx="14" class="panel2"/>
<text x="865" y="254" class="b" text-anchor="middle">expanduser + resolve</text><text x="865" y="278" class="small" text-anchor="middle">canonical filesystem identity</text>
<rect x="745" y="320" width="240" height="105" rx="14" class="panel2"/>
<text x="865" y="350" class="b" text-anchor="middle">relative_to allowed root</text>
<text x="865" y="376" class="small" text-anchor="middle">reject .., symlink and junction</text>
<text x="865" y="398" class="small" text-anchor="middle">escape after realpath resolution</text>
<rect x="745" y="450" width="240" height="70" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="865" y="479" class="b" text-anchor="middle">Outside Root</text><text x="865" y="503" class="small" text-anchor="middle">PolicyError before execution</text>
<line x1="1015" y1="355" x2="1070" y2="355" stroke="#4cc9f0" stroke-width="3"/><polygon points="1070,355 1059.6,361 1059.6,349" fill="#4cc9f0"/>
<rect x="1070" y="150" width="275" height="410" rx="22" class="panel" filter="url(#policy-shadow)"/>
<text x="1207" y="194" class="h" text-anchor="middle">4. Operation Gates</text>
<rect x="1100" y="225" width="215" height="70" rx="14" class="panel2"/>
<text x="1207" y="254" class="b" text-anchor="middle">readonly</text><text x="1207" y="278" class="small" text-anchor="middle">writes rejected</text>
<rect x="1100" y="320" width="215" height="70" rx="14" class="panel2"/>
<text x="1207" y="349" class="b" text-anchor="middle">default</text><text x="1207" y="373" class="small" text-anchor="middle">bounded declared work</text>
<rect x="1100" y="415" width="215" height="70" rx="14" class="panel2"/>
<text x="1207" y="444" class="b" text-anchor="middle">enhanced</text><text x="1207" y="468" class="small" text-anchor="middle">explicit privileged gate</text>
<rect x="145" y="605" width="1110" height="55" rx="18" class="panel2"/>
<text x="700" y="638" class="b" text-anchor="middle">Invalid configuration and unsafe paths are rejected before Worker, COM or evidence creation</text>
</svg>