<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="worker-title worker-desc">
<title id="worker-title">Worker Ownership, Isolation and Recycling</title>
<desc id="worker-desc">AspenOps stages a private model copy, spawns one isolated worker with one simulator owner, correlates IPC requests, supervises owned processes, and recycles only verified workers after timeout, crash, protocol failure, age, point budget or taint.</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="worker-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Worker Ownership, Isolation and Recycling</text>
<text x="64" y="98" class="sub">Private model staging • spawned process • one simulator owner • correlated IPC • verified recycle boundary</text>
<rect x="55" y="150" width="260" height="425" rx="22" class="panel" filter="url(#worker-shadow)"/>
<text x="185" y="194" class="h" text-anchor="middle">1. Private Stage</text>
<rect x="85" y="225" width="200" height="90" rx="14" class="panel2"/>
<text x="185" y="255" class="b" text-anchor="middle">Source Model</text><text x="185" y="280" class="small" text-anchor="middle">read-only identity</text><text x="185" y="301" class="small" text-anchor="middle">SHA-256 bound</text>
<rect x="85" y="345" width="200" height="130" rx="14" fill="#4cc9f0" opacity=".12" stroke="#4cc9f0"/>
<text x="185" y="375" class="b" text-anchor="middle">Temporary Copy</text><text x="185" y="400" class="small" text-anchor="middle">worker + generation path</text><text x="185" y="421" class="small" text-anchor="middle">original never overwritten</text><text x="185" y="442" class="small" text-anchor="middle">removed on cleanup</text>
<line x1="315" y1="360" x2="365" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="365,360 354.6,366 354.6,354" fill="#4cc9f0"/>
<rect x="365" y="150" width="285" height="425" rx="22" class="panel" filter="url(#worker-shadow)"/>
<text x="507" y="194" class="h" text-anchor="middle">2. Isolated Owner</text>
<rect x="395" y="225" width="225" height="85" rx="14" class="panel2"/>
<text x="507" y="255" class="b" text-anchor="middle">spawn Worker</text><text x="507" y="280" class="small" text-anchor="middle">fresh Python process</text>
<rect x="395" y="335" width="225" height="105" rx="14" class="panel2"/>
<text x="507" y="365" class="b" text-anchor="middle">One COM STA</text><text x="507" y="390" class="small" text-anchor="middle">one Automation Server</text><text x="507" y="411" class="small" text-anchor="middle">no proxy crosses IPC</text>
<rect x="395" y="465" width="225" height="70" rx="14" class="panel2"/>
<text x="507" y="494" class="b" text-anchor="middle">Windows Job Scope</text><text x="507" y="518" class="small" text-anchor="middle">owned descendants only</text>
<line x1="650" y1="360" x2="700" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="700,360 689.6,366 689.6,354" fill="#4cc9f0"/>
<rect x="700" y="150" width="285" height="425" rx="22" class="panel" filter="url(#worker-shadow)"/>
<text x="842" y="194" class="h" text-anchor="middle">3. Governed IPC</text>
<rect x="730" y="225" width="225" height="105" rx="14" class="panel2"/>
<text x="842" y="255" class="b" text-anchor="middle">Protocol + Request ID</text><text x="842" y="280" class="small" text-anchor="middle">ready / evaluate / close</text><text x="842" y="301" class="small" text-anchor="middle">correlation must match</text>
<rect x="730" y="355" width="225" height="80" rx="14" class="panel2"/>
<text x="842" y="385" class="b" text-anchor="middle">Hard Deadline</text><text x="842" y="410" class="small" text-anchor="middle">parent enforces timeout</text>
<rect x="730" y="460" width="225" height="75" rx="14" class="panel2"/>
<text x="842" y="490" class="b" text-anchor="middle">Bounded Diagnostics</text><text x="842" y="515" class="small" text-anchor="middle">no unbounded traceback</text>
<line x1="985" y1="360" x2="1035" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="1035,360 1024.6,366 1024.6,354" fill="#4cc9f0"/>
<rect x="1035" y="150" width="310" height="425" rx="22" class="panel" filter="url(#worker-shadow)"/>
<text x="1190" y="194" class="h" text-anchor="middle">4. Verified Recycle</text>
<rect x="1065" y="225" width="250" height="145" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="1190" y="255" class="b" text-anchor="middle">Recycle Reasons</text><text x="1190" y="280" class="small" text-anchor="middle">timeout • crash • protocol</text><text x="1190" y="301" class="small" text-anchor="middle">tainted write • point budget</text><text x="1190" y="322" class="small" text-anchor="middle">worker age • cancellation</text><text x="1190" y="343" class="small" text-anchor="middle">lease ownership loss</text>
<rect x="1065" y="395" width="250" height="100" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="1190" y="425" class="b" text-anchor="middle">Generation + 1</text><text x="1190" y="450" class="small" text-anchor="middle">old handle closed</text><text x="1190" y="471" class="small" text-anchor="middle">new private stage and runtime</text>
<rect x="135" y="620" width="1130" height="58" rx="19" class="panel2"/>
<text x="700" y="644" class="b" text-anchor="middle">AspenOps never terminates an unrelated simulator process and never shares a live COM object across workers</text>
</svg>