<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">CLI, Python and MCP</title><desc id="desc">Three product surfaces reuse one deterministic implementation.</desc><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{font-family:"JetBrains Mono",Consolas,monospace;fill:#A7B7CA}.e{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.2px;fill:#22D3EE}.h{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:32px;font-weight:700;fill:#F8FAFC}.s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:500;fill:#A7B7CA}.l{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;fill:#F8FAFC}.b{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#A7B7CA}.x{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;fill:#71849B}.c{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600;fill:#A7B7CA}.v{font-family:"JetBrains Mono",Consolas,monospace;font-size:21px;font-weight:700;fill:#F8FAFC}.p{fill:#0D1524;stroke:#23344E;stroke-width:1.2}.q{fill:#121E30;stroke:#334A6B;stroke-width:1.2}</style><rect width="1440" height="720" rx="28" fill="#050A12"/><path d="M52 132H1388" stroke="#334A6B"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><text x="52" y="46" class="e">PUBLIC SURFACES</text><text x="52" y="86" class="h">CLI, Python and MCP</text><text x="52" y="112" class="s">No parallel simulator drivers and no arbitrary code execution.</text><rect x="52" y="190" width="300" height="260" rx="16" class="q"/><rect x="52" y="190" width="6" height="260" rx="3" fill="#60A5FA"/><text x="74" y="228" class="l">CLI</text><text x="74" y="256" class="b">commands</text><text x="74" y="278" class="b">diagnostics</text><text x="74" y="300" class="b">batch + scheduler</text><rect x="392" y="190" width="300" height="260" rx="16" class="q"/><rect x="392" y="190" width="6" height="260" rx="3" fill="#2DD4BF"/><text x="414" y="228" class="l">Python API</text><text x="414" y="256" class="b">embedded workflows</text><text x="414" y="278" class="b">same Settings + Policy</text><rect x="732" y="190" width="300" height="260" rx="16" class="q"/><rect x="732" y="190" width="6" height="260" rx="3" fill="#A78BFA"/><text x="754" y="228" class="l">MCP</text><text x="754" y="256" class="b">14 constrained tools</text><text x="754" y="278" class="b">Agent discovery + control</text><path d="M352 320H382" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M382 320l-8 5v-10z" fill="#60A5FA"/><path d="M692 320H722" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M722 320l-8 5v-10z" fill="#60A5FA"/><rect x="1072" y="190" width="316" height="260" rx="16" class="q"/><rect x="1072" y="190" width="6" height="260" rx="3" fill="#22C55E"/><text x="1094" y="228" class="l">Shared Runtime</text><text x="1094" y="256" class="b">Settings + Policy</text><text x="1094" y="278" class="b">Scheduler + Pool</text><text x="1094" y="300" class="b">Evidence + Verification</text><rect x="52" y="492" width="420" height="96" rx="16" class="p"/><rect x="52" y="492" width="6" height="96" rx="3" fill="#22C55E"/><text x="74" y="530" class="l">ALLOWED</text><text x="74" y="558" class="b">typed requests · bounded operations</text><rect x="510" y="492" width="420" height="96" rx="16" class="p"/><rect x="510" y="492" width="6" height="96" rx="3" fill="#F43F5E"/><text x="532" y="530" class="l">REJECTED</text><text x="532" y="558" class="b">Shell · VBA · arbitrary COM · raw Tree Path</text><rect x="968" y="492" width="420" height="96" rx="16" class="p"/><rect x="968" y="492" width="6" height="96" rx="3" fill="#F59E0B"/><text x="990" y="530" class="l">LIFECYCLE</text><text x="990" y="558" class="b">startup → serve → cleanup</text><rect x="52" y="626" width="1336" height="46" rx="12" fill="#121E30" stroke="#22D3EE"/><text x="720" y="655" class="c" text-anchor="middle">one implementation · three controlled entry points</text></svg>