<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">CLI, Python and MCP Operating Surface</title>
<desc id="desc">Three controlled entry points share one policy, scheduler, worker and evidence implementation instead of creating parallel simulator drivers</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.m{fill:#9fb0c8;font-size:14px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">CLI, Python and MCP Operating Surface</text>
<text x="64" y="96" class="sub">One implementation • narrow interfaces • semantic variables • no arbitrary shell or raw Tree Path</text>
<rect x="55" y="145" width="330" height="455" rx="22" class="panel" filter="url(#shadow)"/>
<text x="220" y="190" class="h" text-anchor="middle">Entry Points</text>
<rect x="85" y="225" width="270" height="70" rx="14" class="panel2"/><text x="105" y="254" class="b">CLI</text><text x="105" y="277" class="m">demo • doctor • dry-run • run-batch</text>
<rect x="85" y="315" width="270" height="70" rx="14" class="panel2"/><text x="105" y="344" class="b">Python API</text><text x="105" y="367" class="m">batch • scheduler • optimization</text>
<rect x="85" y="405" width="270" height="70" rx="14" class="panel2"/><text x="105" y="434" class="b">MCP server</text><text x="105" y="457" class="m">14 narrow discovery and execution tools</text>
<rect x="85" y="505" width="270" height="54" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/><text x="220" y="538" class="m" text-anchor="middle">No alternate COM driver</text>
<line x1="385" y1="370" x2="465" y2="370" stroke="#4cc9f0" stroke-width="3"/><polygon points="465,370 454.6,376 454.6,364" fill="#4cc9f0"/>
<rect x="465" y="145" width="470" height="455" rx="22" class="panel" filter="url(#shadow)"/>
<text x="700" y="190" class="h" text-anchor="middle">Shared AspenOps Core</text>
<rect x="495" y="225" width="190" height="74" rx="14" class="panel2"/><text x="515" y="255" class="b">Settings &amp; Policy</text><text x="515" y="279" class="m">roots • units • budgets</text>
<rect x="715" y="225" width="190" height="74" rx="14" class="panel2"/><text x="735" y="255" class="b">Request Validation</text><text x="735" y="279" class="m">dry-run before COM</text>
<rect x="495" y="325" width="190" height="74" rx="14" class="panel2"/><text x="515" y="355" class="b">Scheduler &amp; Pools</text><text x="515" y="379" class="m">leases • license slots</text>
<rect x="715" y="325" width="190" height="74" rx="14" class="panel2"/><text x="735" y="355" class="b">Isolated Workers</text><text x="735" y="379" class="m">process • STA • private case</text>
<rect x="495" y="425" width="190" height="74" rx="14" class="panel2"/><text x="515" y="455" class="b">Engineering Gates</text><text x="515" y="479" class="m">convergence • balances</text>
<rect x="715" y="425" width="190" height="74" rx="14" class="panel2"/><text x="735" y="455" class="b">Evidence</text><text x="735" y="479" class="m">hashes • bundles • signatures</text>
<rect x="560" y="530" width="280" height="42" rx="18" fill="#4ade80" opacity=".14" stroke="#4ade80"/><text x="700" y="556" class="m" text-anchor="middle">same semantics on every surface</text>
<line x1="935" y1="370" x2="1015" y2="370" stroke="#4cc9f0" stroke-width="3"/><polygon points="1015,370 1004.6,376 1004.6,364" fill="#4cc9f0"/>
<rect x="1015" y="145" width="330" height="455" rx="22" class="panel" filter="url(#shadow)"/>
<text x="1180" y="190" class="h" text-anchor="middle">Controlled Outcomes</text>
<rect x="1045" y="225" width="270" height="66" rx="14" class="panel2"/><text x="1065" y="253" class="b">Portable Mock</text><text x="1065" y="275" class="m">cross-platform software evidence</text>
<rect x="1045" y="310" width="270" height="66" rx="14" class="panel2"/><text x="1065" y="338" class="b">Aspen Plus / HYSYS</text><text x="1065" y="360" class="m">licensed Windows, approved model</text>
<rect x="1045" y="395" width="270" height="66" rx="14" class="panel2"/><text x="1065" y="423" class="b">Durable Jobs</text><text x="1065" y="445" class="m">queryable status and cancellation</text>
<rect x="1045" y="480" width="270" height="66" rx="14" class="panel2"/><text x="1065" y="508" class="b">Evidence Bundles</text><text x="1065" y="530" class="m">verification before acceptance</text>
<text x="700" y="662" class="b" text-anchor="middle">Agent integrations must call the governed surface; they do not generate arbitrary simulator automation code</text>
</svg>