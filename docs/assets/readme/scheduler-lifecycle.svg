<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Durable Scheduler State Machine</title><desc id="desc">Leases, retries, cancellation, and commits are explicit.</desc><style>.h{font:700 28px system-ui,sans-serif;fill:#F8FAFC}.e{font:700 12px system-ui,sans-serif;fill:#38BDF8;letter-spacing:2px}.l{font:650 15px system-ui,sans-serif;fill:#F8FAFC}.s{font:500 12px system-ui,sans-serif;fill:#A7B5C8}.m{font:600 12px monospace;fill:#C9D7E8}.c{fill:#102036;stroke:#2A405F}.d{fill:#142944;stroke:#3B567A}</style><rect width="1200" height="560" rx="24" fill="#07111F"/><text x="44" y="42" class="e">SCHEDULER LIFECYCLE</text><text x="44" y="78" class="h">Durable Scheduler State Machine</text><path d="M44 98H1156" stroke="#38BDF8" stroke-width="2"/><path d="M650 98H1156" stroke="#818CF8" stroke-width="2"/><rect x="44" y="160" width="170" height="72" rx="16" class="c"/><rect x="44" y="160" width="6" height="72" rx="3" fill="#38BDF8"/><text x="64" y="198" class="l">pending</text><text x="64" y="224" class="s">durable state</text><rect x="254" y="160" width="170" height="72" rx="16" class="c"/><rect x="254" y="160" width="6" height="72" rx="3" fill="#38BDF8"/><text x="274" y="198" class="l">claimed</text><text x="274" y="224" class="s">durable state</text><rect x="464" y="160" width="170" height="72" rx="16" class="d"/><rect x="464" y="160" width="6" height="72" rx="3" fill="#818CF8"/><text x="484" y="198" class="l">running</text><text x="484" y="224" class="s">durable state</text><rect x="674" y="160" width="170" height="72" rx="16" class="c"/><rect x="674" y="160" width="6" height="72" rx="3" fill="#34D399"/><text x="694" y="198" class="l">completed</text><text x="694" y="224" class="s">durable state</text><path d="M214 196h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><path d="M424 196h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><path d="M634 196h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="254" y="300" width="170" height="72" rx="16" class="c"/><rect x="254" y="300" width="6" height="72" rx="3" fill="#FBBF24"/><text x="274" y="338" class="l">retry_wait</text><text x="274" y="364" class="s">attempts remain</text><path d="M549 232L339 300" stroke="#71829A" stroke-dasharray="6 7"/><rect x="254" y="408" width="170" height="58" rx="16" class="c"/><rect x="254" y="408" width="6" height="58" rx="3" fill="#FB7185"/><text x="274" y="446" class="l">dead_letter</text><text x="274" y="472" class="s">attempts exhausted</text><rect x="794" y="300" width="170" height="72" rx="16" class="c"/><rect x="794" y="300" width="6" height="72" rx="3" fill="#FBBF24"/><text x="814" y="338" class="l">cancelling</text><text x="814" y="364" class="s">deadline active</text><rect x="794" y="408" width="170" height="58" rx="16" class="c"/><rect x="794" y="408" width="6" height="58" rx="3" fill="#FB7185"/><text x="814" y="446" class="l">cancelled</text><text x="814" y="472" class="s">terminal state</text><rect x="1000" y="160" width="156" height="306" rx="16" class="d"/><rect x="1000" y="160" width="6" height="306" rx="3" fill="#38BDF8"/><text x="1020" y="198" class="l">LEASE</text><text x="1020" y="224" class="s">owner · expiry · heartbeat · attempt · token</text><rect x="44" y="478" width="1112" height="46" rx="12" class="d"/><text x="600" y="507" class="m" text-anchor="middle">retry_wait · dead_letter · cancelling · cancelled</text></svg>
