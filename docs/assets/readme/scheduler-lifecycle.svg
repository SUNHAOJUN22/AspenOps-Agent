<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Durable Scheduler and Worker Lifecycle</title>
<desc id="desc">Validated requests become durable jobs, receive leases and heartbeats, execute in isolated workers, and finish with evidence or explicit failure</desc>
<rect width="1400" height="700" rx="28" fill="#0b1020"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.m{fill:#9fb0c8;font-size:14px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Durable Scheduler and Worker Lifecycle</text>
<text x="64" y="96" class="sub">SQLite WAL • leases • heartbeats • cancellation deadlines • idempotent completion</text>
<rect x="55" y="145" width="210" height="250" rx="20" class="panel" filter="url(#shadow)"/>
<text x="160" y="188" class="h" text-anchor="middle">1. Validate</text>
<rect x="80" y="220" width="160" height="46" rx="12" class="panel2"/><text x="160" y="249" class="m" text-anchor="middle">schema + policy</text>
<rect x="80" y="282" width="160" height="46" rx="12" class="panel2"/><text x="160" y="311" class="m" text-anchor="middle">paths + units</text>
<rect x="80" y="344" width="160" height="32" rx="16" fill="#4ade80" opacity=".16" stroke="#4ade80"/><text x="160" y="365" class="small" text-anchor="middle">fail closed</text>
<line x1="265" y1="270" x2="310" y2="270" stroke="#4cc9f0" stroke-width="3"/><polygon points="310,270 299.6,276 299.6,264" fill="#4cc9f0"/>
<rect x="310" y="145" width="210" height="250" rx="20" class="panel" filter="url(#shadow)"/>
<text x="415" y="188" class="h" text-anchor="middle">2. Persist</text>
<rect x="335" y="220" width="160" height="46" rx="12" class="panel2"/><text x="415" y="249" class="m" text-anchor="middle">SQLite WAL job</text>
<rect x="335" y="282" width="160" height="46" rx="12" class="panel2"/><text x="415" y="311" class="m" text-anchor="middle">idempotency key</text>
<rect x="335" y="344" width="160" height="32" rx="16" fill="#7b61ff" opacity=".16" stroke="#7b61ff"/><text x="415" y="365" class="small" text-anchor="middle">QUEUED</text>
<line x1="520" y1="270" x2="565" y2="270" stroke="#4cc9f0" stroke-width="3"/><polygon points="565,270 554.6,276 554.6,264" fill="#4cc9f0"/>
<rect x="565" y="145" width="210" height="250" rx="20" class="panel" filter="url(#shadow)"/>
<text x="670" y="188" class="h" text-anchor="middle">3. Lease</text>
<rect x="590" y="220" width="160" height="46" rx="12" class="panel2"/><text x="670" y="249" class="m" text-anchor="middle">claim deadline</text>
<rect x="590" y="282" width="160" height="46" rx="12" class="panel2"/><text x="670" y="311" class="m" text-anchor="middle">heartbeat renewal</text>
<rect x="590" y="344" width="160" height="32" rx="16" fill="#4cc9f0" opacity=".16" stroke="#4cc9f0"/><text x="670" y="365" class="small" text-anchor="middle">RUNNING</text>
<line x1="775" y1="270" x2="820" y2="270" stroke="#4cc9f0" stroke-width="3"/><polygon points="820,270 809.6,276 809.6,264" fill="#4cc9f0"/>
<rect x="820" y="145" width="210" height="250" rx="20" class="panel" filter="url(#shadow)"/>
<text x="925" y="188" class="h" text-anchor="middle">4. Execute</text>
<rect x="845" y="220" width="160" height="46" rx="12" class="panel2"/><text x="925" y="249" class="m" text-anchor="middle">isolated Worker</text>
<rect x="845" y="282" width="160" height="46" rx="12" class="panel2"/><text x="925" y="311" class="m" text-anchor="middle">private case copy</text>
<rect x="845" y="344" width="160" height="32" rx="16" fill="#fbbf24" opacity=".16" stroke="#fbbf24"/><text x="925" y="365" class="small" text-anchor="middle">license bounded</text>
<line x1="1030" y1="270" x2="1075" y2="270" stroke="#4cc9f0" stroke-width="3"/><polygon points="1075,270 1064.6,276 1064.6,264" fill="#4cc9f0"/>
<rect x="1075" y="145" width="270" height="250" rx="20" class="panel" filter="url(#shadow)"/>
<text x="1210" y="188" class="h" text-anchor="middle">5. Commit Evidence</text>
<rect x="1100" y="220" width="220" height="46" rx="12" class="panel2"/><text x="1210" y="249" class="m" text-anchor="middle">result + hashes + bundle</text>
<rect x="1100" y="282" width="220" height="46" rx="12" class="panel2"/><text x="1210" y="311" class="m" text-anchor="middle">atomic final state</text>
<rect x="1100" y="344" width="105" height="32" rx="16" fill="#4ade80" opacity=".16" stroke="#4ade80"/><text x="1152" y="365" class="small" text-anchor="middle">COMPLETED</text>
<rect x="1215" y="344" width="105" height="32" rx="16" fill="#fb7185" opacity=".16" stroke="#fb7185"/><text x="1267" y="365" class="small" text-anchor="middle">FAILED</text>
<rect x="120" y="475" width="1160" height="145" rx="22" class="panel"/>
<text x="700" y="516" class="h" text-anchor="middle">Recovery and Cancellation Contracts</text>
<rect x="160" y="545" width="235" height="48" rx="12" class="panel2"/><text x="277" y="575" class="m" text-anchor="middle">expired lease → reclaim</text>
<rect x="425" y="545" width="235" height="48" rx="12" class="panel2"/><text x="542" y="575" class="m" text-anchor="middle">cancel deadline → terminate owned Worker</text>
<rect x="690" y="545" width="235" height="48" rx="12" class="panel2"/><text x="807" y="575" class="m" text-anchor="middle">restart → interrupted state</text>
<rect x="955" y="545" width="235" height="48" rx="12" class="panel2"/><text x="1072" y="575" class="m" text-anchor="middle">duplicate submit → same durable intent</text>
<text x="700" y="665" class="b" text-anchor="middle">No silent success: every terminal state carries explicit status and evidence provenance</text>
</svg>