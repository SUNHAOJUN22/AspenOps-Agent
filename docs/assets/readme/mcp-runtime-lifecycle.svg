<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">MCP Runtime Compatibility and Scheduler Lifecycle</title>
<desc id="desc">AspenOps constrains MCP Python SDK 1.x in project and Wheel metadata, verifies the installed SDK before importing FastMCP, starts the durable Scheduler inside server lifespan, exposes fourteen constrained tools, and closes Worker resources on shutdown.</desc>
<rect width="1400" height="680" rx="28" fill="#0b1020"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.m{fill:#9fb0c8;font-size:14px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">MCP Runtime Compatibility and Scheduler Lifecycle</text>
<text x="64" y="98" class="sub">Package and Wheel metadata • runtime fail-closed gate • lifespan-owned startup and shutdown</text>
<rect x="55" y="155" width="235" height="350" rx="22" class="panel" filter="url(#shadow)"/>
<text x="172" y="198" class="h" text-anchor="middle">1. Install Contract</text>
<rect x="82" y="230" width="180" height="70" rx="14" class="panel2"/>
<text x="100" y="258" class="b">Project + Wheel</text><text x="100" y="282" class="small">agent: mcp&gt;=1.9,&lt;2</text>
<rect x="82" y="325" width="180" height="70" rx="14" class="panel2"/>
<text x="100" y="353" class="b">Frozen CI</text><text x="100" y="377" class="small">1.28.1 + METADATA check</text>
<line x1="290" y1="330" x2="350" y2="330" stroke="#4cc9f0" stroke-width="3"/><polygon points="350,330 339.6,336 339.6,324" fill="#4cc9f0"/>
<rect x="350" y="155" width="235" height="350" rx="22" class="panel" filter="url(#shadow)"/>
<text x="467" y="198" class="h" text-anchor="middle">2. Fail-Closed Gate</text>
<rect x="377" y="230" width="180" height="70" rx="14" fill="#4ade80" opacity=".13" stroke="#4ade80"/>
<text x="467" y="259" class="b" text-anchor="middle">SDK major = 1</text><text x="467" y="282" class="small" text-anchor="middle">continue to import</text>
<rect x="377" y="325" width="180" height="70" rx="14" fill="#fb7185" opacity=".13" stroke="#fb7185"/>
<text x="467" y="354" class="b" text-anchor="middle">missing or major != 1</text><text x="467" y="377" class="small" text-anchor="middle">explicit RuntimeError</text>
<line x1="585" y1="330" x2="645" y2="330" stroke="#4cc9f0" stroke-width="3"/><polygon points="645,330 634.6,336 634.6,324" fill="#4cc9f0"/>
<rect x="645" y="155" width="310" height="350" rx="22" class="panel" filter="url(#shadow)"/>
<text x="800" y="198" class="h" text-anchor="middle">3. FastMCP Lifespan</text>
<rect x="675" y="230" width="250" height="62" rx="14" class="panel2"/>
<text x="695" y="258" class="b">Startup</text><text x="895" y="258" class="small" text-anchor="end">scheduler.start()</text>
<rect x="675" y="315" width="250" height="62" rx="14" class="panel2"/>
<text x="695" y="343" class="b">Serve</text><text x="895" y="343" class="small" text-anchor="end">14 narrow tools</text>
<rect x="675" y="400" width="250" height="62" rx="14" class="panel2"/>
<text x="695" y="428" class="b">Shutdown</text><text x="895" y="428" class="small" text-anchor="end">scheduler.stop()</text>
<line x1="955" y1="330" x2="1015" y2="330" stroke="#4cc9f0" stroke-width="3"/><polygon points="1015,330 1004.6,336 1004.6,324" fill="#4cc9f0"/>
<rect x="1015" y="155" width="330" height="350" rx="22" class="panel" filter="url(#shadow)"/>
<text x="1180" y="198" class="h" text-anchor="middle">4. Controlled Runtime</text>
<rect x="1045" y="230" width="270" height="58" rx="14" class="panel2"/>
<text x="1065" y="265" class="b">Durable queue + cancellation</text>
<rect x="1045" y="310" width="270" height="58" rx="14" class="panel2"/>
<text x="1065" y="345" class="b">License-aware Worker pools</text>
<rect x="1045" y="390" width="270" height="58" rx="14" class="panel2"/>
<text x="1065" y="425" class="b">Evidence and human review</text>
<rect x="130" y="555" width="1140" height="66" rx="22" class="panel2"/>
<text x="700" y="584" class="b" text-anchor="middle">No implicit major upgrade and no orphaned Scheduler fabric after MCP server shutdown</text>
<text x="700" y="607" class="small" text-anchor="middle">Mock and software lifecycle evidence do not grant licensed Aspen engineering certification</text>
</svg>
