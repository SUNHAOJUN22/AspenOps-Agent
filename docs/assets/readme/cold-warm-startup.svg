.title{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:32px;font-weight:700;fill:#F8FAFC}
.subtitle{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:500;fill:#A7B7CA}
.label{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;fill:#F8FAFC}
.body{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#A7B7CA}
.small{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;fill:#71849B}
