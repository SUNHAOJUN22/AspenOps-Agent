<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Cold and Warm Startup Evidence</title><desc id="desc">Startup measurements compare lightweight and full control paths on the same interpreter and machine.</desc><style>
.txt{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.mono{font-family:"JetBrains Mono",Consolas,monospace;fill:#A7B7CA}
