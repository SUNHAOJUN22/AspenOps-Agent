</style><rect width="1440" height="720" rx="28" fill="#050A12"/><defs><pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#23344E" stroke-width=".6" opacity=".22"/></pattern></defs><rect x="1" y="1" width="1438" height="718" rx="27" fill="url(#microgrid)" opacity=".45"/><text x="52" y="46" class="eyebrow">STARTUP MODEL</text><text x="52" y="86" class="title">Cold and Warm Startup Evidence</text><text x="52" y="112" class="subtitle">Lightweight Bootstrap · Import Time · Hard Contracts</text><path d="M52 132H1388" stroke="#334A6B" stroke-width="1"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><rect x="52" y="176" width="650" height="390" rx="16" class="panel2"/><text x="78" y="214" class="small">COLD PATH</text><rect x="78" y="238" width="54" height="54" rx="12" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1.2"/><path d="M92.0 257.0l8 8-8 8M104.0 273.0h14" fill="none" stroke="#60A5FA" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="262" class="label">Lightweight Bootstrap</text><text x="78" y="342" class="small">package version</text><rect x="220" y="326" width="110" height="24" rx="8" fill="#60A5FA" stroke="#60A5FA" stroke-width="1.2"/><text x="78" y="406" class="small">argparse surface</text><rect x="220" y="390" width="190" height="24" rx="8" fill="#22D3EE" stroke="#22D3EE" stroke-width="1.2"/><text x="78" y="470" class="small">full control plane</text><rect x="220" y="454" width="470" height="24" rx="8" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.2"/><rect x="78" y="500" width="226" height="30" rx="15" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1"/><text x="191.0" y="520" class="small" text-anchor="middle" fill="#F8FAFC">--version / --help</text><rect x="738" y="176" width="650" height="390" rx="16" class="panel"/><text x="764" y="214" class="small">MEASUREMENT CHANNELS</text><rect x="764" y="242" width="596" height="54" rx="12" fill="#121E30" stroke="#60A5FA" stroke-width="1.2"/><text x="782" y="265" class="label">normal subprocess</text><text x="1030" y="265" class="small">median · P95 · CV</text><rect x="764" y="312" width="596" height="54" rx="12" fill="#121E30" stroke="#22D3EE" stroke-width="1.2"/><text x="782" y="335" class="label">Import Time</text><text x="1030" y="335" class="small">-X importtime</text><rect x="764" y="382" width="596" height="54" rx="12" fill="#121E30" stroke="#22C55E" stroke-width="1.2"/><text x="782" y="405" class="label">Hard Contracts</text><text x="1030" y="405" class="small">module + operation counts</text><rect x="764" y="452" width="596" height="54" rx="12" fill="#121E30" stroke="#A78BFA" stroke-width="1.2"/><text x="782" y="475" class="label">diagnostics</text><text x="1030" y="475" class="small">cProfile · tracemalloc · RSS</text><rect x="764" y="522" width="596" height="28" rx="9" fill="#0D1524" stroke="#F59E0B" stroke-width="1.2"/><text x="1062" y="541" class="small" text-anchor="middle">shared-runner wall time is evidence, not a narrow gate</text><rect x="52.0" y="594" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="70.0" y="622" class="small">VERSION PATH</text><text x="70.0" y="658" class="value">no heavy modules</text><rect x="468.6666666666667" y="612" width="4" height="60" rx="2" fill="#60A5FA"/><rect x="502.6666666666667" y="594" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="520.6666666666667" y="622" class="small">REAL COMMAND</text><text x="520.6666666666667" y="658" class="value">one parse</text><rect x="919.3333333333334" y="612" width="4" height="60" rx="2" fill="#22D3EE"/><rect x="953.3333333333334" y="594" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="971.3333333333334" y="622" class="small">SOLVER SPEED</text><text x="971.3333333333334" y="658" class="value">not claimed</text><rect x="1370.0" y="612" width="4" height="60" rx="2" fill="#F59E0B"/></svg>
