<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Native Adapter Conformance Gate</title><desc id="desc">Deterministic preflight compares plan requirements with adapter identity and declared capabilities before the first native mutation.</desc><style>.e{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.2px;fill:#22D3EE}.h{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:32px;font-weight:700;fill:#F8FAFC}.s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:500;fill:#A7B7CA}.l{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:700;fill:#F8FAFC}.b{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#A7B7CA}.c{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600;fill:#A7B7CA}.k{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;font-weight:700;fill:#67E8F9}.p{fill:#0D1524;stroke:#23344E;stroke-width:1.2}.q{fill:#121E30;stroke:#334A6B;stroke-width:1.2}</style><rect width="1440" height="720" rx="28" fill="#050A12"/><path d="M52 132H1388" stroke="#334A6B"/><path d="M52 132H560" stroke="#22D3EE" stroke-width="2"/><text x="52" y="46" class="e">NATIVE PREFLIGHT</text><text x="52" y="86" class="h">Native Adapter Conformance Gate</text><text x="52" y="112" class="s">Prove declared adapter coverage before the first compilation step mutates a case.</text><rect x="52" y="172" width="380" height="342" rx="16" class="q"/><rect x="52" y="172" width="6" height="342" rx="3" fill="#60A5FA"/><text x="76" y="210" class="l">Plan Requirements</text><text x="76" y="246" class="b">Operations</text><text x="76" y="274" class="b">Adapter keys</text><text x="76" y="302" class="b">Topology readback</text><text x="76" y="330" class="b">Layout readback</text><text x="76" y="358" class="b">Save and reopen</text><text x="76" y="386" class="b">Failure isolation</text><rect x="76" y="430" width="250" height="32" rx="16" fill="#082F49"/><text x="201" y="451" text-anchor="middle" class="k">CompilationPlan digest</text><path d="M432 343H486" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M486 343l-8 5v-10z" fill="#60A5FA"/><rect x="486" y="152" width="468" height="382" rx="18" class="q"/><rect x="486" y="152" width="6" height="382" rx="3" fill="#22D3EE"/><text x="512" y="194" class="l">Manifest Identity</text><circle cx="720" cy="286" r="72" fill="#0D2D46" stroke="#22D3EE" stroke-width="3"/><path d="M687 286l22 22 45-52" fill="none" stroke="#22C55E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="394" text-anchor="middle" class="l">Strict schema</text><text x="720" y="426" text-anchor="middle" class="b">Profile + adapter contract</text><text x="720" y="454" text-anchor="middle" class="b">Code + runtime SHA-256</text><text x="720" y="482" text-anchor="middle" class="b">Declared capability coverage</text><rect x="596" y="504" width="248" height="32" rx="16" fill="#164E63"/><text x="720" y="525" text-anchor="middle" class="k">Conformance report</text><path d="M954 343H1008" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/><path d="M1008 343l-8 5v-10z" fill="#A78BFA"/><rect x="1008" y="172" width="380" height="342" rx="16" class="q"/><rect x="1008" y="172" width="6" height="342" rx="3" fill="#A78BFA"/><text x="1032" y="210" class="l">Fail Before Mutation</text><rect x="1032" y="246" width="330" height="58" rx="14" fill="#321725" stroke="#F43F5E"/><text x="1197" y="281" text-anchor="middle" class="l">Missing capability</text><rect x="1032" y="326" width="330" height="58" rx="14" fill="#0C302B" stroke="#22C55E"/><text x="1197" y="361" text-anchor="middle" class="l">Conformant adapter</text><path d="M1197 388V430" fill="none" stroke="#22C55E" stroke-width="2"/><path d="M1197 430l-5-8h10z" fill="#22C55E"/><rect x="1032" y="438" width="330" height="48" rx="14" fill="#172554"/><text x="1197" y="468" text-anchor="middle" class="b">Fresh authorization</text><rect x="52" y="558" width="420" height="64" rx="16" class="p"/><rect x="52" y="558" width="6" height="64" rx="3" fill="#60A5FA"/><text x="76" y="584" class="l">COVERAGE</text><text x="76" y="610" class="b">Every operation + adapter key</text><rect x="510" y="558" width="420" height="64" rx="16" class="p"/><rect x="510" y="558" width="6" height="64" rx="3" fill="#22C55E"/><text x="534" y="584" class="l">EVIDENCE</text><text x="534" y="610" class="b">Manifest + report digests</text><rect x="968" y="558" width="420" height="64" rx="16" class="p"/><rect x="968" y="558" width="6" height="64" rx="3" fill="#F43F5E"/><text x="992" y="584" class="l">BOUNDARY</text><text x="992" y="610" class="b">Golden Cases still required</text><rect x="52" y="642" width="1336" height="42" rx="12" fill="#121E30" stroke="#334A6B"/><text x="720" y="668" text-anchor="middle" class="c">offline conformance · licensed runtime verification · human engineering acceptance</text></svg>
