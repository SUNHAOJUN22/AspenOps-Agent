<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="adapter-title adapter-desc">
  <title id="adapter-title">Native adapter conformance gate</title>
  <desc id="adapter-desc">A deterministic preflight compares compilation plan requirements with adapter identity, operations, readback, persistence, and failure isolation before native mutation.</desc>
  <defs>
    <linearGradient id="adapter-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#10294a"/>
    </linearGradient>
    <linearGradient id="adapter-gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="adapter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="adapter-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#adapter-bg)"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Native Adapter Conformance Gate</text>
  <text x="64" y="108" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Deterministic preflight before the first native mutation</text>

  <g filter="url(#adapter-shadow)">
    <rect x="62" y="164" width="300" height="344" rx="26" fill="#0f2745" stroke="#38bdf8" stroke-width="2"/>
    <rect x="450" y="142" width="300" height="388" rx="30" fill="#111f3c" stroke="url(#adapter-gate)" stroke-width="4"/>
    <rect x="838" y="164" width="300" height="344" rx="26" fill="#0f2745" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <text x="92" y="210" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Plan Requirements</text>
  <text x="92" y="252" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Operations</text>
  <text x="92" y="287" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Adapter keys</text>
  <text x="92" y="322" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Topology readback</text>
  <text x="92" y="357" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Layout readback</text>
  <text x="92" y="392" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Save and reopen</text>
  <text x="92" y="427" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">Failure isolation</text>
  <rect x="92" y="456" width="224" height="28" rx="14" fill="#082f49"/>
  <text x="204" y="476" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="14">CompilationPlan digest</text>

  <text x="480" y="194" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="24" font-weight="700">Manifest Identity</text>
  <circle cx="600" cy="270" r="72" fill="#132d50" stroke="#67e8f9" stroke-width="3"/>
  <path d="M570 271 l20 20 l42 -48" fill="none" stroke="#5eead4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="378" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Strict schema</text>
  <text x="600" y="410" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Profile and contract</text>
  <text x="600" y="438" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Code and runtime SHA-256</text>
  <text x="600" y="466" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Capability coverage</text>
  <rect x="500" y="486" width="200" height="28" rx="14" fill="#312e81"/>
  <text x="600" y="506" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="14">Conformance report</text>

  <text x="868" y="210" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="24" font-weight="700">Fail Before Mutation</text>
  <rect x="878" y="246" width="220" height="58" rx="18" fill="#3f1d35" stroke="#fb7185" stroke-width="2"/>
  <text x="988" y="281" text-anchor="middle" fill="#fecdd3" font-family="Arial, sans-serif" font-size="17" font-weight="700">Missing capability</text>
  <rect x="878" y="326" width="220" height="58" rx="18" fill="#123a35" stroke="#2dd4bf" stroke-width="2"/>
  <text x="988" y="361" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="17" font-weight="700">Conformant adapter</text>
  <path d="M988 386 V430" stroke="#5eead4" stroke-width="4" marker-end="url(#adapter-arrow)"/>
  <rect x="878" y="438" width="220" height="46" rx="16" fill="#172554"/>
  <text x="988" y="467" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="16">Fresh authorization</text>

  <path d="M366 336 H438" stroke="#67e8f9" stroke-width="4" marker-end="url(#adapter-arrow)"/>
  <path d="M754 336 H826" stroke="#67e8f9" stroke-width="4" marker-end="url(#adapter-arrow)"/>

  <rect x="62" y="574" width="1076" height="58" rx="20" fill="#091b31" stroke="#334155"/>
  <text x="600" y="610" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Offline conformance is necessary, not sufficient: licensed Golden Cases and human engineering acceptance remain mandatory.</text>
</svg>
