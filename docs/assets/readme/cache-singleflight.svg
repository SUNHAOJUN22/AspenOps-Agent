<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="cache-title cache-desc">
<title id="cache-title">Content-Addressed Cache, Deduplication and Singleflight</title>
<desc id="cache-desc">AspenOps hashes runtime, backend, model, registry and physical request identity, checks memory and SQLite WAL caches, deduplicates identical batch points, coordinates concurrent single-point followers, and computes only one governed solver call.</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="cache-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Content-Addressed Cache, Deduplication and Singleflight</text>
<text x="64" y="98" class="sub">Stable physical identity • memory LRU • SQLite WAL • same-batch dedup • one in-flight leader</text>
<rect x="55" y="145" width="300" height="430" rx="22" class="panel" filter="url(#cache-shadow)"/>
<text x="205" y="190" class="h" text-anchor="middle">1. Physical Identity</text>
<rect x="85" y="220" width="240" height="280" rx="14" class="panel2"/>
<text x="205" y="250" class="b" text-anchor="middle">Canonical SHA-256</text>
<text x="205" y="283" class="small" text-anchor="middle">runtime schema + package version</text>
<text x="205" y="309" class="small" text-anchor="middle">backend + stable runtime identity</text>
<text x="205" y="335" class="small" text-anchor="middle">model SHA-256</text>
<text x="205" y="361" class="small" text-anchor="middle">registry SHA-256</text>
<text x="205" y="387" class="small" text-anchor="middle">physical request identity</text>
<rect x="105" y="425" width="200" height="50" rx="12" fill="#4cc9f0" opacity=".12" stroke="#4cc9f0"/>
<text x="205" y="456" class="b" text-anchor="middle">cache_key</text>
<line x1="355" y1="360" x2="410" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="410,360 399.6,366 399.6,354" fill="#4cc9f0"/>
<rect x="410" y="145" width="270" height="430" rx="22" class="panel" filter="url(#cache-shadow)"/>
<text x="545" y="190" class="h" text-anchor="middle">2. Cache Lookup</text>
<rect x="440" y="220" width="210" height="75" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="545" y="250" class="b" text-anchor="middle">Memory LRU</text><text x="545" y="275" class="small" text-anchor="middle">bounded hot entries</text>
<rect x="440" y="320" width="210" height="90" rx="14" class="panel2"/>
<text x="545" y="350" class="b" text-anchor="middle">SQLite WAL</text>
<text x="545" y="375" class="small" text-anchor="middle">persistent payload + hit stats</text>
<rect x="440" y="435" width="210" height="100" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="545" y="465" class="b" text-anchor="middle">Corrupt Entry</text>
<text x="545" y="491" class="small" text-anchor="middle">discard and recompute</text>
<text x="545" y="513" class="small" text-anchor="middle">never return invalid JSON</text>
<line x1="680" y1="360" x2="735" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="735,360 724.6,366 724.6,354" fill="#4cc9f0"/>
<rect x="735" y="145" width="290" height="430" rx="22" class="panel" filter="url(#cache-shadow)"/>
<text x="880" y="190" class="h" text-anchor="middle">3. Dedup Coordination</text>
<rect x="765" y="220" width="230" height="90" rx="14" class="panel2"/>
<text x="880" y="250" class="b" text-anchor="middle">Same Batch</text>
<text x="880" y="276" class="small" text-anchor="middle">one unique task</text>
<text x="880" y="298" class="small" text-anchor="middle">cloned results for duplicates</text>
<rect x="765" y="335" width="230" height="125" rx="14" class="panel2"/>
<text x="880" y="365" class="b" text-anchor="middle">Concurrent Single Point</text>
<text x="880" y="391" class="small" text-anchor="middle">one leader computes</text>
<text x="880" y="413" class="small" text-anchor="middle">followers wait on Event</text>
<text x="880" y="435" class="small" text-anchor="middle">cancellable wait loop</text>
<rect x="765" y="485" width="230" height="50" rx="12" fill="#4cc9f0" opacity=".12" stroke="#4cc9f0"/>
<text x="880" y="516" class="b" text-anchor="middle">singleflight</text>
<line x1="1025" y1="360" x2="1080" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="1080,360 1069.6,366 1069.6,354" fill="#4cc9f0"/>
<rect x="1080" y="145" width="265" height="430" rx="22" class="panel" filter="url(#cache-shadow)"/>
<text x="1212" y="190" class="h" text-anchor="middle">4. Governed Compute</text>
<rect x="1110" y="220" width="205" height="90" rx="14" class="panel2"/>
<text x="1212" y="250" class="b" text-anchor="middle">One Solver Call</text>
<text x="1212" y="276" class="small" text-anchor="middle">isolated Worker execution</text>
<rect x="1110" y="335" width="205" height="90" rx="14" class="panel2"/>
<text x="1212" y="365" class="b" text-anchor="middle">Cache Policy</text>
<text x="1212" y="391" class="small" text-anchor="middle">reinitialize required</text>
<rect x="1110" y="450" width="205" height="85" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="1212" y="480" class="b" text-anchor="middle">Provenance</text>
<text x="1212" y="505" class="small" text-anchor="middle">computed / cache / inflight</text>
<rect x="130" y="620" width="1140" height="55" rx="18" class="panel2"/>
<text x="700" y="653" class="b" text-anchor="middle">Deduplication reduces duplicate solver work without weakening runtime, model, registry or request identity</text>
</svg>