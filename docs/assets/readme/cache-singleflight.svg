 rx="16" class="p"/><rect x="510" y="482" width="6" height="96" rx="3" fill="#F59E0B"/><text x="532" y="520" class="l">FAILURE POLICY</text><text x="532" y="548" class="b">failed results disabled by default</text><rect x="968" y="482" width="420" height="96" rx="16" class="p"/><rect x="968" y="482" width="6" height="96" rx="3" fill="#22C55E"/><text x="990" y="520" class="l">PROVENANCE</text><text x="990" y="548" class="b">computed · cache · dedup · inflight</text><rect x="52" y="626" width="1336" height="46" rx="12" fill="#121E30" stroke="#22C55E"/><text x="720" y="655" class="c" text-anchor="middle">one governed solver call for equivalent work</text></svg>