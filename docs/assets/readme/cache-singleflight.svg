<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Cache, Batch Deduplication, and Singleflight</title><desc id="desc">Content identity collapses duplicate work.</desc><style>.h{font:700 28px system-ui,sans-serif;fill:#F8FAFC}.e{font:700 12px system-ui,sans-serif;fill:#38BDF8;letter-spacing:2px}.l{font:650 15px system-ui,sans-serif;fill:#F8FAFC}.s{font:500 12px system-ui,sans-serif;fill:#A7B5C8}.m{font:600 12px monospace;fill:#C9D7E8}.c{fill:#102036;stroke:#2A405F}.d{fill:#142944;stroke:#3B567A}</style><rect width="1200" height="560" rx="24" fill="#07111F"/><text x="44" y="42" class="e">CACHE ARCHITECTURE</text><text x="44" y="78" class="h">Cache, Batch Deduplication, and Singleflight</text><path d="M44 98H1156" stroke="#38BDF8" stroke-width="2"/><path d="M650 98H1156" stroke="#818CF8" stroke-width="2"/><rect x="44.0" y="176" width="203.2" height="116" rx="16" class="d"/><rect x="44.0" y="176" width="6" height="116" rx="3" fill="#38BDF8"/><text x="64.0" y="214" class="l">Canonical Identity</text><text x="64.0" y="240" class="s">runtime + model + registry</text><path d="M247.2 234.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="271.2" y="176" width="203.2" height="116" rx="16" class="c"/><rect x="271.2" y="176" width="6" height="116" rx="3" fill="#38BDF8"/><text x="291.2" y="214" class="l">Memory LRU</text><text x="291.2" y="240" class="s">compact JSON snapshot</text><path d="M474.4 234.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="498.4" y="176" width="203.2" height="116" rx="16" class="c"/><rect x="498.4" y="176" width="6" height="116" rx="3" fill="#818CF8"/><text x="518.4" y="214" class="l">SQLite WAL</text><text x="518.4" y="240" class="s">persistent identity cache</text><path d="M701.6 234.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="725.6" y="176" width="203.2" height="116" rx="16" class="c"/><rect x="725.6" y="176" width="6" height="116" rx="3" fill="#818CF8"/><text x="745.6" y="214" class="l">same-batch + singleflight</text><text x="745.6" y="240" class="s">leader + isolated followers</text><path d="M928.8 234.0h23m-7-7 7 7-7 7" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="952.8" y="176" width="203.2" height="116" rx="16" class="d"/><rect x="952.8" y="176" width="6" height="116" rx="3" fill="#34D399"/><text x="972.8" y="214" class="l">One Solver Call</text><text x="972.8" y="240" class="s">computed provenance</text><rect x="44" y="478" width="1112" height="46" rx="12" class="d"/><text x="600" y="507" class="m" text-anchor="middle">3 memory hits / 2 calls → 2 JSON decodes → 0 SQLite connections</text></svg>
