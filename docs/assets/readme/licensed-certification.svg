 x="1120" y="180" width="190" height="10" rx="5" fill="#4ade80"/><g class="h"><text x="63" y="230">Dispatch guard</text><text x="278" y="230">Trusted SHA</text><text x="493" y="230">Mock software gate</text><text x="708" y="230">Path preflight</text><text x="923" y="230">Real COM</text><text x="1138" y="230">Signed bundle</text></g><g class="b"><text x="63" y="274">refs/heads/main</text><text x="278" y="274">expected = GITHUB_SHA</text><text x="493" y="274">pytest + dashboards</text><text x="708" y="274">realpath + allowlist</text><text x="923" y="274">approved plan only</text><text x="1138" y="274">PENDING review</text></g><g class="m"><text x="63" y="308">ubuntu-24.04</text><text x="278" y="308">detached checkout</text><text x="493" y="308">no COM</text><text x="708" y="308">run-scoped evidence</text><text x="923" y="308">licensed Windows</text><text x="1138" y="308">human acceptance</text></g><g class="panel2"><rect x="63" y="345" width="154" height="34" rx="9"/><rect x="63" y="391" width="154" height="34" rx="9"/><rect x="63" y="437" width="154" height="34" rx="9"/><rect x="278" y="345" width="154" height="34" rx="9"/><rect x="278" y="391" width="154" height="34" rx="9"/><rect x="278" y="437" width="154" height="34" rx="9"/><rect x="493" y="345" width="154" height="34" rx="9"/><rect x="493" y="391" width="154" height="34" rx="9"/><rect x="493" y="437" width="154" height="34" rx="9"/><rect x="708" y="345" width="154" height="34" rx="9"/><rect x="708" y="391" width="154" height="34" rx="9"/><rect x="708" y="437" width="154" height="34" rx="9"/><rect x="923" y="345" width="154" height="34" rx="9"/><rect x="923" y="391" width="154" height="34" rx="9"/><rect x="923" y="437" width="154" height="34" rx="9"/><rect x="1138" y="345" width="154" height="34" rx="9"/><rect x="1138" y="391" width="154" height="34" rx="9"/><rect x="1138" y="437" width="154" height="34" rx="9"/></g><g class="small"><text x="75" y="368">identity</text><text x="75" y="414">evidence</text><text x=