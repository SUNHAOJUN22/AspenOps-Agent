<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Reproducible Evidence Chain</title><desc id="desc">Accepted results bind validated intent, exact code identity, runtime evidence, and qualified review.</desc><style>
