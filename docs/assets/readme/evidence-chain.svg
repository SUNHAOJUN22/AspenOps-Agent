</style><rect width="1440" height="720" rx="28" fill="#050A12"/><defs><pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#23344E" stroke-width=".6" opacity=".22"/></pattern></defs><rect x="1" y="1" width="1438" height="718" rx="27" fill="url(#microgrid)" opacity=".45"/><text x="52" y="46" class="eyebrow">EVIDENCE LIFECYCLE</text><text x="52" y="86" class="title">Reproducible Evidence Chain</text><text x="52" y="112" class="subtitle">Every transition preserves provenance and an explicit acceptance boundary.</text><path d="M52 132H1388" stroke="#334A6B" stroke-width="1"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><rect x="52.0" y="200" width="211.0" height="236" rx="16" class="panel2"/><circle cx="157.5" cy="248" r="24" fill="#60A5FA" fill-opacity=".14" stroke="#60A5FA" stroke-width="1.4"/><text x="157.5" y="254" class="label" text-anchor="middle">1</text><text x="72.0" y="314" class="label">Validated Intent</text><text x="72.0" y="344" class="body"><tspan x="72.0" dy="0">schema + policy</tspan></text><rect x="72.0" y="382" width="171.0" height="30" rx="15" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1"/><text x="157.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">VALID</text><path d="M263.0 318L277.0 318" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M277.0 318L270.1 322.0M277.0 318L270.1 314.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="277.0" y="200" width="211.0" height="236" rx="16" class="panel"/><circle cx="382.5" cy="248" r="24" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-width="1.4"/><text x="382.5" y="254" class="label" text-anchor="middle">2</text><text x="297.0" y="314" class="label">Trusted Main SHA</text><text x="297.0" y="344" class="body"><tspan x="297.0" dy="0">immutable revision</tspan></text><rect x="297.0" y="382" width="171.0" height="30" rx="15" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-width="1"/><text x="382.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">PINNED</text><path d="M488.0 318L502.0 318" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M502.0 318L495.1 322.0M502.0 318L495.1 314.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="502.0" y="200" width="211.0" height="236" rx="16" class="panel"/><circle cx="607.5" cy="248" r="24" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-width="1.4"/><text x="607.5" y="254" class="label" text-anchor="middle">3</text><text x="522.0" y="314" class="label">Isolated Worker</text><text x="522.0" y="344" class="body"><tspan x="522.0" dy="0">owned execution</tspan></text><rect x="522.0" y="382" width="171.0" height="30" rx="15" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-width="1"/><text x="607.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">OWNED</text><path d="M713.0 318L727.0 318" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M727.0 318L720.1 322.0M727.0 318L720.1 314.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="727.0" y="200" width="211.0" height="236" rx="16" class="panel"/><circle cx="832.5" cy="248" r="24" fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-width="1.4"/><text x="832.5" y="254" class="label" text-anchor="middle">4</text><text x="747.0" y="314" class="label">Validity Gates</text><text x="747.0" y="344" class="body"><tspan x="747.0" dy="0">convergence + balances</tspan></text><rect x="747.0" y="382" width="171.0" height="30" rx="15" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-width="1"/><text x="832.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">VERIFIED</text><path d="M938.0 318L952.0 318" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M952.0 318L945.1 322.0M952.0 318L945.1 314.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="952.0" y="200" width="211.0" height="236" rx="16" class="panel"/><circle cx="1057.5" cy="248" r="24" fill="#22C55E" fill-opacity=".14" stroke="#22C55E" stroke-width="1.4"/><text x="1057.5" y="254" class="label" text-anchor="middle">5</text><text x="972.0" y="314" class="label">Evidence Bundle</text><text x="972.0" y="344" class="body"><tspan x="972.0" dy="0">hashes + members</tspan></text><rect x="972.0" y="382" width="171.0" height="30" rx="15" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-width="1"/><text x="1057.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">BOUND</text><path d="M1163.0 318L1177.0 318" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M1177.0 318L1170.1 322.0M1177.0 318L1170.1 314.0" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><rect x="1177.0" y="200" width="211.0" height="236" rx="16" class="panel2"/><circle cx="1282.5" cy="248" r="24" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-width="1.4"/><text x="1282.5" y="254" class="label" text-anchor="middle">6</text><text x="1197.0" y="314" class="label">Human Acceptance</text><text x="1197.0" y="344" class="body"><tspan x="1197.0" dy="0">qualified reviewer</tspan></text><rect x="1197.0" y="382" width="171.0" height="30" rx="15" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-width="1"/><text x="1282.5" y="402" class="small" text-anchor="middle" fill="#F8FAFC">APPROVED</text><rect x="52" y="488" width="1336" height="78" rx="16" fill="#121E30" stroke="#22C55E" stroke-width="1.2"/><text x="78" y="518" class="small">MANIFEST IDENTITY</text><text x="78" y="548" class="code">request · result · model · registry · runtime · version · commit</text><rect x="52.0" y="590" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="70.0" y="618" class="small">SOFTWARE PASS</text><text x="70.0" y="654" class="value">not physics proof</text><rect x="468.6666666666667" y="608" width="4" height="60" rx="2" fill="#60A5FA"/><rect x="502.6666666666667" y="590" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="520.6666666666667" y="618" class="small">SIGNATURE</text><text x="520.6666666666667" y="654" class="value">not approval</text><rect x="919.3333333333334" y="608" width="4" height="60" rx="2" fill="#F59E0B"/><rect x="953.3333333333334" y="590" width="434.6666666666667" height="96" rx="16" class="panel"/><text x="971.3333333333334" y="618" class="small">ACCEPTANCE</text><text x="971.3333333333334" y="654" class="value">human + engineering</text><rect x="1370.0" y="608" width="4" height="60" rx="2" fill="#22C55E"/></svg>
