<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Process Intent IR / 统一流程意图中间表示</title><desc id="desc">Simulator-neutral graph with deterministic normalization, strict validation and stable identity</desc><rect width="1400" height="720" rx="28" fill="#0b1020"/><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:22px;font-weight:700}.b{fill:#eef4ff;font-size:17px}.m{fill:#9fb0c8;font-size:15px}.small{fill:#9fb0c8;font-size:13px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style></defs><text x="64" y="66" class="title">Process Intent IR / 统一流程意图中间表示</text><text x="64" y="96" class="sub">Simulator-neutral graph with deterministic normalization, strict validation and stable identity</text><rect x="55" y="130" width="330" height="520" rx="22" class="panel" filter="url(#shadow)"/><text x="220" y="170" class="h" text-anchor="middle">Structured Intent</text><rect x="80" y="205" width="280" height="48" rx="12" class="panel2"/><text x="96" y="234" class="m">schema</text><text x="340" y="234" class="small" text-anchor="end">aspenops.flowsheet/v1</text><rect x="80" y="270" width="280" height="48" rx="12" class="panel2"/><text x="96" y="299" class="m">components</text><text x="340" y="299" class="small" text-anchor="end">H2O, MeOH, ...</text><rect x="80" y="335" width="280" height="48" rx="12" class="panel2"/><text x="96" y="364" class="m">property_method</text><text x="340" y="364" class="small" text-anchor="end">NRTL / PR / ...</text><rect x="80" y="400" width="280" height="48" rx="12" class="panel2"/><text x="96" y="429" class="m">units</text><text x="340" y="429" class="small" text-anchor="end">feed, mixer, column</text><rect x="80" y="465" width="280" height="48" rx="12" class="panel2"/><text x="96" y="494" class="m">streams</text><text x="340" y="494" class="small" text-anchor="end">source.port → target.port</text><rect x="80" y="530" width="280" height="48" rx="12" class="panel2"/><text x="96" y="559" class="m">parameters</text><text x="340" y="559" class="small" text-anchor="end">typed value + unit</text><line x1="385" y1="390" x2="495" y2="390" stroke="#4cc9f0" stroke-width="3"/><polygon points="495,390 484.6,396 484.6,384" fill="#4cc9f0"/><rect x="495" y="130" width="410" height="520" rx="22" class="panel" filter="url(#shadow)"/><text x="700" y="170" class="h" text-anchor="middle">Validation &amp; Canonicalization</text><circle cx="535" cy="210" r="10" fill="#4ade80"/><text x="560" y="216" class="b">Unique IDs</text><circle cx="535" cy="268" r="10" fill="#4ade80"/><text x="560" y="274" class="b">Port direction</text><circle cx="535" cy="326" r="10" fill="#4ade80"/><text x="560" y="332" class="b">Required connections</text><circle cx="535" cy="384" r="10" fill="#4ade80"/><text x="560" y="390" class="b">Unknown components</text><circle cx="535" cy="442" r="10" fill="#fbbf24"/><text x="560" y="448" class="b">Self loops / cycles</text><circle cx="535" cy="500" r="10" fill="#fb7185"/><text x="560" y="506" class="b">Forbidden code &amp; paths</text><rect x="525" y="570" width="350" height="52" rx="12" class="panel2"/><text x="545" y="602" class="m">canonical JSON → SHA-256 graph identity</text><line x1="905" y1="390" x2="1015" y2="390" stroke="#4cc9f0" stroke-width="3"/><polygon points="1015,390 1004.6,396 1004.6,384" fill="#4cc9f0"/><rect x="1015" y="130" width="330" height="520" rx="22" class="panel" filter="url(#shadow)"/><text x="1180" y="170" class="h" text-anchor="middle">Safe Outputs</text><rect x="1040" y="210" width="280" height="62" rx="14" class="panel2"/><rect x="1055" y="225" width="10" height="32" rx="5" fill="#4ade80"/><text x="1080" y="238" class="b">Validation report</text><text x="1080" y="259" class="small">issues + topology metrics</text><rect x="1040" y="292" width="280" height="62" rx="14" class="panel2"/><rect x="1055" y="307" width="10" height="32" rx="5" fill="#4cc9f0"/><text x="1080" y="320" class="b">Canonical JSON</text><text x="1080" y="341" class="small">stable ordering</text><rect x="1040" y="374" width="280" height="62" rx="14" class="panel2"/><rect x="1055" y="389" width="10" height="32" rx="5" fill="#7b61ff"/><text x="1080" y="402" class="b">IR dashboard</text><text x="1080" y="423" class="small">HTML + SVG</text><rect x="1040" y="456" width="280" height="62" rx="14" class="panel2"/><rect x="1055" y="471" width="10" height="32" rx="5" fill="#fbbf24"/><text x="1080" y="484" class="b">Compiler contract</text><text x="1080" y="505" class="small">non-executable plan</text><rect x="1040" y="538" width="280" height="62" rx="14" class="panel2"/><rect x="1055" y="553" width="10" height="32" rx="5" fill="#fb7185"/><text x="1080" y="566" class="b">Unavailable adapters</text><text x="1080" y="587" class="small">fail closed</text></svg>