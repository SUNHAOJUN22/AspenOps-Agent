<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Process Intent IR</title><desc id="desc">A simulator-neutral graph enters execution only after deterministic validation.</desc><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{font-family:"JetBrains Mono",Consolas,monospace;fill:#A7B7CA}.e{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.2px;fill:#22D3EE}.h{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:32px;font-weight:700;fill:#F8FAFC}.s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:500;fill:#A7B7CA}.l{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;fill:#F8FAFC}.b{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#A7B7CA}.x{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;fill:#71849B}.c{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600;fill:#A7B7CA}.v{font-family:"JetBrains Mono",Consolas,monospace;font-size:21px;font-weight:700;fill:#F8FAFC}.p{fill:#0D1524;stroke:#23344E;stroke-width:1.2}.q{fill:#121E30;stroke:#334A6B;stroke-width:1.2}</style><rect width="1440" height="720" rx="28" fill="#050A12"/><path d="M52 132H1388" stroke="#334A6B"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><text x="52" y="46" class="e">DECLARATIVE PLANE</text><text x="52" y="86" class="h">Process Intent IR</text><text x="52" y="112" class="s">Intent is data, not arbitrary simulator code.</text><rect x="52" y="210" width="225" height="230" rx="16" class="q"/><rect x="52" y="210" width="6" height="230" rx="3" fill="#60A5FA"/><text x="74" y="248" class="l">Human / Agent</text><text x="74" y="276" class="b">components + goals</text><path d="M277 325H307" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M307 325l-8 5v-10z" fill="#60A5FA"/><rect x="319" y="210" width="225" height="230" rx="16" class="p"/><rect x="319" y="210" width="6" height="230" rx="3" fill="#22D3EE"/><text x="341" y="248" class="l">aspenops.flowsheet/v1</text><text x="341" y="276" class="b">typed graph + metadata</text><path d="M544 325H574" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/><path d="M574 325l-8 5v-10z" fill="#22D3EE"/><rect x="586" y="210" width="225" height="230" rx="16" class="p"/><rect x="586" y="210" width="6" height="230" rx="3" fill="#2DD4BF"/><text x="608" y="248" class="l">Validate + Digest</text><text x="608" y="276" class="b">topology + budgets + SHA-256</text><path d="M811 325H841" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/><path d="M841 325l-8 5v-10z" fill="#2DD4BF"/><rect x="853" y="210" width="225" height="230" rx="16" class="p"/><rect x="853" y="210" width="6" height="230" rx="3" fill="#F59E0B"/><text x="875" y="248" class="l">Compiler Gate</text><text x="875" y="276" class="b">available + approved?</text><path d="M1078 325H1108" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/><path d="M1108 325l-8 5v-10z" fill="#F59E0B"/><rect x="1120" y="210" width="225" height="230" rx="16" class="q"/><rect x="1120" y="210" width="6" height="230" rx="3" fill="#22C55E"/><text x="1142" y="248" class="l">Execution Plane</text><text x="1142" y="276" class="b">existing model control</text><rect x="52" y="486" width="420" height="96" rx="16" class="p"/><rect x="52" y="486" width="6" height="96" rx="3" fill="#22C55E"/><text x="74" y="524" class="l">IR GUARANTEES</text><text x="74" y="552" class="b">deterministic order · finite scalars · safe metadata</text><rect x="510" y="486" width="420" height="96" rx="16" class="p"/><rect x="510" y="486" width="6" height="96" rx="3" fill="#F43F5E"/><text x="532" y="524" class="l">REJECTED</text><text x="532" y="552" class="b">code · script · shell · VBA · raw Tree Path</text><rect x="968" y="486" width="420" height="96" rx="16" class="p"/><rect x="968" y="486" width="6" height="96" rx="3" fill="#F59E0B"/><text x="990" y="524" class="l">PLANNED</text><text x="990" y="552" class="b">Aspen/HYSYS compiler · DWSIM · IDAES · FMI</text><rect x="52" y="626" width="1336" height="46" rx="12" fill="#121E30" stroke="#22D3EE"/><text x="720" y="655" class="c" text-anchor="middle">compiler availability and execution availability are independent</text></svg>