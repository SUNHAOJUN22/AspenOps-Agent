<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps agent closed loop</title><desc id="desc">A six-stage governed loop from knowledge and process intent to execution, repair, review and reusable evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111c35"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#f8fbff;font-size:34px;font-weight:700}.st{fill:#a9b8d0;font-size:18px}.h{fill:#f8fbff;font-size:21px;font-weight:700}.b{fill:#a9b8d0;font-size:15px}.n{fill:#06101e;font-size:18px;font-weight:800}.card{fill:#14213a;stroke:#304261;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">Governed Agent Closed Loop / 受治理智能体闭环</text><text x="64" y="105" class="st">Every stage emits a typed artifact; no stage may jump directly to arbitrary simulator code.</text>
<path d="M265 350 C300 205 470 150 620 205 C760 105 1015 155 1065 330 C1180 410 1105 590 940 590 C820 690 585 660 500 560 C335 610 190 505 265 350Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="10 10" opacity=".8"/>
<g filter="url(#s)"><rect x="85" y="250" width="230" height="135" rx="22" class="card"/><circle cx="125" cy="292" r="20" fill="#22d3ee"/><text x="125" y="299" text-anchor="middle" class="n">1</text><text x="160" y="295" class="h">Knowledge</text><text x="110" y="332" class="b">Evidence, constraints,</text><text x="110" y="355" class="b">model boundaries</text>
<rect x="365" y="145" width="230" height="135" rx="22" class="card"/><circle cx="405" cy="187" r="20" fill="#38bdf8"/><text x="405" y="194" text-anchor="middle" class="n">2</text><text x="440" y="190" class="h">Concept</text><text x="390" y="227" class="b">Flowsheet topology</text><text x="390" y="250" class="b">Process Intent IR</text>
<rect x="665" y="145" width="230" height="135" rx="22" class="card"/><circle cx="705" cy="187" r="20" fill="#818cf8"/><text x="705" y="194" text-anchor="middle" class="n">3</text><text x="740" y="190" class="h">Parameter</text><text x="690" y="227" class="b">Semantic variables,</text><text x="690" y="250" class="b">units and budgets</text>
<rect x="965" y="250" width="230" height="135" rx="22" class="card"/><circle cx="1005" cy="292" r="20" fill="#a78bfa"/><text x="1005" y="299" text-anchor="middle" class="n">4</text><text x="1040" y="295" class="h">Execution</text><text x="990" y="332" class="b">Isolated worker,</text><text x="990" y="355" class="b">licensed backend</text>
<rect x="810" y="475" width="230" height="135" rx="22" class="card"/><circle cx="850" cy="517" r="20" fill="#c084fc"/><text x="850" y="524" text-anchor="middle" class="n">5</text><text x="885" y="520" class="h">Repair</text><text x="835" y="557" class="b">Bounded diagnosis,</text><text x="835" y="580" class="b">auditable retry</text>
<rect x="405" y="475" width="230" height="135" rx="22" class="card"/><circle cx="445" cy="517" r="20" fill="#34d399"/><text x="445" y="524" text-anchor="middle" class="n">6</text><text x="480" y="520" class="h">Review</text><text x="430" y="557" class="b">Engineering gates,</text><text x="430" y="580" class="b">human acceptance</text></g>
<g fill="#dbeafe"><path d="M325 232l22 8-18 14z"/><path d="M610 165l22 8-18 14z"/><path d="M910 210l22 8-18 14z"/><path d="M1092 415l8 22-22-8z"/><path d="M770 590l-22 8 18-14z"/><path d="M355 535l-22-8 18-14z"/></g>
<rect x="115" y="655" width="1170" height="52" rx="16" fill="#0d172b" stroke="#2a3c5b"/><text x="700" y="687" text-anchor="middle" class="st">Typed intent → deterministic validation → isolated execution → evidence → bounded repair → human review</text>
</svg>
