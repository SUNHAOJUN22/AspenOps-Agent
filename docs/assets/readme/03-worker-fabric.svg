<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps isolated worker fabric</title><desc id="desc">License-aware scheduling assigns jobs to process-isolated Windows workers, each owning one STA apartment, one COM object and a private model copy.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100b20"/><stop offset="1" stop-color="#24143c"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#faf7ff;font-size:34px;font-weight:700}.st{fill:#beb3d5;font-size:18px}.h{fill:#faf7ff;font-size:20px;font-weight:700}.b{fill:#beb3d5;font-size:14px}.small{fill:#d9d2e8;font-size:13px}.card{fill:#261a40;stroke:#513b75;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">License-aware Isolated Worker Fabric / 许可感知隔离执行</text><text x="64" y="105" class="st">Concurrency is bounded by license slots; simulator ownership never crosses process or STA boundaries.</text>
<g filter="url(#s)"><rect x="55" y="160" width="260" height="510" rx="24" class="card"/><rect x="350" y="160" width="995" height="510" rx="24" class="card"/></g>
<text x="185" y="205" text-anchor="middle" class="h">Scheduler</text><rect x="90" y="240" width="190" height="72" rx="16" fill="#31204f"/><text x="185" y="270" text-anchor="middle" class="h">Job queue</text><text x="185" y="294" text-anchor="middle" class="b">priority + budgets</text>
<rect x="90" y="340" width="190" height="72" rx="16" fill="#31204f"/><text x="185" y="370" text-anchor="middle" class="h">License slots</text><text x="185" y="394" text-anchor="middle" class="b">hard concurrency cap</text>
<rect x="90" y="440" width="190" height="72" rx="16" fill="#31204f"/><text x="185" y="470" text-anchor="middle" class="h">Lease fencing</text><text x="185" y="494" text-anchor="middle" class="b">owner + generation</text>
<rect x="90" y="540" width="190" height="72" rx="16" fill="#31204f"/><text x="185" y="570" text-anchor="middle" class="h">Recovery</text><text x="185" y="594" text-anchor="middle" class="b">restart + cleanup</text>
<path d="M315 415H375" stroke="url(#g)" stroke-width="4"/><polygon points="375,415 361,423 361,407" fill="#22d3ee"/>
<text x="392" y="205" class="h">Windows worker pool</text>
<g><rect x="390" y="240" width="275" height="350" rx="22" fill="#2d1f49" stroke="#8b5cf6"/><circle cx="430" cy="280" r="15" fill="#34d399"/><text x="460" y="287" class="h">Worker 0</text><rect x="420" y="320" width="215" height="54" rx="13" fill="#1b1230"/><text x="527" y="352" text-anchor="middle" class="small">OS process + Windows Job</text><rect x="420" y="392" width="215" height="54" rx="13" fill="#1b1230"/><text x="527" y="424" text-anchor="middle" class="small">one STA apartment</text><rect x="420" y="464" width="215" height="54" rx="13" fill="#1b1230"/><text x="527" y="496" text-anchor="middle" class="small">one COM object</text><rect x="420" y="536" width="215" height="34" rx="11" fill="#17364a"/><text x="527" y="558" text-anchor="middle" class="small">private model copy</text>
<rect x="710" y="240" width="275" height="350" rx="22" fill="#2d1f49" stroke="#38bdf8"/><circle cx="750" cy="280" r="15" fill="#34d399"/><text x="780" y="287" class="h">Worker 1</text><rect x="740" y="320" width="215" height="54" rx="13" fill="#1b1230"/><text x="847" y="352" text-anchor="middle" class="small">OS process + Windows Job</text><rect x="740" y="392" width="215" height="54" rx="13" fill="#1b1230"/><text x="847" y="424" text-anchor="middle" class="small">one STA apartment</text><rect x="740" y="464" width="215" height="54" rx="13" fill="#1b1230"/><text x="847" y="496" text-anchor="middle" class="small">one COM object</text><rect x="740" y="536" width="215" height="34" rx="11" fill="#17364a"/><text x="847" y="558" text-anchor="middle" class="small">private model copy</text>
<rect x="1030" y="240" width="275" height="350" rx="22" fill="#2d1f49" stroke="#64748b"/><circle cx="1070" cy="280" r="15" fill="#fbbf24"/><text x="1100" y="287" class="h">Worker N</text><rect x="1060" y="320" width="215" height="54" rx="13" fill="#1b1230"/><text x="1167" y="352" text-anchor="middle" class="small">created only within budget</text><rect x="1060" y="392" width="215" height="54" rx="13" fill="#1b1230"/><text x="1167" y="424" text-anchor="middle" class="small">no shared COM state</text><rect x="1060" y="464" width="215" height="54" rx="13" fill="#1b1230"/><text x="1167" y="496" text-anchor="middle" class="small">verified process ownership</text><rect x="1060" y="536" width="215" height="34" rx="11" fill="#3b2b1b"/><text x="1167" y="558" text-anchor="middle" class="small">queued when slots are full</text></g>
<rect x="420" y="615" width="855" height="34" rx="12" fill="#171026"/><text x="847" y="638" text-anchor="middle" class="b">Hard timeout terminates only AspenOps-owned and identity-verified processes.</text>
</svg>
