<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Process Intent IR validation map</title><desc id="desc">A simulator-neutral flowsheet graph is canonicalized and checked for topology, references, ports, parameters and unsafe executable content.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06141a"/><stop offset="1" stop-color="#0f2734"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-opacity=".3"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#f2fbff;font-size:34px;font-weight:700}.st{fill:#a7c3cf;font-size:18px}.h{fill:#f2fbff;font-size:20px;font-weight:700}.b{fill:#a7c3cf;font-size:14px}.id{fill:#06141a;font-size:15px;font-weight:800}.card{fill:#102c39;stroke:#2e5362;stroke-width:1.5}.line{stroke:#5eead4;stroke-width:4;fill:none}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">Process Intent IR / 流程意图中间表示</text><text x="64" y="105" class="st">aspenops.flowsheet/v1 turns process design into canonical, reviewable and fail-closed data.</text>
<g filter="url(#s)"><rect x="55" y="155" width="760" height="520" rx="24" class="card"/><rect x="850" y="155" width="495" height="520" rx="24" class="card"/></g>
<text x="90" y="205" class="h">Simulator-neutral flowsheet graph</text><text x="885" y="205" class="h">Deterministic validation gates</text>
<g><rect x="100" y="295" width="135" height="82" rx="18" fill="#173d49" stroke="#5eead4"/><text x="167" y="330" text-anchor="middle" class="h">FEED</text><text x="167" y="354" text-anchor="middle" class="b">components</text>
<rect x="310" y="230" width="150" height="82" rx="18" fill="#173d49" stroke="#38bdf8"/><text x="385" y="265" text-anchor="middle" class="h">MIXER</text><text x="385" y="289" text-anchor="middle" class="b">ports + rules</text>
<rect x="310" y="420" width="150" height="82" rx="18" fill="#173d49" stroke="#38bdf8"/><text x="385" y="455" text-anchor="middle" class="h">RECYCLE</text><text x="385" y="479" text-anchor="middle" class="b">explicit cycle</text>
<rect x="540" y="295" width="150" height="82" rx="18" fill="#173d49" stroke="#818cf8"/><text x="615" y="330" text-anchor="middle" class="h">COLUMN</text><text x="615" y="354" text-anchor="middle" class="b">parameters</text>
<rect x="705" y="230" width="80" height="82" rx="18" fill="#173d49" stroke="#34d399"/><text x="745" y="265" text-anchor="middle" class="h">TOP</text><text x="745" y="289" text-anchor="middle" class="b">product</text>
<rect x="705" y="420" width="80" height="82" rx="18" fill="#173d49" stroke="#fbbf24"/><text x="745" y="455" text-anchor="middle" class="h">BOT</text><text x="745" y="479" text-anchor="middle" class="b">product</text>
<path d="M235 336H280Q300 336 310 300" class="line"/><path d="M460 271H505Q525 271 540 320" class="line"/><path d="M690 320Q705 300 705 271" class="line"/><path d="M690 352Q705 390 705 461" class="line"/><path d="M615 377Q590 470 460 461" class="line"/><path d="M385 420V312" class="line" stroke-dasharray="9 8"/></g>
<g><rect x="885" y="238" width="195" height="78" rx="16" fill="#153743"/><circle cx="918" cy="277" r="17" fill="#2dd4bf"/><text x="918" y="283" text-anchor="middle" class="id">1</text><text x="950" y="270" class="h">Schema</text><text x="950" y="294" class="b">strict fields</text>
<rect x="1115" y="238" width="195" height="78" rx="16" fill="#153743"/><circle cx="1148" cy="277" r="17" fill="#38bdf8"/><text x="1148" y="283" text-anchor="middle" class="id">2</text><text x="1180" y="270" class="h">References</text><text x="1180" y="294" class="b">known IDs</text>
<rect x="885" y="344" width="195" height="78" rx="16" fill="#153743"/><circle cx="918" cy="383" r="17" fill="#818cf8"/><text x="918" y="389" text-anchor="middle" class="id">3</text><text x="950" y="376" class="h">Topology</text><text x="950" y="400" class="b">ports + cycles</text>
<rect x="1115" y="344" width="195" height="78" rx="16" fill="#153743"/><circle cx="1148" cy="383" r="17" fill="#a78bfa"/><text x="1148" y="389" text-anchor="middle" class="id">4</text><text x="1180" y="376" class="h">Parameters</text><text x="1180" y="400" class="b">finite + typed</text>
<rect x="885" y="450" width="195" height="78" rx="16" fill="#153743"/><circle cx="918" cy="489" r="17" fill="#fb7185"/><text x="918" y="495" text-anchor="middle" class="id">5</text><text x="950" y="482" class="h">Safety</text><text x="950" y="506" class="b">no code / shell</text>
<rect x="1115" y="450" width="195" height="78" rx="16" fill="#153743"/><circle cx="1148" cy="489" r="17" fill="#34d399"/><text x="1148" y="495" text-anchor="middle" class="id">6</text><text x="1180" y="482" class="h">Identity</text><text x="1180" y="506" class="b">canonical SHA-256</text></g>
<rect x="885" y="565" width="425" height="70" rx="18" fill="#0b202a" stroke="url(#g)" stroke-width="2"/><text x="1097" y="594" text-anchor="middle" class="h">VALID → backend capability check</text><text x="1097" y="619" text-anchor="middle" class="b">INVALID → typed issues, no execution</text>
</svg>
