<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Windows COM Process Isolation</title><desc id="desc">Each Worker owns one OS process, one STA apartment, one Automation Server and one private model copy</desc><rect width="1400" height="700" rx="28" fill="#0b1020"/><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:22px;font-weight:700}.b{fill:#eef4ff;font-size:17px}.m{fill:#9fb0c8;font-size:15px}.small{fill:#9fb0c8;font-size:13px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style></defs><text x="64" y="66" class="title">Windows COM Process Isolation</text><text x="64" y="96" class="sub">Each Worker owns one OS process, one STA apartment, one Automation Server and one private model copy</text><rect x="70" y="135" width="1260" height="110" rx="20" class="panel" filter="url(#shadow)"/><text x="700" y="180" class="h" text-anchor="middle">Parent Control Plane / 父控制平面</text><rect x="145" y="198" width="150" height="32" rx="16" fill="#4cc9f0" opacity=".16" stroke="#4cc9f0"/><text x="220" y="219" class="small" text-anchor="middle">Policy</text><rect x="365" y="198" width="150" height="32" rx="16" fill="#7b61ff" opacity=".16" stroke="#7b61ff"/><text x="440" y="219" class="small" text-anchor="middle">Scheduler</text><rect x="585" y="198" width="150" height="32" rx="16" fill="#4ade80" opacity=".16" stroke="#4ade80"/><text x="660" y="219" class="small" text-anchor="middle">License slots</text><rect x="805" y="198" width="150" height="32" rx="16" fill="#fbbf24" opacity=".16" stroke="#fbbf24"/><text x="880" y="219" class="small" text-anchor="middle">Evidence</text><rect x="1025" y="198" width="150" height="32" rx="16" fill="#fb7185" opacity=".16" stroke="#fb7185"/><text x="1100" y="219" class="small" text-anchor="middle">Hard timeout</text><g stroke="#4cc9f0" stroke-width="3"><line x1="300" y1="245" x2="300" y2="315"/><line x1="735" y1="245" x2="735" y2="315"/><line x1="1170" y1="245" x2="1170" y2="315"/></g><g fill="#4cc9f0"><polygon points="300,315 294,304.6 306,304.6"/><polygon points="735,315 729,304.6 741,304.6"/><polygon points="1170,315 1164,304.6 1176,304.6"/></g><rect x="85" y="315" width="390" height="300" rx="20" class="panel" filter="url(#shadow)"/><text x="280" y="355" class="h" text-anchor="middle">Worker A</text><rect x="110" y="380" width="155" height="78" rx="14" class="panel2"/><text x="187" y="410" class="b" text-anchor="middle">OS Process</text><text x="187" y="436" class="small" text-anchor="middle">isolated PID</text><rect x="295" y="380" width="155" height="78" rx="14" class="panel2"/><text x="372" y="410" class="b" text-anchor="middle">COM STA</text><text x="372" y="436" class="small" text-anchor="middle">thread-owned</text><rect x="110" y="485" width="155" height="90" rx="14" class="panel2"/><text x="187" y="520" class="b" text-anchor="middle">Aspen Plus</text><text x="187" y="547" class="small" text-anchor="middle">Automation Server</text><rect x="295" y="485" width="155" height="90" rx="14" class="panel2"/><text x="372" y="520" class="b" text-anchor="middle">Private case</text><text x="372" y="547" class="small" text-anchor="middle">staged copy</text><rect x="520" y="315" width="390" height="300" rx="20" class="panel" filter="url(#shadow)"/><text x="715" y="355" class="h" text-anchor="middle">Worker B</text><rect x="545" y="380" width="155" height="78" rx="14" class="panel2"/><text x="622" y="410" class="b" text-anchor="middle">OS Process</text><text x="622" y="436" class="small" text-anchor="middle">isolated PID</text><rect x="730" y="380" width="155" height="78" rx="14" class="panel2"/><text x="807" y="410" class="b" text-anchor="middle">COM STA</text><text x="807" y="436" class="small" text-anchor="middle">thread-owned</text><rect x="545" y="485" width="155" height="90" rx="14" class="panel2"/><text x="622" y="520" class="b" text-anchor="middle">HYSYS</text><text x="622" y="547" class="small" text-anchor="middle">Automation Server</text><rect x="730" y="485" width="155" height="90" rx="14" class="panel2"/><text x="807" y="520" class="b" text-anchor="middle">Private case</text><text x="807" y="547" class="small" text-anchor="middle">staged copy</text><rect x="955" y="315" width="390" height="300" rx="20" class="panel" filter="url(#shadow)"/><text x="1150" y="355" class="h" text-anchor="middle">Worker C</text><rect x="980" y="380" width="155" height="78" rx="14" class="panel2"/><text x="1057" y="410" class="b" text-anchor="middle">OS Process</text><text x="1057" y="436" class="small" text-anchor="middle">isolated PID</text><rect x="1165" y="380" width="155" height="78" rx="14" class="panel2"/><text x="1242" y="410" class="b" text-anchor="middle">COM STA</text><text x="1242" y="436" class="small" text-anchor="middle">thread-owned</text><rect x="980" y="485" width="155" height="90" rx="14" class="panel2"/><text x="1057" y="520" class="b" text-anchor="middle">Mock/Fake COM</text><text x="1057" y="547" class="small" text-anchor="middle">Automation Server</text><rect x="1165" y="485" width="155" height="90" rx="14" class="panel2"/><text x="1242" y="520" class="b" text-anchor="middle">Private case</text><text x="1242" y="547" class="small" text-anchor="middle">staged copy</text><text x="700" y="660" class="b" text-anchor="middle">No COM proxy crosses a process boundary • Timeout kills only the owned Worker</text></svg>