<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="performance-hotspot-title performance-hotspot-desc">
  <title id="performance-hotspot-title">AspenOps performance hotspot and evidence map</title>
  <desc id="performance-hotspot-desc">A layered map connecting CLI startup, cache accounting, batch deduplication, optimizer allocation, deterministic operation counts, and licensed Aspen boundaries.</desc>
  <defs>
    <linearGradient id="performance-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13243d"/>
    </linearGradient>
    <marker id="performance-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#performance-bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Performance Hotspot Map</text>
  <text x="64" y="106" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="17">Measure first. Preserve identity, isolation, durability, and certification boundaries.</text>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="150" width="245" height="170" rx="20" fill="#172554" stroke="#818cf8" stroke-width="2"/>
    <text x="80" y="188" fill="#c7d2fe" font-size="22" font-weight="700">CLI Startup</text>
    <text x="80" y="225" fill="#e2e8f0" font-size="16">Lazy bootstrap</text>
    <text x="80" y="253" fill="#e2e8f0" font-size="16">Single parse on execution</text>
    <text x="80" y="281" fill="#e2e8f0" font-size="16">-X importtime evidence</text>

    <rect x="340" y="150" width="245" height="170" rx="20" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <text x="365" y="188" fill="#a5f3fc" font-size="22" font-weight="700">Cache Path</text>
    <text x="365" y="225" fill="#e2e8f0" font-size="16">O(1) pending-hit total</text>
    <text x="365" y="253" fill="#e2e8f0" font-size="16">Compact canonical JSON</text>
    <text x="365" y="281" fill="#e2e8f0" font-size="16">WAL plus PRAGMA optimize</text>

    <rect x="625" y="150" width="245" height="170" rx="20" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
    <text x="650" y="188" fill="#a7f3d0" font-size="22" font-weight="700">Batch and Flight</text>
    <text x="650" y="225" fill="#e2e8f0" font-size="16">One key per request object</text>
    <text x="650" y="253" fill="#e2e8f0" font-size="16">One canonical serialization</text>
    <text x="650" y="281" fill="#e2e8f0" font-size="16">Deep isolated result clones</text>

    <rect x="910" y="150" width="235" height="170" rx="20" fill="#3b1d0d" stroke="#fb923c" stroke-width="2"/>
    <text x="935" y="188" fill="#fed7aa" font-size="22" font-weight="700">Optimizer</text>
    <text x="935" y="225" fill="#e2e8f0" font-size="16">Allocation-light sampling</text>
    <text x="935" y="253" fill="#e2e8f0" font-size="16">Pareto dedup first</text>
    <text x="935" y="281" fill="#e2e8f0" font-size="16">Evaluation budget unchanged</text>

    <path d="M300 235H332" stroke="#7dd3fc" stroke-width="3" marker-end="url(#performance-arrow)"/>
    <path d="M585 235H617" stroke="#7dd3fc" stroke-width="3" marker-end="url(#performance-arrow)"/>
    <path d="M870 235H902" stroke="#7dd3fc" stroke-width="3" marker-end="url(#performance-arrow)"/>

    <rect x="110" y="390" width="450" height="190" rx="22" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="432" fill="#bae6fd" font-size="23" font-weight="700">Deterministic Evidence</text>
    <text x="140" y="470" fill="#e2e8f0" font-size="17">Cache-key calls</text>
    <text x="140" y="500" fill="#e2e8f0" font-size="17">Solver calls and result serializations</text>
    <text x="140" y="530" fill="#e2e8f0" font-size="17">Dominance calls and cache flush state</text>
    <text x="140" y="560" fill="#94a3b8" font-size="15">Hard contracts: low-noise counts</text>

    <rect x="640" y="390" width="450" height="190" rx="22" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="670" y="432" fill="#fde68a" font-size="23" font-weight="700">Measured Diagnostics</text>
    <text x="670" y="470" fill="#e2e8f0" font-size="17">Median, P95, min, max, CV</text>
    <text x="670" y="500" fill="#e2e8f0" font-size="17">cProfile, tracemalloc, RSS</text>
    <text x="670" y="530" fill="#e2e8f0" font-size="17">Commit and environment fingerprint</text>
    <text x="670" y="560" fill="#94a3b8" font-size="15">Shared-runner time: evidence, not a narrow gate</text>

    <path d="M465 320L400 382" stroke="#7dd3fc" stroke-width="3" marker-end="url(#performance-arrow)"/>
    <path d="M750 320L810 382" stroke="#7dd3fc" stroke-width="3" marker-end="url(#performance-arrow)"/>

    <rect x="240" y="620" width="720" height="36" rx="18" fill="#450a0a" stroke="#f87171"/>
    <text x="600" y="644" fill="#fecaca" font-size="16" text-anchor="middle">Portable orchestration evidence is not licensed Aspen solve or engineering certification.</text>
  </g>
</svg>
