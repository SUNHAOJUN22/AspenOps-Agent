<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps quality and evidence pipeline</title><desc id="desc">Pinned GitHub Actions run frozen dependencies, static checks, tests, build, smoke and dashboards before storing immutable attempt-scoped evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1018"/><stop offset="1" stop-color="#20293b"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#fbfdff;font-size:34px;font-weight:700}.st{fill:#b2bdd0;font-size:18px}.h{fill:#fbfdff;font-size:19px;font-weight:700}.b{fill:#b2bdd0;font-size:14px}.n{fill:#101620;font-size:15px;font-weight:800}.card{fill:#1b2435;stroke:#3d4c65;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">Quality Gate &amp; Evidence Chain / 质量门与证据链</text><text x="64" y="105" class="st">Pinned automation produces reproducible evidence without claiming proprietary simulator certification.</text>
<g filter="url(#s)"><rect x="55" y="160" width="1290" height="485" rx="25" class="card"/></g>
<path d="M150 325H1245" stroke="#3b4d68" stroke-width="6" stroke-linecap="round"/>
<g><circle cx="155" cy="325" r="55" fill="#3a2b16" stroke="#f59e0b" stroke-width="3"/><circle cx="155" cy="282" r="16" fill="#f59e0b"/><text x="155" y="288" text-anchor="middle" class="n">1</text><text x="155" y="326" text-anchor="middle" class="h">Frozen</text><text x="155" y="350" text-anchor="middle" class="b">uv.lock + pins</text>
<circle cx="370" cy="325" r="55" fill="#172f3d" stroke="#38bdf8" stroke-width="3"/><circle cx="370" cy="282" r="16" fill="#38bdf8"/><text x="370" y="288" text-anchor="middle" class="n">2</text><text x="370" y="326" text-anchor="middle" class="h">Static</text><text x="370" y="350" text-anchor="middle" class="b">Ruff + mypy</text>
<circle cx="585" cy="325" r="55" fill="#1d2e4a" stroke="#818cf8" stroke-width="3"/><circle cx="585" cy="282" r="16" fill="#818cf8"/><text x="585" y="288" text-anchor="middle" class="n">3</text><text x="585" y="326" text-anchor="middle" class="h">Tests</text><text x="585" y="350" text-anchor="middle" class="b">3 Python versions</text>
<circle cx="800" cy="325" r="55" fill="#302342" stroke="#c084fc" stroke-width="3"/><circle cx="800" cy="282" r="16" fill="#c084fc"/><text x="800" y="288" text-anchor="middle" class="n">4</text><text x="800" y="326" text-anchor="middle" class="h">Build</text><text x="800" y="350" text-anchor="middle" class="b">wheel + smoke</text>
<circle cx="1015" cy="325" r="55" fill="#173b35" stroke="#2dd4bf" stroke-width="3"/><circle cx="1015" cy="282" r="16" fill="#2dd4bf"/><text x="1015" y="288" text-anchor="middle" class="n">5</text><text x="1015" y="326" text-anchor="middle" class="h">Dashboards</text><text x="1015" y="350" text-anchor="middle" class="b">HTML + SVG</text>
<circle cx="1230" cy="325" r="55" fill="#183a2a" stroke="#34d399" stroke-width="3"/><circle cx="1230" cy="282" r="16" fill="#34d399"/><text x="1230" y="288" text-anchor="middle" class="n">6</text><text x="1230" y="326" text-anchor="middle" class="h">Artifacts</text><text x="1230" y="350" text-anchor="middle" class="b">run + attempt</text></g>
<g fill="#dbeafe"><polygon points="265,325 247,315 247,335"/><polygon points="480,325 462,315 462,335"/><polygon points="695,325 677,315 677,335"/><polygon points="910,325 892,315 892,335"/><polygon points="1125,325 1107,315 1107,335"/></g>
<g><rect x="95" y="440" width="260" height="130" rx="18" fill="#121a28"/><text x="225" y="476" text-anchor="middle" class="h">Linux matrix</text><text x="225" y="505" text-anchor="middle" class="b">Python 3.11 · 3.12 · 3.13</text><text x="225" y="532" text-anchor="middle" class="b">branch coverage ≥ 94.5%</text>
<rect x="390" y="440" width="260" height="130" rx="18" fill="#121a28"/><text x="520" y="476" text-anchor="middle" class="h">Windows gate</text><text x="520" y="505" text-anchor="middle" class="b">Job Objects · IPC · paths</text><text x="520" y="532" text-anchor="middle" class="b">Fake Aspen / HYSYS contracts</text>
<rect x="685" y="440" width="260" height="130" rx="18" fill="#121a28"/><text x="815" y="476" text-anchor="middle" class="h">Security governance</text><text x="815" y="505" text-anchor="middle" class="b">read-only token · pinned Actions</text><text x="815" y="532" text-anchor="middle" class="b">fail-closed evidence upload</text>
<rect x="980" y="440" width="260" height="130" rx="18" fill="#121a28"/><text x="1110" y="476" text-anchor="middle" class="h">Licensed boundary</text><text x="1110" y="505" text-anchor="middle" class="b">trusted main SHA + signing</text><text x="1110" y="532" text-anchor="middle" class="b">human engineering review</text></g>
<rect x="300" y="600" width="800" height="42" rx="14" fill="#0e1623" stroke="url(#g)" stroke-width="2"/><text x="700" y="627" text-anchor="middle" class="b">Artifact names include github.run_id and github.run_attempt; missing evidence is an error.</text>
</svg>
