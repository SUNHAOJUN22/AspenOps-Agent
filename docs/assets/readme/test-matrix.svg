e only · no skipped security findings · no order-dependent passes</text><rect x="52" y="156" width="1336" height="48" rx="12" class="q"/><rect x="72" y="168" width="210" height="24" rx="12" fill="#0B3B3C" stroke="#22D3EE"/><text x="177" y="185" class="k" text-anchor="middle">BANDIT 1.9.4 · HIGH/HIGH</text><rect x="302" y="168" width="260" height="24" rx="12" fill="#102D4E" stroke="#60A5FA"/><text x="432" y="185" class="k" text-anchor="middle">REVERSE + SEEDED RANDOM</text><rect x="582" y="168" width="210" height="24" rx="12" fill="#183B2A" stroke="#22C55E"/><text x="687" y="185" class="k" text-anchor="middle">PY3.12 COVERAGE 95.0%</text><text x="1360" y="185" class="c" text-anchor="end">FAIL CLOSED</text><rect x="52" y="224" width="1336" height="72" rx="14" class="p"/><rect x="52" y="224" width="8" height="72" rx="4" fill="#22C55E"/><text x="84" y="254" class="l">Linux CI</text><text x="374" y="254" class="c">3.11 · 3.12 · 3.13</text><text x="700" y="254" class="b">Ruff · mypy · compileall · AST audit · Bandit · pytest · Wheel</text><text x="1330" y="254" class="c" text-anchor="end">CURRENT ARTIFACT REQUIRED</text><text x="700" y="278" class="x">3.12: 95.0% + reverse/seeded reruns · 3.11/3.13: 94.5% compatibility floors</text><rect x="52" y="316" width="1336" height="72" rx="14" class="p"/><rect x="52" y="316" width="8" height="72" rx="4" fill="#60A5FA"/><text x="84" y="346" class="l">Public Windows</text><text x="374" y="346" class="c">3.12 · windows-2025</text><text x="700" y="346" class="b">IPC · Job Object · Fake COM · compileall · AST audit · governance</text><text x="1330" y="346" class="c" text-anchor="end">CURRENT ARTIFACT REQUIRED</text><rect x="52" y="408" width="1336" height="72" rx="14" class="p"/><rect x="52" y="408" width="8" height="72" rx="4" fill="#22D3EE"/><text x="84" y="438" class="l">Performance</text><text x="374" y="438" class="c">3.12 · ubuntu-24.04</text><text x="700" y="438" class="b">baseline/candidate · operation counts · query plan</text