<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps operating modes</title><desc id="desc">Four supported entry modes share one policy, scheduling, execution and evidence core: CLI and Python, batch studies, optimization, and MCP agents.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#142642"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#f6f9ff;font-size:34px;font-weight:700}.st{fill:#a9b9d2;font-size:18px}.h{fill:#f6f9ff;font-size:21px;font-weight:700}.b{fill:#a9b9d2;font-size:14px}.code{fill:#dbeafe;font-size:13px}.card{fill:#152742;stroke:#344d70;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">One Runtime, Four Operating Modes / 一个内核，四种使用方式</text><text x="64" y="105" class="st">Every interface reaches the same semantic registry, policy gates, worker pools and provenance layer.</text>
<g filter="url(#s)"><rect x="55" y="160" width="285" height="410" rx="24" class="card"/><rect x="390" y="160" width="285" height="410" rx="24" class="card"/><rect x="725" y="160" width="285" height="410" rx="24" class="card"/><rect x="1060" y="160" width="285" height="410" rx="24" class="card"/></g>
<g><circle cx="197" cy="225" r="35" fill="#0e3d5a" stroke="#38bdf8" stroke-width="2"/><path d="M178 214h38v24h-38zM185 245h24" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><text x="197" y="292" text-anchor="middle" class="h">CLI &amp; Python</text><text x="197" y="326" text-anchor="middle" class="b">demo · doctor · dry-run</text><text x="197" y="350" text-anchor="middle" class="b">typed request objects</text><rect x="85" y="388" width="225" height="108" rx="14" fill="#0c182a"/><text x="105" y="418" class="code">aspenops dry-run request.json</text><text x="105" y="447" class="code">aspenops submit ...</text><text x="105" y="476" class="code">from aspenops_nexus ...</text>
<circle cx="532" cy="225" r="35" fill="#263769" stroke="#818cf8" stroke-width="2"/><path d="M513 210h16v16h-16zM535 210h16v16h-16zM513 232h16v16h-16zM535 232h16v16h-16z" fill="#a5b4fc"/><text x="532" y="292" text-anchor="middle" class="h">Batch Studies</text><text x="532" y="326" text-anchor="middle" class="b">DOE · sensitivity · sweeps</text><text x="532" y="350" text-anchor="middle" class="b">cache + singleflight</text><rect x="420" y="388" width="225" height="108" rx="14" fill="#0c182a"/><text x="440" y="418" class="code">compile → deduplicate</text><text x="440" y="447" class="code">schedule → execute</text><text x="440" y="476" class="code">aggregate → archive</text>
<circle cx="867" cy="225" r="35" fill="#40265d" stroke="#c084fc" stroke-width="2"/><path d="M848 242l10-14 9 7 19-25" fill="none" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="886" cy="210" r="4" fill="#f0abfc"/><text x="867" y="292" text-anchor="middle" class="h">Optimization</text><text x="867" y="326" text-anchor="middle" class="b">bounded proposals</text><text x="867" y="350" text-anchor="middle" class="b">feasibility-first scoring</text><rect x="755" y="388" width="225" height="108" rx="14" fill="#0c182a"/><text x="775" y="418" class="code">objective + constraints</text><text x="775" y="447" class="code">evaluate candidates</text><text x="775" y="476" class="code">retain full evidence</text>
<circle cx="1202" cy="225" r="35" fill="#542746" stroke="#f472b6" stroke-width="2"/><circle cx="1188" cy="218" r="7" fill="#f9a8d4"/><circle cx="1216" cy="218" r="7" fill="#f9a8d4"/><circle cx="1202" cy="240" r="7" fill="#f9a8d4"/><path d="M1194 222l8 14 8-14" fill="none" stroke="#fce7f3" stroke-width="3"/><text x="1202" y="292" text-anchor="middle" class="h">MCP Agents</text><text x="1202" y="326" text-anchor="middle" class="b">14 narrow tools</text><text x="1202" y="350" text-anchor="middle" class="b">no arbitrary shell / COM</text><rect x="1090" y="388" width="225" height="108" rx="14" fill="#0c182a"/><text x="1110" y="418" class="code">system_info</text><text x="1110" y="447" class="code">dry_run_request</text><text x="1110" y="476" class="code">submit_batch / optimize</text></g>
