)"/><text x="1028" y="223" class="h" text-anchor="middle">5</text><text x="1028" y="270" class="h" text-anchor="middle">Repair</text><text x="1028" y="302" class="m" text-anchor="middle">simulator feedback</text><rect x="963" y="330" width="130" height="32" rx="16" fill="#fb7185" opacity=".16" stroke="#fb7185"/><text x="1028" y="351" class="small" text-anchor="middle">Bounded</text><line x1="1125" y1="275" x2="1153" y2="275" stroke="#4cc9f0" stroke-width="3"/><polygon points="1153,275 1142.6,281 1142.6,269" fill="#4cc9f0"/><rect x="1150" y="170" width="195" height="210" rx="18" class="panel" filter="url(#shadow)"/><circle cx="1248" cy="215" r="26" fill="url(#grad)"/><text x="1248" y="223" class="h" text-anchor="middle">6</text><text x="1248" y="270" class="h" text-anchor="middle">Review</text><text x="1248" y="302" class="m" text-anchor="middle">physics • convergence • balances</text><rect x="1183" y="330" width="130" height="32" rx="16" fill="#4ade80" opacity=".16" stroke="#4ade80"/><text x="1248" y="351" class="small" text-anchor="middle">Human gate</text><text x="700" y="450" class="b" text-anchor="middle">No stage may emit arbitrary Python / Shell / VBA / raw Aspen Tree Path</text></svg>