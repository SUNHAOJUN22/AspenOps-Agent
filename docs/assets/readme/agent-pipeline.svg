<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Layered Chemical Process Agent Pipeline</title><desc id="desc">Knowledge → Concept → Parameter → Execution → Repair → Physics Review</desc><rect width="1400" height="520" rx="28" fill="#0b1020"/><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#7b61ff"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:22px;font-weight:700}.b{fill:#eef4ff;font-size:17px}.m{fill:#9fb0c8;font-size:15px}.small{fill:#9fb0c8;font-size:13px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}</style></defs><text x="64" y="66" class="title">Layered Chemical Process Agent Pipeline</text><text x="64" y="96" class="sub">Knowledge → Concept → Parameter → Execution → Repair → Physics Review</text><rect x="50" y="170" width="195" height="210" rx="18" class="panel" filter="url(#shadow)"/><circle cx="148" cy="215" r="26" fill="url(#grad)"/><text x="148" y="223" class="h" text-anchor="middle">1</text><text x="148" y="270" class="h" text-anchor="middle">Knowledge</text><text x="148" y="302" class="m" text-anchor="middle">references • properties • rules</text><rect x="83" y="330" width="130" height="32" rx="16" fill="#4cc9f0" opacity=".16" stroke="#4cc9f0"/><text x="148" y="351" class="small" text-anchor="middle">Read-only</text><line x1="245" y1="275" x2="273" y2="275" stroke="#4cc9f0" stroke-width="3"/><polygon points="273,275 262.6,281 262.6,269" fill="#4cc9f0"/><rect x="270" y="170" width="195" height="210" rx="18" class="panel" filter="url(#shadow)"/><circle cx="368" cy="215" r="26" fill="url(#grad)