<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps engineering decision gates</title><desc id="desc">A result is accepted only after communication, engine, convergence, feasibility and material and energy balance gates all pass.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08140f"/><stop offset="1" stop-color="#102c24"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-opacity=".28"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#f3fff9;font-size:34px;font-weight:700}.st{fill:#add0bf;font-size:18px}.h{fill:#f3fff9;font-size:20px;font-weight:700}.b{fill:#add0bf;font-size:14px}.yes{fill:#062018;font-size:15px;font-weight:800}.card{fill:#14372c;stroke:#326555;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">Engineering Decision Gates / 工程判定门</text><text x="64" y="105" class="st">Engine return is evidence, not success. Every independent gate must pass before ok=true.</text>
<g filter="url(#s)"><rect x="60" y="170" width="1280" height="455" rx="28" class="card"/></g>
<path d="M160 390H1240" stroke="#2e6654" stroke-width="6" stroke-linecap="round"/>
<g><circle cx="190" cy="390" r="72" fill="#174b3a" stroke="#34d399" stroke-width="3"/><circle cx="190" cy="335" r="18" fill="#34d399"/><text x="190" y="341" text-anchor="middle" class="yes">✓</text><text x="190" y="386" text-anchor="middle" class="h">Communication</text><text x="190" y="414" text-anchor="middle" class="b">IPC + protocol</text><text x="190" y="438" text-anchor="middle" class="b">response received</text>
<circle cx="440" cy="390" r="72" fill="#174b3a" stroke="#34d399" stroke-width="3"/><circle cx="440" cy="335" r="18" fill="#34d399"/><text x="440" y="341" text-anchor="middle" class="yes">✓</text><text x="440" y="386" text-anchor="middle" class="h">Engine</text><text x="440" y="414" text-anchor="middle" class="b">Run returned</text><text x="440" y="438" text-anchor="middle" class="b">engine idle</text>
<circle cx="690" cy="390" r="72" fill="#174b3a" stroke="#22d3ee" stroke-width="3"/><circle cx="690" cy="335" r="18" fill="#22d3ee"/><text x="690" y="341" text-anchor="middle" class="yes">✓</text><text x="690" y="386" text-anchor="middle" class="h">Convergence</text><text x="690" y="414" text-anchor="middle" class="b">typed state</text><text x="690" y="438" text-anchor="middle" class="b">diagnostic evidence</text>
<circle cx="940" cy="390" r="72" fill="#174b3a" stroke="#38bdf8" stroke-width="3"/><circle cx="940" cy="335" r="18" fill="#38bdf8"/><text x="940" y="341" text-anchor="middle" class="yes">✓</text><text x="940" y="386" text-anchor="middle" class="h">Feasibility</text><text x="940" y="414" text-anchor="middle" class="b">bounds + rules</text><text x="940" y="438" text-anchor="middle" class="b">zero violations</text>
<circle cx="1190" cy="390" r="72" fill="#174b3a" stroke="#818cf8" stroke-width="3"/><circle cx="1190" cy="335" r="18" fill="#818cf8"/><text x="1190" y="341" text-anchor="middle" class="yes">✓</text><text x="1190" y="386" text-anchor="middle" class="h">Balances</text><text x="1190" y="414" text-anchor="middle" class="b">material + energy</text><text x="1190" y="438" text-anchor="middle" class="b">within tolerance</text></g>
<g fill="#d1fae5"><polygon points="310,390 290,378 290,402"/><polygon points="560,390 540,378 540,402"/><polygon points="810,390 790,378 790,402"/><polygon points="1060,390 1040,378 1040,402"/></g>
<rect x="265" y="525" width="870" height="58" rx="17" fill="#0a211a" stroke="url(#g)" stroke-width="2"/><text x="700" y="561" text-anchor="middle" class="h">ok = communication_ok ∧ engine_ok ∧ converged ∧ feasible ∧ balances_passed</text>
<text x="700" y="680" text-anchor="middle" class="st">Any failed gate returns structured violations and preserves the full evidence trail.</text>
</svg>
