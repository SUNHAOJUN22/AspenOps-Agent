<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" data-design-system="ui-ux-pro-max" data-visual-version="3"><title id="title">Durable Path Portability</title><desc id="desc">Submitted paths remain stable across process working directories.</desc><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{font-family:"JetBrains Mono",Consolas,monospace;fill:#A7B7CA}.e{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.2px;fill:#22D3EE}.h{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:32px;font-weight:700;fill:#F8FAFC}.s{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:500;fill:#A7B7CA}.l{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;fill:#F8FAFC}.b{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#A7B7CA}.x{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;fill:#71849B}.c{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600;fill:#A7B7CA}.v{font-family:"JetBrains Mono",Consolas,monospace;font-size:21px;font-weight:700;fill:#F8FAFC}.p{fill:#0D1524;stroke:#23344E;stroke-width:1.2}.q{fill:#121E30;stroke:#334A6B;stroke-width:1.2}</style><rect width="1440" height="720" rx="28" fill="#050A12"/><path d="M52 132H1388" stroke="#334A6B"/><path d="M52 132H520" stroke="#22D3EE" stroke-width="2"/><text x="52" y="46" class="e">PATH IDENTITY</text><text x="52" y="86" class="h">Durable Path Portability</text><text x="52" y="112" class="s">Resolve once, persist absolute identity, revalidate at execution.</text><rect x="52" y="214" width="225" height="220" rx="16" class="q"/><rect x="52" y="214" width="6" height="220" rx="3" fill="#60A5FA"/><text x="74" y="252" class="l">Submission CWD</text><text x="74" y="280" class="b">relative model + registry</text><path d="M277 324H307" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><path d="M307 324l-8 5v-10z" fill="#60A5FA"/><rect x="319" y="214" width="225" height="220" rx="16" class="p"/><rect x="319" y="214" width="6" height="220" rx="3" fill="#22D3EE"/><text x="341" y="252" class="l">Resolve</text><text x="341" y="280" class="b">expanduser + realpath</text><path d="M544 324H574" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/><path d="M574 324l-8 5v-10z" fill="#22D3EE"/><rect x="586" y="214" width="225" height="220" rx="16" class="p"/><rect x="586" y="214" width="6" height="220" rx="3" fill="#2DD4BF"/><text x="608" y="252" class="l">Pin</text><text x="608" y="280" class="b">absolute durable request</text><path d="M811 324H841" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/><path d="M841 324l-8 5v-10z" fill="#2DD4BF"/><rect x="853" y="214" width="225" height="220" rx="16" class="p"/><rect x="853" y="214" width="6" height="220" rx="3" fill="#A78BFA"/><text x="875" y="252" class="l">Persist</text><text x="875" y="280" class="b">SQLite WAL record</text><path d="M1078 324H1108" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/><path d="M1108 324l-8 5v-10z" fill="#A78BFA"/><rect x="1120" y="214" width="225" height="220" rx="16" class="q"/><rect x="1120" y="214" width="6" height="220" rx="3" fill="#22C55E"/><text x="1142" y="252" class="l">Execute</text><text x="1142" y="280" class="b">Scheduler from any CWD</text><rect x="52" y="486" width="420" height="96" rx="16" class="p"/><rect x="52" y="486" width="6" height="96" rx="3" fill="#22C55E"/><text x="74" y="524" class="l">EVIDENCE</text><text x="74" y="552" class="b">paths_pinned = true</text><text x="74" y="574" class="b">submission_cwd = absolute</text><rect x="510" y="486" width="420" height="96" rx="16" class="p"/><rect x="510" y="486" width="6" height="96" rx="3" fill="#F59E0B"/><text x="532" y="524" class="l">REAL BACKEND</text><text x="532" y="552" class="b">allowed roots + realpath checked again</text><rect x="968" y="486" width="420" height="96" rx="16" class="p"/><rect x="968" y="486" width="6" height="96" rx="3" fill="#60A5FA"/><text x="990" y="524" class="l">DIRECT PYTHON</text><text x="990" y="552" class="b">absolute paths or pin helper required</text><rect x="52" y="626" width="1336" height="46" rx="12" fill="#121E30" stroke="#F43F5E"/><text x="720" y="655" class="c" text-anchor="middle">durability never bypasses path policy</text></svg>