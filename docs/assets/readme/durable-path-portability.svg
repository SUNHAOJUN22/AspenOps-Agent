<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Durable Queue Path Portability</title>
<desc id="desc">Relative model and registry paths are pinned to absolute identities at submission so the scheduler can execute from a different working directory.</desc>
<rect width="1400" height="660" rx="28" fill="#0b1020"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:22px;font-weight:700}.b{fill:#eef4ff;font-size:17px}.m{fill:#9fb0c8;font-size:15px}.small{fill:#9fb0c8;font-size:13px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Durable Queue Path Portability</text>
<text x="64" y="96" class="sub">Submission identity is independent of the scheduler service working directory</text>
<rect x="55" y="150" width="280" height="360" rx="22" class="panel" filter="url(#shadow)"/>
<text x="195" y="194" class="h" text-anchor="middle">Submit Process</text>
<rect x="85" y="225" width="220" height="65" rx="14" class="panel2"/>
<text x="105" y="253" class="b">Working directory A</text><text x="105" y="276" class="small">request paths are relative</text>
<rect x="85" y="315" width="220" height="74" rx="14" class="panel2"/>
<text x="105" y="344" class="b">Resolve and validate</text><text x="105" y="368" class="small">model + registry + policy</text>
<rect x="85" y="414" width="220" height="55" rx="14" fill="#4ade80" opacity=".13" stroke="#4ade80"/>
<text x="195" y="447" class="b" text-anchor="middle">paths_pinned = true</text>
<line x1="335" y1="330" x2="440" y2="330" stroke="#4cc9f0" stroke-width="3"/><polygon points="440,330 429.6,336 429.6,324" fill="#4cc9f0"/>
<rect x="440" y="150" width="340" height="360" rx="22" class="panel" filter="url(#shadow)"/>
<text x="610" y="194" class="h" text-anchor="middle">Durable SQLite Record</text>
<rect x="475" y="225" width="270" height="70" rx="14" class="panel2"/>
<text x="495" y="252" class="b">Absolute model path</text><text x="495" y="276" class="small">stable across process boundaries</text>
<rect x="475" y="315" width="270" height="70" rx="14" class="panel2"/>
<text x="495" y="342" class="b">Absolute registry path</text><text x="495" y="366" class="small">same semantic contract</text>
<rect x="475" y="405" width="270" height="65" rx="14" class="panel2"/>
<text x="495" y="432" class="b">Submission metadata</text><text x="495" y="455" class="small">submission_cwd + request hash</text>
<line x1="780" y1="330" x2="885" y2="330" stroke="#4cc9f0" stroke-width="3"/><polygon points="885,330 874.6,336 874.6,324" fill="#4cc9f0"/>
<rect x="885" y="150" width="460" height="360" rx="22" class="panel" filter="url(#shadow)"/>
<text x="1115" y="194" class="h" text-anchor="middle">Scheduler Service</text>
<rect x="920" y="225" width="390" height="65" rx="14" class="panel2"/>
<text x="940" y="253" class="b">Working directory B may differ</text><text x="940" y="276" class="small">no implicit dependence on service startup location</text>
<rect x="920" y="315" width="185" height="88" rx="14" class="panel2"/>
<text x="940" y="346" class="b">Lease + heartbeat</text><text x="940" y="371" class="small">durable ownership</text>
<rect x="1125" y="315" width="185" height="88" rx="14" class="panel2"/>
<text x="1145" y="346" class="b">Isolated Worker</text><text x="1145" y="371" class="small">private case copy</text>
<rect x="920" y="430" width="390" height="42" rx="18" fill="#7b61ff" opacity=".14" stroke="#7b61ff"/>
<text x="1115" y="457" class="b" text-anchor="middle">same model identity, same evidence chain</text>
<rect x="210" y="555" width="980" height="52" rx="20" class="panel2"/>
<text x="700" y="587" class="b" text-anchor="middle">Relative input is accepted only once; persisted execution identity is absolute and auditable</text>
</svg>
