<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="evidence-title evidence-desc">
<title id="evidence-title">Evidence Bundle Integrity and Authenticity</title>
<desc id="evidence-desc">AspenOps writes JSON-safe request, result and environment members, binds model and registry hashes, records member size and SHA-256 declarations, optionally signs the manifest with Ed25519, verifies archive structure and separates integrity from human engineering acceptance.</desc>
<rect width="1400" height="720" rx="28" fill="#0b1020"/>
<defs>
  <filter id="evidence-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:21px;font-weight:700}.b{fill:#eef4ff;font-size:16px}.small{fill:#9fb0c8;font-size:12px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style>
</defs>
<text x="64" y="66" class="title">Evidence Bundle Integrity and Authenticity</text>
<text x="64" y="98" class="sub">JSON-safe members • content hashes • bounded archive • optional Ed25519 • explicit trust boundary</text>
<rect x="55" y="150" width="270" height="425" rx="22" class="panel" filter="url(#evidence-shadow)"/>
<text x="190" y="194" class="h" text-anchor="middle">1. Evidence Members</text>
<rect x="85" y="225" width="210" height="55" rx="13" class="panel2"/><text x="190" y="258" class="b" text-anchor="middle">request.json</text>
<rect x="85" y="300" width="210" height="55" rx="13" class="panel2"/><text x="190" y="333" class="b" text-anchor="middle">results.json</text>
<rect x="85" y="375" width="210" height="55" rx="13" class="panel2"/><text x="190" y="408" class="b" text-anchor="middle">environment.json</text>
<rect x="85" y="450" width="210" height="75" rx="13" fill="#4cc9f0" opacity=".12" stroke="#4cc9f0"/>
<text x="190" y="480" class="b" text-anchor="middle">JSON-Safe Contract</text><text x="190" y="505" class="small" text-anchor="middle">allow_nan = false</text>
<line x1="325" y1="360" x2="375" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="375,360 364.6,366 364.6,354" fill="#4cc9f0"/>
<rect x="375" y="150" width="285" height="425" rx="22" class="panel" filter="url(#evidence-shadow)"/>
<text x="517" y="194" class="h" text-anchor="middle">2. Manifest Binding</text>
<rect x="405" y="225" width="225" height="100" rx="14" class="panel2"/>
<text x="517" y="255" class="b" text-anchor="middle">Content Identity</text><text x="517" y="280" class="small" text-anchor="middle">request + result SHA-256</text><text x="517" y="301" class="small" text-anchor="middle">runtime schema + version</text>
<rect x="405" y="350" width="225" height="90" rx="14" class="panel2"/>
<text x="517" y="380" class="b" text-anchor="middle">Scientific Inputs</text><text x="517" y="405" class="small" text-anchor="middle">model + registry SHA-256</text>
<rect x="405" y="465" width="225" height="70" rx="14" class="panel2"/>
<text x="517" y="494" class="b" text-anchor="middle">Member Declarations</text><text x="517" y="518" class="small" text-anchor="middle">size + SHA-256</text>
<line x1="660" y1="360" x2="710" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="710,360 699.6,366 699.6,354" fill="#4cc9f0"/>
<rect x="710" y="150" width="285" height="425" rx="22" class="panel" filter="url(#evidence-shadow)"/>
<text x="852" y="194" class="h" text-anchor="middle">3. Archive Safety</text>
<rect x="740" y="225" width="225" height="105" rx="14" class="panel2"/>
<text x="852" y="255" class="b" text-anchor="middle">Bounded ZIP</text><text x="852" y="280" class="small" text-anchor="middle">member count and size</text><text x="852" y="301" class="small" text-anchor="middle">path and compression checks</text>
<rect x="740" y="355" width="225" height="90" rx="14" fill="#fb7185" opacity=".12" stroke="#fb7185"/>
<text x="852" y="385" class="b" text-anchor="middle">Reject Structure Drift</text><text x="852" y="410" class="small" text-anchor="middle">missing, extra or reserved member</text>
<rect x="740" y="470" width="225" height="65" rx="14" class="panel2"/>
<text x="852" y="498" class="b" text-anchor="middle">Exact Recalculation</text><text x="852" y="521" class="small" text-anchor="middle">digest and size verification</text>
<line x1="995" y1="360" x2="1045" y2="360" stroke="#4cc9f0" stroke-width="3"/><polygon points="1045,360 1034.6,366 1034.6,354" fill="#4cc9f0"/>
<rect x="1045" y="150" width="300" height="425" rx="22" class="panel" filter="url(#evidence-shadow)"/>
<text x="1195" y="194" class="h" text-anchor="middle">4. Trust Decision</text>
<rect x="1075" y="225" width="240" height="90" rx="14" class="panel2"/>
<text x="1195" y="255" class="b" text-anchor="middle">Unsigned</text><text x="1195" y="280" class="small" text-anchor="middle">internal integrity only</text><text x="1195" y="301" class="small" text-anchor="middle">no authenticity claim</text>
<rect x="1075" y="340" width="240" height="105" rx="14" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
<text x="1195" y="370" class="b" text-anchor="middle">Ed25519 Signed</text><text x="1195" y="395" class="small" text-anchor="middle">trusted key ID + signature</text><text x="1195" y="416" class="small" text-anchor="middle">authenticity when key is trusted</text>
<rect x="1075" y="470" width="240" height="65" rx="14" fill="#fbbf24" opacity=".12" stroke="#fbbf24"/>
<text x="1195" y="498" class="b" text-anchor="middle">Human Acceptance</text><text x="1195" y="521" class="small" text-anchor="middle">separate engineering gate</text>
<rect x="130" y="620" width="1140" height="58" rx="19" class="panel2"/>
<text x="700" y="644" class="b" text-anchor="middle">Hashes detect modification; signatures prove origin only with a trusted key; neither proves physical model validity</text>
</svg>