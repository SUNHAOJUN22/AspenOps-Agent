<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AspenOps industrial study scenarios</title><desc id="desc">AspenOps supports governed execution patterns for separation, reaction, energy integration, sensitivity studies and constrained optimization while keeping engineering approval human-led.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10100b"/><stop offset="1" stop-color="#302910"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.t{fill:#fffdf4;font-size:34px;font-weight:700}.st{fill:#d4c9a6;font-size:18px}.h{fill:#fffdf4;font-size:20px;font-weight:700}.b{fill:#d4c9a6;font-size:14px}.card{fill:#352f18;stroke:#695d2d;stroke-width:1.5}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="64" y="70" class="t">Industrial Study Patterns / 工业仿真研究场景</text><text x="64" y="105" class="st">The platform automates controlled execution and evidence capture—not engineering judgment or model ownership.</text>
<g filter="url(#s)"><rect x="55" y="160" width="1290" height="500" rx="25" class="card"/></g>
