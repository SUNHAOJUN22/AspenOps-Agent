<rect x="840" y="205" width="230" height="380" rx="22" fill="#41391b"/><text x="955" y="252" text-anchor="middle" class="h">Sensitivity</text><path d="M895 450V310M895 450h120" fill="none" stroke="#fde68a" stroke-width="4"/><path d="M910 425c25-60 45-20 70-70 12-22 20-35 30-38" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/><circle cx="930" cy="386" r="7" fill="#34d399"/><circle cx="980" cy="355" r="7" fill="#34d399"/><text x="955" y="520" text-anchor="middle" class="b">DOE · parameter sweeps</text><text x="955" y="545" text-anchor="middle" class="b">cache-aware batching</text>
