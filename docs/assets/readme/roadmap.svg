" width="348" height="48" rx="12" class="p"/><text x="94" y="352" class="b">Aspen/HYSYS existing models</text><rect x="76" y="390" width="348" height="48" rx="12" class="p"/><text x="94" y="420" class="b">Durable Scheduler + Cache</text><rect x="76" y="458" width="348" height="48" rx="12" class="p"/><text x="94" y="488" class="b">MCP + Evidence</text><rect x="502" y="182" width="396" height="388" rx="18" class="q"/><rect x="502" y="182" width="396" height="8" rx="4" fill="#60A5FA"/><text x="526" y="226" class="l">NEXT</text><rect x="526" y="254" width="348" height="48" rx="12" class="p"/><text x="544" y="284" class="b">JobStore query consolidation</text><rect x="526" y="322" width="348" height="48" rx="12" class="p"/><text x="544" y="352" class="b">IR → Mock plan compiler</text><rect x="526" y="390" width="348" height="48" rx="12" class="p"/><text x="544" y="420" class="b">DWSIM backend</text><rect x="526" y="458" width="348" height="48" rx="12" class="p"/><text x="544" y="488" class="b">Repair loop + review UI</text><rect x="952" y="182" width="396" height="388" rx="18" class="q"/><rect x="952" y="182" width="396" height="8" rx="4" fill="#F59E0B"/><text x="976" y="226" class="l">EVIDENCE-GATED</text><rect x="976" y="254" width="348" height="48" rx="12" class="p"/><text x="994" y="284" class="b">Automatic Aspen compiler</text><rect x="976" y="322" width="348" height="48" rx="12" class="p"/><text x="994" y="352" class="b">IDAES symbolic backend</text><rect x="976" y="390" width="348" height="48" rx="12" class="p"/><text x="994" y="420" class="b">Modelica/FMI</text><rect x="976" y="458" width="348" height="48" rx="12" class="p"/><text x="994" y="488" class="b">Industrial qualification</text><rect x="52" y="626" width="1336" height="46" rx="12" fill="#121E30" stroke="#F43F5E"/><text x="720" y="655" class="c" text-anchor="middle">planned ≠ implemented · signed ≠ engineering-approved</text></svg>