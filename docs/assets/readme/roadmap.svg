<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc"><title id="title">AspenOps Product Roadmap</title><desc id="desc">Preserve industrial execution safety while adding generative flowsheet intelligence in evidence-backed stages</desc><rect width="1400" height="690" rx="28" fill="#0b1020"/><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><style>text{font-family:Inter,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif}.title{fill:#eef4ff;font-size:34px;font-weight:750}.sub{fill:#9fb0c8;font-size:18px}.h{fill:#eef4ff;font-size:22px;font-weight:700}.b{fill:#eef4ff;font-size:17px}.panel{fill:#131a2b;stroke:#26324a;stroke-width:1.5}.panel2{fill:#182338;stroke:#26324a;stroke-width:1.5}</style></defs><text x="64" y="66" class="title">AspenOps Product Roadmap</text><text x="64" y="96" class="sub">Preserve industrial execution safety while adding generative flowsheet intelligence in evidence-backed stages</text><rect x="55" y="145" width="405" height="455" rx="20" class="panel" filter="url(#shadow)"/><rect x="55" y="145" width="405" height="12" rx="6" fill="#4ade80"/><text x="80" y="205" class="h">NOW / 已实现</text><circle cx="90" cy="245" r="8" fill="#4ade80"/><text x="113" y="251" class="b">Process Intent IR</text><circle cx="90" cy="307" r="8" fill="#4ade80"/><text x="113" y="313" class="b">Aspen/HYSYS execution</text><circle cx="90" cy="369" r="8" fill="#4ade80"/><text x="113" y="375" class="b">Mock + Windows gates</text><circle cx="90" cy="431" r="8" fill="#4ade80"/><text x="113" y="437" class="b">MCP + scheduler</text><circle cx="90" cy="493" r="8" fill="#4ade80"/><text x="113" y="499" class="b">Signed evidence</text><rect x="500" y="145" width="405" height="455" rx="20" class="panel" filter="url(#shadow)"/><rect x="500" y="145" width="405" height="12" rx="6" fill="#4cc9f0