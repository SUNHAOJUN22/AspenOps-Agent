  <g transform="translate(680 350)"><rect width="240" height="150" rx="24" fill="#101D35" stroke="#22C55E" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="#22C55E"/><text x="58" y="39" class="stage">SCHEDULER</text><text x="24" y="82" class="zh">隔离调度</text><text x="24" y="118" class="detail">pool · license · retry</text></g>
  <g transform="translate(985 350)"><rect width="240" height="150" rx="24" fill="#101D35" stroke="#F59E0B" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="#F59E0B"/><text x="58" y="39" class="stage">SIMULATOR</text><text x="24" y="82" class="zh">商业求解器</text><text x="24" y="118" class="detail">Aspen Plus / HYSYS</text></g>
  <g transform="translate(1290 350)"><rect width="240" height="150" rx="24" fill="#101D35" stroke="#EF4444" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="#EF4444"/><text x="58" y="39" class="stage">EVIDENCE</text><text x="24" y="82" class="zh">交付证据</text><text x="24" y="118" class="detail">hash · SBOM · receipt</text></g>
  <g transform="translate(70 605)"><rect width="1460" height="145" rx="24" fill="#0B1830" stroke="#334155"/><text x="34" y="45" class="stage">ACCEPTANCE LOGIC / 验收逻辑</text><text x="34" y="88" class="subtitle">Code + schema + deterministic tests + provenance → software PASS</text><text x="34" y="122" class="subtitle">Licensed solver / Golden Case absent → PENDING_REAL_ASPEN_CERTIFICATION</text></g>
