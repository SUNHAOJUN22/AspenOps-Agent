  <g transform="translate(70 350)"><rect width="240" height="150" rx="24" fill="#101D35" stroke="#0EA5E9" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="#0EA5E9"/><text x="58" y="39" class="stage">INTENT</text><text x="24" y="82" class="zh">过程意图</text><text x="24" y="118" class="detail">typed Process IR</text></g>
