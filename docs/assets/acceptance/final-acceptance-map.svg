<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AspenOps-Agent final acceptance map</title>
  <desc id="desc">AI-assisted bilingual conceptual diagram mapping repository code contracts to acceptance evidence. Not scientific data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.24"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#94A3B8"/></marker>
    <style>
      .title{font:700 54px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#F8FAFC}
      .subtitle{font:400 25px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#CBD5E1}
      .stage{font:700 23px Arial,sans-serif;fill:#F8FAFC;letter-spacing:1px}
      .zh{font:700 27px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#E2E8F0}
      .detail{font:400 18px Consolas,'DejaVu Sans Mono',monospace;fill:#94A3B8}
      .formula{font:italic 38px Georgia,'Times New Roman',serif;fill:#E0F2FE}
      .small{font:400 18px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#94A3B8}
      .tag{font:700 18px Arial,sans-serif;fill:#07111F}
      .arrow{stroke:#94A3B8;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="130" r="260" fill="url(#halo)"/>
  <path d="M70 183 H1530" stroke="url(#beam)" stroke-width="5" opacity="0.8" filter="url(#glow)"/>
