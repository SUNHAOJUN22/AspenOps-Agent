name: Bug report
description: Report a reproducible AspenOps defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload proprietary Aspen cases, licenses, credentials, or customer data.
  - type: input
    id: version
    attributes:
      label: AspenOps version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/Python/Aspen product build/ProgID, with confidential details removed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error and diagnostic evidence
    validations:
      required: true
