name: Annotated tag ref API diagnostics

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/AspenOps-Agent' &&
      github.event.issue.title == 'AspenOps tag ref API diagnostics' &&
      github.event.issue.body == 'RUN_TAG_REF_DIAGNOSTICS_20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TAG_OBJECT_SHA: 126b4da51b54abc06e0cd56d2d9a9df9021e2a1e
      TAG_NAME: archive/branch/agent-aspenops-1.0-production-runtime/20260721/2d5ae6c
    steps:
      - name: Attempt tag ref creation and publish raw response
        shell: bash
        run: |
          set -uo pipefail
          jq -n --arg ref "refs/tags/$TAG_NAME" --arg sha "$TAG_OBJECT_SHA" '{ref:$ref,sha:$sha}' > /tmp/ref.json
          set +e
          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input /tmp/ref.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$response"
          safe="$(printf '%s' "$response" | head -c 5000)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Tag ref POST exit=$status\n\n\`\`\`text\n$safe\n\`\`\`\n\nRun: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ $status -eq 0 ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            exit "$status"
          fi
