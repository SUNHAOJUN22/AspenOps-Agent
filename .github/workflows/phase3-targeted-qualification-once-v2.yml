name: Phase 3 targeted signed-qualification gate v2

on:
  pull_request:
    branches:
      - feature/aspenops-v15-compilation-contracts
    paths:
      - .github/workflows/phase3-targeted-qualification-once-v2.yml

permissions:
  contents: write

concurrency:
  group: phase3-targeted-signed-qualification
  cancel-in-progress: false

jobs:
  qualify-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-runtime-profile-qualification
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Format and validate Phase 3 contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -f PHASE3_DIAGNOSTIC.md PHASE3_TARGETED_QUALIFICATION.json
          rm -f .github/workflows/phase3-*.yml
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py \
            tests/test_compilation_plan_v15.py \
            tests/test_simulator_capabilities_v15.py \
            tests/test_native_topology_contract.py
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=95.0
      - name: Commit qualified formatting and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          Path("PHASE3_TARGETED_QUALIFICATION.json").write_text(
              json.dumps(
                  {
                      "status": "PASS_TARGETED_AND_FULL_PY312",
                      "scope": "SIGNED_RUNTIME_QUALIFICATION_CONTRACTS",
                      "real_aspen_status": "PENDING_REAL_ASPEN_CERTIFICATION",
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: qualify Phase 3 signed runtime contracts"
          git push origin HEAD:feature/aspenops-runtime-profile-qualification
