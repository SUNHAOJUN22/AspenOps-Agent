name: Materialize AspenOps 1.1.0

on:
  push:
    branches:
      - agent/aspenops-1.1-materialize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aspenops-1.1-materialize
  cancel-in-progress: true

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout checksum-gated staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f v1.1stage/source.tar.gz.b64
          echo "e2ed6b5eb35e8a1504bddf3fb40229897f08d3a538ce0d32ece2318cc9a76857  v1.1stage/source.tar.gz.b64" | sha256sum --check --strict
          base64 --decode v1.1stage/source.tar.gz.b64 > /tmp/aspenops-1.1.0-source.tar.gz
          echo "de758d63a3003560cb3b43de08138aa196599b92fb94bbb211fd0fd3a47e2aef  /tmp/aspenops-1.1.0-source.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/aspenops-1.1.0
          tar -xzf /tmp/aspenops-1.1.0-source.tar.gz -C /tmp/aspenops-1.1.0
          test -f /tmp/aspenops-1.1.0/pyproject.toml
          test -f /tmp/aspenops-1.1.0/README.md
          test -f /tmp/aspenops-1.1.0/README.en.md

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install report fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-ukai fonts-arphic-uming

      - name: Run portable release gate
        working-directory: /tmp/aspenops-1.1.0
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra agent
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning --cov=aspenops --cov-branch --cov-report=term --cov-report=json:var/coverage.json --cov-fail-under=85
          uv run python scripts/check_release_consistency.py
          uv run python scripts/check_mcp.py
          uv build --clear
          uv run aspenops version
          uv run aspenops doctor
          uv run aspenops demo

      - name: Verify clean wheel installation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/aspenops-wheel-smoke
          /tmp/aspenops-wheel-smoke/bin/pip install /tmp/aspenops-1.1.0/dist/*.whl
          cd /tmp
          /tmp/aspenops-wheel-smoke/bin/aspenops version
          /tmp/aspenops-wheel-smoke/bin/aspenops doctor
          /tmp/aspenops-wheel-smoke/bin/aspenops demo

      - name: Publish verified production candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/aspenops-1.1.0-source.tar.gz -C .
          rm -rf .venv .pytest_cache .mypy_cache .ruff_cache dist build var htmlcov
          rm -f .coverage .coverage.*
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git switch -C agent/aspenops-1.1-production-runtime
          git add -A
          git commit -m "release: AspenOps 1.1.0 production candidate"
          git push --force origin agent/aspenops-1.1-production-runtime
