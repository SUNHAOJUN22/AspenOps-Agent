name: Diagnose AspenOps 1.1 payload

on:
  push:
    branches:
      - agent/aspenops-1.1-materialize
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose-payload:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/aspenops-1.1-materialize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Hash issue payload comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/12/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          comments = json.load(urllib.request.urlopen(req))
          pattern = re.compile(r'^ASPENOPS-ZSTD-PART ([0-9]{2})\r?\n([A-Za-z0-9+/=]+)\s*$')
          expected = {
              '2c415a8f19afd50fe663245b483ac710e43310fe6cfd177f547f7d9f48a01205': '00',
              'd256ae4b81ee51d8899af2da2ab6247d894848a8c5c1a912f4b85228723067b0': '01',
              '7ddb88597deb28cefacaf54b585104469fb3e1b44b4b8fbcd5512948f0e08366': '02',
              '228d0d81a5726c3573b97ace9ec6867bafd27aa0840c59a11eec41cd23346e02': '03',
              'e398d74bab9f82151d585dfc9f2cff48b4443cec45a1875e813a04ae33c0d540': '04',
          }
          found = {}
          for comment in comments:
              body = comment.get('body') or ''
              match = pattern.fullmatch(body)
              if not match:
                  continue
              marker, payload = match.groups()
              digest = hashlib.sha256(payload.encode()).hexdigest()
              canonical = expected.get(digest, 'UNKNOWN')
              print(json.dumps({
                  'comment_id': comment['id'],
                  'marker': marker,
                  'canonical_by_sha256': canonical,
                  'length': len(payload),
                  'sha256': digest,
              }, sort_keys=True))
              if canonical != 'UNKNOWN':
                  found.setdefault(canonical, []).append(comment['id'])
          missing = sorted(set(expected.values()) - set(found))
          duplicates = {key: value for key, value in found.items() if len(value) != 1}
          print(json.dumps({'missing': missing, 'duplicates': duplicates}, sort_keys=True))
          if missing or duplicates:
              raise SystemExit(1)
          PY
