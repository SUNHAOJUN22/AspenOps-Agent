name: One-shot format optimization imports

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/format-optimization-imports.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Normalize imports and formatting
        run: |
          uv sync --extra dev
          uv run ruff check src/aspenops_nexus/optimization.py --fix
          uv run ruff format src/aspenops_nexus/optimization.py
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/format-optimization-imports.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/optimization.py \
            .github/workflows/format-optimization-imports.yml
          git commit -m "style: normalize optimization imports"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
