name: Phase 3 diagnostic gate

on:
  pull_request:
    branches:
      - feature/aspenops-v15-compilation-contracts
    paths:
      - .github/workflows/phase3-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnose-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-runtime-profile-qualification
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -u
          uv sync --frozen --extra dev --extra agent --extra signing > /tmp/sync.log 2>&1
          sync_status=$?
          uv run ruff check --fix --exit-zero \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py > /tmp/ruff-fix.log 2>&1
          uv run ruff format \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py > /tmp/format.log 2>&1
          uv run ruff check . > /tmp/ruff.log 2>&1
          ruff_status=$?
          uv run ruff format --check . > /tmp/format-check.log 2>&1
          format_status=$?
          uv run mypy src > /tmp/mypy.log 2>&1
          mypy_status=$?
          uv run pytest \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py \
            tests/test_compilation_plan_v15.py > /tmp/targeted.log 2>&1
          targeted_status=$?
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=95.0 > /tmp/full.log 2>&1
          full_status=$?
          python - <<'PY'
          from pathlib import Path
          import os

          items = (
              ("sync", "/tmp/sync.log", os.environ.get("sync_status", "")),
              ("ruff", "/tmp/ruff.log", os.environ.get("ruff_status", "")),
              ("format", "/tmp/format-check.log", os.environ.get("format_status", "")),
              ("mypy", "/tmp/mypy.log", os.environ.get("mypy_status", "")),
              ("targeted", "/tmp/targeted.log", os.environ.get("targeted_status", "")),
              ("full", "/tmp/full.log", os.environ.get("full_status", "")),
          )
          lines = ["# Phase 3 diagnostic\n"]
          for name, filename, status in items:
              payload = Path(filename).read_text(encoding="utf-8", errors="replace")
              tail = "\n".join(payload.splitlines()[-160:])
              lines.extend((f"## {name} status={status}\n", "```text", tail, "```\n"))
          Path("PHASE3_DIAGNOSTIC.md").write_text("\n".join(lines), encoding="utf-8")
          PY
        env:
          sync_status: ${{ env.sync_status }}
          ruff_status: ${{ env.ruff_status }}
          format_status: ${{ env.format_status }}
          mypy_status: ${{ env.mypy_status }}
          targeted_status: ${{ env.targeted_status }}
          full_status: ${{ env.full_status }}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py \
            PHASE3_DIAGNOSTIC.md
          git commit -m "test: record Phase 3 diagnostic gate"
          git push origin HEAD:feature/aspenops-runtime-profile-qualification
