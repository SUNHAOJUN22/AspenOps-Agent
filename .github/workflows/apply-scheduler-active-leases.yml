name: One-shot apply scheduler active lease hardening

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/apply-scheduler-active-leases.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Patch active lease lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/scheduler.py")
          text = path.read_text(encoding="utf-8")

          old = '''        self._active_lock = threading.RLock()
                  self._active_pools: dict[str, CasePool] = {}
                  self.owner = f"scheduler-{uuid.uuid4().hex[:12]}"
          '''
          new = '''        self._active_lock = threading.RLock()
                  self._active_pools: dict[str, CasePool] = {}
                  self._active_jobs: set[str] = set()
                  self.owner = f"scheduler-{uuid.uuid4().hex[:12]}"
          '''
          if old not in text:
              raise SystemExit("active scheduler fields anchor not found")
          text = text.replace(old, new, 1)

          old = '''    def _active_snapshot(self) -> dict[str, CasePool]:
                  with self._active_lock:
                      return dict(self._active_pools)

              def stop(self) -> None:
          '''
          new = '''    def _active_snapshot(self) -> dict[str, CasePool]:
                  with self._active_lock:
                      return dict(self._active_pools)

              def _active_job_snapshot(self) -> set[str]:
                  with self._active_lock:
                      return set(self._active_jobs)

              def _set_job_active(self, job_id: str, active: bool) -> None:
                  with self._active_lock:
                      if active:
                          self._active_jobs.add(job_id)
                      else:
                          self._active_jobs.discard(job_id)

              def stop(self) -> None:
          '''
          if old not in text:
              raise SystemExit("active snapshot anchor not found")
          text = text.replace(old, new, 1)

          old = '''    def _watch_active_jobs(self) -> None:
                  interval = max(0.05, min(self.settings.scheduler_poll_s, self.settings.job_lease_s / 3))
                  while not self._stop.wait(interval):
                      active = self._active_snapshot()
                      for job_id, pool in active.items():
                          if self.store.heartbeat(job_id, self.owner, self.settings.job_lease_s):
                              continue
                          events = pool.force_recycle_all("lease_lost")
                          self._observe_pool(job_id, None)
                          self.store.record_lease_lost(job_id, self.owner, events)
                      for job_id in self.store.cancellation_due(owner=self.owner):
                          due_pool = self._active_snapshot().get(job_id)
                          if due_pool is None:
                              continue
                          events = due_pool.force_recycle_all("cancel_deadline")
                          self.store.mark_abort_dispatched(job_id, events, owner=self.owner)
          '''
          new = '''    def _watch_active_jobs(self) -> None:
                  interval = max(0.05, min(self.settings.scheduler_poll_s, self.settings.job_lease_s / 3))
                  while not self._stop.wait(interval):
                      active_jobs = self._active_job_snapshot()
                      active_pools = self._active_snapshot()
                      for job_id in active_jobs:
                          if self.store.heartbeat(job_id, self.owner, self.settings.job_lease_s):
                              continue
                          pool = active_pools.get(job_id)
                          events = [] if pool is None else pool.force_recycle_all("lease_lost")
                          self._observe_pool(job_id, None)
                          self._set_job_active(job_id, False)
                          self.store.record_lease_lost(job_id, self.owner, events)
                      for job_id in self.store.cancellation_due(owner=self.owner):
                          due_pool = self._active_snapshot().get(job_id)
                          if due_pool is None:
                              continue
                          events = due_pool.force_recycle_all("cancel_deadline")
                          self.store.mark_abort_dispatched(job_id, events, owner=self.owner)
          '''
          if old not in text:
              raise SystemExit("watcher block anchor not found")
          text = text.replace(old, new, 1)

          old = '''            if not self.store.mark_running(job_id, self.owner, self.settings.job_lease_s):
                          continue
                      try:
          '''
          new = '''            if not self.store.mark_running(job_id, self.owner, self.settings.job_lease_s):
                          continue
                      self._set_job_active(job_id, True)
                      bundle: Path | None = None
                      try:
          '''
          if old not in text:
              raise SystemExit("job activation anchor not found")
          text = text.replace(old, new, 1)

          old = '''            except Exception as exc:
                          error_class, retryable = self._classify_error(exc)
                          self.store.retry_or_fail(
          '''
          new = '''            except Exception as exc:
                          if bundle is not None:
                              bundle.unlink(missing_ok=True)
                          error_class, retryable = self._classify_error(exc)
                          self.store.retry_or_fail(
          '''
          if old not in text:
              raise SystemExit("bundle cleanup anchor not found")
          text = text.replace(old, new, 1)

          old = '''            finally:
                          self._observe_pool(job_id, None)
          '''
          new = '''            finally:
                          self._observe_pool(job_id, None)
                          self._set_job_active(job_id, False)
          '''
          if old not in text:
              raise SystemExit("job deactivation anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate scheduler lease hardening
        run: |
          uv sync --extra dev --extra agent
          uv run ruff format src/aspenops_nexus/scheduler.py tests/test_scheduler_active_leases.py
          uv run ruff check src/aspenops_nexus/scheduler.py tests/test_scheduler_active_leases.py tests/test_job_store_owner_fencing.py
          uv run mypy src/aspenops_nexus/scheduler.py
          uv run pytest tests/test_scheduler_active_leases.py tests/test_job_store_owner_fencing.py tests/test_scheduler.py tests/test_scheduler_edge_cases.py
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/apply-scheduler-active-leases.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/scheduler.py tests/test_scheduler_active_leases.py .github/workflows/apply-scheduler-active-leases.yml
          git commit -m "fix: cover scheduler lease across full execution"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
