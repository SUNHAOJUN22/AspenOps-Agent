name: One-shot format lease recovery tests

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/format-lease-recovery-tests.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-format-lease-recovery-tests
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Format and validate regression tests
        run: |
          uv sync --extra dev
          uv run ruff format tests/test_job_store_lease_recovery.py
          uv run ruff check tests/test_job_store_lease_recovery.py
          uv run pytest tests/test_job_store_lease_recovery.py
      - name: Commit normalized test and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/format-lease-recovery-tests.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add tests/test_job_store_lease_recovery.py \
            .github/workflows/format-lease-recovery-tests.yml
          git commit -m "style: normalize lease recovery tests"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
