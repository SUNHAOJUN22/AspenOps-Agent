name: Apply comprehensive skill-native V17
on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v17/payload.tar.gz
      - scripts/apply_tsao_skill_native_v17.py
      - .github/workflows/apply-tsao-skill-native-v17.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: aspenops-skill-native-v17
  cancel-in-progress: false
jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
      - name: Apply verified comprehensive payload
        run: python scripts/apply_tsao_skill_native_v17.py
      - name: Sync frozen environment after source materialization
        run: uv sync --frozen --extra dev --extra agent --extra signing
      - name: Validate the materialized Skill and run the full test suite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('.agents/skills/aspenops-acceptance-maintainer/SKILL.md'),
              Path('.agents/skills/aspenops-acceptance-maintainer/references/definition-of-done.md'),
              Path('assets/diagrams/vision-en.svg'),
              Path('assets/diagrams/vision-zh.svg'),
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing materialized Skill assets: {missing}')
          skill = required[0].read_text(encoding='utf-8')
          if not skill.startswith('---\n') or 'name: aspenops-acceptance-maintainer' not in skill[:1200]:
              raise SystemExit('invalid canonical AspenOps SKILL.md frontmatter')
          for path in required:
              text = path.read_text(encoding='utf-8')
              if '\ufffd' in text or '\x00' in text:
                  raise SystemExit(f'Unicode/source corruption in {path}')
          PY
          uv run pytest -q
      - name: Run permanent repository gates
        run: |
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-report=term-missing --cov-fail-under=95.0
          uv build
          uv run python scripts/check_mcp.py
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified source and remove one-shot payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v17 scripts/apply_tsao_skill_native_v17.py .github/workflows/apply-tsao-skill-native-v17.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected verified source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete AspenOps skill-native V17 remediation'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v17-failure.txt
          gh issue create --title 'V17 remediation workflow failed (run ${{ github.run_id }})' --body-file /tmp/v17-failure.txt
