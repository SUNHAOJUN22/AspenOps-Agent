name: Apply comprehensive skill-native V17
on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v17/payload.tar.gz
      - scripts/apply_tsao_skill_native_v17.py
      - .github/workflows/apply-tsao-skill-native-v17.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: aspenops-skill-native-v17
  cancel-in-progress: false
jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
      - name: Apply verified comprehensive payload
        run: python scripts/apply_tsao_skill_native_v17.py
      - name: Remove temporary and non-authoritative workflow surfaces
        shell: bash
        run: rm -f .github/workflows/agent-skill-portability.yml .github/workflows/apply-tsao-skill-native-v17.yml
      - name: Normalize materialized Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check . --fix --exit-zero 2>&1 | tee /tmp/v17-normalize-ruff.log
          uv run ruff format . 2>&1 | tee /tmp/v17-normalize-format.log
          git diff --check
      - name: Sync frozen environment
        run: uv sync --frozen --extra dev --extra agent --extra signing
      - name: Validate canonical Skill and bilingual assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('.agents/skills/aspenops-acceptance-maintainer/SKILL.md'),
              Path('.agents/skills/aspenops-acceptance-maintainer/references/definition-of-done.md'),
              Path('assets/diagrams/vision-en.svg'),
              Path('assets/diagrams/vision-zh.svg'),
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing materialized Skill assets: {missing}')
          skill = required[0].read_text(encoding='utf-8')
          if not skill.startswith('---\n') or 'name: aspenops-acceptance-maintainer' not in skill[:1200]:
              raise SystemExit('invalid canonical AspenOps SKILL.md frontmatter')
          for path in required:
              text = path.read_text(encoding='utf-8')
              if '\ufffd' in text or '\x00' in text:
                  raise SystemExit(f'Unicode/source corruption in {path}')
          PY
      - name: Run full repository tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/v17-pytest.log
      - name: Verify frozen lock
        run: uv lock --check
      - name: Ruff lint
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check . 2>&1 | tee /tmp/v17-ruff.log
      - name: Ruff formatting
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee /tmp/v17-ruff-format.log
      - name: Strict mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy src 2>&1 | tee /tmp/v17-mypy.log
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts
      - name: Branch coverage gate
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-report=term-missing --cov-fail-under=95.0 2>&1 | tee /tmp/v17-coverage.log
      - name: Build distributions
        shell: bash
        run: |
          set -o pipefail
          uv build 2>&1 | tee /tmp/v17-build.log
      - name: MCP surface check
        run: uv run python scripts/check_mcp.py
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified source and remove one-shot payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v17 scripts/apply_tsao_skill_native_v17.py
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected verified source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete AspenOps skill-native V17 remediation'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v17-failure.txt
          for log in /tmp/v17-*.log; do
            if [[ -f "$log" ]]; then
              printf '\n===== %s =====\n' "$(basename "$log")" >> /tmp/v17-failure.txt
              tail -n 220 "$log" >> /tmp/v17-failure.txt
            fi
          done
          gh issue create --title 'V17 remediation workflow failed (run ${{ github.run_id }})' --body-file /tmp/v17-failure.txt
