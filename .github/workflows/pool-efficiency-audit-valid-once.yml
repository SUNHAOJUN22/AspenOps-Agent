          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/pool-efficiency-audit-valid-once.yml
          INVALID=.github/workflows/pool-efficiency-audit-pass-once.yml
          E=var/pool-efficiency-audit-valid
          rm -rf "$E" dist /tmp/aspenops-pool-wheel
          mkdir -p "$E"
          rm -f "$SELF" "$INVALID" docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json

