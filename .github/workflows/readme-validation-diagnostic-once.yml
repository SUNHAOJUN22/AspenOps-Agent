name: Diagnose README qualification run once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-validation-diagnostic-once.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Read Actions state for README source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: c157f8ae5f5fd4125f872ad186e0c25a3efb91e2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AspenOps-readme-diagnostic',
          }
          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          runs_url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={source}&per_page=100'
          runs = get(runs_url).get('workflow_runs', [])
          compact = []
          for run in runs:
              jobs = get(run['jobs_url']).get('jobs', [])
              compact.append({
                  'id': run['id'],
                  'name': run['name'],
                  'path': run.get('path'),
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run.get('conclusion'),
                  'html_url': run['html_url'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'jobs': [
                      {
                          'id': job['id'],
                          'name': job['name'],
                          'status': job['status'],
                          'conclusion': job.get('conclusion'),
                          'started_at': job.get('started_at'),
                          'completed_at': job.get('completed_at'),
                          'failed_steps': [
                              step['name'] for step in job.get('steps', [])
                              if step.get('conclusion') == 'failure'
                          ],
                      }
                      for job in jobs
                  ],
              })
          payload = {
              'schema': 'aspenops.readme-validation-diagnostic/v1',
              'source_sha': source,
              'run_count': len(compact),
              'runs': compact,
          }
          Path('docs/README_VALIDATION_DIAGNOSTIC.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          lines = [
              '# README validation diagnostic',
              '',
              f'- source SHA: `{source}`;',
              f'- matching Actions runs: {len(compact)}.',
              '',
          ]
          for run in compact:
              lines.append(f"## {run['name']} — `{run['status']}` / `{run['conclusion']}`")
              lines.append('')
              lines.append(f"- run ID: `{run['id']}`;")
              lines.append(f"- workflow path: `{run['path']}`;")
              for job in run['jobs']:
                  suffix = ', failed steps: ' + ', '.join(job['failed_steps']) if job['failed_steps'] else ''
                  lines.append(
                      f"- job `{job['name']}`: `{job['status']}` / `{job['conclusion']}`{suffix}."
                  )
              lines.append('')
          Path('docs/README_VALIDATION_DIAGNOSTIC.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
      - name: Remove one-time workflows and publish diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/readme-validation-diagnostic-once.yml
          rm -f .github/workflows/validate-readme-main-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record README qualification diagnostic'
          git push origin HEAD:main
