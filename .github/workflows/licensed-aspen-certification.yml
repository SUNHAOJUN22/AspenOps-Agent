name: Licensed Aspen certification

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: Repository-relative licensed certification plan JSON
        required: true
        type: string
      expected_head_sha:
        description: Exact GITHUB_SHA approved for certification
        required: true
        type: string
      backend:
        description: Licensed simulator backend scoped by the plan
        required: true
        type: choice
        options:
          - aspen_plus
          - hysys
      approve_real_execution:
        description: Explicitly authorize licensed COM execution after preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: licensed-aspen-certification
  cancel-in-progress: false

jobs:
  dispatch-guard:
    name: Reject non-main manual dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require refs/heads/main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Licensed certification must be dispatched from refs/heads/main" >&2
            exit 2
          fi
          echo "Main workflow ref accepted"

  certify:
    needs: dispatch-guard
    name: licensed-${{ inputs.backend }}-certification
    runs-on: [self-hosted, windows, x64, aspen-licensed]
    environment: licensed-aspen-certification
    timeout-minutes: 480
    env:
      PLAN_PATH: ${{ inputs.plan_path }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXECUTION_APPROVED: ${{ inputs.approve_real_execution }}
    steps:
      - name: Prepare clean licensed artifact directory
        shell: pwsh
        run: |
          $artifactName = "aspenops-licensed-artifact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifactDir = Join-Path $env:RUNNER_TEMP $artifactName
          Remove-Item -LiteralPath $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "ref=$env:GITHUB_REF"
            "workflow_sha=$env:GITHUB_SHA"
            "expected_head_sha=$env:EXPECTED_HEAD_SHA"
          ) | Set-Content -LiteralPath (Join-Path $artifactDir "run-metadata.txt") -Encoding utf8

      - name: Checkout trusted workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatched revision and approved SHA
        shell: pwsh
        run: |
          $expected = $env:EXPECTED_HEAD_SHA.Trim().ToLowerInvariant()
          $workflowSha = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$') {
            throw "expected_head_sha must be a full lowercase 40-character Git SHA"
          }
          if ($workflowSha -notmatch '^[0-9a-f]{40}$') {
            throw "GITHUB_SHA must be a full lowercase 40-character Git SHA"
          }
          if ($expected -ne $workflowSha) {
            throw "expected_head_sha must equal the dispatched main GITHUB_SHA"
          }
          $observedBefore = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observedBefore -ne $workflowSha) {
            throw "Initial checkout does not match the dispatched workflow revision"
          }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch the trusted main branch"
          }
          git rev-parse --verify --end-of-options "$workflowSha^{commit}" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "GITHUB_SHA does not identify a commit"
          }
          git merge-base --is-ancestor $workflowSha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Dispatched workflow revision is not an ancestor of trusted main"
          }
          git checkout --detach $workflowSha
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to checkout the dispatched workflow revision"
          }
          $observed = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observed -ne $workflowSha) {
            throw "Checked-out commit does not match the dispatched workflow revision"
          }
          if ([string]::IsNullOrWhiteSpace($env:PLAN_PATH) -or $env:PLAN_PATH -match "[`r`n]") {
            throw "plan_path must be one non-empty line"
          }
          if ([System.IO.Path]::IsPathRooted($env:PLAN_PATH)) {
            throw "plan_path must be repository-relative"
          }
          $workspace = [System.IO.Path]::GetFullPath("${{ github.workspace }}")
          $plan = [System.IO.Path]::GetFullPath((Join-Path $workspace $env:PLAN_PATH))
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if (-not $plan.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "plan_path escapes the repository workspace"
          }
          if (-not (Test-Path -LiteralPath $plan -PathType Leaf)) {
            throw "Certification plan does not exist: $plan"
          }
          "PLAN_PATH=$plan" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Verify lockfile and sync frozen certification dependencies
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev --extra windows --extra agent --extra signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run isolated licensed control-plane regression gate
        shell: pwsh
        env:
          ASPENOPS_BACKEND: mock
          ASPENOPS_ALLOWED_ROOTS: ""
          ASPENOPS_STATE_DIR: ${{ github.workspace }}\var\licensed-regression
          ASPENOPS_LICENSE_SLOTS: "1"
          ASPENOPS_VISIBLE: "false"
          ASPENOPS_CACHE_FAILURES: "false"
        run: |
          $artifactName = "aspenops-licensed-artifact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifactDir = Join-Path $env:RUNNER_TEMP $artifactName
          $junit = Join-Path $artifactDir "licensed-software-regression.xml"
          uv run pytest -W error::ResourceWarning `
            tests/test_batch_backend_default.py `
            tests/test_cli_output_policy.py `
            tests/test_config_registry_edge_cases.py `
            tests/test_config_resource_budgets.py `
            tests/test_documentation_contracts.py `
            tests/test_artifact_upload_governance.py `
            tests/test_real_backend_state_policy.py `
            tests/test_licensed_path_gate.py `
            tests/test_licensed_bundle_integrity.py `
            tests/test_licensed_certification.py `
            tests/test_licensed_certification_cli.py `
            tests/test_licensed_certification_governance.py `
            tests/test_licensed_certification_remaining_edges.py `
            tests/test_licensed_certification_validation_edges.py `
            tests/test_licensed_certification_workflow.py `
            tests/test_aspen_process_ownership.py `
            tests/test_backends_convergence.py `
            tests/test_workflow_governance.py `
            tests/test_wheel_smoke_governance.py `
            --junitxml="$junit" `
            --durations=20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve licensed filesystem targets
        shell: pwsh
        env:
          ASPENOPS_ALLOWED_ROOTS: ${{ vars.ASPENOPS_ALLOWED_ROOTS }}
          ASPENOPS_STATE_DIR: ${{ vars.ASPENOPS_CERT_STATE_DIR }}
        run: |
          $raw = python scripts/validate_licensed_paths.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolved = $raw | ConvertFrom-Json
          $runScope = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidenceRoot = Join-Path $resolved.state_dir "licensed-certification"
          $evidenceDir = Join-Path $evidenceRoot $runScope
          Remove-Item -LiteralPath $evidenceDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          "PLAN_PATH=$($resolved.plan_path)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPENOPS_STATE_DIR=$($resolved.state_dir)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LICENSED_EVIDENCE_DIR=$evidenceDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run licensed certification preflight
        id: preflight
        shell: pwsh
        env:
          ASPENOPS_BACKEND: ${{ inputs.backend }}
          ASPENOPS_GIT_COMMIT: ${{ inputs.expected_head_sha }}
          ASPENOPS_ALLOWED_ROOTS: ${{ vars.ASPENOPS_ALLOWED_ROOTS }}
          ASPENOPS_LICENSE_SLOTS: ${{ vars.ASPENOPS_LICENSE_SLOTS }}
          ASPENOPS_LICENSE_SERVER_IDENTITY: ${{ vars.ASPENOPS_LICENSE_SERVER_IDENTITY }}
          ASPENOPS_LICENSE_FEATURES: ${{ vars.ASPENOPS_LICENSE_FEATURES }}
          ASPENOPS_CERT_SIGNING_KEY: ${{ secrets.ASPENOPS_CERT_SIGNING_KEY_PATH }}
          ASPENOPS_VISIBLE: "false"
          ASPENOPS_CACHE_FAILURES: "false"
        run: |
          uv run aspenops certification-preflight `
            "$env:PLAN_PATH" `
            --output "$env:LICENSED_EVIDENCE_DIR\preflight.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate explicit execution approval
        shell: pwsh
        run: |
          if ($env:EXECUTION_APPROVED -ne "true") {
            throw "Preflight completed, but licensed COM execution was not explicitly approved"
          }

      - name: Execute scoped licensed certification plan
        id: execute
        shell: pwsh
        env:
          ASPENOPS_BACKEND: ${{ inputs.backend }}
          ASPENOPS_GIT_COMMIT: ${{ inputs.expected_head_sha }}
          ASPENOPS_ALLOWED_ROOTS: ${{ vars.ASPENOPS_ALLOWED_ROOTS }}
          ASPENOPS_LICENSE_SLOTS: ${{ vars.ASPENOPS_LICENSE_SLOTS }}
          ASPENOPS_LICENSE_SERVER_IDENTITY: ${{ vars.ASPENOPS_LICENSE_SERVER_IDENTITY }}
          ASPENOPS_LICENSE_FEATURES: ${{ vars.ASPENOPS_LICENSE_FEATURES }}
          ASPENOPS_CERT_SIGNING_KEY: ${{ secrets.ASPENOPS_CERT_SIGNING_KEY_PATH }}
          ASPENOPS_VISIBLE: "false"
          ASPENOPS_CACHE_FAILURES: "false"
        run: |
          uv run aspenops certify-licensed `
            "$env:PLAN_PATH" `
            --output-dir "$env:LICENSED_EVIDENCE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify signed certification bundle
        id: verify
        shell: pwsh
        env:
          ASPENOPS_CERT_PUBLIC_KEY: ${{ vars.ASPENOPS_CERT_PUBLIC_KEY_PATH }}
        run: |
          uv run aspenops verify-licensed-bundle `
            "$env:LICENSED_EVIDENCE_DIR\licensed-certification-bundle.zip" `
            --public-key "$env:ASPENOPS_CERT_PUBLIC_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm status remains pending human certification review
        shell: pwsh
        run: |
          $reportPath = "$env:LICENSED_EVIDENCE_DIR\licensed-certification-report.json"
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.certification_status -ne "PENDING_REAL_ASPEN_CERTIFICATION") {
            throw "Runtime is not permitted to self-grant real Aspen certification"
          }

      - name: Stage and verify licensed evidence
        if: ${{ success() }}
        shell: pwsh
        run: |
          $artifactName = "aspenops-licensed-artifact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifactDir = Join-Path $env:RUNNER_TEMP $artifactName
          $regression = Join-Path $artifactDir "licensed-software-regression.xml"
          $preflight = "$env:LICENSED_EVIDENCE_DIR\preflight.json"
          $report = "$env:LICENSED_EVIDENCE_DIR\licensed-certification-report.json"
          $bundle = "$env:LICENSED_EVIDENCE_DIR\licensed-certification-bundle.zip"
          $required = @(
            @{ Label = "software regression JUnit"; Source = $regression },
            @{ Label = "preflight report"; Source = $preflight },
            @{ Label = "certification report"; Source = $report },
            @{ Label = "signed certification bundle"; Source = $bundle }
          )
          foreach ($item in $required) {
            $source = [string]$item.Source
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required licensed evidence is missing: $($item.Label)"
            }
            if ((Get-Item -LiteralPath $source).Length -le 0) {
              throw "Required licensed evidence is empty: $($item.Label)"
            }
          }

          $staging = Join-Path $artifactDir "licensed-evidence"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item -LiteralPath $preflight -Destination (Join-Path $staging "preflight.json")
          Copy-Item -LiteralPath $report -Destination (Join-Path $staging "report.json")
          Copy-Item -LiteralPath $bundle -Destination (Join-Path $staging "bundle.zip")
          foreach ($name in @("preflight.json", "report.json", "bundle.zip")) {
            $staged = Join-Path $staging $name
            if (-not (Test-Path -LiteralPath $staged -PathType Leaf)) {
              throw "Staged licensed evidence is missing: $name"
            }
            if ((Get-Item -LiteralPath $staged).Length -le 0) {
              throw "Staged licensed evidence is empty: $name"
            }
          }

      - name: Record licensed workflow outcome
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $artifactName = "aspenops-licensed-artifact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $artifactDir = Join-Path $env:RUNNER_TEMP $artifactName
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          @(
            "job_status=$env:JOB_STATUS"
            "licensed_evidence_dir=$env:LICENSED_EVIDENCE_DIR"
          ) | Add-Content -LiteralPath (Join-Path $artifactDir "run-metadata.txt") -Encoding utf8

      - name: Upload signed licensed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licensed-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aspenops-licensed-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
