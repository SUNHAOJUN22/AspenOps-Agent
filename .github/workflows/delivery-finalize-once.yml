# One-time, source-only finalizer for deterministic delivery packaging.
name: Delivery finalization once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delivery-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-delivery-finalization-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply, qualify and publish deterministic delivery support
        shell: bash
        run: |
          set +e
          set -uo pipefail
          source_sha="$(git rev-parse HEAD)"
          log=/tmp/delivery-finalization.log
          : > "$log"
          status=0

          run_gate() {
            if [[ "$status" -ne 0 ]]; then
              return 0
            fi
            printf '\n>>> %q' "$1" | tee -a "$log"
            printf ' %q' "${@:2}" | tee -a "$log"
            printf '\n' | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            local rc=${PIPESTATUS[0]}
            if [[ "$rc" -ne 0 ]]; then
              status=$rc
            fi
            return 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"schema":"aspenops.delivery-finalization-running/v1","run_id":"%s","source_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$source_sha" > docs/DELIVERY_FINALIZATION_RUNNING.json
          git add docs/DELIVERY_FINALIZATION_RUNNING.json
          git commit -m "ci: mark delivery finalization running"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$source_sha" ]]; then
            echo "main advanced before delivery finalization heartbeat" >&2
            exit 2
          fi
          git push origin HEAD:main
          heartbeat_sha="$(git rev-parse HEAD)"

          run_gate python -c 'import base64,gzip; from pathlib import Path; data=Path("scripts/delivery_finish_payload.b64").read_text(encoding="ascii").strip(); Path("/tmp/apply_delivery_bundle_finish.py").write_bytes(gzip.decompress(base64.b64decode(data)))'
          run_gate python /tmp/apply_delivery_bundle_finish.py
          run_gate rm -f scripts/delivery_finish_payload.b64
          run_gate rm -f .github/workflows/delivery-finalize-once.yml
          run_gate rm -f docs/DELIVERY_FINALIZATION_RUNNING.json
          run_gate rm -f docs/DELIVERY_FINALIZATION_DIAGNOSTIC.txt
          run_gate rm -f /tmp/apply_delivery_bundle_finish.py

          run_gate mkdir -p var
          run_gate uv lock --check
          run_gate uv sync --frozen --extra dev --extra agent --extra signing
          run_gate uv run ruff format src scripts tests
          run_gate uv run ruff check .
          run_gate uv run ruff format --check .
          run_gate uv run mypy src
          run_gate uv run python -m compileall -q src scripts tests
          run_gate uv run python scripts/audit_source_tree.py --output var/source-tree-audit.json
          run_gate uv tool run --isolated --from bandit==1.9.4 bandit --recursive src scripts --severity-level high --confidence-level high --format json --output var/bandit.json
          run_gate uv run python scripts/verify_delivery.py --output var/delivery-acceptance.json
          run_gate uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-report=term-missing --cov-report=json:var/delivery-coverage.json --junitxml=var/delivery-junit.xml --cov-fail-under=95.0
          run_gate uv run python scripts/run_test_order_gate.py --seed 20260728 --output-dir var/delivery-order
          run_gate uv build
          run_gate uv run python scripts/build_delivery_bundle.py --source-sha "$source_sha" --source-date-epoch 0 --include-dist --output-dir var/delivery-package
          run_gate bash -c 'cd var/delivery-package && sha256sum -c SHA256SUMS'
          run_gate bash -c 'cd var/delivery-package && sha256sum -c aspenops-handover-*.zip.sha256'

          qualified_tree_sha=""
          if [[ "$status" -eq 0 ]]; then
            git add -A
            qualified_tree_sha="$(git write-tree)"
            SOURCE_SHA="$source_sha" QUALIFIED_TREE_SHA="$qualified_tree_sha" python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage = json.loads(
              Path("var/delivery-coverage.json").read_text(encoding="utf-8")
          )["totals"]["percent_covered"]
          root = ET.parse("var/delivery-junit.xml").getroot()
          suites = [root] if root.tag.endswith("testsuite") else list(root)
          tests = sum(int(item.attrib.get("tests", 0)) for item in suites)
          failures = sum(int(item.attrib.get("failures", 0)) for item in suites)
          errors = sum(int(item.attrib.get("errors", 0)) for item in suites)
          skipped = sum(int(item.attrib.get("skipped", 0)) for item in suites)
          package_files = sorted(
              path.name for path in Path("var/delivery-package").iterdir() if path.is_file()
          )
          evidence = {
              "schema": "aspenops.delivery-qualification/v2",
              "status": "PASS",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "validated_source_parent": os.environ["SOURCE_SHA"],
              "qualified_content_tree_sha": os.environ["QUALIFIED_TREE_SHA"],
              "python": "3.12",
              "passed": tests - failures - errors - skipped,
              "failed": failures,
              "errors": errors,
              "skipped": skipped,
              "branch_coverage_percent": round(float(coverage), 2),
              "reverse_order_gate": "PASS",
              "seeded_order_gate": {"status": "PASS", "seed": 20260728},
              "static_gates": {
                  "ruff": "PASS",
                  "ruff_format": "PASS",
                  "mypy_strict": "PASS",
                  "compileall": "PASS",
                  "source_tree_audit": "PASS",
                  "bandit_high_high": "PASS",
                  "delivery_verifier": "PASS",
                  "deterministic_delivery_builder": "PASS",
                  "sha256_verification": "PASS",
                  "build": "PASS",
              },
              "delivery_package_files": package_files,
              "real_aspen_status": "PENDING_REAL_ASPEN_CERTIFICATION",
          }
          Path("docs/DELIVERY_QUALIFICATION.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
            git add docs/DELIVERY_QUALIFICATION.json
            git diff --check || status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            git checkout "$heartbeat_sha" -- .github/workflows/delivery-finalize-once.yml
            rm -f docs/DELIVERY_FINALIZATION_RUNNING.json
            rm -f docs/DELIVERY_FINALIZATION_DIAGNOSTIC.txt
            rm -f scripts/delivery_finish_payload.b64
            git add -A
            git commit -m "feat: complete deterministic delivery handover"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$heartbeat_sha" ]]; then
              echo "main advanced during delivery finalization" >&2
              exit 2
            fi
            git push origin HEAD:main
            exit 0
          fi

          cp "$log" /tmp/delivery-finalization-failure.log
          git reset --hard "$heartbeat_sha"
          rm -f docs/DELIVERY_FINALIZATION_RUNNING.json
          printf 'delivery finalization failed with status %s\n\n' "$status" \
            > docs/DELIVERY_FINALIZATION_DIAGNOSTIC.txt
          tail -n 2400 /tmp/delivery-finalization-failure.log \
            >> docs/DELIVERY_FINALIZATION_DIAGNOSTIC.txt
          git add -A
          git commit -m "test: record delivery finalization diagnostic"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$heartbeat_sha" ]]; then
            echo "main advanced before delivery diagnostic publication" >&2
            exit 2
          fi
          git push origin HEAD:main
          exit "$status"
      - name: Upload delivery finalization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: var
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
