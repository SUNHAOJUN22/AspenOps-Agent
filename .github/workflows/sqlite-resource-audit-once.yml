name: AspenOps SQLite Resource Audit Once

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: aspenops-comprehensive-code-closure
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.title == 'ASPENOPS_SQLITE_RESOURCE_AUDIT_20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - name: Audit SQLite connection lifetime
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python 3.13 --frozen --extra dev --extra agent --extra signing
          cp .github/sqlite-resource-audit.py.txt /tmp/sqlite-resource-audit.py
          python /tmp/sqlite-resource-audit.py
          rm -f .github/sqlite-resource-audit.py.txt .github/workflows/sqlite-resource-audit-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: record SQLite resource lifetime audit'
          git push origin HEAD:main
