name: Publish authoritative README qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-readme-qualification-once.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 7403663b24a2bd9fff6452b7d537f59933e53c22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Collect authoritative CI and Windows evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import os
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AspenOps-authoritative-README-qualification',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def get_bytes(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          required = {
              '.github/workflows/ci.yml',
              '.github/workflows/windows-control-plane.yml',
          }
          deadline = time.monotonic() + 900
          selected = {}
          while True:
              url = (
                  f'https://api.github.com/repos/{repo}/actions/runs'
                  f'?head_sha={source}&event=push&per_page=100'
              )
              runs = get_json(url).get('workflow_runs', [])
              selected = {
                  run.get('path'): run
                  for run in runs
                  if run.get('path') in required
              }
              if required <= selected.keys() and all(
                  selected[path]['status'] == 'completed' for path in required
              ):
                  break
              if time.monotonic() >= deadline:
                  raise TimeoutError(f'Authoritative runs incomplete: {selected}')
              time.sleep(15)

          ci_run = selected['.github/workflows/ci.yml']
          windows_run = selected['.github/workflows/windows-control-plane.yml']
          runs_ok = (
              ci_run.get('conclusion') == 'success'
              and windows_run.get('conclusion') == 'success'
          )

          jobs = {}
          for label, run in (('ci', ci_run), ('windows', windows_run)):
              job_payload = get_json(run['jobs_url'])
              jobs[label] = [
                  {
                      'id': job['id'],
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job.get('conclusion'),
                      'failed_steps': [
                          step['name']
                          for step in job.get('steps', [])
                          if step.get('conclusion') == 'failure'
                      ],
                  }
                  for job in job_payload.get('jobs', [])
              ]

          artifact_payload = get_json(ci_run['artifacts_url'])
          artifacts = artifact_payload.get('artifacts', [])
          matrix = {}
          for version in ('3.11', '3.12', '3.13'):
              prefix = f"ci-evidence-python-{version}-{ci_run['id']}-"
              matches = [item for item in artifacts if item['name'].startswith(prefix)]
              if len(matches) != 1:
                  raise RuntimeError(
                      f'Expected one Python {version} artifact; found {len(matches)}'
                  )
              archive = zipfile.ZipFile(
                  io.BytesIO(get_bytes(matches[0]['archive_download_url']))
              )
              names = archive.namelist()
              junit_name = next(
                  name for name in names if name.endswith(f'junit-{version}.xml')
              )
              coverage_name = next(
                  name for name in names if name.endswith(f'coverage-{version}.json')
              )
              root = ET.fromstring(archive.read(junit_name))
              suites = [root] if root.tag.endswith('testsuite') else list(root)
              tests = sum(int(item.attrib.get('tests', 0)) for item in suites)
              failures = sum(int(item.attrib.get('failures', 0)) for item in suites)
              errors = sum(int(item.attrib.get('errors', 0)) for item in suites)
              skipped = sum(int(item.attrib.get('skipped', 0)) for item in suites)
              coverage = json.loads(archive.read(coverage_name))
              matrix[version] = {
                  'tests_passed': tests - failures - errors - skipped,
                  'failures': failures,
                  'errors': errors,
                  'skipped': skipped,
                  'branch_coverage_percent': round(
                      float(coverage['totals']['percent_covered']), 2
                  ),
              }

          matrix_ok = all(
              row['failures'] == 0 and row['errors'] == 0
              for row in matrix.values()
          )
          success = runs_ok and matrix_ok
          payload = {
              'schema': 'aspenops.readme-visual-refresh-qualification/v1',
              'decision': 'PASS' if success else 'BLOCKED',
              'branch_policy': 'MAIN_ONLY',
              'validated_source_sha': source,
              'ci_run_id': ci_run['id'],
              'windows_run_id': windows_run['id'],
              'conclusions': {
                  'ci': ci_run.get('conclusion'),
                  'windows': windows_run.get('conclusion'),
              },
              'python_matrix': matrix,
              'python_312_order_independence': (
                  'PASS' if ci_run.get('conclusion') == 'success' else 'BLOCKED'
              ),
              'visual_assets': 22,
              'featured_visuals': 12,
              'real_simulator_status': 'PENDING_REAL_ASPEN_CERTIFICATION',
              'jobs': jobs,
          }
          docs = Path('docs')
          docs.mkdir(exist_ok=True)
          (docs / 'README_VISUAL_REFRESH_VALIDATION.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          lines = [
              '# README AI visual refresh qualification',
              '',
              f"## Decision: `{payload['decision']}`",
              '',
              f"- validated source: `{source}`;",
              f"- Linux CI: `{ci_run['id']}` / `{ci_run.get('conclusion')}`;",
              f"- Windows: `{windows_run['id']}` / `{windows_run.get('conclusion')}`;",
              '- branch policy: `MAIN_ONLY`;',
              '- visual assets: 22 self-contained SVG files; featured atlas: 12;',
              '- real Aspen/HYSYS: `PENDING_REAL_ASPEN_CERTIFICATION`.',
              '',
              '| Python | Passed | Failed | Errors | Skipped | Branch coverage |',
              '|---|---:|---:|---:|---:|---:|',
          ]
          for version, row in matrix.items():
              lines.append(
                  f"| {version} | {row['tests_passed']} | {row['failures']} | "
                  f"{row['errors']} | {row['skipped']} | "
                  f"{row['branch_coverage_percent']:.2f}% |"
              )
          lines.extend(
              [
                  '',
                  'Python 3.12 reverse-order and fixed-seed order gates are part of the CI run.',
                  '',
                  'This report validates software and documentation contracts only. It does not '
                  'certify commercial Aspen thermodynamics, topology or engineering acceptance.',
              ]
          )
          (docs / 'README_VISUAL_REFRESH_VALIDATION.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )

          start = '<!-- README_VISUAL_REFRESH_VALIDATION:START -->'
          end = '<!-- README_VISUAL_REFRESH_VALIDATION:END -->'
          zh = '\n'.join(
              [
                  start,
                  '',
                  '### 本次 AI README 自动验证',
                  '',
                  f"- 验证源码：`{source}`；",
                  f"- Linux CI：`{ci_run['id']}`；Windows：`{windows_run['id']}`；",
                  f"- Python 3.11/3.12/3.13：分别 "
                  f"{matrix['3.11']['tests_passed']} / "
                  f"{matrix['3.12']['tests_passed']} / "
                  f"{matrix['3.13']['tests_passed']} passed；",
                  '- 二十二张自包含 SVG 与十二图视觉导航：通过资产合同；',
                  '- 真实 Aspen/HYSYS：`PENDING_REAL_ASPEN_CERTIFICATION`。',
                  '',
                  end,
              ]
          )
          en = '\n'.join(
              [
                  start,
                  '',
                  '### Automated AI README validation',
                  '',
                  f"- validated source: `{source}`;",
                  f"- Linux CI: `{ci_run['id']}`; Windows: `{windows_run['id']}`;",
                  f"- Python 3.11/3.12/3.13: "
                  f"{matrix['3.11']['tests_passed']} / "
                  f"{matrix['3.12']['tests_passed']} / "
                  f"{matrix['3.13']['tests_passed']} passed;",
                  '- twenty-two SVG assets and the twelve-diagram atlas passed asset contracts;',
                  '- real Aspen/HYSYS: `PENDING_REAL_ASPEN_CERTIFICATION`.',
                  '',
                  end,
              ]
          )

          def insert(path: Path, block: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  re.escape(start) + r'.*?' + re.escape(end), re.DOTALL
              )
              if pattern.search(text):
                  text = pattern.sub(block, text, count=1)
              else:
                  anchor = '<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:END -->'
                  index = text.find(anchor)
                  if index < 0:
                      raise RuntimeError(f'Qualification anchor missing in {path}')
                  index += len(anchor)
                  text = text[:index] + '\n\n' + block + text[index:]
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

          insert(Path('README.md'), zh)
          insert(Path('README.en.md'), en)
          if not success:
              raise SystemExit('Authoritative README qualification is blocked')
          PY
      - name: Verify reports and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-readme-qualification-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: publish authoritative AI README qualification'
          git push origin HEAD:main
