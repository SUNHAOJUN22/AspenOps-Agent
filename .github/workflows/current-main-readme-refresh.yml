name: Current-main README and visual refresh

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: current-main-readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '/refresh-current-main-readme-v2'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Generate bilingual README sections and code-bound visuals
        run: python scripts/refresh_current_main_readme.py --write
      - name: Verify deterministic visual and UTF-8 contracts
        run: python scripts/refresh_current_main_readme.py --check
      - name: Run repository documentation gates
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py \
            tests/test_process_ir.py \
            -q
          git diff --check
      - name: Commit generated README and visual assets
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add README.md README.en.md docs/CURRENT_MAIN_ACCEPTANCE.md docs/current-main
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh current-main bilingual acceptance design'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish refresh result to issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          gh issue comment "$ISSUE" --body "CURRENT_MAIN_README_REFRESH_V2 outcome=${OUTCOME} changed=${CHANGED:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
