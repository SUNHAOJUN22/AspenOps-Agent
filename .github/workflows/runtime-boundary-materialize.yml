name: Materialize runtime boundary hardening

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: runtime-boundary-materialize-v1
  cancel-in-progress: false

env:
  PATCH_SOURCE_SHA: 332dc5dea9a28466a0dd3c62135d3b697760e58e

jobs:
  materialize:
    if: github.event.issue.title == 'ASPENOPS_RUNTIME_BOUNDARY_MATERIALIZE_V1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          source = os.environ["PATCH_SOURCE_SHA"]
          payload = "".join(
              subprocess.check_output(
                  ["git", "show", f"{source}:.github/runtime-hardening-parts/part-{index:02d}"],
                  text=True,
              )
              for index in range(6)
          )
          payload = payload.replace(
              "ROOT = Path(__file__).resolve().parents[1]",
              "ROOT = Path.cwd().resolve()",
              1,
          )
          old = "    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f\"{path}: expected one patch target, found {count}: {old[:80]!r}\")\n"
          new = "    count = text.count(old)\n    allowed_duplicate = (\n        (path == \"src/aspenops_nexus/batch.py\" and old == '    root = _object(data, \"Batch request\")\\n' and count == 2)\n        or (path == \"src/aspenops_nexus/worker.py\" and old == '        generation=generation,\\n' and count == 2)\n    )\n    if count != 1 and not allowed_duplicate:\n        raise RuntimeError(f\"{path}: expected one patch target, found {count}: {old[:80]!r}\")\n"
          if payload.count(old) != 1:
              raise SystemExit("replace_once guard marker is not unique")
          payload = payload.replace(old, new, 1)
          Path("/tmp/apply-runtime-boundary-hardening.py").write_text(
              payload,
              encoding="utf-8",
          )
          PY
          python /tmp/apply-runtime-boundary-hardening.py
          rm -f .github/workflows/runtime-boundary-materialize.yml
          rm -f docs/runtime-boundary-hardening-blocker.json
      - name: Static and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          uv run --python 3.12 ruff check --fix --unsafe-fixes .
          uv run --python 3.12 ruff format .
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          uv run --python 3.12 mypy src
          uv run --python 3.12 python -m compileall -q src scripts
          uv run --python 3.12 python scripts/audit_source_tree.py
          uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_runtime_boundary_hardening.py \
            tests/test_mcp.py tests/test_mcp_tools.py \
            tests/test_backend_adapter_edges.py \
            tests/test_hysys_convergence_contracts.py \
            tests/test_worker_contracts.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_models_strict_contracts.py \
            tests/test_batch_resource_limits.py \
            tests/test_units.py tests/test_config_registry_edge_cases.py
      - name: Commit source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden runtime execution boundaries"
          git push origin HEAD:main
