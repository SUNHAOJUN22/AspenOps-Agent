name: One-shot single-main consolidation

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-single-main-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.repository == 'SUNHAOJUN22/AspenOps-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete every remote branch except main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mkdir -p var/consolidation

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[].ref' | sort -u > var/consolidation/refs-before.txt
          : > var/consolidation/deleted-branches.txt

          while IFS= read -r ref; do
            [[ -n "$ref" ]] || continue
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue

            encoded_ref="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote('heads/' + sys.argv[1], safe=''))
          PY
          )"
            gh api --method DELETE "repos/$repo/git/refs/$encoded_ref"
            printf '%s\n' "$branch" | tee -a var/consolidation/deleted-branches.txt
          done < var/consolidation/refs-before.txt

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[].ref' | sort -u > var/consolidation/refs-after.txt

          if [[ "$(cat var/consolidation/refs-after.txt)" != "refs/heads/main" ]]; then
            echo "Unexpected refs remain after cleanup:" >&2
            cat var/consolidation/refs-after.txt >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          before = Path('var/consolidation/refs-before.txt').read_text().splitlines()
          after = Path('var/consolidation/refs-after.txt').read_text().splitlines()
          deleted = Path('var/consolidation/deleted-branches.txt').read_text().splitlines()
          payload = {
              'schema': 'aspenops.single-main-consolidation/v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'main_sha_at_cleanup': os.environ['GITHUB_SHA'],
              'before': before,
              'deleted': deleted,
              'after': after,
              'status': 'PASS' if after == ['refs/heads/main'] else 'FAIL',
          }
          Path('var/consolidation/result.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload consolidation evidence
        uses: actions/upload-artifact@v4
        with:
          name: single-main-consolidation-evidence
          path: var/consolidation
          if-no-files-found: error
          retention-days: 90

      - name: Remove this one-shot workflow from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path=".github/workflows/one-shot-main-consolidation.yml"
          sha="$(gh api "repos/$repo/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$repo/contents/$path" \
            -f message='chore: remove completed single-main consolidation workflow' \
            -f sha="$sha" \
            -f branch='main'
