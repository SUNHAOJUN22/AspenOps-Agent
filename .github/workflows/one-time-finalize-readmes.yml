## 配置边界

AspenOps 2.0 的公开交付合同是 `aspenops-nexus 2.0.0`。支持的验收平台为 Linux 与 Windows：永久质量工作流使用 `ubuntu-24.04`，控制面与真实 COM 预检使用 `windows-2025`。测试矩阵覆盖 Python 3.11、3.12、3.13，形成六种 Python/平台组合；真实 Aspen Plus/HYSYS 执行仍要求经许可的 Windows 主机。

固定工具链为 `uv 0.11.16`，依赖解析边界为 `mcp>=1.9,<2`。安装必须使用：

```bash
git clone https://github.com/SUNHAOJUN22/AspenOps-Agent.git
cd AspenOps-Agent
uv lock --check
uv sync --frozen --extra dev --extra agent --extra signing
```

## 配置与路径安全策略

默认 `.env.example` 使用 Mock 后端。真实模型、registry、state 和输出路径必须位于显式允许根中；持久任务在提交时记录 `paths_pinned` 与 `submission_cwd`，避免调度器工作目录变化后重新解释相对路径。JSON 序列化固定 `allow_nan=False`，重复键、NaN、Infinity、越界路径与不平衡配置均 fail closed。

## 原生适配器一致性门

原生适配器必须通过 manifest、输入/输出 Schema、单位、错误隔离与确定性结果对照。适配器一致性只证明软件接口实现，不证明客户模型、商业求解器或工程结论。DWSIM 与 IDAES 仅处于 `planned` 路线，当前无生产适配器；`aspenops.flowsheet/v1` 的未实现能力不得被自动升级。

```bash
uv run aspenops doctor --probe
uv run python scripts/validate_process_ir.py examples/process-intent.example.json
```

生成的 `process-ir-dashboard.html` 是合同可视化，不是模拟结果。

## 快速开始

```bash
uv run aspenops demo
uv run aspenops dry-run examples/request.example.json
uv run aspenops run-batch examples/request.example.json --output var/results.json --bundle var/run-bundle.zip
uv run aspenops verify-bundle var/run-bundle.zip
```

## 独立有效性门

一个运行只有在通信、引擎、收敛、有限值、约束和衡算全部成立时才可进入审查。稳定原因码包括 `constraint_non_finite` 与 `balance_non_finite`。进程退出码、COM 返回或缓存命中均不能替代这些门。

\[
OK=C_{comm}\land C_{engine}\land C_{conv}\land C_{finite}\land C_{constraint}\land C_{balance}.
\]

## 典型工作流

```bash
uv run aspenops submit examples/request.example.json
JOB_ID=$(uv run aspenops submit examples/request.example.json | python -c "import json,sys; print(json.load(sys.stdin)['job_id'])")
uv run aspenops job "$JOB_ID"
uv run aspenops cancel "$JOB_ID" --grace-s 2
uv run aspenops scheduler
uv run aspenops optimize examples/optimization-request.example.json
```

## MCP 兼容性与服务生命周期

MCP SDK 固定在 `mcp>=1.9,<2`，当前锁文件解析到受测试的 v1 运行时。服务 lifespan 拥有调度器的启动、关闭与异常回收；MCP 面不会公开真实 Aspen 认证或绕过显式执行权限。

```bash
uv run aspenops mcp
```

## 约束优化闭环

优化器按预算生成批次，保留可行性优先顺序、原子 checkpoint 与 Pareto 档案。外部求解失败、非有限目标或工程约束失败均不能被“最优分数”覆盖。

## 调度与恢复

持久任务状态包括 `retry_wait` 与 `dead_letter`。租约、心跳、取消截止、worker 崩溃和幂等提交均有事务边界；暖启动轨迹必须串行并固定到单一 worker。

## 缓存、批内去重与单航班

相同不可变请求可使用 `same_batch_dedup`、持久缓存和 `inflight_singleflight`。缓存身份绑定 runtime、模型、registry 与物理请求；失败默认不缓存，返回对象必须深度隔离。

## Worker 所有权与回收

每个 Windows worker 独占其 COM 会话、私有模型副本和 job scope。point budget、age、timeout、protocol error、tainted state 或 cancellation deadline 会触发可验证回收。

## 性能工程与证据

控制面性能证据由以下脚本生成：

```bash
uv run python scripts/measure_cli_startup.py --output var/ci/cli-startup.json
uv run python scripts/measure_operation_counts.py --output var/ci/operation-counts.json
uv run python scripts/measure_job_store_queries.py --output var/ci/job-store-query-plan.json
uv run python scripts/render_test_dashboard.py --input-dir var/ci --output-html var/ci/test-dashboard.html --output-svg var/ci/test-dashboard.svg
```

对应工件为 `cli-startup.json`、`operation-counts.json` 与 `job-store-query-plan.json`；解释规则见 Performance Audit V2。临时证据只写入 `RUNNER_TEMP`/`${{ runner.temp }}`，上传名包含 `github.run_id` 和 `github.run_attempt`，以免早期失败发布旧工件。

## 工业应用场景

支持批量流程参数扫描、受约束优化、牌号切换、故障复算和受控数字孪生交接。软件只提供执行与证据基础设施，不替代流程工程师、HAZOP/LOPA/SIL、客户模型批准、许可证或现场运行授权。

## 证据包完整性与真实性

`ci.yml`、`windows-control-plane.yml`、`generate-performance-evidence.yml` 和 `licensed-aspen-certification.yml` 是永久工作流。手动证据生产仅接受 `refs/heads/main`；dispatch guard 在 checkout 前检查 ref，不满足时显式失败并返回 status 2，禁止 all-skipped 假绿。候选和基线随后以 detached worktree 验证，固定 `actions/checkout` 修订。

真实许可认证采用 `licensed-aspen-certification` 环境，要求 `expected_head_sha == GITHUB_SHA`，并记录 `GITHUB_RUN_ID`、`GITHUB_RUN_ATTEMPT`、`LICENSED_EVIDENCE_DIR`、`run-metadata.txt`、`job_status` 与 `aspenops-licensed-artifact`。上传设置 `if-no-files-found: error`，目录位于 `runner.temp`，所有真实 Aspen 任务串行执行。

当前公开结果属于**已验证归档基线**，不是对任意后续提交的自动声明。没有新的真实许可运行、Golden Case、工程审批和签名证据时，状态保持 `PENDING_REAL_ASPEN_CERTIFICATION`。

## 项目结构

核心代码位于 `src/aspenops_nexus/`；测试位于 `tests/`；治理脚本位于 `scripts/`；永久工作流位于 `.github/workflows/`；二十三幅 AI-assisted SVG 位于 `docs/assets/readme/`。图示解释代码架构，不是科学数据。

