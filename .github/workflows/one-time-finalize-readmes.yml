The public delivery identity is `aspenops-nexus 2.0.0`. Linux and Windows are the qualified platforms: permanent quality jobs use `ubuntu-24.04`, while Windows control-plane and licensed COM preflight use `windows-2025`. Python 3.11, 3.12 and 3.13 are covered across six platform/version combinations. Real Aspen Plus/HYSYS execution still requires a licensed Windows host.

The frozen toolchain uses `uv 0.11.16` and `mcp>=1.9,<2`:

```bash
git clone https://github.com/SUNHAOJUN22/AspenOps-Agent.git
