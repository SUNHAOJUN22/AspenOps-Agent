## MCP compatibility and server lifecycle

The SDK boundary is `mcp>=1.9,<2`. The lifespan owns scheduler startup, shutdown and exception cleanup. MCP never exposes licensed certification or a bypass around explicit execution authorization.

```bash
uv run aspenops mcp
```

## Constrained optimization lifecycle

The optimizer preserves evaluation budgets, Deb-style feasibility ordering, atomic checkpoints and Pareto archives. Solver failures, non-finite objectives and engineering violations cannot be hidden by a favorable objective value.

## Scheduling and recovery

Durable states include `retry_wait` and `dead_letter`. Leases, heartbeats, cancellation deadlines, crash recovery and idempotent result commits are transactional. Warm-start trajectories are serial and pinned to one worker.

## Cache, batch deduplication and singleflight

Identical immutable requests may use `same_batch_dedup`, persistent cache and `inflight_singleflight`. Identity binds runtime, model, registry and physical request. Failures are not cached by default and returned values remain deeply isolated.

## Worker ownership and recycling

Each Windows worker owns one COM session, private model snapshot and job scope. Point budget, age, timeout, protocol failure, taint or cancellation deadline triggers verified recycling.

## Performance engineering and evidence

```bash
uv run python scripts/measure_cli_startup.py --output var/ci/cli-startup.json
uv run python scripts/measure_operation_counts.py --output var/ci/operation-counts.json
uv run python scripts/measure_job_store_queries.py --output var/ci/job-store-query-plan.json
uv run python scripts/render_test_dashboard.py --input-dir var/ci --output-html var/ci/test-dashboard.html --output-svg var/ci/test-dashboard.svg
```

The governed artifacts are `cli-startup.json`, `operation-counts.json` and `job-store-query-plan.json`; see Performance Audit V2. Current-run evidence is isolated under `RUNNER_TEMP`/`${{ runner.temp }}`. Artifact names include `github.run_id` and `github.run_attempt`, so an early failure cannot publish stale files.

## Industrial use cases

The control plane supports batch process scans, constrained optimization, grade transitions, failure replay and governed digital-twin handoff. It does not replace process engineering, HAZOP/LOPA/SIL, customer model approval, licensing or plant authorization.

## Evidence bundle integrity and authenticity

Permanent workflows are `ci.yml`, `windows-control-plane.yml`, `generate-performance-evidence.yml` and `licensed-aspen-certification.yml`. Manual evidence production explicitly rejects non-main dispatches: only `refs/heads/main` is accepted, and the dispatch guard fails explicitly with exit code 2 before checkout rather than producing an all-skipped run. Candidate and baseline revisions are then validated in detached worktrees using a pinned `actions/checkout` revision.

The `licensed-aspen-certification` environment requires `expected_head_sha == GITHUB_SHA` and records `GITHUB_RUN_ID`, `GITHUB_RUN_ATTEMPT`, `LICENSED_EVIDENCE_DIR`, `run-metadata.txt`, `job_status` and `aspenops-licensed-artifact`. Uploads use `if-no-files-found: error`, are isolated under `runner.temp`, and licensed Aspen runs remain serial.

The published result is an **archived validated baseline**, not an automatic claim for arbitrary later commits. Without a new licensed run, Golden Case, engineering review and signed evidence, status remains `PENDING_REAL_ASPEN_CERTIFICATION`.

## Repository structure

Runtime code is in `src/aspenops_nexus/`, tests in `tests/`, governance utilities in `scripts/`, permanent workflows in `.github/workflows/`, and twenty-three AI-assisted SVGs in `docs/assets/readme/`. These diagrams explain software architecture and are not scientific data.

## Troubleshooting

Run `uv run aspenops doctor --probe`, then inspect allowed roots, registry SHA, model identity, licenses, worker generation, state database and evidence bundle. Never suppress a failing test, relax a tolerance or reinterpret non-convergence as success.

