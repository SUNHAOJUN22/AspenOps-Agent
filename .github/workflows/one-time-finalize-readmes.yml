The first run uses the Mock backend. Real model, registry, state and output paths must remain inside explicit allowed roots. Durable submission records `paths_pinned` and `submission_cwd`. JSON uses `allow_nan=False`; duplicate keys, non-finite values, escaping paths and malformed configuration fail closed.

## Native adapter conformance gate

A native adapter must pass manifest, Schema, unit, failure-isolation and deterministic-reference checks. This qualifies an interface, not a customer model or engineering conclusion. DWSIM and IDAES remain `planned`; there is no adapter for those engines. The `aspenops.flowsheet/v1` boundary is explicit and unavailable operations are reported as having no adapter.

```bash
uv run aspenops doctor --probe
uv run python scripts/validate_process_ir.py examples/process-intent.example.json
