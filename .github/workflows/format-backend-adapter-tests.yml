name: One-shot format backend adapter tests

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/format-backend-adapter-tests.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-format-backend-adapters
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync locked development dependencies
        run: uv sync --extra dev
      - name: Apply repository formatter
        run: uv run ruff format tests/test_backend_adapter_edges.py
      - name: Commit formatted test and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/format-backend-adapter-tests.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add tests/test_backend_adapter_edges.py \
            .github/workflows/format-backend-adapter-tests.yml
          git commit -m "style: format backend adapter contract tests"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
