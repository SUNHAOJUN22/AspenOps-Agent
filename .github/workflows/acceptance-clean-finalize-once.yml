name: Remove temporary acceptance branch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acceptance-clean-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-remove-temporary-branch
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Delete temporary reference
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete tmp-do-not-use
