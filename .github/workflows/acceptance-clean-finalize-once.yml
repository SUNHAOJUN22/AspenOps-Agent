name: Finalize clean acceptance hardening once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acceptance-clean-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-clean-acceptance-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Patch, qualify and publish clean tree
        shell: bash
        run: |
          set -uo pipefail
          trigger_sha="$(git rev-parse HEAD)"
          log=/tmp/acceptance-clean-finalizer.log
          : > "$log"
          status=0
          {
            set -e
            git show 13eab4d18decb544597dea9f72e07fbee795f1ba:.github/workflows/ci.yml > .github/workflows/ci.yml
            git show 13eab4d18decb544597dea9f72e07fbee795f1ba:.github/workflows/generate-performance-evidence.yml > .github/workflows/generate-performance-evidence.yml
            rm -f .github/workflows/acceptance-clean-finalize-once.yml
            rm -f .github/workflows/acceptance-finalizer-once.yml
            rm -f .github/workflows/acceptance-hardening-once.yml
            rm -f .github/workflows/acceptance-hardening-retry-once.yml
            rm -f docs/ACCEPTANCE_HARDENING_DIAGNOSTIC.json
            rm -f docs/ACCEPTANCE_HARDENING_RETRY_DIAGNOSTIC.txt
            rm -f docs/ACCEPTANCE_FINALIZER_DIAGNOSTIC.txt
            rm -f docs/ACCEPTANCE_CLEAN_FINALIZER_DIAGNOSTIC.txt

            python scripts/finalize_acceptance_hardening.py patch
            uv lock --check
            uv sync --frozen --extra dev --extra agent --extra signing
            uv run ruff format src scripts tests
            uv run ruff check .
            uv run mypy src
            uv run python -m compileall -q src scripts tests
            uv run python scripts/audit_source_tree.py --output /tmp/source-tree-audit.json
            uv tool run --isolated --from 'bandit==1.9.4' bandit --recursive src scripts --severity-level high --confidence-level high
            uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-report=term-missing --cov-report=json:/tmp/acceptance-clean-coverage.json --junitxml=/tmp/acceptance-clean-junit.xml --cov-fail-under=95.0
            uv run python scripts/run_test_order_gate.py --seed 20260728 --output-dir /tmp/acceptance-clean-order
            python scripts/finalize_acceptance_hardening.py evidence --coverage /tmp/acceptance-clean-coverage.json --junit /tmp/acceptance-clean-junit.xml --validated-parent "$trigger_sha"
            rm -f scripts/finalize_acceptance_hardening.py
            git diff --check
          } > >(tee "$log") 2>&1 || status=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$status" -eq 0 ]]; then
            git add -A
            git commit -m "fix: complete acceptance-critical runtime hardening"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$trigger_sha" ]]; then
              echo "main advanced during final qualification" >&2
              exit 2
            fi
            git push origin HEAD:main
            exit 0
          fi

          cp "$log" /tmp/acceptance-clean-finalizer-failure.log
          git reset --hard "$trigger_sha"
          printf 'clean acceptance finalizer failed with status %s\n\n' "$status" > docs/ACCEPTANCE_CLEAN_FINALIZER_DIAGNOSTIC.txt
          tail -n 2200 /tmp/acceptance-clean-finalizer-failure.log >> docs/ACCEPTANCE_CLEAN_FINALIZER_DIAGNOSTIC.txt
          git add docs/ACCEPTANCE_CLEAN_FINALIZER_DIAGNOSTIC.txt
          git commit -m "test: record clean acceptance finalizer diagnostic"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$trigger_sha" ]]; then
            echo "main advanced before diagnostic publication" >&2
            exit 2
          fi
          git push origin HEAD:main
          exit "$status"
