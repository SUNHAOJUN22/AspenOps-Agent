name: Finalize clean acceptance hardening once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acceptance-clean-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-clean-acceptance-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Patch, qualify and publish clean tree
        shell: bash
        run: |
          set -uo pipefail
          trigger_sha="$(git rev-parse HEAD)"
          log=/tmp/acceptance-clean-finalizer.log
          : > "$log"
          status=0
          {
            set -e
            git show 13eab4d18decb544597dea9f72e07fbee795f1ba:.github/workflows/ci.yml \
              > .github/workflows/ci.yml
            git show 13eab4d18decb544597dea9f72e07fbee795f1ba:.github/workflows/generate-performance-evidence.yml \
              > .github/workflows/generate-performance-evidence.yml

            rm -f \
              .github/workflows/acceptance-clean-finalize-once.yml \
              .github/workflows/acceptance-finalizer-once.yml \
              .github/workflows/acceptance-hardening-once.yml \
              .github/workflows/acceptance-hardening-retry-once.yml \
              docs/ACCEPTANCE_HARDENING_DIAGNOSTIC.json \
              docs/ACCEPTANCE_HARDENING_RETRY_DIAGNOSTIC.txt \
              docs/ACCEPTANCE_FINALIZER_DIAGNOSTIC.txt \
              docs/ACCEPTANCE_CLEAN_FINALIZER_DIAGNOSTIC.txt

            python - <<'PY'
