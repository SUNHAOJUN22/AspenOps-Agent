name: One-shot format latest hardening

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/format-latest-hardening.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Format and validate latest hardening
        run: |
          uv sync --extra dev --extra agent
          uv run ruff format \
            src/aspenops_nexus/provenance.py \
            tests/test_pool_manager_creation.py \
            tests/test_worker_protocol_hardening.py
          uv run ruff check \
            src/aspenops_nexus/archive_safety.py \
            src/aspenops_nexus/provenance.py \
            src/aspenops_nexus/worker.py \
            src/aspenops_nexus/pool_manager.py \
            tests/test_provenance_zip_safety.py \
            tests/test_provenance_zip_absolute_path.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_pool_manager_creation.py \
            tests/test_scheduler_active_leases.py
          uv run mypy \
            src/aspenops_nexus/archive_safety.py \
            src/aspenops_nexus/provenance.py \
            src/aspenops_nexus/worker.py \
            src/aspenops_nexus/pool_manager.py
          uv run pytest \
            tests/test_provenance.py \
            tests/test_provenance_edge_cases.py \
            tests/test_provenance_zip_safety.py \
            tests/test_provenance_zip_absolute_path.py \
            tests/test_worker_contracts.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_pool_manager.py \
            tests/test_pool_manager_creation.py \
            tests/test_scheduler_active_leases.py
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/format-latest-hardening.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git commit -m "style: format latest reliability hardening"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
