          documentation = '''# Native adapter conformance

The native adapter conformance layer closes the gap between a deterministic compilation
plan and a concrete target-runtime adapter implementation.

## Preflight sequence

1. Fresh runtime authorization verifies qualification, trust, revocation and witness data.
2. Adapter identity properties must match the authorized profile, code and runtime hashes.
3. `NativeAdapterManifest` is parsed under a strict versioned schema.
4. Every plan operation and `adapter_key` must be declared by the manifest.
5. Topology, layout, save/reopen and failure-isolation capabilities are mandatory when the
   plan requires them.
6. Any conformance issue stops execution before the first compilation step.

## Boundary

A conformant manifest is not vendor certification. It proves deterministic offline contract
coverage only. Aspen Plus/HYSYS object names, COM methods, port behavior, persistence,
solver behavior and engineering correctness require licensed Golden Cases and human
acceptance.
