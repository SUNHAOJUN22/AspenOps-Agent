name: Exact tracked tree export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-tree-export-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build deterministic tracked-tree archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          mkdir -p artifacts
          prefix="${GITHUB_REPOSITORY#*/}-${GITHUB_SHA}/"
          git archive --format=tar.gz --prefix="$prefix" "$GITHUB_SHA" \
            -o artifacts/exact-source-tree.tar.gz
          sha256sum artifacts/exact-source-tree.tar.gz \
            | tee artifacts/exact-source-tree.sha256
          printf '{"repository":"%s","sha":"%s","tree":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" \
            > artifacts/exact-source-tree.json

      - name: Upload exact tracked tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-tree-${{ github.sha }}
          path: artifacts/exact-source-tree.*
          if-no-files-found: error
          retention-days: 14
