name: Agent Repository Snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-repository-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload complete working tree
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot-${{ github.sha }}
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
