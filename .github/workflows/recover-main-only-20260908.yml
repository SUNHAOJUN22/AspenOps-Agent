name: Recover independent repository to main only
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-main-only-20260908.yml]
permissions:
  contents: write
concurrency:
  group: recover-main-only-20260908
  cancel-in-progress: false
jobs:
  preserve-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve verified branch tips before removing non-main refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: SUNHAOJUN22/AspenOps-Agent
          RESTORED_PARENT: 17c62fab2ed65334376ff129dc82c73158b9df2c
          EXPECTED_BRANCHES: '{"archive/pre-tsaoscience-astra-pro-1":"e3755c89a1650622d1d8c6a2c008c11d2c8676c9","closure/20260828-code-readme":"ef28e84064c93421f8cc9344d63a4f131459d710","remediation/dimensionless-optimization-ci":"e8d537de132ea27811162c74e551e3b6a4ebd764"}'
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, urllib.request, urllib.error, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != os.environ['EXPECTED_REPOSITORY'] or os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('Unexpected repository or branch; no changes made')
          base = 'https://api.github.com/repos/' + repo
          expected = json.loads(os.environ['EXPECTED_BRANCHES'])
          def api(method, suffix, body=None, missing=False):
              payload = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(base + suffix, data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(2_000_001)
                      if len(raw) > 2_000_000: raise RuntimeError('Response size limit exceeded')
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if missing and exc.code == 404: return None
                  raise RuntimeError(f'GitHub operation refused: {method} {suffix} HTTP {exc.code}') from None
          def ref(kind, name):
              return '/git/ref/' + kind + '/' + urllib.parse.quote(name, safe='')
          def current():
              return api('GET','/git/ref/heads/main')['object']['sha']
          if current() != os.environ['GITHUB_SHA']:
              raise RuntimeError('Main changed; no changes made')
          commit = api('GET','/git/commits/' + os.environ['GITHUB_SHA'])
          if [p['sha'] for p in commit['parents']] != [os.environ['RESTORED_PARENT']]:
              raise RuntimeError('Unexpected parent; no changes made')
          heads = api('GET','/git/matching-refs/heads/')
          actual = {x['ref'][11:]:x['object']['sha'] for x in heads if x['ref'] != 'refs/heads/main'}
          if actual != expected:
              raise RuntimeError('Branch snapshot changed; no changes made')
          backups = []
          # First preserve EVERY tip and verify all tags; only then may any branch be removed.
          for branch, sha in sorted(expected.items()):
              if branch == 'main': raise RuntimeError('Refusing main deletion')
              tag = 'recovery/20260908/branch/' + branch
              old = api('GET', ref('tags', tag), missing=True)
              if old is None:
                  api('POST','/git/refs',{'ref':'refs/tags/' + tag,'sha':sha})
              elif old['object']['sha'] != sha:
                  raise RuntimeError('Backup tag collision; no branches deleted')
              if api('GET', ref('tags', tag))['object']['sha'] != sha:
                  raise RuntimeError('Backup verification failed')
              backups.append({'branch':branch,'sha':sha,'tag':tag})
          report = {'repository':repo,'workflow_sha':os.environ['GITHUB_SHA'],
                    'run_id':os.environ['GITHUB_RUN_ID'],'backups':backups,
                    'deleted':[],'main_untouched':True,'state':'BACKED_UP'}
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'branch-recovery.json'
          def save():
              path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          save()
          for item in backups:
              if current() != os.environ['GITHUB_SHA']:
                  raise RuntimeError('Main changed; remaining branches retained')
              if api('GET',ref('heads',item['branch']))['object']['sha'] != item['sha']:
                  raise RuntimeError('Branch changed; retained')
              if api('GET',ref('tags',item['tag']))['object']['sha'] != item['sha']:
                  raise RuntimeError('Backup changed; branch retained')
              api('DELETE','/git/refs/heads/' + urllib.parse.quote(item['branch'],safe=''))
              if api('GET',ref('heads',item['branch']),missing=True) is not None:
                  raise RuntimeError('Branch deletion not confirmed')
              report['deleted'].append(item['branch'])
              save()
          remaining = api('GET','/git/matching-refs/heads/')
          report['remaining_branches']=[x['ref'][11:] for x in remaining]
          report['state']='MAIN_ONLY' if report['remaining_branches']==['main'] else 'INCOMPLETE'
          save()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['state']!='MAIN_ONLY': raise RuntimeError('Unexpected remaining branch')
          PYTHON
      - name: Save branch preservation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-recovery.json
          if-no-files-found: error
          retention-days: 30
