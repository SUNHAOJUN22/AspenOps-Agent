name: Phase 7 one-time push migration

on:
  push:
    branches:
      - feature/aspenops-revocation-witness
    paths:
      - .github/workflows/phase7-migrate-on-push-once.yml

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-revocation-witness
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          witness_test = Path("tests/test_revocation_witness.py")
          lines = witness_test.read_text(encoding="utf-8").splitlines()
          target = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if "item.assert_matches(replace(policy.statement, sequence=2), checkpoint)"
                  in line
              ),
              None,
          )
          if target is None or target == 0 or "with pytest.raises" not in lines[target - 1]:
              raise RuntimeError("Witness policy mismatch call not found")
          indent = lines[target - 1][:-len(lines[target - 1].lstrip())]
          lines[target - 1 : target + 1] = [
              f"{indent}changed_policy = replace(",
              f"{indent}    policy,",
              f"{indent}    statement=replace(policy.statement, sequence=2),",
              f"{indent})",
              f'{indent}with pytest.raises(ValueError, match="policy_sequence"):',
              f"{indent}    item.assert_matches(changed_policy, checkpoint)",
          ]
          witness_test.write_text("\n".join(lines) + "\n", encoding="utf-8")

          helper_import = (
              "from tests.revocation_witness_support import "
              "install_revocation_witness"
          )
          authorization_test = Path("tests/test_runtime_execution_authorization.py")
          text = authorization_test.read_text(encoding="utf-8")
          if helper_import not in text:
              marker = "import pytest\n"
              if text.count(marker) != 1:
                  raise RuntimeError("Authorization pytest import marker not found")
              text = text.replace(marker, marker + "\n" + helper_import + "\n", 1)
          install_line = "    install_revocation_witness(root, verified, checkpoint, now=NOW)\n"
          if install_line not in text:
              marker = "    return policy_document\n"
              if text.count(marker) != 1:
                  raise RuntimeError("Authorization return marker not found")
              text = text.replace(marker, install_line + marker, 1)
          text = text.replace(
              "    assert first.expires_at == NOW + timedelta(hours=2)\n",
              "    assert first.expires_at == NOW + timedelta(hours=1)\n",
              1,
          )
          if "first.revocation_witness_sha256" not in text:
              marker = "    assert len(first.revocation_checkpoint_sha256) == 64\n"
              if text.count(marker) != 1:
                  raise RuntimeError("Authorization checkpoint assertion not found")
              text = text.replace(
                  marker,
                  marker
                  + "    assert len(first.revocation_witness_sha256) == 64\n"
                  + "    assert len(first.revocation_witness_signing_key_id) == 32\n"
                  + '    assert first.revocation_witness_id == "test-witness"\n'
                  + "    assert first.revocation_witness_expires_at == NOW + timedelta(hours=1)\n",
                  1,
              )
          if "def test_missing_witness_receipt_fails_closed" not in text:
              marker = "\ndef test_future_and_expired_signed_policies_fail_closed"
              if marker not in text:
                  raise RuntimeError("Authorization test insertion marker not found")
              new_test = '''

def test_missing_witness_receipt_fails_closed(tmp_path: Path) -> None:
    plan, profile, envelope, _ = context(tmp_path)
    from aspenops_nexus.revocation_witness import WITNESS_RECEIPT_FILENAME

    (tmp_path / WITNESS_RECEIPT_FILENAME).unlink()
    with pytest.raises(FileNotFoundError, match="witness receipt is unavailable"):
        authorize_runtime_execution(
            plan,
            profile,
            envelope,
            trusted_key_dir=tmp_path,
            now=NOW,
        )
'''
              text = text.replace(marker, new_test + marker, 1)
          authorization_test.write_text(text, encoding="utf-8")

          builder_test = Path("tests/test_native_builder_contract.py")
          text = builder_test.read_text(encoding="utf-8")
          if helper_import not in text:
              marker = "import pytest\n"
              if text.count(marker) != 1:
                  raise RuntimeError("Native builder pytest import marker not found")
              text = text.replace(marker, marker + "\n" + helper_import + "\n", 1)
          old_checkpoint = '''    (tmp_path / REVOCATION_CHECKPOINT_FILENAME).write_text(
        json.dumps(
            advance_revocation_policy_checkpoint(verified_policy).to_dict(),
            sort_keys=True,
        ),
        encoding="utf-8",
    )
'''
          new_checkpoint = '''    checkpoint = advance_revocation_policy_checkpoint(verified_policy)
    (tmp_path / REVOCATION_CHECKPOINT_FILENAME).write_text(
        json.dumps(checkpoint.to_dict(), sort_keys=True),
        encoding="utf-8",
    )
    install_revocation_witness(
        tmp_path,
        verified_policy,
        checkpoint,
        now=NOW,
    )
'''
          if old_checkpoint not in text:
              raise RuntimeError("Native builder checkpoint block not found")
          text = text.replace(old_checkpoint, new_checkpoint, 1)
          if "record.revocation_witness_sha256" not in text:
              marker = "    assert len(record.revocation_checkpoint_sha256) == 64\n"
              if text.count(marker) != 1:
                  raise RuntimeError("Native builder checkpoint assertion not found")
              text = text.replace(
                  marker,
                  marker
                  + "    assert len(record.revocation_witness_sha256) == 64\n"
                  + "    assert len(record.revocation_witness_signing_key_id) == 32\n"
                  + '    assert record.revocation_witness_id == "test-witness"\n'
                  + '    assert record.revocation_witness_expires_at == "2026-08-02T13:00:00Z"\n',
                  1,
              )
          builder_test.write_text(text, encoding="utf-8")
          PY
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git commit -m "test: migrate runtime authorization to revocation witnesses"
          git push origin HEAD:feature/aspenops-revocation-witness
