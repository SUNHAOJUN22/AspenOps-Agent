name: Apply skill-native V15

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15.py
      - .github/workflows/apply-skill-native-v15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aspenops-skill-native-v15
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply deterministic repository update
        run: python scripts/apply_skill_native_v15.py
      - name: Remove one-shot bootstrap
        shell: bash
        run: rm -f scripts/apply_skill_native_v15.py .github/workflows/apply-skill-native-v15.yml
      - name: Commit generated source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: apply AspenOps skill-native V15 source'
          git push origin HEAD:main
