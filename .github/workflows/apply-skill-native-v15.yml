name: Apply skill-native V15

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15.py
      - .github/workflows/apply-skill-native-v15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aspenops-skill-native-v15
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
      - name: Apply deterministic repository update
        run: python scripts/apply_skill_native_v15.py
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev --extra agent --extra signing
      - name: Validate canonical Skill
        run: uv run python scripts/validate_skill.py --root . --report artifacts/skill-validation-v15.json
      - name: Run focused scientific contract tests
        run: uv run pytest tests/test_scientific_contracts_v15.py -q
      - name: Static checks for new contract surface
        run: |
          uv run ruff check src/aspenops_nexus/scientific_contracts_v15.py tests/test_scientific_contracts_v15.py scripts/validate_skill.py
          uv run mypy src/aspenops_nexus/scientific_contracts_v15.py
      - name: Remove one-shot bootstrap
        shell: bash
        run: rm -f scripts/apply_skill_native_v15.py .github/workflows/apply-skill-native-v15.yml
      - name: Commit verified result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: finalize AspenOps skill-native V15'
          git push origin HEAD:main
