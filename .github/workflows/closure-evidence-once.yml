# One-time hosted qualification. Remove after both closure evidence files are committed.
name: Closure evidence once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-closure-evidence-once
  cancel-in-progress: false

jobs:
  linux:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Run complete hosted Linux qualification and commit evidence
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          evidence_dir="var/closure-linux"
          status_file="$evidence_dir/status.tsv"
          rm -rf "$evidence_dir" /tmp/aspenops-closure-wheel
          mkdir -p "$evidence_dir"
          : > "$status_file"
          rm .github/workflows/closure-evidence-once.yml
          failed=0

          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" > "$evidence_dir/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$status_file"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          run_gate lock-check uv lock --check
          run_gate sync-312 uv sync --frozen --python 3.12 --extra dev --extra agent --extra signing
          run_gate dependency-audit bash -lc '
            set -euo pipefail
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json \
                  > "var/closure-linux/audit-${platform}-py${version}.json"
                python -m json.tool "var/closure-linux/audit-${platform}-py${version}.json" >/dev/null
              done
            done
          '
          run_gate ruff uv run --python 3.12 ruff check .
          run_gate ruff-format uv run --python 3.12 ruff format --check .
          run_gate mypy uv run --python 3.12 mypy src
          run_gate bandit bash -lc '
            set -euo pipefail
            uv tool run --isolated --from "bandit==1.9.4" bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high \
              --format json \
              --output var/closure-linux/bandit.json
            python -m json.tool var/closure-linux/bandit.json >/dev/null
          '
          run_gate pytest-312 uv run --python 3.12 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch --cov-report=term-missing \
            --cov-report=json:var/closure-linux/coverage-3.12.json \
            --junitxml=var/closure-linux/junit-3.12.xml --durations=20 --cov-fail-under=94.5
          run_gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py \
            --seed 20260728 --output-dir var/closure-linux/order
          run_gate build uv build
          run_gate demo uv run --python 3.12 aspenops demo
          run_gate mcp uv run --python 3.12 python scripts/check_mcp.py
          run_gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output var/closure-linux/process-intent-canonical.json \
            --report-output var/closure-linux/process-intent-report.json
          run_gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py \
            --repo-root . --output var/closure-linux/benchmark-smoke.json --smoke
          run_gate sync-311 uv sync --frozen --python 3.11 --extra dev --extra agent --extra signing
          run_gate pytest-311 uv run --python 3.11 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch --cov-report=term-missing \
            --cov-report=json:var/closure-linux/coverage-3.11.json \
            --junitxml=var/closure-linux/junit-3.11.xml --durations=20 --cov-fail-under=94.5
          run_gate sync-313 uv sync --frozen --python 3.13 --extra dev --extra agent --extra signing
          run_gate pytest-313 uv run --python 3.13 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch --cov-report=term-missing \
            --cov-report=json:var/closure-linux/coverage-3.13.json \
            --junitxml=var/closure-linux/junit-3.13.xml --durations=20 --cov-fail-under=94.5
          run_gate sync-312-final uv sync --frozen --python 3.12 --extra dev --extra agent --extra signing
          run_gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project \
              --format requirements.txt --output-file var/closure-linux/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-closure-wheel
            uv pip sync --python /tmp/aspenops-closure-wheel/bin/python --require-hashes \
              var/closure-linux/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-closure-wheel/bin/python --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-closure-wheel/bin/python
            /tmp/aspenops-closure-wheel/bin/aspenops --version
            /tmp/aspenops-closure-wheel/bin/aspenops demo
            /tmp/aspenops-closure-wheel/bin/aspenops mcp --help >/dev/null
          '

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence_dir = Path("var/closure-linux")
          statuses = {}
          for line in (evidence_dir / "status.tsv").read_text(encoding="utf-8").splitlines():
              name, code = line.split("\t")
              statuses[name] = int(code)

          coverage = {}
          tests = {}
          for version in ("3.11", "3.12", "3.13"):
              coverage_path = evidence_dir / f"coverage-{version}.json"
              junit_path = evidence_dir / f"junit-{version}.xml"
              if coverage_path.exists():
                  coverage[version] = json.loads(coverage_path.read_text(encoding="utf-8"))["totals"]["percent_covered"]
              if junit_path.exists():
                  root = ET.parse(junit_path).getroot()
                  suite = root if "tests" in root.attrib else root.find("testsuite")
                  if suite is not None:
                      tests[version] = {
                          "tests": int(suite.attrib.get("tests", 0)),
                          "failures": int(suite.attrib.get("failures", 0)),
                          "errors": int(suite.attrib.get("errors", 0)),
                          "skipped": int(suite.attrib.get("skipped", 0)),
                      }

          excluded = {
              ".github/workflows/closure-evidence-once.yml",
              "docs/closure-evidence-linux.json",
              "docs/closure-evidence-windows.json",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          digest = hashlib.sha256()
          for raw_path in sorted(path for path in tracked if path):
              path = raw_path.decode("utf-8")
              if path in excluded:
                  continue
              data = Path(path).read_bytes()
              digest.update(len(raw_path).to_bytes(8, "big"))
              digest.update(raw_path)
              digest.update(len(data).to_bytes(8, "big"))
              digest.update(data)

          payload = {
              "schema": "aspenops.closure-evidence/v1",
              "platform": "linux",
              "source_sha": os.environ["GITHUB_SHA"],
              "qualified_tree_sha256": digest.hexdigest(),
              "workflow_removed_during_qualification": True,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "gate_status": statuses,
              "coverage_percent": coverage,
              "junit": tests,
              "overall": "PASS" if statuses and all(code == 0 for code in statuses.values()) else "FAIL",
          }
          Path("docs/closure-evidence-linux.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git restore .github/workflows/closure-evidence-once.yml
          git add docs/closure-evidence-linux.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record hosted Linux closure evidence"
          git push origin HEAD:main
          exit "$failed"

  windows:
    needs: linux
    if: ${{ always() && github.actor != 'github-actions[bot]' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Run hosted Windows qualification and commit evidence
        shell: pwsh
        env:
          LINUX_JOB_RESULT: ${{ needs.linux.result }}
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDir = "var/closure-windows"
          Remove-Item -LiteralPath $evidenceDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          $statusPath = Join-Path $evidenceDir "status.tsv"
          Set-Content -LiteralPath $statusPath -Value "" -NoNewline
          Remove-Item -LiteralPath .github/workflows/closure-evidence-once.yml -Force
          $script:failed = 0

          function Invoke-Gate {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][scriptblock]$Command
            )
            $logPath = Join-Path $evidenceDir "$Name.log"
            $code = 0
            try {
              & $Command *>&1 | Out-File -LiteralPath $logPath -Encoding utf8
              if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
            } catch {
              $_ | Out-String | Out-File -LiteralPath $logPath -Encoding utf8 -Append
              $code = 1
            }
            Add-Content -LiteralPath $statusPath -Value "$Name`t$code"
            if ($code -ne 0) { $script:failed = 1 }
          }

          Invoke-Gate "lock-check" { uv lock --check }
          Invoke-Gate "sync" { uv sync --frozen --extra dev --extra windows --extra agent --extra signing }
          Invoke-Gate "powershell-parse" {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath scripts/setup_windows.ps1),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parser found errors" }
          }
          Invoke-Gate "bootstrap-library" {
            . ./scripts/setup_windows.ps1 -LibraryMode
            $contractRoot = Join-Path $env:RUNNER_TEMP "aspenops-closure-bootstrap"
            Remove-Item -LiteralPath $contractRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $contractRoot | Out-Null
            $valid = Join-Path $contractRoot "valid.env"
            @("ASPENOPS_BACKEND=mock", 'QUOTED_VALUE="hello world"') | Set-Content -LiteralPath $valid
            Import-DotEnv -Path $valid
            if ($env:ASPENOPS_BACKEND -ne "mock" -or $env:QUOTED_VALUE -ne "hello world") {
              throw "Valid dotenv values were not imported"
            }
            $secret = "DO_NOT_ECHO_SECRET"
            $duplicate = Join-Path $contractRoot "duplicate.env"
            @("SECRET_VALUE=$secret", "secret_value=second") | Set-Content -LiteralPath $duplicate
            $rejected = $false
            try { Import-DotEnv -Path $duplicate } catch {
              if ($_.Exception.Message -match [regex]::Escape($secret)) { throw "Secret leaked" }
              if ($_.Exception.Message -notmatch "Duplicate environment variable at line 2") { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw "Duplicate dotenv variable was accepted" }
          }
          Invoke-Gate "ruff" { uv run ruff check . }
          Invoke-Gate "ruff-format" { uv run ruff format --check . }
          Invoke-Gate "mypy" { uv run mypy src }

          $contractTests = @(
            "tests/test_windows_job.py",
            "tests/test_windows_job_edges.py",
            "tests/test_aspen_process_ownership.py",
            "tests/test_batch_backend_default.py",
            "tests/test_cli_output_policy.py",
            "tests/test_config_registry_edge_cases.py",
            "tests/test_config_resource_budgets.py",
            "tests/test_documentation_contracts.py",
            "tests/test_artifact_upload_governance.py",
            "tests/test_test_dashboard.py",
            "tests/test_readme_visual_assets.py",
            "tests/test_process_ir.py",
            "tests/test_process_ir_edges.py",
            "tests/test_process_ir_dashboard.py",
            "tests/test_real_backend_state_policy.py",
            "tests/test_licensed_path_gate.py",
            "tests/test_convergence.py",
            "tests/test_backends_convergence.py",
            "tests/test_v2_reliability.py",
            "tests/test_singleflight.py",
            "tests/test_worker_contracts.py",
            "tests/test_worker_protocol_hardening.py",
            "tests/test_pool_manager_creation.py",
            "tests/test_scheduler_active_leases.py",
            "tests/test_provenance_zip_safety.py",
            "tests/test_archive_safety_complete.py",
            "tests/test_licensed_bundle_integrity.py",
            "tests/test_licensed_certification_cli.py",
            "tests/test_licensed_certification_workflow.py",
            "tests/test_workflow_governance.py",
            "tests/test_wheel_smoke_governance.py",
            "tests/test_ci_closure_gates.py"
          )
          Invoke-Gate "pytest-windows" {
            uv run pytest -W error::ResourceWarning @contractTests `
              --junitxml=var/closure-windows/junit-windows.xml --durations=20
          }
          Invoke-Gate "process-ir" {
            uv run python scripts/validate_process_ir.py examples/process-intent.example.json `
              --canonical-output var/closure-windows/process-intent-canonical.json `
              --report-output var/closure-windows/process-intent-report.json
          }
          Invoke-Gate "cli-version" { uv run aspenops --version }
          Invoke-Gate "cli-help" { uv run aspenops --help }
          Invoke-Gate "doctor" { uv run aspenops doctor }

          @'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence_dir = Path("var/closure-windows")
          statuses = {}
          for line in (evidence_dir / "status.tsv").read_text(encoding="utf-8-sig").splitlines():
              if not line.strip():
                  continue
              name, code = line.split("\t")
              statuses[name] = int(code)

          tests = {}
          junit = evidence_dir / "junit-windows.xml"
          if junit.exists():
              root = ET.parse(junit).getroot()
              suite = root if "tests" in root.attrib else root.find("testsuite")
              if suite is not None:
                  tests = {
                      "tests": int(suite.attrib.get("tests", 0)),
                      "failures": int(suite.attrib.get("failures", 0)),
                      "errors": int(suite.attrib.get("errors", 0)),
                      "skipped": int(suite.attrib.get("skipped", 0)),
                  }

          excluded = {
              ".github/workflows/closure-evidence-once.yml",
              "docs/closure-evidence-linux.json",
              "docs/closure-evidence-windows.json",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          digest = hashlib.sha256()
          for raw_path in sorted(path for path in tracked if path):
              path = raw_path.decode("utf-8")
              if path in excluded:
                  continue
              data = Path(path).read_bytes()
              digest.update(len(raw_path).to_bytes(8, "big"))
              digest.update(raw_path)
              digest.update(len(data).to_bytes(8, "big"))
              digest.update(data)

          payload = {
              "schema": "aspenops.closure-evidence/v1",
              "platform": "windows",
              "source_sha": os.environ["GITHUB_SHA"],
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "qualified_tree_sha256": digest.hexdigest(),
              "workflow_removed_during_qualification": True,
              "linux_job_result": os.environ.get("LINUX_JOB_RESULT"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "gate_status": statuses,
              "junit": tests,
              "overall": "PASS" if statuses and all(code == 0 for code in statuses.values()) else "FAIL",
          }
          Path("docs/closure-evidence-windows.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { throw "Failed to render Windows evidence" }

          git restore .github/workflows/closure-evidence-once.yml
          git add docs/closure-evidence-windows.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record hosted Windows closure evidence"
          git push origin HEAD:main
          exit $script:failed
