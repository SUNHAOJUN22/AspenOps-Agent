name: EPDM public source retrieval
on:
  push:
    branches: [main]
    paths: ['.github/workflows/epdm-public-source-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-public-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve fixed public original sources (no checkout, no simulator)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Public source retrieval must run from refs/heads/main" >&2
            exit 2
          fi
          python3 - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from hashlib import sha256
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          import json

          ROOT = Path('epdm-public-sources')
          SOURCES = [
           ('S01','https://www.cetjournal.it/cet/23/100/028.pdf'),
           ('S02','https://patentimages.storage.googleapis.com/89/8f/51/6f02bab191756d/WO2012156393A1.pdf'),
           ('S03','https://patentimages.storage.googleapis.com/f9/01/71/ffd85dfd0298e9/WO2014202715A1.pdf'),
           ('S04','https://patentimages.storage.googleapis.com/f5/9d/57/d3e1bad157c3d8/US6545088.pdf'),
           ('S05','https://patents.google.com/patent/WO2022207551A1/en'),
           ('S06','https://patents.google.com/patent/US11002653B2/en'),
           ('S07','https://patents.google.com/patent/US6150498A/en'),
           ('S08','https://patentimages.storage.googleapis.com/ab/45/0d/8663e4bcc37b57/US20180362684A1.pdf'),
           ('S09','https://patentimages.storage.googleapis.com/b8/c0/e1/abf5b02faf7c1f/US6011128.pdf'),
           ('S10','https://patents.google.com/patent/US3681306A/en'),
           ('S11','https://www.mobt3ath.com/uplode/book/book-31783.pdf'),
           ('S12','https://patentimages.storage.googleapis.com/be/45/17/1795461470aef6/CN102675513A.pdf'),
           ('S13','https://patents.google.com/patent/CN105330764A/zh'),
           ('S14','https://repository.lsu.edu/gradschool_dissertations/2655/'),
           ('S19','https://www.dow.com/content/dam/dcc/documents/265/265-11001-01-nordel-epdm-product-selection-guide.pdf'),
           ('S20','https://patents.google.com/patent/WO2023217397A1/en'),
           ('S21','https://patents.google.com/patent/WO2017127184A1/en'),
           ('S22','https://versalis.eni.com/assets/documents/versalis/it/documentazione/licensing/2024/EPDM_20x29.pdf'),
           ('S22B','https://versalis.eni.com/en-IT/portfolio/technologies-licensing/tecnhologies-production-traditional-raw-materials.html'),
          ]
          ALLOWED = {'www.cetjournal.it','patentimages.storage.googleapis.com','patents.google.com','www.mobt3ath.com','mobt3ath.com','repository.lsu.edu','www.dow.com','versalis.eni.com','www.versalis.eni.com'}

          LIMIT = 35 * 1024 * 1024
          MAX_CANDIDATES = 3


          def validate_url(url):
              if not isinstance(url, str) or len(url) > 8192 or any(ord(c) < 32 for c in url):
                  raise ValueError('Invalid source URL')
              parsed = urlparse(url)
              if (parsed.scheme != 'https' or parsed.hostname not in ALLOWED
                      or parsed.username is not None or parsed.password is not None
                      or parsed.port not in (None, 443)):
                  raise ValueError('Source outside fixed HTTPS allowlist')


          class SourceRedirects(HTTPRedirectHandler):
              max_redirections = 3
              max_repeats = 2

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  # Reject the next hop before urllib is allowed to contact it.
                  validate_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.pdfs = []

              def handle_starttag(self, tag, attrs):
                  if len(self.pdfs) >= MAX_CANDIDATES:
                      return
                  values = dict(attrs)
                  candidate = ''
                  if tag == 'meta' and (values.get('name') or '').lower() == 'citation_pdf_url':
                      candidate = values.get('content') or ''
                  elif tag == 'a':
                      href = values.get('href') or ''
                      if (('EPDM' in href.upper() and '.pdf' in href.lower())
                              or ('viewcontent.cgi' in href and '2655' not in href)):
                          candidate = href
                  if candidate and candidate not in self.pdfs:
                      self.pdfs.append(candidate)


          def get(url):
              validate_url(url)
              request = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; EPDM-Evidence-Research/1.0)',
              })
              opener = build_opener(SourceRedirects())
              with opener.open(request, timeout=35) as response:
                  validate_url(response.url)
                  payload = response.read(LIMIT + 1)
                  if len(payload) > LIMIT:
                      raise ValueError('Per-source size limit exceeded')
                  return payload, response.url, response.headers.get('Content-Type', '')


          def one(source):
              sid, url = source
              record = {'id': sid, 'source_url': url,
                        'retrieved_utc': datetime.now(timezone.utc).isoformat(), 'status': 'failed'}
              try:
                  payload, final, content_type = get(url)
                  if not payload.startswith(b'%PDF-'):
                      (ROOT / (sid + '.html')).write_bytes(payload)
                      parser = Links()
                      parser.feed(payload.decode('utf-8', 'replace'))
                      choices = list(dict.fromkeys(urljoin(final, value) for value in parser.pdfs))
                      record['pdf_candidates'] = choices
                      if not choices:
                          raise ValueError('No original PDF link found; no surrogate generated')
                      last = None
                      for candidate in choices[:MAX_CANDIDATES]:
                          try:
                              payload, final, content_type = get(candidate)
                              if payload.startswith(b'%PDF-'):
                                  break
                              raise ValueError('PDF signature missing')
                          except Exception as error:
                              last = error
                      if not payload.startswith(b'%PDF-'):
                          raise ValueError(str(last or 'No PDF'))
                  target = ROOT / (sid + '.pdf')
                  target.write_bytes(payload)
                  record.update(status='downloaded', final_url=final, bytes=len(payload),
                                sha256=sha256(payload).hexdigest(), file=target.name,
                                content_type=content_type)
              except Exception as error:
                  record['error'] = f'{type(error).__name__}: {error}'
              print(json.dumps(record, ensure_ascii=False), flush=True)
              return record


          def main():
              ROOT.mkdir(exist_ok=True)
              with ThreadPoolExecutor(max_workers=4) as pool:
                  manifest = list(pool.map(one, SOURCES))
              downloaded = sum(row['status'] == 'downloaded' for row in manifest)
              summary = {
                  'status': 'COMPLETE' if downloaded == len(manifest) else 'PARTIAL' if downloaded else 'FAILED',
                  'sources': len(manifest), 'downloaded': downloaded,
                  'failed': len(manifest) - downloaded,
                  'scientific_validation': 'NOT_EVALUATED',
              }
              (ROOT / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              (ROOT / 'summary.json').write_text(
                  json.dumps(summary, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(summary), flush=True)
              return 0 if downloaded else 1


          if __name__ == '__main__':
              raise SystemExit(main())
          PYTHON
      - name: Return source bytes and retrieval receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epdm-public-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: epdm-public-sources/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
