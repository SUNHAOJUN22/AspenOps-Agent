name: Validate refreshed README on single main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-readme-main-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-validate-readme-main-once
  cancel-in-progress: false

env:
  ONE_TIME_WORKFLOW: .github/workflows/validate-readme-main-once.yml

jobs:
  quality:
    name: Linux quality build wheel and MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Prepare governed source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ONE_TIME_WORKFLOW"
          mkdir -p var/readme-validation
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          git diff --check
      - name: Six-target dependency audit
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          failed=0
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              output="var/readme-validation/audit-${platform}-${version}.json"
              log="var/readme-validation/audit-${platform}-${version}.log"
              if ! uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json > "$output" 2> "$log"; then
                failed=1
              fi
              python -m json.tool "$output" >/dev/null || failed=1
            done
          done
          test "$failed" -eq 0
      - name: Static and security gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py --output var/readme-validation/source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/readme-validation/bandit.json
      - name: README documentation and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py \
            tests/test_artifact_upload_governance.py \
            tests/test_source_tree_audit.py \
            --junitxml=var/readme-validation/documentation.xml
      - name: Build demo MCP and clean Wheel smoke
        shell: bash
        run: |
          set -euo pipefail
          uv build
          uv run aspenops demo > var/readme-validation/demo.json
          uv run python scripts/check_mcp.py > var/readme-validation/mcp.json
          uv export --frozen \
            --extra agent \
            --no-default-groups \
            --no-emit-project \
            --format requirements.txt \
            --output-file var/readme-validation/runtime-requirements.txt
          uv venv --python 3.12 /tmp/aspenops-readme-wheel
          uv pip sync \
            --python /tmp/aspenops-readme-wheel/bin/python \
            --require-hashes \
            var/readme-validation/runtime-requirements.txt
          uv pip install \
            --python /tmp/aspenops-readme-wheel/bin/python \
            --offline --no-deps dist/*.whl
          uv pip check --python /tmp/aspenops-readme-wheel/bin/python
          /tmp/aspenops-readme-wheel/bin/aspenops --version
          /tmp/aspenops-readme-wheel/bin/aspenops demo >/dev/null
          /tmp/aspenops-readme-wheel/bin/python -c \
            "from aspenops_nexus.mcp_server import _require_supported_mcp_sdk; print(_require_supported_mcp_sdk())"

  python311:
    name: Python 3.11 full tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      errors: ${{ steps.summary.outputs.errors }}
      skipped: ${{ steps.summary.outputs.skipped }}
      coverage: ${{ steps.summary.outputs.coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.11"
          enable-cache: true
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ONE_TIME_WORKFLOW"
          mkdir -p var/readme-validation
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/readme-validation/coverage.json \
            --junitxml=var/readme-validation/junit.xml \
            --cov-fail-under=94.5
      - name: Summarize
        id: summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET
          root = ET.parse('var/readme-validation/junit.xml').getroot()
          suites = [root] if root.tag.endswith('testsuite') else list(root)
          tests = sum(int(item.attrib.get('tests', 0)) for item in suites)
          failed = sum(int(item.attrib.get('failures', 0)) for item in suites)
          errors = sum(int(item.attrib.get('errors', 0)) for item in suites)
          skipped = sum(int(item.attrib.get('skipped', 0)) for item in suites)
          coverage = json.load(open('var/readme-validation/coverage.json', encoding='utf-8'))['totals']['percent_covered']
          print(f'passed={tests - failed - errors - skipped}')
          print(f'failed={failed}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          print(f'coverage={coverage:.2f}')
          PY

  python312:
    name: Python 3.12 full tests and order gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      errors: ${{ steps.summary.outputs.errors }}
      skipped: ${{ steps.summary.outputs.skipped }}
      coverage: ${{ steps.summary.outputs.coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Test and order independence
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ONE_TIME_WORKFLOW"
          mkdir -p var/readme-validation
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/readme-validation/coverage.json \
            --junitxml=var/readme-validation/junit.xml \
            --cov-fail-under=95.0
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir var/readme-validation
      - name: Summarize
        id: summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET
          root = ET.parse('var/readme-validation/junit.xml').getroot()
          suites = [root] if root.tag.endswith('testsuite') else list(root)
          tests = sum(int(item.attrib.get('tests', 0)) for item in suites)
          failed = sum(int(item.attrib.get('failures', 0)) for item in suites)
          errors = sum(int(item.attrib.get('errors', 0)) for item in suites)
          skipped = sum(int(item.attrib.get('skipped', 0)) for item in suites)
          coverage = json.load(open('var/readme-validation/coverage.json', encoding='utf-8'))['totals']['percent_covered']
          print(f'passed={tests - failed - errors - skipped}')
          print(f'failed={failed}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          print(f'coverage={coverage:.2f}')
          PY

  python313:
    name: Python 3.13 full tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      errors: ${{ steps.summary.outputs.errors }}
      skipped: ${{ steps.summary.outputs.skipped }}
      coverage: ${{ steps.summary.outputs.coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - name: Test
        shell: bash
        env:
          PYTHONTRACEMALLOC: "10"
        run: |
          set -euo pipefail
          rm -f "$ONE_TIME_WORKFLOW"
          mkdir -p var/readme-validation
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/readme-validation/coverage.json \
            --junitxml=var/readme-validation/junit.xml \
            --cov-fail-under=94.5
      - name: Summarize
        id: summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET
          root = ET.parse('var/readme-validation/junit.xml').getroot()
          suites = [root] if root.tag.endswith('testsuite') else list(root)
          tests = sum(int(item.attrib.get('tests', 0)) for item in suites)
          failed = sum(int(item.attrib.get('failures', 0)) for item in suites)
          errors = sum(int(item.attrib.get('errors', 0)) for item in suites)
          skipped = sum(int(item.attrib.get('skipped', 0)) for item in suites)
          coverage = json.load(open('var/readme-validation/coverage.json', encoding='utf-8'))['totals']['percent_covered']
          print(f'passed={tests - failed - errors - skipped}')
          print(f'failed={failed}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          print(f'coverage={coverage:.2f}')
          PY

  windows:
    name: Windows control-plane contracts
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Prepare and validate
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:ONE_TIME_WORKFLOW -Force -ErrorAction SilentlyContinue
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev --extra windows --extra agent --extra signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check --fix scripts/update_readme_gallery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format scripts/update_readme_gallery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/update_readme_gallery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows process and documentation contracts
        shell: pwsh
        run: |
          uv run pytest -W error::ResourceWarning `
            tests/test_windows_job.py `
            tests/test_windows_job_edges.py `
            tests/test_aspen_process_ownership.py `
            tests/test_config_registry_edge_cases.py `
            tests/test_documentation_contracts.py `
            tests/test_readme_visual_assets.py `
            tests/test_real_backend_state_policy.py `
            tests/test_convergence.py `
            tests/test_backends_convergence.py `
            tests/test_singleflight.py `
            tests/test_worker_contracts.py `
            tests/test_worker_protocol_hardening.py `
            tests/test_pool_manager_creation.py `
            tests/test_scheduler_active_leases.py `
            tests/test_provenance_zip_safety.py `
            tests/test_archive_safety_complete.py `
            tests/test_licensed_bundle_integrity.py `
            tests/test_licensed_certification_cli.py `
            tests/test_workflow_governance.py `
            tests/test_source_tree_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops doctor *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  finalize:
    name: Record README qualification and clean workflow
    if: always()
    needs: [quality, python311, python312, python313, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      PY311_RESULT: ${{ needs.python311.result }}
      PY312_RESULT: ${{ needs.python312.result }}
      PY313_RESULT: ${{ needs.python313.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      PY311_PASSED: ${{ needs.python311.outputs.passed }}
      PY311_FAILED: ${{ needs.python311.outputs.failed }}
      PY311_ERRORS: ${{ needs.python311.outputs.errors }}
      PY311_SKIPPED: ${{ needs.python311.outputs.skipped }}
      PY311_COVERAGE: ${{ needs.python311.outputs.coverage }}
      PY312_PASSED: ${{ needs.python312.outputs.passed }}
      PY312_FAILED: ${{ needs.python312.outputs.failed }}
      PY312_ERRORS: ${{ needs.python312.outputs.errors }}
      PY312_SKIPPED: ${{ needs.python312.outputs.skipped }}
      PY312_COVERAGE: ${{ needs.python312.outputs.coverage }}
      PY313_PASSED: ${{ needs.python313.outputs.passed }}
      PY313_FAILED: ${{ needs.python313.outputs.failed }}
      PY313_ERRORS: ${{ needs.python313.outputs.errors }}
      PY313_SKIPPED: ${{ needs.python313.outputs.skipped }}
      PY313_COVERAGE: ${{ needs.python313.outputs.coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Finalize source and evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          rm -f "$ONE_TIME_WORKFLOW"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md scripts/update_readme_gallery.py "$ONE_TIME_WORKFLOW"
          if ! git diff --cached --quiet; then
            git commit -m 'docs: finalize synchronized AI README source'
          fi
          source_sha="$(git rev-parse HEAD)"
          export SOURCE_SHA="$source_sha"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = {
              'quality': os.environ['QUALITY_RESULT'],
              'python_3_11': os.environ['PY311_RESULT'],
              'python_3_12': os.environ['PY312_RESULT'],
              'python_3_13': os.environ['PY313_RESULT'],
              'windows': os.environ['WINDOWS_RESULT'],
          }
          success = all(value == 'success' for value in results.values())
          def row(prefix: str) -> dict[str, object]:
              return {
                  'tests_passed': int(os.environ.get(f'{prefix}_PASSED') or 0),
                  'failures': int(os.environ.get(f'{prefix}_FAILED') or 0),
                  'errors': int(os.environ.get(f'{prefix}_ERRORS') or 0),
                  'skipped': int(os.environ.get(f'{prefix}_SKIPPED') or 0),
                  'branch_coverage_percent': float(os.environ.get(f'{prefix}_COVERAGE') or 0),
              }
          payload = {
              'schema': 'aspenops.readme-visual-refresh-qualification/v1',
              'decision': 'PASS' if success else 'BLOCKED',
              'branch_policy': 'MAIN_ONLY',
              'validated_source_sha': os.environ['SOURCE_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'jobs': results,
              'python_matrix': {
                  '3.11': row('PY311'),
                  '3.12': row('PY312'),
                  '3.13': row('PY313'),
              },
              'python_312_order_independence': 'PASS' if os.environ['PY312_RESULT'] == 'success' else 'BLOCKED',
              'visual_assets': 22,
              'visual_gallery_entries': 12,
              'real_simulator_status': 'PENDING_REAL_ASPEN_CERTIFICATION',
          }
          target = Path('docs/README_VISUAL_REFRESH_VALIDATION.json')
          target.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lines = [
              '# README AI visual refresh qualification',
              '',
              f"## Decision: `{payload['decision']}`",
              '',
              f"- branch policy: `{payload['branch_policy']}`;",
              f"- validated source: `{payload['validated_source_sha']}`;",
              f"- workflow run: `{payload['workflow_run_id']}` attempt `{payload['workflow_attempt']}`;",
              f"- Linux quality/build/Wheel/MCP: `{results['quality']}`;",
              f"- Windows control plane: `{results['windows']}`;",
              '- README visual assets: 22 self-contained SVG files; visual atlas: 12 featured diagrams;',
              '- real Aspen Plus/HYSYS runtime: `NOT_EXECUTED`;',
              '- engineering certification: `PENDING_REAL_ASPEN_CERTIFICATION`.',
              '',
              '## Python matrix',
              '',
              '| Python | Passed | Failed | Errors | Skipped | Branch coverage |',
              '|---|---:|---:|---:|---:|---:|',
          ]
          for version, item in payload['python_matrix'].items():
              lines.append(
                  f"| {version} | {item['tests_passed']} | {item['failures']} | "
                  f"{item['errors']} | {item['skipped']} | {item['branch_coverage_percent']:.2f}% |"
              )
          lines.extend([
              '',
              'Python 3.12 reverse-order and fixed-seed order-independence gates were included.',
              '',
              'This qualification validates software and documentation contracts only. It does not certify commercial Aspen thermodynamics, equipment selection, topology, convergence or engineering acceptance.',
          ])
          Path('docs/README_VISUAL_REFRESH_VALIDATION.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          evidence = json.loads(Path('docs/README_VISUAL_REFRESH_VALIDATION.json').read_text(encoding='utf-8'))
          start = '<!-- README_VISUAL_REFRESH_VALIDATION:START -->'
          end = '<!-- README_VISUAL_REFRESH_VALIDATION:END -->'
          zh = '\n'.join([
              start,
              '',
              '### 本次 AI README 自动验证',
              '',
              f"- 验证源码：`{evidence['validated_source_sha']}`；",
              f"- GitHub Actions：`{evidence['workflow_run_id']}`；",
              f"- Linux 质量/构建/Wheel/MCP：`{evidence['jobs']['quality']}`；Windows：`{evidence['jobs']['windows']}`；",
              f"- Python 3.11/3.12/3.13：分别 {evidence['python_matrix']['3.11']['tests_passed']} / {evidence['python_matrix']['3.12']['tests_passed']} / {evidence['python_matrix']['3.13']['tests_passed']} passed；",
              '- 二十二张自包含 SVG 与十二图视觉导航：通过文档及安全资产合同；',
              '- 真实 Aspen/HYSYS：`PENDING_REAL_ASPEN_CERTIFICATION`。',
              '',
              end,
          ])
          en = '\n'.join([
              start,
              '',
              '### Automated AI README validation',
              '',
              f"- validated source: `{evidence['validated_source_sha']}`;",
              f"- GitHub Actions run: `{evidence['workflow_run_id']}`;",
              f"- Linux quality/build/Wheel/MCP: `{evidence['jobs']['quality']}`; Windows: `{evidence['jobs']['windows']}`;",
              f"- Python 3.11/3.12/3.13: {evidence['python_matrix']['3.11']['tests_passed']} / {evidence['python_matrix']['3.12']['tests_passed']} / {evidence['python_matrix']['3.13']['tests_passed']} passed;",
              '- twenty-two self-contained SVG assets and the twelve-diagram visual atlas passed documentation and asset-safety contracts;',
              '- real Aspen/HYSYS: `PENDING_REAL_ASPEN_CERTIFICATION`.',
              '',
              end,
          ])
          def insert(path: Path, block: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.DOTALL)
              if pattern.search(text):
                  text = pattern.sub(block, text, count=1)
              else:
                  anchor = '<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:END -->'
                  index = text.find(anchor)
                  if index < 0:
                      raise RuntimeError(f'Qualification anchor missing in {path}')
                  index += len(anchor)
                  text = text[:index] + '\n\n' + block + text[index:]
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
          insert(Path('README.md'), zh)
          insert(Path('README.en.md'), en)
          PY
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py
          git add README.md README.en.md docs/README_VISUAL_REFRESH_VALIDATION.json docs/README_VISUAL_REFRESH_VALIDATION.md
          git commit -m 'test: record AI README main qualification'
          git push origin HEAD:main
          if [[ "$QUALITY_RESULT" != success || "$PY311_RESULT" != success || "$PY312_RESULT" != success || "$PY313_RESULT" != success || "$WINDOWS_RESULT" != success ]]; then
            exit 1
          fi
