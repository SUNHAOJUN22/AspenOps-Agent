name: One-time math and performance qualification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-performance-qualification-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aspenops-math-performance-qualification
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Verify registration and install locked dependencies
        shell: bash
        env:
          EXPECTED_PARENT: 8349caa6d20450684b2f96169235d9f71f673bb9
          WORKFLOW_PATH: .github/workflows/math-performance-qualification-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          git diff --check HEAD^ HEAD
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing

      - name: Measure current serialization baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/benchmark_result_to_dict.py <<'PY'
          from __future__ import annotations

          import gc
          import hashlib
          import json
          import statistics
          import sys
          import time
          from pathlib import Path
          from typing import Any

          from aspenops_nexus.models import EvaluationResult


          def result_document() -> EvaluationResult:
              values: dict[str, Any] = {f"value_{i}": i * 0.125 for i in range(96)}
              diagnostics: dict[str, Any] = {
                  "state_trace": ["received", "compiled", "solved", "verified"],
                  "runtime": {
                      "backend": "mock",
                      "nested": {
                          "limits": list(range(32)),
                          "labels": {f"k{i}": f"v{i}" for i in range(32)},
                      },
                  },
                  "constraints": [
                      {
                          "name": f"c{i}",
                          "actual": i * 0.1,
                          "limit": i * 0.1 + 1.0,
                          "violation": 0.0,
                          "passed": True,
                      }
                      for i in range(48)
                  ],
              }
              balances = {
                  f"balance_{i}": {
                      "residual": 0.0,
                      "absolute": 0.0,
                      "scale": float(i + 1),
                      "relative": 0.0,
                      "abs_tol": 1e-6,
                      "rel_tol": 1e-6,
                      "passed": 1.0,
                  }
                  for i in range(24)
              }
              return EvaluationResult(
                  ok=True,
                  communication_ok=True,
                  engine_ok=True,
                  converged=True,
                  feasible=True,
                  values=values,
                  units={key: "kg/h" for key in values},
                  violations=[],
                  diagnostics=diagnostics,
                  elapsed_s=0.125,
                  balance_residuals=balances,
                  request_hash="a" * 64,
                  worker_id=3,
              )


          def measure(result: EvaluationResult, loops: int = 600, repeats: int = 9) -> float:
              samples: list[float] = []
              checksum = 0
              for _ in range(repeats):
                  gc.collect()
                  started = time.perf_counter()
                  for _ in range(loops):
                      payload = result.to_dict()
                      checksum ^= id(payload)
                  samples.append(time.perf_counter() - started)
              if checksum == -1:
                  raise AssertionError("unreachable checksum")
              return statistics.median(samples)


          output = Path(sys.argv[1])
          result = result_document()
          payload = result.to_dict()
          payload["diagnostics"]["runtime"]["nested"]["limits"].append(999)
          payload["values"]["value_0"] = -1.0
          assert 999 not in result.diagnostics["runtime"]["nested"]["limits"]
          assert result.values["value_0"] == 0.0
          canonical = json.dumps(
              result.to_dict(), sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          report = {
              "loops": 600,
              "seconds": measure(result),
              "payload_sha256": hashlib.sha256(canonical).hexdigest(),
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          uv run python /tmp/benchmark_result_to_dict.py /tmp/to-dict-before.json

      - name: Apply field-aware copy and serialization candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/optimize_result_deepcopy_once.py
          uv run python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one target in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          models = Path("src/aspenops_nexus/models.py")
          replace_once(
              models,
              "from dataclasses import asdict, dataclass, field\n",
              "from dataclasses import dataclass, field\n",
          )
          replace_once(
              models,
              """    def to_dict(self) -> dict[str, Any]:
                  return asdict(self)
          """,
              """    def to_dict(self) -> dict[str, Any]:
                  \"\"\"Serialize JSON-like fields without generic dataclass traversal.\"\"\"
                  return {
                      \"ok\": self.ok,
                      \"communication_ok\": self.communication_ok,
                      \"engine_ok\": self.engine_ok,
                      \"converged\": self.converged,
                      \"feasible\": self.feasible,
                      \"values\": deepcopy(self.values),
                      \"units\": self.units.copy(),
                      \"violations\": self.violations.copy(),
                      \"diagnostics\": deepcopy(self.diagnostics),
                      \"elapsed_s\": self.elapsed_s,
                      \"balance_residuals\": {
                          name: detail.copy() for name, detail in self.balance_residuals.items()
                      },
                      \"cache_source\": self.cache_source,
                      \"cache_hit\": self.cache_hit,
                      \"request_hash\": self.request_hash,
                      \"worker_id\": self.worker_id,
                  }
          """,
          )

          tests = Path("tests/test_evaluation_result_deepcopy.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_evaluation_result_to_dict_is_equivalent_and_deeply_isolated() -> None:"
          if marker in text:
              raise RuntimeError("to_dict regression test already exists")
          text += """


def test_evaluation_result_to_dict_is_equivalent_and_deeply_isolated() -> None:
    result = _result()
    payload = result.to_dict()
    restored = EvaluationResult.from_dict(payload)
    assert restored == result

    payload[\"values\"][\"shared\"][\"items\"].append(4)
    payload[\"diagnostics\"][\"shared\"][\"items\"].append(5)
    payload[\"units\"][\"shared\"] = None
    payload[\"violations\"].append(\"mutated\")
    payload[\"balance_residuals\"][\"mass\"][\"relative\"] = 1.0

    assert result.values[\"shared\"][\"items\"] == [1, 2, 3]
    assert result.diagnostics[\"shared\"][\"items\"] == [1, 2, 3]
    assert result.units[\"shared\"] == \"fraction\"
    assert result.violations == [\"example\"]
    assert result.balance_residuals[\"mass\"][\"relative\"] == 0.0
          """
          tests.write_text(text, encoding="utf-8")
          PY
          rm -f \
            .github/workflows/optimize-result-deepcopy-once.yml \
            .github/workflows/optimize-result-deepcopy-once-v2.yml \
            tools/optimize_result_deepcopy_once.py
          uv run ruff format \
            src/aspenops_nexus/models.py \
            scripts/benchmark_result_deepcopy.py \
            tests/test_evaluation_result_deepcopy.py
          uv run ruff check --fix \
            src/aspenops_nexus/models.py \
            scripts/benchmark_result_deepcopy.py \
            tests/test_evaluation_result_deepcopy.py
          git diff --check

      - name: Audit numerical and mathematical contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          from aspenops_nexus.evaluation import _constraint_violation, _finite_nonnegative_sum
          from aspenops_nexus.models import ConstraintSpec
          from aspenops_nexus.optimization import (
              _finite_weighted_sum,
              _saturating_nonnegative_add,
          )

          cases = [
              ("<", 9.5, 10.0, 0.5, 0.0),
              ("<", 9.75, 10.0, 0.5, 0.25),
              ("<=", 10.5, 10.0, 0.5, 0.0),
              ("<=", 10.75, 10.0, 0.5, 0.25),
              (">", 10.5, 10.0, 0.5, 0.0),
              (">", 10.25, 10.0, 0.5, 0.25),
              (">=", 9.5, 10.0, 0.5, 0.0),
              (">=", 9.25, 10.0, 0.5, 0.25),
              ("==", 10.5, 10.0, 0.5, 0.0),
              ("==", 10.75, 10.0, 0.5, 0.25),
          ]
          evaluated = []
          for operator, actual, limit, tolerance, expected in cases:
              spec = ConstraintSpec(
                  key="x",
                  identifiers={},
                  operator=operator,
                  value=limit,
                  tolerance=tolerance,
              )
              observed = _constraint_violation(spec, actual)
              assert math.isclose(observed, expected, rel_tol=0.0, abs_tol=1e-15)
              evaluated.append(
                  {
                      "operator": operator,
                      "actual": actual,
                      "limit": limit,
                      "tolerance": tolerance,
                      "violation": observed,
                  }
              )

          saturated, did_saturate = _finite_nonnegative_sum(
              [sys.float_info.max, sys.float_info.max]
          )
          assert saturated == sys.float_info.max and did_saturate
          assert _saturating_nonnegative_add(sys.float_info.max, 1.0) == sys.float_info.max
          assert _finite_weighted_sum(((2.0, 1e308), (-2.0, 1e308))) == 0.0
          assert math.isfinite(_finite_weighted_sum(((2.0, 1e308), (2.0, 1e308))))

          report = {
              "decision": "PASS",
              "constraint_cases": evaluated,
              "strict_inequalities": "tolerance is a safety margin",
              "non_strict_inequalities": "tolerance is an acceptance band",
              "equality": "absolute residual <= tolerance",
              "finite_aggregation": True,
              "weighted_overflow_cancellation": True,
          }
          Path("/tmp/math-audit.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Measure and enforce performance improvements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/qualification
          uv run python scripts/benchmark_result_deepcopy.py \
            --output var/qualification/result-deepcopy-benchmark.json \
            --min-speedup 1.5
          uv run python /tmp/benchmark_result_to_dict.py /tmp/to-dict-after.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("/tmp/to-dict-before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("/tmp/to-dict-after.json").read_text(encoding="utf-8"))
          if before["payload_sha256"] != after["payload_sha256"]:
              raise AssertionError("Serialized payload changed")
          speedup = before["seconds"] / after["seconds"]
          if speedup < 1.15:
              raise AssertionError(f"to_dict speedup below threshold: {speedup:.3f}x")
          decision = {
              "decision": "PASS",
              "before_seconds": before["seconds"],
              "after_seconds": after["seconds"],
              "speedup": speedup,
              "minimum_speedup": 1.15,
              "payload_equal": True,
          }
          Path("var/qualification/result-to-dict-benchmark.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

      - name: Run focused and full Python matrix
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11 3.12 3.13
          uv run pytest -W error::ResourceWarning \
            tests/test_evaluation_result_deepcopy.py \
            tests/test_runtime_closure.py \
            tests/test_finite_aggregation.py \
            --junitxml=var/qualification/focused.xml
          for version in 3.11 3.12 3.13; do
            uv sync --python "$version" --frozen --extra dev --extra agent --extra signing
            uv run pytest -W error::ResourceWarning \
              --junitxml="var/qualification/junit-${version}.xml" \
              2>&1 | tee "var/qualification/pytest-${version}.log"
          done

      - name: Run coverage, order, quality, security and build gates
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=json:var/qualification/coverage.json \
            --cov-fail-under=95
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir var/qualification
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py \
            --output var/qualification/source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/qualification/bandit.json
          uv run python scripts/measure_operation_counts.py \
            --output var/qualification/operation-counts.json
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/qualification/benchmark-smoke.json \
            --smoke
          uv build
          git diff --check

      - name: Write evidence, remove one-time workflow and publish
        shell: bash
        env:
          QUALIFIED_SOURCE_BASELINE: 0e12306bc49985b6a2c71d9db04ab39ed13fa15d
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          deepcopy_benchmark = json.loads(
              Path("var/qualification/result-deepcopy-benchmark.json").read_text(
                  encoding="utf-8"
              )
          )
          serialization_benchmark = json.loads(
              Path("var/qualification/result-to-dict-benchmark.json").read_text(
                  encoding="utf-8"
              )
          )
          math_audit = json.loads(Path("/tmp/math-audit.json").read_text(encoding="utf-8"))
          coverage = json.loads(
              Path("var/qualification/coverage.json").read_text(encoding="utf-8")
          )
          operation_counts = json.loads(
              Path("var/qualification/operation-counts.json").read_text(encoding="utf-8")
          )
          report = {
              "schema": "aspenops.math-performance-qualification/v1",
              "decision": "PASS",
              "qualified_source_baseline": os.environ["QUALIFIED_SOURCE_BASELINE"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "aspen_executed": False,
              "boundary": (
                  "Portable Python numerical, result-copy and serialization qualification; "
                  "not licensed Aspen Plus/HYSYS physical solve evidence."
              ),
              "changes": [
                  "EvaluationResult has a memo-aware field-specific __deepcopy__ implementation.",
                  "EvaluationResult.to_dict avoids generic dataclass traversal.",
                  "Temporary optimization registration workflows and patch tooling are removed.",
              ],
              "deepcopy_benchmark": deepcopy_benchmark,
              "serialization_benchmark": serialization_benchmark,
              "math_audit": math_audit,
              "coverage_percent": coverage["totals"]["percent_covered"],
              "operation_counts": {
                  "pool": operation_counts["pool"],
                  "memory_cache": operation_counts["memory_cache"],
                  "cache": operation_counts["cache"],
              },
              "gates": {
                  "focused_tests": "PASS",
                  "python_3_11": "PASS",
                  "python_3_12": "PASS",
                  "python_3_13": "PASS",
                  "coverage": "PASS",
                  "order_independence": "PASS",
                  "ruff": "PASS",
                  "format": "PASS",
                  "mypy_strict": "PASS",
                  "compileall": "PASS",
                  "source_tree_audit": "PASS",
                  "bandit": "PASS",
                  "operation_counts": "PASS",
                  "benchmark_smoke": "PASS",
                  "build": "PASS",
              },
              "external_gate": "PENDING_LICENSED_WINDOWS_ASPEN_ENGINEERING_CERTIFICATION",
          }
          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          (docs / "MATH_PERFORMANCE_QUALIFICATION_RESULT.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          markdown = (
              "# Math and Performance Qualification Result\n\n"
              "Decision: **PASS**\n\n"
              f"- Result deepcopy speedup: `{deepcopy_benchmark['speedup']:.3f}x`\n"
              f"- Result serialization speedup: `{serialization_benchmark['speedup']:.3f}x`\n"
              f"- Serialization payload equality: `{serialization_benchmark['payload_equal']}`\n"
              f"- Python 3.12 branch coverage: `{report['coverage_percent']:.3f}%`\n"
              "- Python 3.11 / 3.12 / 3.13 full suites: `PASS`\n"
              "- Mathematical contracts, order, quality, security and build gates: `PASS`\n"
              "- Licensed Windows/Aspen engineering certification: `PENDING`\n\n"
              "The performance measurements cover portable Python result copying and "
              "serialization only; they are not Aspen solve-speed evidence.\n"
          )
          (docs / "MATH_PERFORMANCE_QUALIFICATION_RESULT.md").write_text(
              markdown, encoding="utf-8"
          )
          PY
          git rm .github/workflows/math-performance-qualification-once.yml
          registration_sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$registration_sha"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: accelerate result copying and serialization"
          git push origin HEAD:main

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: math-performance-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/qualification
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
