name: Comprehensive Main Audit Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-comprehensive-main-audit-once
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.title == 'ASPENOPS_MAIN_COMPREHENSIVE_AUDIT_AND_AUTO_UPDATE_V1_20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Audit, repair and qualify current main
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGING_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(git rev-parse HEAD^)"
          SELF=.github/workflows/comprehensive-main-audit-once.yml
          E=var/comprehensive-audit
          rm -rf "$E" dist /tmp/aspenops-comprehensive-wheel
          mkdir -p "$E"
          rm -f "$SELF" docs/COMPREHENSIVE_AUDIT_BLOCKER.json

          : > "$E/status.tsv"
          failed=0
          gate() {
            local name="$1"
            shift
            set +e
            "$@" >"$E/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          gate lock-check uv lock --check
          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate dependency-audit bash -lc '
            set -euo pipefail
            failed=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem="var/comprehensive-audit/dependency-${platform}-${version}"
                if ! uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json >"${stem}.json" 2>"${stem}.log"; then
                  failed=1
                fi
                python -m json.tool "${stem}.json" >/dev/null || failed=1
              done
            done
            exit "$failed"
          '
          gate ruff-fix uv run --python 3.12 ruff check --fix .
          gate format-fix uv run --python 3.12 ruff format .
          gate diff-boundary python - <<'PY'
          from pathlib import Path
          import subprocess

          self_path = '.github/workflows/comprehensive-main-audit-once.yml'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          bad = []
          for path in changed:
              if path == self_path:
                  continue
              item = Path(path)
              if not path.startswith(('src/', 'scripts/', 'tests/')) or item.suffix not in {'.py', '.pyi'}:
                  bad.append(path)
          if bad:
              raise SystemExit('automatic-fix boundary violation: ' + ', '.join(bad))
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit \
              --recursive src scripts --severity-level high --confidence-level high \
              --format json --output var/comprehensive-audit/bandit.json \
              2>var/comprehensive-audit/bandit.log || status=$?
            python -m json.tool var/comprehensive-audit/bandit.json >/dev/null
            exit "$status"
          '
          gate focused-tests uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_numerical_core_optimization.py \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_examples.py \
            tests/test_research_governance.py \
            tests/test_research_contract_edges.py \
            tests/test_models_strict_contracts.py \
            tests/test_backend_adapter_edges.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_batch_resource_limits.py \
            tests/test_cache.py \
            tests/test_scheduler_multiprocess_races.py \
            tests/test_archive_safety_complete.py \
            tests/test_mcp.py \
            --junitxml="$E/focused-junit.xml"

          for version in 3.11 3.12 3.13; do
            floor=94.5
            if [[ "$version" == "3.12" ]]; then floor=95.0; fi
            gate "full-${version}" bash -lc "
              set -euo pipefail
              uv sync --python ${version} --frozen --extra dev --extra agent --extra signing
              uv run --python ${version} pytest -W error::ResourceWarning \\
                --cov=aspenops_nexus --cov-branch --cov-report=term-missing \\
                --cov-report=json:${E}/coverage-${version}.json \\
                --junitxml=${E}/junit-${version}.xml \\
                --cov-fail-under=${floor}
            "
          done

          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py --seed 20260730 --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$E/process-intent-canonical.json" \
            --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py \
            --repo-root . --output "$E/benchmark-smoke.json" --smoke
          gate performance-policy uv run --python 3.12 python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc "$E/performance-baseline.md" \
            --after-doc "$E/performance-after.md" \
            --fail-on-stable-regression
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$E/wheel-metadata.json"
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project \
              --format requirements.txt --output-file var/comprehensive-audit/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-comprehensive-wheel
            uv pip sync --python /tmp/aspenops-comprehensive-wheel/bin/python \
              --require-hashes var/comprehensive-audit/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-comprehensive-wheel/bin/python \
              --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-comprehensive-wheel/bin/python
            /tmp/aspenops-comprehensive-wheel/bin/aspenops --version
            /tmp/aspenops-comprehensive-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/aspenops scheduler --help >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/aspenops cancel --help >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/aspenops optimize --help >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/aspenops mcp --help >/dev/null
            /tmp/aspenops-comprehensive-wheel/bin/python -c "from aspenops_nexus.process_ir import ProcessIntent; print(ProcessIntent)"
            /tmp/aspenops-comprehensive-wheel/bin/python -c "from aspenops_nexus.simulation_agents import capability_matrix; print(capability_matrix())"
          '

          if [[ "$failed" -ne 0 ]]; then
            git reset --hard "$STAGING_SHA"
            rm -f "$SELF"
            python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('var/comprehensive-audit')
          status = {}
          tails = {}
          for line in (evidence / 'status.tsv').read_text(encoding='utf-8').splitlines():
              name, code = line.split('\t')
              status[name] = int(code)
          for name, code in status.items():
              log = evidence / f'{name}.log'
              if code and log.exists():
                  tails[name] = log.read_text(encoding='utf-8', errors='replace').splitlines()[-120:]
          payload = {
              'schema': 'aspenops.comprehensive-audit-blocker/v1',
              'decision': 'FAIL',
              'hard_gates': status,
              'failure_tail': tails,
              'source_changes_retained': False,
              'runtime_control_plane_changed': False,
              'aspen_executed': False,
          }
          Path('docs/COMPREHENSIVE_AUDIT_BLOCKER.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'test: record comprehensive main audit blocker [skip ci]'
            git push origin HEAD:main
            gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --comment 'Comprehensive audit failed closed. See docs/COMPREHENSIVE_AUDIT_BLOCKER.json.' || true
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path('var/comprehensive-audit')
          status = {}
          for line in (evidence / 'status.tsv').read_text(encoding='utf-8').splitlines():
              name, code = line.split('\t')
              status[name] = int(code)

          def junit(path: Path) -> dict[str, int | float]:
              root = ET.parse(path).getroot()
              suite = root if root.tag == 'testsuite' else root.find('testsuite')
              if suite is None:
                  raise RuntimeError(f'No testsuite in {path}')
              return {
                  'tests': int(suite.attrib.get('tests', 0)),
                  'failures': int(suite.attrib.get('failures', 0)),
                  'errors': int(suite.attrib.get('errors', 0)),
                  'skipped': int(suite.attrib.get('skipped', 0)),
                  'time_seconds': float(suite.attrib.get('time', 0.0)),
              }

          def coverage(path: Path) -> float:
              totals = json.loads(path.read_text(encoding='utf-8'))['totals']
              return float(totals.get('percent_covered', 0.0))

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          source_changes = [
              path for path in changed
              if path != '.github/workflows/comprehensive-main-audit-once.yml'
          ]
          full = {version: junit(evidence / f'junit-{version}.xml') for version in ('3.11', '3.12', '3.13')}
          coverage_values = {
              version: coverage(evidence / f'coverage-{version}.json')
              for version in ('3.11', '3.12', '3.13')
          }
          payload = {
              'schema': 'aspenops.comprehensive-main-audit/v1',
              'decision': 'PASS',
              'baseline_sha': os.environ.get('GITHUB_SHA', ''),
              'qualification_run': {
                  'run_id': os.environ['RUN_ID'],
                  'run_attempt': os.environ['RUN_ATTEMPT'],
              },
              'hard_gates': status,
              'focused_tests': junit(evidence / 'focused-junit.xml'),
              'full_tests': full,
              'coverage_percent': coverage_values,
              'source_files_changed': source_changes,
              'source_changes_retained': bool(source_changes),
              'runtime_control_plane_changed': False,
              'aspen_executed': False,
              'parameter_estimation_executed': False,
              'dynamic_modeling_executed': False,
              'machine_learning_executed': False,
              'stale_dispatch_issues_to_close': list(range(31, 44)),
              'retained_open_external_gate': 16,
              'retained_for_separate_review': 44,
          }
          Path('docs/COMPREHENSIVE_AUDIT_RESULT.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          lines = [
              '# AspenOps Comprehensive Main Audit',
              '',
              '**Decision: PASS**',
              '',
              f"- Run: `{os.environ['RUN_ID']}` / `{os.environ['RUN_ATTEMPT']}`",
              f"- Focused tests: {payload['focused_tests']['tests']}",
              f"- Full tests: 3.11={full['3.11']['tests']}, 3.12={full['3.12']['tests']}, 3.13={full['3.13']['tests']}",
              f"- Coverage: 3.11={coverage_values['3.11']:.3f}%, 3.12={coverage_values['3.12']:.3f}%, 3.13={coverage_values['3.13']:.3f}%",
              f"- Source files changed by safe auto-fix: {len(source_changes)}",
              '- Aspen/parameter estimation/dynamics/ML: not executed',
              '- Runtime execution control plane changed: no',
              '',
          ]
          Path('docs/COMPREHENSIVE_AUDIT_RESULT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          rm -f docs/COMPREHENSIVE_AUDIT_BLOCKER.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: complete comprehensive main audit'
          git push origin HEAD:main

          for issue in $(seq 31 43); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment 'Closed as a superseded transient dispatch record after the current main branch passed comprehensive qualification.' || true
          done
          gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --comment 'Comprehensive main audit completed. See docs/COMPREHENSIVE_AUDIT_RESULT.json.' || true
