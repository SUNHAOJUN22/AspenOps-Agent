name: Main final documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-final-docs-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-main-final-documentation
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VALIDATED_SHA: c66300e38a5d3ce2d595c01398ba912627dfe90c
      CI_RUN: "30938876928"
      WINDOWS_RUN: "30938874028"
      TESTS_311: "1186"
      COVERAGE_311: "95.20"
      TESTS_312: "1186"
      COVERAGE_312: "95.20"
      TESTS_313: "1186"
      COVERAGE_313: "95.20"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Publish authoritative qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = {
              "3.11": {
                  "tests_passed": int(os.environ["TESTS_311"]),
                  "failures": 0,
                  "errors": 0,
                  "skipped": 0,
                  "branch_coverage_percent": float(os.environ["COVERAGE_311"]),
              },
              "3.12": {
                  "tests_passed": int(os.environ["TESTS_312"]),
                  "failures": 0,
                  "errors": 0,
                  "skipped": 0,
                  "branch_coverage_percent": float(os.environ["COVERAGE_312"]),
              },
              "3.13": {
                  "tests_passed": int(os.environ["TESTS_313"]),
                  "failures": 0,
                  "errors": 0,
                  "skipped": 0,
                  "branch_coverage_percent": float(os.environ["COVERAGE_313"]),
              },
          }
          validated_sha = os.environ["VALIDATED_SHA"]
          ci_run = int(os.environ["CI_RUN"])
          windows_run = int(os.environ["WINDOWS_RUN"])

          report = f"""# AspenOps single-main qualification

          ## Decision

          `PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS`

          ## Validated scope

          - branch policy: `MAIN_ONLY`;
          - validated source commit: `{validated_sha}`;
          - standard Linux CI run: `{ci_run}`;
          - standard Windows control-plane run: `{windows_run}`;
          - six-target frozen dependency audit: `PASS`;
          - locked signing dependency: `cryptography 50.0.0`;
          - real commercial Aspen Plus/HYSYS runtime: `NOT_EXECUTED`;
          - certification status: `PENDING_REAL_ASPEN_CERTIFICATION`.

          ## Python matrix

          | Python | Passed | Failed | Errors | Skipped | Branch coverage |
          |---|---:|---:|---:|---:|---:|
          | 3.11 | {metrics['3.11']['tests_passed']} | 0 | 0 | 0 | {metrics['3.11']['branch_coverage_percent']:.2f}% |
          | 3.12 | {metrics['3.12']['tests_passed']} | 0 | 0 | 0 | {metrics['3.12']['branch_coverage_percent']:.2f}% |
          | 3.13 | {metrics['3.13']['tests_passed']} | 0 | 0 | 0 | {metrics['3.13']['branch_coverage_percent']:.2f}% |

          Python 3.12 reverse-order and fixed-seed order-independence gates passed. Ruff, exact
          formatter, strict mypy, source-tree audit, high/high Bandit, dependency audit,
          distribution build, clean Wheel installation, CLI demo, MCP surface and Windows
          control-plane contracts passed.

          ## Software capability boundary

          The validated repository includes immutable execution artifacts, typed process
          requirements and ProcessDesignIR v2, deterministic engineering rules, offline
          Aspen Plus/HYSYS 14/15 compilation contracts, signed runtime qualification,
          fresh execution authorization, chained revocation policies and an independent
          short-lived witness receipt.

          It does **not** yet include a production native builder that can take arbitrary natural
          language and safely create any Aspen Plus/HYSYS flowsheet. No licensed Aspen Plus V15 or
          HYSYS V15 Golden Case, native topology/layout roundtrip, commercial solver result or
          human engineering acceptance was executed by these public workflows.
          """
          Path("docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md").write_text(
              report.replace("          ", ""), encoding="utf-8"
          )

          matrix = {
              "schema": "aspenops.main-single-branch-qualification/v1",
              "decision": "PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS",
              "branch_policy": "MAIN_ONLY",
              "validated_source_sha": validated_sha,
              "ci_run_id": ci_run,
              "windows_run_id": windows_run,
              "python_matrix": metrics,
              "python_312_order_independence": {
                  "reverse": "PASS",
                  "fixed_seed": 20260728,
                  "result": "PASS",
              },
              "quality": {
                  "six_target_dependency_audit": "PASS",
                  "cryptography_version": "50.0.0",
                  "ruff": "PASS",
                  "ruff_format": "PASS",
                  "strict_mypy": "PASS",
                  "source_tree_audit": "PASS",
                  "bandit_high_high": "PASS",
                  "distribution_build": "PASS",
                  "clean_wheel_install": "PASS",
                  "cli_demo": "PASS",
                  "mcp_surface": "PASS",
                  "windows_control_plane": "PASS",
              },
              "native_aspen_hysys_builder": "NOT_IMPLEMENTED_PRODUCTION_SCOPE",
              "real_simulator_status": "PENDING_REAL_ASPEN_CERTIFICATION",
          }
          Path("docs/MAIN_SINGLE_BRANCH_VALIDATION.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:START -->"
          end = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:END -->"
          block = f"""{start}

          ### 最新单一主干自动资格

          - 验证源码提交：`{validated_sha}`；
          - 标准 Linux CI：`{ci_run}`；标准 Windows control plane：`{windows_run}`；
          - Python 3.11：{metrics['3.11']['tests_passed']} passed，0 failed，0 skipped，{metrics['3.11']['branch_coverage_percent']:.2f}% branch coverage；
          - Python 3.12：{metrics['3.12']['tests_passed']} passed，0 failed，0 skipped，{metrics['3.12']['branch_coverage_percent']:.2f}% branch coverage，并通过反序与固定种子顺序独立性；
          - Python 3.13：{metrics['3.13']['tests_passed']} passed，0 failed，0 skipped，{metrics['3.13']['branch_coverage_percent']:.2f}% branch coverage；
          - 六组合冻结依赖审计、Ruff、formatter、strict mypy、Bandit、build、clean Wheel、MCP 与 Windows control plane：通过；
          - 详细证据：[single-main qualification](docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md)；
          - 真实 Aspen/HYSYS：`PENDING_REAL_ASPEN_CERTIFICATION`。

          {end}""".replace("          ", "")
          needle = "**已验证归档基线**只证明对应提交和对应 Actions 运行。"
          if start in readme and end in readme:
              prefix, rest = readme.split(start, 1)
              _, suffix = rest.split(end, 1)
              readme = prefix + block + suffix
          elif needle in readme:
              readme = readme.replace(needle, block + "\n\n" + needle, 1)
          else:
              raise RuntimeError("README qualification insertion point is missing")
          readme_path.write_text(readme, encoding="utf-8")

          Path("docs/MAIN_FINAL_TRIGGER_PENDING.txt").write_text(
              "Delete this file through a trusted connector commit to trigger final standard CI.\n",
              encoding="utf-8",
          )
          PY
      - name: Remove transient diagnostics, self-delete and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            docs/MAIN_SINGLE_BRANCH_BLOCKER.md \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.json \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.md \
            docs/MAIN_RUN_LOCATOR.json \
            docs/MAIN_STANDARD_RUN_LOCATOR.json \
            docs/MATH_PERFORMANCE_CLOSURE_BLOCKER.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-final-docs-once.yml
          git add -A
          git commit -m "docs: publish authoritative single-main qualification"
          git push origin HEAD:main
