name: One-shot AspenOps closure qualification

on:
  push:
    branches: [closure/20260828-code-readme]

permissions:
  contents: write

concurrency:
  group: aspenops-closure-20260828
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closure/20260828-code-readme
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.11.16
          python-version: "3.13"
          enable-cache: true
      - name: Apply reviewed source and expose final workflow view
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/closure/nonworkflow.patch.gz > /tmp/closure.patch
          git apply --index --binary /tmp/closure.patch
          python - <<'PY'
          from pathlib import Path

          package = Path("src/aspenops_nexus")
          for name in ("research_claims.py", "research_document.py"):
              path = package / name
              text = path.read_text(encoding="utf-8")
              marker = "from .research_common import (\n"
              if "from .hashing import canonical_hash\n" not in text:
                  text = text.replace(marker, "from .hashing import canonical_hash\n" + marker, 1)
              text = text.replace("    canonical_hash,\n", "", 1)
              path.write_text(text, encoding="utf-8")

          research = package / "research.py"
          text = research.read_text(encoding="utf-8")
          text = text.replace(
              "from .research_common import (\n    _canonical_bytes as _canonical_bytes,\n)\n",
              "from .hashing import canonical_bytes as _canonical_bytes\n",
              1,
          )
          text = text.replace(
              "from .research_common import (\n    canonical_hash as canonical_hash,\n)\n",
              "from .hashing import canonical_hash as canonical_hash\n",
              1,
          )
          research.write_text(text, encoding="utf-8")
          PY
          rm -rf .github/closure
          rm .github/workflows/closure-export.yml
          git add -A
      - name: Normalize and qualify canonical hashing closure
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -q
          uv run python scripts/verify_delivery.py --root . --output /tmp/delivery.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/delivery.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS', report
          PY
          git diff --check
      - name: Commit qualified non-workflow source changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows/closure-export.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(closure): centralize canonical hashes and clarify README boundaries"
          git push origin HEAD:closure/20260828-code-readme
