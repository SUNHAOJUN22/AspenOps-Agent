name: One-shot fix COM collection indexing

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/fix-com-collection-indexing.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-fix-com-collection-indexing
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Patch index-base detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/backends/aspen_plus.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _iter_collection(collection: Any, limit: int = 200) -> Iterable[Any]:
              try:
                  count = int(collection.Count)
              except Exception:
                  return ()
              values: list[Any] = []
              for index in range(min(count, limit)):
                  for candidate_index in (index, index + 1):
                      try:
                          values.append(collection.Item(candidate_index))
                          break
                      except Exception:
                          continue
              return values
          '''
          new = '''def _iter_collection(collection: Any, limit: int = 200) -> Iterable[Any]:
              try:
                  count = int(collection.Count)
              except Exception:
                  return ()
              bounded_count = min(count, limit)
              if bounded_count <= 0:
                  return ()
              values: list[Any] = []
              try:
                  values.append(collection.Item(0))
                  index_base = 0
              except Exception:
                  index_base = 1
              start = 1 if index_base == 0 else 0
              for index in range(start, bounded_count):
                  try:
                      values.append(collection.Item(index + index_base))
                  except Exception:
                      continue
              return values
          '''
          if old not in text:
              raise SystemExit("expected _iter_collection block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Normalize and validate source
        run: |
          uv sync --extra dev
          uv run ruff check src/aspenops_nexus/backends/aspen_plus.py
          uv run ruff format src/aspenops_nexus/backends/aspen_plus.py
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-com-collection-indexing.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/backends/aspen_plus.py \
            .github/workflows/fix-com-collection-indexing.yml
          git commit -m "fix: detect COM collection index base once"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
