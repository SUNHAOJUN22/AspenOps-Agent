name: Inspect final README source validation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-validation-diagnostic-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 31ec7640a17d21fe38f7d271afa8f1efcca59756
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Query source runs
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'AspenOps-source-diagnostic'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                  return json.load(r)
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['SOURCE_SHA']
          runs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100').get('workflow_runs',[])
          output=[]
          for run in runs:
              jobs=get(run['jobs_url']).get('jobs',[])
              output.append({'id':run['id'],'name':run['name'],'path':run.get('path'),'status':run['status'],'conclusion':run.get('conclusion'),'artifacts_url':run['artifacts_url'],'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'failed_steps':[s['name'] for s in j.get('steps',[]) if s.get('conclusion')=='failure']} for j in jobs]})
          Path('docs/README_SOURCE_VALIDATION_DIAGNOSTIC.json').write_text(json.dumps({'source_sha':sha,'runs':output},indent=2)+"\n")
          PY
      - name: Publish and clean
        run: |
          rm -f .github/workflows/source-validation-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record final README source validation diagnostic'
          git push origin HEAD:main
