name: Main clean finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-clean-finalize-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: aspenops-main-clean-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 7380f494a9264ee5efe9f600b8ba9481898fc5fb
      WORKFLOW_PATH: .github/workflows/main-clean-finalize-once.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the finalizer is the only change after the tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$TARGET_SHA" HEAD)" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA" HEAD)" = "$WORKFLOW_PATH"
      - name: Require clean standard workflows for the tested source
        id: source-runs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh run list --repo "$GITHUB_REPOSITORY" \
              --commit "$TARGET_SHA" \
              --limit 30 \
              --json databaseId,workflowName,status,conclusion,event,createdAt \
              > /tmp/source-runs.json
            python - <<'PY' > /tmp/source-state
          import json
          from pathlib import Path

          runs = json.loads(Path("/tmp/source-runs.json").read_text(encoding="utf-8"))
          required = ("CI", "Windows control-plane contracts")
          selected = {}
          for item in runs:
              name = item["workflowName"]
              if name in required and item.get("event") == "push" and name not in selected:
                  selected[name] = item
          if set(selected) != set(required):
              print("waiting")
          elif any(item["status"] != "completed" for item in selected.values()):
              print("waiting")
          elif all(item["conclusion"] == "success" for item in selected.values()):
              print("success")
              print(selected["CI"]["databaseId"])
              print(selected["Windows control-plane contracts"]["databaseId"])
          else:
              print("failure")
              for name in required:
                  item = selected.get(name)
                  if item:
                      print(item["databaseId"])
          PY
            state="$(head -n 1 /tmp/source-state)"
            if [[ "$state" == "success" ]]; then
              ci_run="$(sed -n '2p' /tmp/source-state)"
              windows_run="$(sed -n '3p' /tmp/source-state)"
              echo "ci_run=$ci_run" >> "$GITHUB_OUTPUT"
              echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
              break
            fi
            if [[ "$state" == "failure" ]]; then
              cat /tmp/source-runs.json
              while read -r run_id; do
                [[ "$run_id" =~ ^[0-9]+$ ]] || continue
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
              done < <(tail -n +2 /tmp/source-state)
              exit 1
            fi
            sleep 10
          done
          test -n "${ci_run:-}"
          test -n "${windows_run:-}"
      - name: Download and parse exact Python evidence
        id: metrics
        env:
          CI_RUN: ${{ steps.source-runs.outputs.ci_run }}
        shell: bash
        run: |
          set -euo pipefail
          run_attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq .run_attempt)"
          for version in 3.11 3.12 3.13; do
            artifact="ci-evidence-python-${version}-${CI_RUN}-${run_attempt}"
            destination="/tmp/evidence-${version}"
            mkdir -p "$destination"
            for retry in 1 2 3 4 5; do
              if gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact" --dir "$destination"; then
                break
              fi
              sleep 5
            done
            find "$destination" -type f -maxdepth 5 -print
          done
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for version in ("3.11", "3.12", "3.13"):
              root = Path(f"/tmp/evidence-{version}")
              coverage_files = list(root.rglob(f"coverage-{version}.json"))
              junit_files = list(root.rglob(f"junit-{version}.xml"))
              if len(coverage_files) != 1 or len(junit_files) != 1:
                  raise SystemExit(
                      f"Expected one coverage and JUnit file for {version}; "
                      f"found {coverage_files!r}, {junit_files!r}"
                  )
              coverage = json.loads(coverage_files[0].read_text(encoding="utf-8"))
              xml_root = ET.parse(junit_files[0]).getroot()
              tests = int(xml_root.attrib.get("tests", 0))
              if tests == 0:
                  tests = sum(int(item.attrib.get("tests", 0)) for item in xml_root)
              suffix = version.replace(".", "")
              print(f"tests_{suffix}={tests}")
              print(f"coverage_{suffix}={coverage['totals']['percent_covered']:.2f}")
          PY
      - name: Generate authoritative report and README metrics
        env:
          CI_RUN: ${{ steps.source-runs.outputs.ci_run }}
          WINDOWS_RUN: ${{ steps.source-runs.outputs.windows_run }}
          TESTS_311: ${{ steps.metrics.outputs.tests_311 }}
          COVERAGE_311: ${{ steps.metrics.outputs.coverage_311 }}
          TESTS_312: ${{ steps.metrics.outputs.tests_312 }}
          COVERAGE_312: ${{ steps.metrics.outputs.coverage_312 }}
          TESTS_313: ${{ steps.metrics.outputs.tests_313 }}
          COVERAGE_313: ${{ steps.metrics.outputs.coverage_313 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = {
              "3.11": {"tests_passed": int(os.environ["TESTS_311"]), "branch_coverage_percent": float(os.environ["COVERAGE_311"])},
              "3.12": {"tests_passed": int(os.environ["TESTS_312"]), "branch_coverage_percent": float(os.environ["COVERAGE_312"])},
              "3.13": {"tests_passed": int(os.environ["TESTS_313"]), "branch_coverage_percent": float(os.environ["COVERAGE_313"])},
          }
          target = os.environ["TARGET_SHA"]
          ci_run = int(os.environ["CI_RUN"])
          windows_run = int(os.environ["WINDOWS_RUN"])
          report = f"""# AspenOps single-main qualification

          ## Decision

          `PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS`

          ## Scope

          - branch policy: `MAIN_ONLY`;
          - validated source commit: `{target}`;
          - standard Linux CI run: `{ci_run}`;
          - standard Windows control-plane run: `{windows_run}`;
          - six-target locked dependency audit: passed with `cryptography 50.0.0`;
          - real commercial Aspen/HYSYS runtime: not executed;
          - certification status: `PENDING_REAL_ASPEN_CERTIFICATION`.

          ## Python matrix

          | Python | Tests | Branch coverage |
          |---|---:|---:|
          | 3.11 | {metrics['3.11']['tests_passed']} | {metrics['3.11']['branch_coverage_percent']:.2f}% |
          | 3.12 | {metrics['3.12']['tests_passed']} | {metrics['3.12']['branch_coverage_percent']:.2f}% |
          | 3.13 | {metrics['3.13']['tests_passed']} | {metrics['3.13']['branch_coverage_percent']:.2f}% |

          Python 3.12 reverse and fixed-seed order-independence passed. Ruff, exact formatter,
          strict mypy, source audit, high/high Bandit, dependency audit, distribution build,
          clean Wheel installation, CLI demo, MCP surface and Windows control-plane contracts passed.

          This report qualifies software control-plane and offline build contracts only. It does
          not prove native Aspen/HYSYS flowsheet construction, thermodynamic correctness,
          equipment sizing, process safety or human engineering acceptance.
          """
          Path("docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md").write_text(
              report.replace("          ", ""), encoding="utf-8"
          )
          matrix = {
              "schema": "aspenops.main-single-branch-qualification/v1",
              "decision": "PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS",
              "validated_source_sha": target,
              "ci_run_id": ci_run,
              "windows_run_id": windows_run,
              "branch_policy": "MAIN_ONLY",
              "python_matrix": metrics,
              "python_312_order_independence": "PASS",
              "six_target_dependency_audit": "PASS",
              "real_simulator_status": "PENDING_REAL_ASPEN_CERTIFICATION",
          }
          Path("docs/MAIN_SINGLE_BRANCH_VALIDATION.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:START -->"
          end = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:END -->"
          block = f"""{start}

          ### 最新单一主干自动资格

          - 验证源码提交：`{target}`；
          - 标准 Linux CI：`{ci_run}`；标准 Windows control plane：`{windows_run}`；
          - Python 3.11：{metrics['3.11']['tests_passed']} passed，{metrics['3.11']['branch_coverage_percent']:.2f}% branch coverage；
          - Python 3.12：{metrics['3.12']['tests_passed']} passed，{metrics['3.12']['branch_coverage_percent']:.2f}% branch coverage，并通过顺序独立性；
          - Python 3.13：{metrics['3.13']['tests_passed']} passed，{metrics['3.13']['branch_coverage_percent']:.2f}% branch coverage；
          - 六组合冻结依赖审计、Linux quality/build/Wheel/MCP 与 Windows control plane：通过；
          - 详细证据：[single-main qualification](docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md)；
          - 真实 Aspen：`PENDING_REAL_ASPEN_CERTIFICATION`。

          {end}""".replace("          ", "")
          needle = "**已验证归档基线**只证明对应提交和对应 Actions 运行。"
          if start in readme and end in readme:
              prefix, rest = readme.split(start, 1)
              _, suffix = rest.split(end, 1)
              readme = prefix + block + suffix
          elif needle in readme:
              readme = readme.replace(needle, block + "\n\n" + needle, 1)
          else:
              raise RuntimeError("README qualification insertion point is missing")
          readme_path.write_text(readme, encoding="utf-8")
          PY
      - name: Commit clean documentation and self-delete
        id: final-commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_PATH"
          rm -f \
            docs/MAIN_SINGLE_BRANCH_BLOCKER.md \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.json \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.md \
            docs/MAIN_RUN_LOCATOR.json \
            docs/MATH_PERFORMANCE_CLOSURE_BLOCKER.json
          git add -A
          git commit -m "chore: finalize single-main qualification"
          git push origin HEAD:main
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require final standard workflows after documentation commit
        env:
          FINAL_SHA: ${{ steps.final-commit.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh run list --repo "$GITHUB_REPOSITORY" \
              --commit "$FINAL_SHA" \
              --limit 30 \
              --json databaseId,workflowName,status,conclusion,event \
              > /tmp/final-runs.json
            state="$(python - <<'PY'
          import json
          from pathlib import Path

          runs = json.loads(Path("/tmp/final-runs.json").read_text(encoding="utf-8"))
          required = {"CI", "Windows control-plane contracts"}
          selected = {item["workflowName"]: item for item in runs if item["workflowName"] in required and item.get("event") == "push"}
          if set(selected) != required or any(item["status"] != "completed" for item in selected.values()):
              print("waiting")
          elif all(item["conclusion"] == "success" for item in selected.values()):
              print("success")
          else:
              print("failure")
          PY
          )"
            if [[ "$state" == "success" ]]; then
              cat /tmp/final-runs.json
              exit 0
            fi
            if [[ "$state" == "failure" ]]; then
              cat /tmp/final-runs.json
              for run_id in $(python - <<'PY'
          import json
          from pathlib import Path
          for item in json.loads(Path("/tmp/final-runs.json").read_text()):
              if item["workflowName"] in {"CI", "Windows control-plane contracts"}:
                  print(item["databaseId"])
          PY
              ); do
                gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
              done
              exit 1
            fi
            sleep 10
          done
          cat /tmp/final-runs.json
          exit 1
      - name: Close stacked PRs and delete every feature branch
        env:
          FINAL_SHA: ${{ steps.final-commit.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in 103 104 105 106 107 108 109 110; do
            state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [[ "$state" == "OPEN" ]]; then
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" \
                --comment "Consolidated and requalified on the single main branch at ${FINAL_SHA}."
            fi
          done
          branches=(
            feature/aspenops-fresh-runtime-authorization
            feature/aspenops-natural-language-flowsheet-v3
            feature/aspenops-process-requirement-ir-v2
            feature/aspenops-qualified-licensed-link
            feature/aspenops-revocation-witness
            feature/aspenops-runtime-profile-qualification
            feature/aspenops-signed-revocation-policy
            feature/aspenops-v15-compilation-contracts
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')
          printf 'Remaining branches: %s\n' "${remaining[*]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "main"
