name: Phase 7 migrate and targeted gate

on:
  pull_request:
    branches:
      - feature/aspenops-signed-revocation-policy
    paths:
      - .github/workflows/phase7-migrate-and-test-once.yml

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-revocation-witness
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          witness_test = Path("tests/test_revocation_witness.py")
          text = witness_test.read_text(encoding="utf-8")
          old = '''    with pytest.raises(ValueError, match="policy_sequence"):
              item.assert_matches(replace(policy.statement, sequence=2), checkpoint)  # type: ignore[arg-type]
          '''
          new = '''    changed_policy = replace(
              policy,
              statement=replace(policy.statement, sequence=2),
          )
              with pytest.raises(ValueError, match="policy_sequence"):
                  item.assert_matches(changed_policy, checkpoint)
          '''
          if text.count(old) != 1:
              raise RuntimeError("Expected one witness policy-mismatch target")
          witness_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          authorization_test = Path("tests/test_runtime_execution_authorization.py")
          text = authorization_test.read_text(encoding="utf-8")
          import_marker = "import pytest\n"
          helper_import = (
              "\nfrom tests.revocation_witness_support import "
              "install_revocation_witness\n"
          )
          if helper_import.strip() not in text:
              if text.count(import_marker) != 1:
                  raise RuntimeError("Authorization pytest import marker not found")
              text = text.replace(import_marker, import_marker + helper_import, 1)
          return_marker = "    return policy_document\n"
          install_line = (
              "    install_revocation_witness(root, verified, checkpoint, now=NOW)\n"
          )
          if install_line not in text:
              if text.count(return_marker) != 1:
                  raise RuntimeError("Authorization policy return marker not found")
              text = text.replace(return_marker, install_line + return_marker, 1)
          text = text.replace(
              "    assert first.expires_at == NOW + timedelta(hours=2)\n",
              "    assert first.expires_at == NOW + timedelta(hours=1)\n",
              1,
          )
          checkpoint_assert = "    assert len(first.revocation_checkpoint_sha256) == 64\n"
          witness_asserts = '''    assert len(first.revocation_witness_sha256) == 64
              assert len(first.revocation_witness_signing_key_id) == 32
              assert first.revocation_witness_id == "test-witness"
              assert first.revocation_witness_expires_at == NOW + timedelta(hours=1)
          '''
          if "first.revocation_witness_sha256" not in text:
              if text.count(checkpoint_assert) != 1:
                  raise RuntimeError("Authorization checkpoint assertion marker not found")
              text = text.replace(
                  checkpoint_assert,
                  checkpoint_assert + witness_asserts,
                  1,
              )
          if "def test_missing_witness_receipt_fails_closed" not in text:
              insert_at = text.index("\ndef test_future_and_expired_signed_policies_fail_closed")
              new_test = '''

          def test_missing_witness_receipt_fails_closed(tmp_path: Path) -> None:
              plan, profile, envelope, _ = context(tmp_path)
              from aspenops_nexus.revocation_witness import WITNESS_RECEIPT_FILENAME

              (tmp_path / WITNESS_RECEIPT_FILENAME).unlink()
              with pytest.raises(FileNotFoundError, match="witness receipt is unavailable"):
                  authorize_runtime_execution(
                      plan,
                      profile,
                      envelope,
                      trusted_key_dir=tmp_path,
                      now=NOW,
                  )
          '''
              text = text[:insert_at] + new_test + text[insert_at:]
          authorization_test.write_text(text, encoding="utf-8")

          builder_test = Path("tests/test_native_builder_contract.py")
          text = builder_test.read_text(encoding="utf-8")
          if helper_import.strip() not in text:
              if text.count(import_marker) != 1:
                  raise RuntimeError("Native builder pytest import marker not found")
              text = text.replace(import_marker, import_marker + helper_import, 1)
          old_checkpoint = '''    (tmp_path / REVOCATION_CHECKPOINT_FILENAME).write_text(
              json.dumps(
                  advance_revocation_policy_checkpoint(verified_policy).to_dict(),
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          '''
          new_checkpoint = '''    checkpoint = advance_revocation_policy_checkpoint(verified_policy)
              (tmp_path / REVOCATION_CHECKPOINT_FILENAME).write_text(
                  json.dumps(checkpoint.to_dict(), sort_keys=True),
                  encoding="utf-8",
              )
              install_revocation_witness(
                  tmp_path,
                  verified_policy,
                  checkpoint,
                  now=NOW,
              )
          '''
          if old_checkpoint not in text:
              raise RuntimeError("Native builder checkpoint block not found")
          text = text.replace(old_checkpoint, new_checkpoint, 1)
          record_marker = "    assert len(record.revocation_checkpoint_sha256) == 64\n"
          record_asserts = '''    assert len(record.revocation_witness_sha256) == 64
              assert len(record.revocation_witness_signing_key_id) == 32
              assert record.revocation_witness_id == "test-witness"
              assert record.revocation_witness_expires_at == "2026-08-02T13:00:00Z"
          '''
          if "record.revocation_witness_sha256" not in text:
              if text.count(record_marker) != 1:
                  raise RuntimeError("Native builder checkpoint assertion marker not found")
              text = text.replace(record_marker, record_marker + record_asserts, 1)
          builder_test.write_text(text, encoding="utf-8")
          PY
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/revocation_witness.py \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/revocation_witness_support.py \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git commit -m "test: migrate runtime authorization to revocation witnesses"
          git push origin HEAD:feature/aspenops-revocation-witness
