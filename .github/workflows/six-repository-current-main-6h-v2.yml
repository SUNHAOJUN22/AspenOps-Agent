name: Six-repository current-main six-hour qualification V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: six-repository-current-main-six-hour-v3
  cancel-in-progress: false

env:
  STAGE_ACTIVE_TARGET_NS: '10800000000000'
  TOTAL_ACTIVE_TARGET_NS: '21600000000000'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'

jobs:
  prepare:
    name: Publish controller-free AspenOps main
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/run-current-main-six-hour-v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      clean_sha: ${{ steps.candidate.outputs.clean_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Install exact AspenOps environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
      - name: Format runner and restore authoritative workflow inventory
        run: |
          set -euo pipefail
          uv run ruff format scripts/run_six_repository_active_gate.py
          rm -f .github/workflows/current-main-readme-refresh.yml
          rm -f .github/workflows/format-six-repository-runner-once.yml
          rm -f .github/workflows/six-repository-current-main-6h-v2.yml
          git diff --check
      - name: Create exact controller-free AspenOps candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            scripts/run_six_repository_active_gate.py \
            .github/workflows/current-main-readme-refresh.yml \
            .github/workflows/format-six-repository-runner-once.yml \
            .github/workflows/six-repository-current-main-6h-v2.yml
          git commit -m 'ci: publish governed exact-SHA qualification runner'
          echo 'clean_sha='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete AspenOps delivery gate on clean candidate
        run: |
          set -euo pipefail
          uv run python scripts/refresh_current_main_readme.py --check
          uv run python -m py_compile scripts/run_six_repository_active_gate.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning -q
          uv run python scripts/verify_delivery.py --root . \
            --output /tmp/aspenops-delivery-v3.json
          git diff --exit-code
          git diff --check
      - name: Publish exact clean AspenOps candidate
        run: |
          set -euo pipefail
          git fetch origin main
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          if [ "$EXPECTED_PARENT" != "$REMOTE_MAIN" ]; then
            echo "STALE_MAIN expected_parent=${EXPECTED_PARENT} remote_main=${REMOTE_MAIN}" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish preparation failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          CANDIDATE: ${{ steps.candidate.outputs.clean_sha }}
        run: |
          gh issue comment "$ISSUE" --body "SIX_REPOSITORY_CURRENT_MAIN_6H_V3 PREPARE_FAIL candidate=${CANDIDATE:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  resolve:
    name: Resolve immutable current-main identities
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      controller_sha: ${{ steps.resolve.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SUNHAOJUN22/AspenOps-Agent
          ref: ${{ needs.prepare.outputs.clean_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Validate coordinator source
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_six_repository_active_gate.py
      - name: Resolve six current main SHAs
        id: resolve
        env:
          CLEAN_ASPEN_SHA: ${{ needs.prepare.outputs.clean_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          clean_aspen_sha = os.environ["CLEAN_ASPEN_SHA"]
          entries = [
              {
                  "slug": "aspenops",
                  "kind": "aspenops",
                  "repository": "SUNHAOJUN22/AspenOps-Agent",
                  "python": "3.12",
                  "node": False,
                  "uv": True,
                  "sha": clean_aspen_sha,
              },
              {
                  "slug": "scicomputation",
                  "kind": "scicomputation",
                  "repository": "SUNHAOJUN22/TsaoSciComputation",
                  "python": "3.13",
                  "node": True,
                  "uv": False,
              },
              {
                  "slug": "processing",
                  "kind": "processing",
                  "repository": "SUNHAOJUN22/TSAO-PROCESSING-SKILL",
                  "python": "3.14",
                  "node": True,
                  "uv": False,
              },
              {
                  "slug": "resindb",
                  "kind": "resindb",
                  "repository": "SUNHAOJUN22/ResinDB-Pro-by-SunHJ",
                  "python": "3.12",
                  "node": True,
                  "uv": False,
              },
              {
                  "slug": "dft",
                  "kind": "dft",
                  "repository": "SUNHAOJUN22/TsaoDFT_skill",
                  "python": "3.12",
                  "node": True,
                  "uv": False,
              },
              {
                  "slug": "researcher",
                  "kind": "researcher",
                  "repository": "SUNHAOJUN22/TsaoSciResearcher",
                  "python": "3.12",
                  "node": True,
                  "uv": False,
              },
          ]
          for entry in entries:
              remote = f"https://github.com/{entry['repository']}.git"
              result = subprocess.run(
                  ["git", "ls-remote", remote, "refs/heads/main"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              )
              fields = result.stdout.strip().split()
              if len(fields) != 2 or len(fields[0]) != 40:
                  raise SystemExit(
                      f"invalid current-main identity for {entry['repository']}: "
                      f"{result.stdout!r}"
                  )
              remote_sha = fields[0]
              if entry["slug"] == "aspenops" and remote_sha != clean_aspen_sha:
                  raise SystemExit(
                      f"AspenOps clean SHA moved before resolve: "
                      f"expected={clean_aspen_sha} remote={remote_sha}"
                  )
              entry["sha"] = remote_sha
          matrix = json.dumps({"include": entries}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={matrix}\n")
              handle.write(f"controller_sha={clean_aspen_sha}\n")
          with open("resolved-current-main.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema_version": "six-repository-resolve-3.0.0",
                      "entries": entries,
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
      - name: Announce immutable qualification identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY' > qualification-running.md
          import json
          import os

          payload = json.load(open("resolved-current-main.json", encoding="utf-8"))
          lines = [
              "SIX_REPOSITORY_CURRENT_MAIN_6H_V3 RUNNING",
              "",
              (
                  "Each repository is bound to the exact `main` SHA below. "
                  "The target is six hours of monotonic active test-command "
                  "time per repository. Setup, queueing, downloads, uploads, "
                  "ledger I/O and sleep are excluded."
              ),
              "",
          ]
          for entry in payload["entries"]:
              lines.append(f"- `{entry['repository']}`: `{entry['sha']}`")
          lines.extend(
              [
                  "",
                  (
                      "Run: "
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  ),
                  "",
                  (
                      "The coordinator workflow removed itself before this "
                      "qualification, so AspenOps `main` contains only its four "
                      "authoritative long-lived workflows. No PASS is claimed "
                      "until both active stages finish and all remote `main` "
                      "identities are rechecked."
                  ),
              ]
          )
          print("\n".join(lines))
          PY
          gh issue comment "$ISSUE" --body-file qualification-running.md

  stage1:
    name: Stage 1 active gate - ${{ matrix.slug }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout immutable coordinator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SUNHAOJUN22/AspenOps-Agent
          ref: ${{ needs.resolve.outputs.controller_sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable tested repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: repo
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node for documentation generators
        if: matrix.node && matrix.kind != 'resindb'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up exact ResinDB Node runtime
        if: matrix.kind == 'resindb'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: repo/.nvmrc
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Set up uv for AspenOps
        if: matrix.uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install deterministic CJK fonts for ResinDB
        if: matrix.kind == 'resindb'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Install repository dependencies
        working-directory: repo
        env:
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          case "$KIND" in
            aspenops)
              uv lock --check
              uv sync --frozen --extra dev --extra agent --extra signing
              ;;
            scicomputation)
              python -m pip install --disable-pip-version-check \
                -e '.[validation,quality]'
              python -m pip check
              ;;
            processing)
              python scripts/verify_dependency_lock.py requirements.lock \
                --pyproject pyproject.toml
              python -m pip install --quiet --require-hashes \
                -r requirements.lock
              python -m pip install --quiet --no-deps \
                --no-build-isolation -e .
              python -m pip check
              ;;
            resindb)
              cp package.json /tmp/resindb-package-exact.json
              cp package-lock.json /tmp/resindb-package-lock-exact.json
              restore_manifests() {
                cp /tmp/resindb-package-exact.json package.json
                cp /tmp/resindb-package-lock-exact.json package-lock.json
              }
              trap restore_manifests EXIT
              node scripts/prepare-ci-manifest.mjs
              npm ci
              restore_manifests
              trap - EXIT
              ;;
            dft)
              python -m pip install --disable-pip-version-check --upgrade pip
              python -m pip install -c constraints/py312.txt \
                -r requirements-dev.txt
              python -m pip check
              ;;
            researcher)
              python -m pip install --disable-pip-version-check \
                -r requirements-ci.lock
              python -m pip install --disable-pip-version-check \
                -e . --no-deps
              python -m pip check
              ;;
            *)
              echo "unknown repository kind: $KIND" >&2
              exit 2
              ;;
          esac
      - name: Run one complete formal gate before active timing
        working-directory: repo
        env:
          KIND: ${{ matrix.kind }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: ${{ matrix.kind == 'researcher' && '1' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$KIND" in
            aspenops)
              uv run python scripts/refresh_current_main_readme.py --check
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy src
              uv run pytest -W error::ResourceWarning -q
              uv run python scripts/verify_delivery.py --root . \
                --output /tmp/aspenops-delivery-stage1.json
              ;;
            scicomputation)
              node scripts/refresh-current-main-readme.mjs --check
              python scripts/verify_all.py --profile core
              ;;
            processing)
              node scripts/refresh-current-main-readme.mjs --check
              python scripts/run_ci.py
              python -m tsao.cli doctor --root . --profile core
              ;;
            resindb)
              node scripts/refresh-current-main-readme.mjs --check
              npm run validate:docs
              npm run validate:source
              npm run validate:data
              npm run validate:compute
              npm run validate:scientific-ui
              npm run lint
              npm run typecheck
              npm run test:unit
              npm run test:science
              npm run build
              ;;
            dft)
              node scripts/refresh-current-main-readme.mjs --check
              python scripts/quality_gate.py
              python scripts/build_release_acceptance.py --help >/dev/null
              python scripts/capture_compute_contract_evidence.py --help >/dev/null
              ;;
            researcher)
              node scripts/refresh-current-main-readme.mjs --check
              python scripts/sync_version.py --check
              python scripts/sync_runtime_data.py --check
              python scripts/validate_schemas.py
              python scripts/validate_mathematical_contracts.py --check
              python scripts/audit_repository.py
              python scripts/validate_structure.py
              python scripts/build_readme_facts.py --check
              python scripts/generate_checksums.py --check
              python scripts/build_capability_index.py --check
              python scripts/final_acceptance_preflight.py --root . --json
              python -m pytest -q -p hypothesis.extra.pytestplugin
              ;;
          esac
          git diff --exit-code
          git diff --check
      - name: Accumulate three hours of active test-command time
        working-directory: repo
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: ${{ matrix.kind == 'researcher' && '1' || '' }}
        run: |
          python ../controller/scripts/run_six_repository_active_gate.py \
            --slug '${{ matrix.slug }}' \
            --kind '${{ matrix.kind }}' \
            --repository '${{ matrix.repository }}' \
            --tested-sha '${{ matrix.sha }}' \
            --stage 1 \
            --target-active-ns "$STAGE_ACTIVE_TARGET_NS" \
            --output-dir ../qualification/stage1
      - name: Upload stage 1 ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-main-6h-v3-stage1-${{ matrix.slug }}-${{ matrix.sha }}
          path: qualification/stage1
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  stage2:
    name: Stage 2 active gate - ${{ matrix.slug }}
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, stage1]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout immutable coordinator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SUNHAOJUN22/AspenOps-Agent
          ref: ${{ needs.resolve.outputs.controller_sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable tested repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: repo
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node for documentation generators
        if: matrix.node && matrix.kind != 'resindb'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up exact ResinDB Node runtime
        if: matrix.kind == 'resindb'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: repo/.nvmrc
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Set up uv for AspenOps
        if: matrix.uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install deterministic CJK fonts for ResinDB
        if: matrix.kind == 'resindb'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Install repository dependencies
        working-directory: repo
        env:
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          case "$KIND" in
            aspenops)
              uv lock --check
              uv sync --frozen --extra dev --extra agent --extra signing
              ;;
            scicomputation)
              python -m pip install --disable-pip-version-check \
                -e '.[validation,quality]'
              python -m pip check
              ;;
            processing)
              python scripts/verify_dependency_lock.py requirements.lock \
                --pyproject pyproject.toml
              python -m pip install --quiet --require-hashes \
                -r requirements.lock
              python -m pip install --quiet --no-deps \
                --no-build-isolation -e .
              python -m pip check
              ;;
            resindb)
              cp package.json /tmp/resindb-package-exact.json
              cp package-lock.json /tmp/resindb-package-lock-exact.json
              restore_manifests() {
                cp /tmp/resindb-package-exact.json package.json
                cp /tmp/resindb-package-lock-exact.json package-lock.json
              }
              trap restore_manifests EXIT
              node scripts/prepare-ci-manifest.mjs
              npm ci
              restore_manifests
              trap - EXIT
              ;;
            dft)
              python -m pip install --disable-pip-version-check --upgrade pip
              python -m pip install -c constraints/py312.txt \
                -r requirements-dev.txt
              python -m pip check
              ;;
            researcher)
              python -m pip install --disable-pip-version-check \
                -r requirements-ci.lock
              python -m pip install --disable-pip-version-check \
                -e . --no-deps
              python -m pip check
              ;;
            *)
              echo "unknown repository kind: $KIND" >&2
              exit 2
              ;;
          esac
      - name: Download and bind stage 1 evidence outside tested repository
        uses: actions/download-artifact@48434091c594fdd9cc8e5207ad7d32737a8d9431 # v5
        with:
          name: current-main-6h-v3-stage1-${{ matrix.slug }}-${{ matrix.sha }}
          path: qualification/previous
      - name: Accumulate the second three active hours
        working-directory: repo
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: ${{ matrix.kind == 'researcher' && '1' || '' }}
        run: |
          python ../controller/scripts/run_six_repository_active_gate.py \
            --slug '${{ matrix.slug }}' \
            --kind '${{ matrix.kind }}' \
            --repository '${{ matrix.repository }}' \
            --tested-sha '${{ matrix.sha }}' \
            --stage 2 \
            --target-active-ns "$STAGE_ACTIVE_TARGET_NS" \
            --previous-summary \
              '../qualification/previous/${{ matrix.slug }}-summary.json' \
            --output-dir ../qualification/stage2
      - name: Upload combined stage 2 ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-main-6h-v3-stage2-${{ matrix.slug }}-${{ matrix.sha }}
          path: qualification/stage2
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  finalize:
    name: Aggregate exact-tree verdicts
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, stage1, stage2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Download all stage 2 summaries
        uses: actions/download-artifact@48434091c594fdd9cc8e5207ad7d32737a8d9431 # v5
        with:
          pattern: current-main-6h-v3-stage2-*
          path: final-artifacts
          merge-multiple: true
      - name: Build final report and recheck remote main
        id: aggregate
        env:
          MATRIX_JSON: ${{ needs.resolve.outputs.matrix }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          matrix = json.loads(os.environ["MATRIX_JSON"])["include"]
          root = Path("final-artifacts")
          target = int(os.environ["TOTAL_ACTIVE_TARGET_NS"])
          results = []
          for entry in matrix:
              summary_path = root / f"{entry['slug']}-summary.json"
              if not summary_path.is_file():
                  results.append(
                      {
                          **entry,
                          "verdict": "FAIL",
                          "failure": "stage 2 summary is missing",
                          "total_active_ns": 0,
                          "total_cycles": 0,
                      }
                  )
                  continue
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              result = {**entry, **summary}
              remote = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      f"https://github.com/{entry['repository']}.git",
                      "refs/heads/main",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              ).stdout.strip().split()[0]
              result["remote_main_sha_at_finalize"] = remote
              if remote != entry["sha"]:
                  result["verdict"] = "STALE_MAIN"
                  result["failure"] = (
                      f"remote main moved: tested={entry['sha']} remote={remote}"
                  )
              elif result.get("verdict") != "PASS":
                  result["verdict"] = "FAIL"
                  result["failure"] = result.get("failure") or "stage 2 did not pass"
              elif result.get("total_active_ns", 0) < target:
                  result["verdict"] = "FAIL"
                  result["failure"] = (
                      f"active duration below target: "
                      f"{result.get('total_active_ns', 0)} < {target}"
                  )
              results.append(result)

          overall = "PASS" if all(
              item["verdict"] == "PASS" for item in results
          ) else "FAIL"
          report = {
              "schema_version": "six-repository-current-main-final-3.0.0",
              "generated_at": datetime.now(UTC).isoformat(timespec="seconds"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "target_active_ns_per_repository": target,
              "overall": overall,
              "results": results,
          }
          Path("final-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          lines = [
              f"SIX_REPOSITORY_CURRENT_MAIN_6H_V3 {overall}",
              "",
              (
                  "The values below count monotonic time spent only inside "
                  "formal test commands. Setup, queueing, downloads, uploads, "
                  "ledger I/O and retry backoff are excluded."
              ),
              "",
          ]
          for item in results:
              hours = item.get("total_active_ns", 0) / 3_600_000_000_000
              cycles = item.get("total_cycles", 0)
              lines.append(
                  f"- `{item['repository']}` `{item['sha']}`: "
                  f"**{item['verdict']}**, active={hours:.6f} h, "
                  f"cycles={cycles}"
              )
              if item.get("failure"):
                  lines.append(f"  - failure: {item['failure']}")
          lines.extend(
              [
                  "",
                  (
                      "Run: "
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  ),
                  "",
                  (
                      "This is software and evidence qualification only. It "
                      "does not assert licensed Aspen, external DFT/MD/CFD, "
                      "experimental, HSE, customer or industrial approval."
                  ),
              ]
          )
          Path("final-comment.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"overall={overall}\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload final six-repository report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-repository-current-main-6h-v3-final-${{ github.run_id }}
          path: |
            final-report.json
            final-comment.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish final machine verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body-file final-comment.md
      - name: Enforce aggregate PASS
        if: steps.aggregate.outputs.overall != 'PASS'
        run: exit 1
