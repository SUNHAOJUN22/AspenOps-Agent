name: Phase 1 one-time schema hardening

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-schema-hardening-once.yml

permissions:
  contents: write

jobs:
  patch-format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Harden nested schemas and bounded mappings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once_or_confirm(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one patch target in {path}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          requirement = Path("src/aspenops_nexus/process_requirement.py")
          replace_once_or_confirm(
              requirement,
              '''        project = _object(mapping.get("project"), "process requirement.project")
                      simulator = _text(
              ''',
              '''        project = _object(mapping.get("project"), "process requirement.project")
                      project_unknown = sorted(
                          set(project) - {"name", "target_simulator", "target_version", "language"}
                      )
                      if project_unknown:
                          raise ValueError(
                              "process requirement.project contains unsupported fields: "
                              + ", ".join(project_unknown)
                          )
                      simulator = _text(
              ''',
          )
          replace_once_or_confirm(
              requirement,
              '''        objective_mapping = _object(
                          mapping.get("process_objective"),
                          "process requirement.process_objective",
                      )
                      feed_items = _array(
              ''',
              '''        objective_mapping = _object(
                          mapping.get("process_objective"),
                          "process requirement.process_objective",
                      )
                      objective_unknown = sorted(set(objective_mapping) - {"description"})
                      if objective_unknown:
                          raise ValueError(
                              "process requirement.process_objective contains unsupported fields: "
                              + ", ".join(objective_unknown)
                          )
                      feed_items = _array(
              ''',
          )
          replace_once_or_confirm(
              requirement,
              '''        assumptions = _object(mapping.get("assumptions", {}), "process requirement.assumptions")
                      accepted = tuple(
              ''',
              '''        assumptions = _object(mapping.get("assumptions", {}), "process requirement.assumptions")
                      assumption_unknown = sorted(set(assumptions) - {"accepted", "unresolved"})
                      if assumption_unknown:
                          raise ValueError(
                              "process requirement.assumptions contains unsupported fields: "
                              + ", ".join(assumption_unknown)
                          )
                      accepted = tuple(
              ''',
          )
          replace_once_or_confirm(
              requirement,
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process requirement.metadata")
                      metadata = {
              ''',
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process requirement.metadata")
                      if len(metadata_mapping) > 1024:
                          raise ValueError(
                              f"process requirement.metadata contains {len(metadata_mapping)} entries; limit is 1024"
                          )
                      metadata = {
              ''',
          )

          design = Path("src/aspenops_nexus/process_ir_v2.py")
          replace_once_or_confirm(
              design,
              '''        vendor_mapping = _object(mapping.get("vendor_ids", {}), f"{label}.vendor_ids")
                      vendor_ids = {
              ''',
              '''        vendor_mapping = _object(mapping.get("vendor_ids", {}), f"{label}.vendor_ids")
                      if len(vendor_mapping) > 16:
                          raise ValueError(
                              f"{label}.vendor_ids contains {len(vendor_mapping)} entries; limit is 16"
                          )
                      vendor_ids = {
              ''',
          )
          replace_once_or_confirm(
              design,
              '''        raw_stoichiometry = _object(mapping.get("stoichiometry", {}), f"{label}.stoichiometry")
                      stoichiometry = {
              ''',
              '''        raw_stoichiometry = _object(mapping.get("stoichiometry", {}), f"{label}.stoichiometry")
                      if len(raw_stoichiometry) > MAX_COMPONENTS:
                          raise ValueError(
                              f"{label}.stoichiometry contains {len(raw_stoichiometry)} entries; "
                              f"limit is {MAX_COMPONENTS}"
                          )
                      stoichiometry = {
              ''',
          )
          replace_once_or_confirm(
              design,
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process design.metadata")
                      metadata = {
              ''',
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process design.metadata")
                      if len(metadata_mapping) > 1024:
                          raise ValueError(
                              f"process design.metadata contains {len(metadata_mapping)} entries; limit is 1024"
                          )
                      metadata = {
              ''',
          )
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/process_requirement.py \
            src/aspenops_nexus/process_ir_v2.py \
            src/aspenops_nexus/engineering_rules.py \
            src/aspenops_nexus/plant_templates.py \
            src/aspenops_nexus/flowsheet_preview.py \
            src/aspenops_nexus/design_contract.py \
            src/aspenops_nexus/design_validation.py \
            scripts/validate_process_design_v2.py \
            tests/test_process_requirement_v1.py \
            tests/test_process_ir_v2_rules.py \
            tests/test_plant_templates_v3.py \
            tests/test_flowsheet_preview_v3.py \
            tests/test_design_contract_v3.py \
            tests/test_phase1_unicode_resource_edges.py \
            tests/test_phase1_nested_schema_edges.py \
            tests/test_phase1_fail_closed_targets.py \
            tests/test_design_validation_v3.py
          rm -f .github/workflows/phase1-*-once*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden nested Phase 1 schema contracts"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
