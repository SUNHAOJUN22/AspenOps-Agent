# One-time controlled source repair. Remove after the repair commit is verified.
name: Source repair once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-source-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Patch root-cause defects, format, and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_ci_closure_gates.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_import = "from scripts.run_test_order_gate import _random_order, _reverse_order\n"
          if old_import not in test_text:
              raise SystemExit("closure-gate script import did not match expected source")
          test_text = test_text.replace("import json\n", "import json\nimport runpy\n", 1)
          test_text = test_text.replace(old_import, "", 1)
          old_test = (
              "def test_order_helpers_are_deterministic_and_non_mutating() -> None:\n"
              "    original = [\"a::test_one\", \"b::test_two\", \"c::test_three\", \"d::test_four\"]\n"
              "\n"
              "    assert _reverse_order(original) == list(reversed(original))\n"
              "    assert _random_order(original, 20260728) == _random_order(original, 20260728)\n"
              "    assert sorted(_random_order(original, 20260728)) == sorted(original)\n"
              "    assert original == [\"a::test_one\", \"b::test_two\", \"c::test_three\", \"d::test_four\"]\n"
          )
          new_test = (
              "def test_order_helpers_are_deterministic_and_non_mutating() -> None:\n"
              "    namespace = runpy.run_path(str(ORDER_GATE))\n"
              "    reverse_order = namespace[\"_reverse_order\"]\n"
              "    random_order = namespace[\"_random_order\"]\n"
              "    original = [\"a::test_one\", \"b::test_two\", \"c::test_three\", \"d::test_four\"]\n"
              "\n"
              "    assert reverse_order(original) == list(reversed(original))\n"
              "    assert random_order(original, 20260728) == random_order(original, 20260728)\n"
              "    assert sorted(random_order(original, 20260728)) == sorted(original)\n"
              "    assert original == [\"a::test_one\", \"b::test_two\", \"c::test_three\", \"d::test_four\"]\n"
          )
          if old_test not in test_text:
              raise SystemExit("closure-gate helper test did not match expected source")
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")

          validation_path = Path("src/aspenops_nexus/process_ir_validation.py")
          validation_text = validation_path.read_text(encoding="utf-8")
          old_validation = (
              "            port = port_map.get((endpoint.unit, endpoint.port))\n"
              "            if port is None:\n"
          )
          new_validation = (
              "            endpoint_port = port_map.get((endpoint.unit, endpoint.port))\n"
              "            if endpoint_port is None:\n"
          )
          if old_validation not in validation_text:
              raise SystemExit("endpoint port lookup did not match expected source")
          validation_text = validation_text.replace(old_validation, new_validation, 1)
          old_direction = "            if port.direction != expected_direction:\n"
          new_direction = "            if endpoint_port.direction != expected_direction:\n"
          if old_direction not in validation_text:
              raise SystemExit("endpoint port direction check did not match expected source")
          validation_path.write_text(
              validation_text.replace(old_direction, new_direction, 1),
              encoding="utf-8",
          )
          PY
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          rm .github/workflows/source-repair-once.yml
          uv run pytest -W error::ResourceWarning
          git restore .github/workflows/source-repair-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close typing collection and formatting failures"
          git push origin HEAD:main
