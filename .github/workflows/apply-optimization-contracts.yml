name: One-shot apply optimization contracts

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/apply-optimization-contracts.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-optimization-contracts
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply bounded and unambiguous optimization contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/optimization.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from .config import Settings\n",
              "from .config import Settings\nfrom .policy import PolicyError\n",
              1,
          )

          old_variable = '''        key = _text(_required(data, "key"), label="variable key")
                  kind_value = data.get("kind", "continuous")
                  kind_text = _text(kind_value, label="variable kind")
                  if kind_text not in {"continuous", "integer", "categorical", "ordinal"}:
                      raise ValueError(f"Unsupported optimization variable kind: {kind_text}")
                  kind = cast(VariableKind, kind_text)

                  identifiers_raw = _optional_object_map(data.get("identifiers", {}))
                  identifiers = {name: str(value) for name, value in identifiers_raw.items()}
                  unit_value = data.get("unit")
                  unit = None if unit_value is None else _text(unit_value, label="variable unit")
                  name_value = data.get("name", key)
                  name = _text(name_value, label="variable name")

                  lower_value = data.get("lower")
                  upper_value = data.get("upper")
                  lower = None if lower_value is None else _number(lower_value, label="lower bound")
                  upper = None if upper_value is None else _number(upper_value, label="upper bound")
                  choices_value = data.get("choices", [])
                  choices = tuple(
                      _choice(item) for item in _object_sequence(choices_value, label="variable choices")
                  )

                  if kind in {"categorical", "ordinal"}:
                      if len(choices) < 2:
                          raise ValueError(f"{kind} variable requires at least two choices")
                  elif lower is None or upper is None or upper <= lower:
                      raise ValueError(f"{kind} variable requires lower < upper")
          '''
          new_variable = '''        key = _text(_required(data, "key"), label="variable key").strip()
                  if not key:
                      raise ValueError("variable key must not be empty")
                  kind_value = data.get("kind", "continuous")
                  kind_text = _text(kind_value, label="variable kind").strip()
                  if kind_text not in {"continuous", "integer", "categorical", "ordinal"}:
                      raise ValueError(f"Unsupported optimization variable kind: {kind_text}")
                  kind = cast(VariableKind, kind_text)

                  identifiers_raw = _optional_object_map(data.get("identifiers", {}))
                  identifiers = {name: str(value) for name, value in identifiers_raw.items()}
                  unit_value = data.get("unit")
                  unit = None if unit_value is None else _text(unit_value, label="variable unit")
                  name_value = data.get("name", key)
                  name = _text(name_value, label="variable name").strip()
                  if not name:
                      raise ValueError("variable name must not be empty")

                  lower_value = data.get("lower")
                  upper_value = data.get("upper")
                  lower = None if lower_value is None else _number(lower_value, label="lower bound")
                  upper = None if upper_value is None else _number(upper_value, label="upper bound")
                  choices_value = data.get("choices", [])
                  choices = tuple(
                      _choice(item) for item in _object_sequence(choices_value, label="variable choices")
                  )
                  choice_identities = {(type(item).__name__, repr(item)) for item in choices}
                  if len(choice_identities) != len(choices):
                      raise ValueError("Optimization variable choices must be unique")

                  if kind in {"categorical", "ordinal"}:
                      if lower is not None or upper is not None:
                          raise ValueError(f"{kind} variable cannot define numeric bounds")
                      if len(choices) < 2:
                          raise ValueError(f"{kind} variable requires at least two choices")
                  else:
                      if choices:
                          raise ValueError(f"{kind} variable cannot define choices")
                      if lower is None or upper is None or upper <= lower:
                          raise ValueError(f"{kind} variable requires lower < upper")
                      if kind == "integer" and (
                          not lower.is_integer() or not upper.is_integer()
                      ):
                          raise ValueError("integer bounds must be integral")
          '''
          if old_variable not in text:
              raise SystemExit("variable contract block not found")
          text = text.replace(old_variable, new_variable, 1)

          text = text.replace(
              '            output_key = _text(output_value, label="objective output_key")\n',
              '            output_key = _text(output_value, label="objective output_key").strip()\n',
              1,
          )
          text = text.replace(
              '            key = _text(_required(data, "key"), label="objective key")\n',
              '            key = _text(_required(data, "key"), label="objective key").strip()\n',
              1,
          )
          objective_anchor = '''            output_key = _output_key(key, identifiers)

                  weight_value = data.get("weight", 1.0)
          '''
          objective_replacement = '''            output_key = _output_key(key, identifiers)
                  if not output_key:
                      raise ValueError("objective output_key must not be empty")

                  weight_value = data.get("weight", 1.0)
          '''
          if objective_anchor not in text:
              raise SystemExit("objective output block not found")
          text = text.replace(objective_anchor, objective_replacement, 1)

          variable_anchor = '''        if not variables:
                      raise ValueError("Optimization requires at least one variable")

                  objectives_value = optimization.get("objectives")
          '''
          variable_replacement = '''        if not variables:
                      raise ValueError("Optimization requires at least one variable")
                  variable_names: set[str] = set()
                  variable_targets: set[str] = set()
                  for variable in variables:
                      if variable.name in variable_names:
                          raise ValueError(f"Duplicate optimization variable name: {variable.name}")
                      variable_names.add(variable.name)
                      target = _output_key(variable.key, variable.identifiers)
                      if target in variable_targets:
                          raise ValueError(f"Duplicate optimization variable target: {target}")
                      variable_targets.add(target)

                  objectives_value = optimization.get("objectives")
          '''
          if variable_anchor not in text:
              raise SystemExit("problem variable block not found")
          text = text.replace(variable_anchor, variable_replacement, 1)

          objective_problem_anchor = '''        if not objectives:
                      raise ValueError("Optimization requires at least one objective")

                  base_request = {
          '''
          objective_problem_replacement = '''        if not objectives:
                      raise ValueError("Optimization requires at least one objective")
                  objective_keys: set[str] = set()
                  for objective in objectives:
                      if objective.output_key in objective_keys:
                          raise ValueError(
                              f"Duplicate optimization objective: {objective.output_key}"
                          )
                      objective_keys.add(objective.output_key)

                  base_request = {
          '''
          if objective_problem_anchor not in text:
              raise SystemExit("problem objective block not found")
          text = text.replace(objective_problem_anchor, objective_problem_replacement, 1)

          method_anchor = '''    def bounds(self) -> tuple[tuple[float, float], ...]:
                  return tuple(variable.bound() for variable in self.variables)
          '''
          method_replacement = '''    def validate_limits(self, settings: Settings) -> None:
                  if len(self.variables) > settings.max_optimization_variables:
                      raise ValueError(
                          f"Optimization defines {len(self.variables)} variables; limit is "
                          f"{settings.max_optimization_variables}"
                      )
                  if len(self.objectives) > settings.max_optimization_objectives:
                      raise ValueError(
                          f"Optimization defines {len(self.objectives)} objectives; limit is "
                          f"{settings.max_optimization_objectives}"
                      )
                  if self.budget.max_evaluations > settings.max_optimization_evaluations:
                      raise ValueError(
                          f"Optimization evaluation budget {self.budget.max_evaluations} exceeds "
                          f"limit {settings.max_optimization_evaluations}"
                      )

              def checkpoint_for(self, settings: Settings) -> Path | None:
                  if self.checkpoint_path is None:
                      return None
                  candidate = self.checkpoint_path
                  resolved = (
                      (settings.state_dir / candidate).expanduser().resolve()
                      if not candidate.is_absolute()
                      else candidate.expanduser().resolve()
                  )
                  roots = (settings.state_dir.expanduser().resolve(), *settings.allowed_roots)
                  for root in roots:
                      try:
                          resolved.relative_to(root.expanduser().resolve())
                          return resolved
                      except ValueError:
                          continue
                  raise PolicyError(f"Optimization checkpoint path is outside allowed roots: {resolved}")

              def bounds(self) -> tuple[tuple[float, float], ...]:
                  return tuple(variable.bound() for variable in self.variables)
          '''
          if method_anchor not in text:
              raise SystemExit("problem methods anchor not found")
          text = text.replace(method_anchor, method_replacement, 1)

          missing_anchor = '''                if value is None:
                              missing = True
                              value = 1e12
          '''
          missing_replacement = '''                if value is None:
                              missing = True
                              value = -1e12 if objective.direction == "maximize" else 1e12
          '''
          if missing_anchor not in text:
              raise SystemExit("missing objective block not found")
          text = text.replace(missing_anchor, missing_replacement, 1)

          run_anchor = '''    problem = OptimizationProblem.from_document(normalized_document)
              evaluator = _Evaluator(problem, settings, pool_manager, cancel_check, pool_observer)
              checkpoint = (
                  None if problem.checkpoint_path is None else _checkpoint_callback(problem.checkpoint_path)
              )
          '''
          run_replacement = '''    problem = OptimizationProblem.from_document(normalized_document)
              problem.validate_limits(settings)
              evaluator = _Evaluator(problem, settings, pool_manager, cancel_check, pool_observer)
              checkpoint_path = problem.checkpoint_for(settings)
              checkpoint = None if checkpoint_path is None else _checkpoint_callback(checkpoint_path)
          '''
          if run_anchor not in text:
              raise SystemExit("run optimization setup block not found")
          path.write_text(text.replace(run_anchor, run_replacement, 1), encoding="utf-8")

          scheduler = Path("src/aspenops_nexus/scheduler.py")
          scheduler_text = scheduler.read_text(encoding="utf-8")
          scheduler_old = '''        if "optimization" in request:
                      OptimizationProblem.from_document(request)
                      dry_run_document(
          '''
          scheduler_new = '''        if "optimization" in request:
                      problem = OptimizationProblem.from_document(request)
                      problem.validate_limits(self.settings)
                      dry_run_document(
          '''
          if scheduler_old not in scheduler_text:
              raise SystemExit("scheduler optimization validation block not found")
          scheduler.write_text(
              scheduler_text.replace(scheduler_old, scheduler_new, 1),
              encoding="utf-8",
          )

          edge_test = Path("tests/test_optimization_edge_cases.py")
          edge_text = edge_test.read_text(encoding="utf-8")
          edge_text = edge_text.replace(
              '    checkpoint = tmp_path / "checkpoint.json"\n',
              '    checkpoint = tmp_path / "state" / "checkpoint.json"\n',
              1,
          )
          edge_test.write_text(edge_text, encoding="utf-8")
          PY
      - name: Normalize and validate optimization contracts
        run: |
          uv sync --extra dev --extra agent
          uv run ruff format \
            src/aspenops_nexus/optimization.py \
            src/aspenops_nexus/scheduler.py \
            tests/test_optimization_contracts.py \
            tests/test_optimization_edge_cases.py
          uv run ruff check \
            src/aspenops_nexus/optimization.py \
            src/aspenops_nexus/scheduler.py \
            tests/test_optimization_contracts.py \
            tests/test_optimization_edge_cases.py
          uv run mypy src/aspenops_nexus/optimization.py src/aspenops_nexus/scheduler.py
          uv run pytest tests/test_optimization*.py tests/test_scheduler_edge_cases.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-optimization-contracts.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/optimization.py \
            src/aspenops_nexus/scheduler.py \
            tests/test_optimization_contracts.py \
            tests/test_optimization_edge_cases.py \
            .github/workflows/apply-optimization-contracts.yml
          git commit -m "fix: bound and disambiguate optimization contracts"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
