name: Generate performance evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/generate-performance-evidence.yml
      - scripts/run_benchmark_matrix.py
      - scripts/compare_benchmarks.py
      - src/aspenops_nexus/archive_safety.py
      - src/aspenops_nexus/batch.py
      - src/aspenops_nexus/cache.py
      - src/aspenops_nexus/pool.py
      - src/aspenops_nexus/pool_manager.py
      - src/aspenops_nexus/provenance.py
      - src/aspenops_nexus/scheduler.py
      - src/aspenops_nexus/worker.py
      - tests/test_archive_safety_complete.py
      - tests/test_benchmark_repeated_trials.py
      - tests/test_benchmark_scripts.py
      - tests/test_cache.py
      - tests/test_pool_cache_efficiency.py
      - tests/test_pool_manager_creation.py
      - tests/test_provenance_zip_safety.py
      - tests/test_scheduler_active_leases.py
      - tests/test_worker_protocol_hardening.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: aspenops-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync candidate dependencies
        shell: bash
        run: |
          mkdir -p var/benchmarks
          set -o pipefail
          uv sync --extra dev --extra agent 2>&1 | tee var/benchmarks/sync.log
      - name: Prepare main worktree
        shell: bash
        run: |
          set -o pipefail
          git fetch origin main 2>&1 | tee var/benchmarks/prepare-main.log
          git worktree add /tmp/aspenops-main origin/main 2>&1 | tee -a var/benchmarks/prepare-main.log
      - name: Run baseline matrix
        shell: bash
        env:
          PYTHONPATH: /tmp/aspenops-main/src
        run: |
          set -o pipefail
          .venv/bin/python scripts/run_benchmark_matrix.py \
            --repo-root /tmp/aspenops-main \
            --output var/benchmarks/baseline.json \
            2>&1 | tee var/benchmarks/baseline.log
      - name: Run candidate matrix
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          .venv/bin/python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/benchmarks/after.json \
            2>&1 | tee var/benchmarks/after.log
      - name: Generate comparison documents and enforce stable regression gate
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc docs/performance-baseline.md \
            --after-doc docs/performance-after.md \
            --fail-on-stable-regression \
            2>&1 | tee var/benchmarks/compare.log
      - name: Validate benchmark tools
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check scripts/run_benchmark_matrix.py scripts/compare_benchmarks.py \
            2>&1 | tee var/benchmarks/ruff.log
          uv run mypy scripts/run_benchmark_matrix.py scripts/compare_benchmarks.py \
            2>&1 | tee var/benchmarks/mypy.log
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . --output var/benchmarks/smoke.json --smoke \
            2>&1 | tee var/benchmarks/smoke.log
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: |
            var/benchmarks
            docs/performance-baseline.md
            docs/performance-after.md
          if-no-files-found: error
