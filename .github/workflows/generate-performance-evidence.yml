name: Generate performance evidence

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Exact baseline commit, tag, or ref
        required: true
        default: 8283744093a210c07da16ffe006968776dff9547
        type: string
      candidate_ref:
        description: Candidate commit, tag, or ref; normally main
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: aspenops-performance-${{ inputs.candidate_ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile and sync frozen candidate dependencies
        shell: bash
        run: |
          mkdir -p var/benchmarks
          set -o pipefail
          uv lock --check 2>&1 | tee var/benchmarks/uv-lock.log
          uv sync --frozen --extra dev --extra agent \
            2>&1 | tee var/benchmarks/sync.log
      - name: Resolve immutable revisions and prepare baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --prune origin 2>&1 | tee var/benchmarks/prepare-baseline.log
          baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          candidate_sha="$(git rev-parse --verify HEAD^{commit})"
          if [[ ! "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "baseline_ref did not resolve to a full commit SHA" >&2
            exit 2
          fi
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_ref did not resolve to a full commit SHA" >&2
            exit 2
          fi
          printf '%s\n' "$baseline_sha" | tee var/benchmarks/baseline-sha.txt
          printf '%s\n' "$candidate_sha" | tee var/benchmarks/candidate-sha.txt
          git worktree add --detach /tmp/aspenops-baseline "$baseline_sha" \
            2>&1 | tee -a var/benchmarks/prepare-baseline.log
      - name: Run baseline matrix
        shell: bash
        env:
          PYTHONPATH: /tmp/aspenops-baseline/src
        run: |
          set -o pipefail
          .venv/bin/python scripts/run_benchmark_matrix.py \
            --repo-root /tmp/aspenops-baseline \
            --output var/benchmarks/baseline.json \
            2>&1 | tee var/benchmarks/baseline.log
      - name: Run candidate matrix
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          .venv/bin/python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/benchmarks/after.json \
            2>&1 | tee var/benchmarks/after.log
      - name: Generate comparison and enforce stable regression policy
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc var/benchmarks/performance-baseline.md \
            --after-doc var/benchmarks/performance-after.md \
            --fail-on-stable-regression \
            2>&1 | tee var/benchmarks/compare.log
      - name: Validate benchmark tools and smoke path
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check scripts/run_benchmark_matrix.py scripts/compare_benchmarks.py \
            2>&1 | tee var/benchmarks/ruff.log
          uv run ruff format --check scripts/run_benchmark_matrix.py scripts/compare_benchmarks.py \
            2>&1 | tee var/benchmarks/ruff-format.log
          uv run mypy scripts/run_benchmark_matrix.py scripts/compare_benchmarks.py \
            2>&1 | tee var/benchmarks/mypy.log
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . --output var/benchmarks/smoke.json --smoke \
            2>&1 | tee var/benchmarks/smoke.log
      - name: Upload immutable comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-evidence-${{ github.run_id }}
          path: var/benchmarks
          if-no-files-found: error
          retention-days: 90
