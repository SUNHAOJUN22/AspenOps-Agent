name: AspenOps Main Audit V3 Finalize Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main-audit-v3-finalize-once.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-main-audit-v3-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Reject incomplete transport and qualify current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/main-audit-v3-finalize-once.yml
          E=var/main-audit-v3-final
          rm -rf "$E" dist /tmp/aspenops-v3-final-wheel
          mkdir -p "$E"
          rm -f "$SELF" docs/MAIN_AUDIT_V3_FINAL_BLOCKER.json

          : > "$E/status.tsv"
          failed=0
          gate() {
            name="$1"; shift
            set +e
            "$@" >"$E/$name.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            [[ "$code" -eq 0 ]] || failed=1
          }

          gate issue44-incomplete-transport bash -lc '
            set -euo pipefail
            gh api "repos/$REPO/issues/44" > var/main-audit-v3-final/issue44.json
            gh api --paginate --slurp "repos/$REPO/issues/44/comments" > var/main-audit-v3-final/issue44-comments.json
            python - <<"PY"
          import json
          import re
          from pathlib import Path

          root = Path("var/main-audit-v3-final")
          issue = json.loads((root / "issue44.json").read_text())
          pages = json.loads((root / "issue44-comments.json").read_text())
          comments = []
          for page in pages:
              if isinstance(page, list):
                  comments.extend(item for item in page if isinstance(item, dict))
              elif isinstance(page, dict):
                  comments.append(page)
          body = str(issue.get("body", ""))
          count_match = re.search(r"parts:\s*(\d+)", body)
          hash_match = re.search(r"decoded_sha256:\s*([0-9a-f]{64})", body)
          baseline_match = re.search(r"baseline_sha:\s*([0-9a-f]{40})", body)
          if count_match is None or hash_match is None or baseline_match is None:
              raise SystemExit("Issue #44 metadata is incomplete")
          expected_count = int(count_match.group(1))
          marker = re.compile(r"ASPNHARDENING PART\s+(\d{2})/(\d{2})")
          actual = []
          declared_totals = set()
          for comment in comments:
              for index, total in marker.findall(str(comment.get("body", ""))):
                  actual.append(int(index))
                  declared_totals.add(int(total))
          actual_unique = sorted(set(actual))
          expected = list(range(expected_count))
          missing = sorted(set(expected) - set(actual_unique))
          if expected_count != 8 or actual_unique != [0] or missing != [1, 2, 3, 4, 5, 6, 7] or declared_totals != {8}:
              raise SystemExit(
                  f"Issue #44 transport state changed unexpectedly: actual={actual_unique}, missing={missing}, totals={declared_totals}"
              )
          payload = {
              "schema": "aspenops.issue44-hardening-audit/v1",
              "issue": 44,
              "decision": "REJECTED_INCOMPLETE_TRANSPORT",
              "expected_parts": expected_count,
              "actual_parts": actual_unique,
              "missing_parts": missing,
              "declared_payload_sha256": hash_match.group(1),
              "declared_baseline_sha": baseline_match.group(1),
              "payload_executed": False,
              "source_changes_applied": False,
              "reason": "Seven of eight declared payload parts are absent; integrity and semantics cannot be reconstructed safely.",
          }
          (root / "issue44-audit.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          '

          gate lock-check uv lock --check
          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate dependency-audit bash -lc '
            set -euo pipefail
            export UV_PREVIEW_FEATURES=json-output
            bad=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem=var/main-audit-v3-final/audit-${platform}-${version}
                uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json >"$stem.json" 2>"$stem.log" || bad=1
                python -m json.tool "$stem.json" >/dev/null || bad=1
              done
            done
            exit "$bad"
          '
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit -r src scripts -lll -iii -f json -o var/main-audit-v3-final/bandit.json 2>var/main-audit-v3-final/bandit.log || status=$?
            python -m json.tool var/main-audit-v3-final/bandit.json >/dev/null
            exit "$status"
          '
          gate focused-tests uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_numerical_core_optimization.py \
            tests/test_optimizer.py tests/test_optimizer_complete_edges.py \
            tests/test_units.py tests/test_models_strict_contracts.py \
            tests/test_config_registry_edge_cases.py \
            tests/test_evaluation_plan.py tests/test_evaluation_plan_write_conflicts.py \
            tests/test_worker_protocol_hardening.py tests/test_batch_resource_limits.py \
            tests/test_job_store.py tests/test_job_store_lease_recovery.py \
            tests/test_job_store_lease_strictness.py tests/test_job_store_owner_fencing.py \
            tests/test_archive_safety_complete.py tests/test_provenance_zip_safety.py \
            tests/test_mcp.py tests/test_mcp_tools.py \
            tests/test_process_ir.py tests/test_process_ir_edges.py \
            tests/test_research_study.py tests/test_research_schemas.py \
            tests/test_research_examples.py tests/test_research_governance.py \
            tests/test_research_contract_edges.py \
            --junitxml="$E/focused-junit.xml"

          for version in 3.11 3.12 3.13; do
            floor=94.5
            [[ "$version" == 3.12 ]] && floor=95.0
            gate full-$version bash -lc "
              set -euo pipefail
              uv sync --python $version --frozen --extra dev --extra agent --extra signing
              uv run --python $version pytest -W error::ResourceWarning \\
                --cov=aspenops_nexus --cov-branch \\
                --cov-report=json:$E/coverage-$version.json \\
                --junitxml=$E/junit-$version.xml \\
                --cov-fail-under=$floor
            "
          done
          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py --seed 20260730 --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py examples/process-intent.example.json --canonical-output "$E/process-intent-canonical.json" --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py --repo-root . --output "$E/benchmark-smoke.json" --smoke
          gate performance-policy uv run --python 3.12 python scripts/compare_benchmarks.py --baseline var/benchmarks/baseline.json --after var/benchmarks/after.json --baseline-doc "$E/performance-baseline.md" --after-doc "$E/performance-after.md" --fail-on-stable-regression
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py --dist-dir dist --output "$E/wheel-metadata.json"

          cat > "$E/wheel_check.py" <<'PY'
          from aspenops_nexus.optimizer import ParetoPoint, pareto_front
          from aspenops_nexus.units import convert

          assert abs(convert(1.0, "bar", "kPa") - 100.0) < 1e-12
          point = ParetoPoint((0.0,), (1.0, 1.0), 0.0)
          assert pareto_front([point, point]) == (point,)
          PY
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project --format requirements.txt --output-file var/main-audit-v3-final/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-v3-final-wheel
            uv pip sync --python /tmp/aspenops-v3-final-wheel/bin/python --require-hashes var/main-audit-v3-final/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-v3-final-wheel/bin/python --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-v3-final-wheel/bin/python
            /tmp/aspenops-v3-final-wheel/bin/aspenops --version
            /tmp/aspenops-v3-final-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/aspenops scheduler --help >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/aspenops cancel --help >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/aspenops optimize --help >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/aspenops mcp --help >/dev/null
            /tmp/aspenops-v3-final-wheel/bin/python var/main-audit-v3-final/wheel_check.py
          '

          if [[ "$failed" -ne 0 ]]; then
            git reset --hard "$BASE"
            rm -f "$SELF"
            python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path("var/main-audit-v3-final")
          status = {}
          tails = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, raw = line.split("\t")
              code = int(raw)
              status[name] = code
              if code:
                  log = evidence / f"{name}.log"
                  if log.exists():
                      tails[name] = log.read_text(errors="replace").splitlines()[-160:]
          payload = {
              "schema": "aspenops.main-audit-v3-final-blocker/v1",
              "decision": "FAIL",
              "source_changes_retained": False,
              "aspen_executed": False,
              "gate_status": status,
              "failure_tail": tails,
          }
          Path("docs/MAIN_AUDIT_V3_FINAL_BLOCKER.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            git add -A
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test: record V3 final audit blocker'
            git push origin HEAD:main
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path("var/main-audit-v3-final")
          status = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)

          def junit(path: Path):
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  raise RuntimeError(f"No testsuite in {path}")
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          def coverage(path: Path):
              return float(json.loads(path.read_text())["totals"]["percent_covered"])

          issue44 = json.loads((evidence / "issue44-audit.json").read_text())
          Path("docs/ISSUE_44_HARDENING_AUDIT.json").write_text(json.dumps(issue44, indent=2, sort_keys=True) + "\n")
          payload = {
              "schema": "aspenops.main-audit-v3-result/v1",
              "decision": "PASS",
              "qualification_run": {"run_id": os.environ["RUN_ID"], "run_attempt": os.environ["RUN_ATTEMPT"]},
              "hard_gates": status,
              "focused_tests": junit(evidence / "focused-junit.xml"),
              "full_tests": {v: junit(evidence / f"junit-{v}.xml") for v in ("3.11", "3.12", "3.13")},
              "coverage_percent": {v: coverage(evidence / f"coverage-{v}.json") for v in ("3.11", "3.12", "3.13")},
              "source_changes_retained": False,
              "source_files_changed": [],
              "issue44_disposition": "REJECTED_INCOMPLETE_TRANSPORT",
              "aspen_executed": False,
              "parameter_estimation_executed": False,
              "dynamic_modeling_executed": False,
              "machine_learning_executed": False,
              "external_gate": "PENDING_LICENSED_WINDOWS_ASPEN_ENGINEERING_CERTIFICATION",
          }
          Path("docs/MAIN_AUDIT_V3_RESULT.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          Path("docs/MAIN_AUDIT_V3_RESULT.md").write_text(
              "# AspenOps Main Audit V3\n\n"
              "**PASS**\n\n"
              "- Source changes retained: `False`\n"
              "- Issue #44: `REJECTED_INCOMPLETE_TRANSPORT`\n"
              "- Aspen execution: no\n"
              "- Licensed Windows/Aspen engineering certification: pending\n",
              encoding="utf-8",
          )
          PY
          rm -f docs/MAIN_AUDIT_V3_BLOCKER.json docs/MAIN_AUDIT_V3_FINAL_BLOCKER.json
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: finalize V3 main audit and reject incomplete issue 44 payload'
          git push origin HEAD:main
          gh issue close 44 --repo "$REPO" --reason "not planned" --comment "V3 verified that this transient transport declares eight parts but contains only part 00. Parts 01-07 are absent, so the declared SHA-256 payload cannot be reconstructed or safely executed. No source changes were applied. Current main independently passed the complete qualification matrix. Evidence: docs/ISSUE_44_HARDENING_AUDIT.json and docs/MAIN_AUDIT_V3_RESULT.json."
