# One-time main-only deep audit and quality upgrade. Deletes itself after Linux qualification.
name: Deep audit upgrade once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-deep-audit-upgrade-once
  cancel-in-progress: true

jobs:
  linux-upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply permanent audit upgrades and qualify Linux
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="var/deep-audit-linux"
          log_path="$evidence_dir/deep-audit.log"
          saved_evidence="$RUNNER_TEMP/deep-audit-linux.json"
          rm -rf "$evidence_dir" /tmp/aspenops-deep-audit-wheel
          mkdir -p "$evidence_dir"
          : > "$log_path"
          exec > >(tee -a "$log_path") 2>&1

          finish() {
            local status=$?
            trap - EXIT
            set +e
            STATUS="$status" EVIDENCE_DIR="$evidence_dir" SAVED_EVIDENCE="$saved_evidence" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          junit_path = evidence_dir / "junit.xml"
          coverage_path = evidence_dir / "coverage.json"
          source_audit_path = evidence_dir / "source-tree-audit.json"
          junit = {}
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              suite = root if "tests" in root.attrib else root.find("testsuite")
              if suite is not None:
                  junit = {
                      "tests": int(suite.attrib.get("tests", 0)),
                      "failures": int(suite.attrib.get("failures", 0)),
                      "errors": int(suite.attrib.get("errors", 0)),
                      "skipped": int(suite.attrib.get("skipped", 0)),
                      "time_seconds": float(suite.attrib.get("time", 0.0)),
                  }
          coverage = None
          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text(encoding="utf-8"))["totals"][
                  "percent_covered"
              ]
          source_audit = {}
          if source_audit_path.exists():
              source_audit = json.loads(source_audit_path.read_text(encoding="utf-8"))
          log = evidence_dir / "deep-audit.log"
          status = int(os.environ["STATUS"])
          payload = {
              "schema": "aspenops.deep-audit/v1",
              "platform": "linux",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "coverage_floor_percent": 95.0,
              "branch_coverage_percent": coverage,
              "junit": junit,
              "source_tree_audit": source_audit,
              "overall": "PASS" if status == 0 else "FAIL",
              "failure_tail": []
              if status == 0
              else log.read_text(encoding="utf-8", errors="replace").splitlines()[-240:],
          }
          rendered = json.dumps(payload, indent=2, sort_keys=True) + "\n"
          Path(os.environ["SAVED_EVIDENCE"]).write_text(rendered, encoding="utf-8")
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [[ "$status" -ne 0 ]]; then
              git restore --source=HEAD --staged --worktree . >/dev/null 2>&1 || true
              rm -f .github/workflows/deep-audit-upgrade-once.yml
              cp "$saved_evidence" docs/deep-audit-linux.json
              git add -A
              git commit -m "test: record deep audit upgrade blocker"
              git push origin HEAD:main
              exit "$status"
            fi
            cp "$saved_evidence" docs/deep-audit-linux.json
            git add -A
            git commit -m "test: deepen source and distribution quality gates"
            git push origin HEAD:main
          }
          trap finish EXIT

          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          rm .github/workflows/deep-audit-upgrade-once.yml

          cat > scripts/audit_source_tree.py <<'PY'
          from __future__ import annotations

          import argparse
          import ast
          import json
          from pathlib import Path
          from typing import Any

          _DIRECT_FORBIDDEN = {
              "builtins.eval": "dynamic_eval",
              "builtins.exec": "dynamic_exec",
              "eval": "dynamic_eval",
              "exec": "dynamic_exec",
              "marshal.load": "unsafe_deserialization",
              "marshal.loads": "unsafe_deserialization",
              "os.system": "shell_execution",
              "pickle.load": "unsafe_deserialization",
              "pickle.loads": "unsafe_deserialization",
              "tempfile.mktemp": "unsafe_temporary_path",
              "yaml.load": "unsafe_yaml_load",
          }
          _SUBPROCESS_CALLS = {
              "subprocess.Popen",
              "subprocess.call",
              "subprocess.check_call",
              "subprocess.check_output",
              "subprocess.run",
          }


          def _call_name(node: ast.expr | None) -> str:
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  prefix = _call_name(node.value)
                  return f"{prefix}.{node.attr}" if prefix else node.attr
              return ""


          def _location(path: Path, node: ast.AST) -> dict[str, Any]:
              return {
                  "path": path.as_posix(),
                  "line": int(getattr(node, "lineno", 0)),
                  "column": int(getattr(node, "col_offset", 0)),
              }


          def audit_tree(root: Path) -> dict[str, Any]:
              root = root.resolve()
              files = sorted(
                  path
                  for base in (root / "src", root / "scripts")
                  if base.exists()
                  for path in base.rglob("*.py")
              )
              forbidden: list[dict[str, Any]] = []
              advisory: list[dict[str, Any]] = []
              totals = {
                  "files": len(files),
                  "lines": 0,
                  "functions": 0,
                  "async_functions": 0,
                  "classes": 0,
                  "calls": 0,
              }

              for path in files:
                  relative = path.relative_to(root)
                  source = path.read_text(encoding="utf-8")
                  totals["lines"] += len(source.splitlines())
                  try:
                      tree = ast.parse(source, filename=relative.as_posix())
                  except SyntaxError as exc:
                      forbidden.append(
                          {
                              "kind": "syntax_error",
                              "path": relative.as_posix(),
                              "line": int(exc.lineno or 0),
                              "column": int(exc.offset or 0),
                              "detail": str(exc),
                          }
                      )
                      continue

                  for node in ast.walk(tree):
                      if isinstance(node, ast.FunctionDef):
                          totals["functions"] += 1
                      elif isinstance(node, ast.AsyncFunctionDef):
                          totals["async_functions"] += 1
                      elif isinstance(node, ast.ClassDef):
                          totals["classes"] += 1
                      elif isinstance(node, ast.ExceptHandler):
                          caught = _call_name(node.type)
                          if caught in {"Exception", "BaseException", "builtins.Exception", "builtins.BaseException"}:
                              advisory.append(
                                  {
                                      "kind": "broad_exception_handler",
                                      **_location(relative, node),
                                      "detail": caught,
                                  }
                              )
                      elif isinstance(node, ast.Call):
                          totals["calls"] += 1
                          name = _call_name(node.func)
                          kind = _DIRECT_FORBIDDEN.get(name)
                          if kind is not None:
                              forbidden.append(
                                  {
                                      "kind": kind,
                                      **_location(relative, node),
                                      "detail": name,
                                  }
                              )
                          if name in _SUBPROCESS_CALLS:
                              shell_keywords = [item for item in node.keywords if item.arg == "shell"]
                              for keyword in shell_keywords:
                                  safe_false = isinstance(keyword.value, ast.Constant) and keyword.value.value is False
                                  if not safe_false:
                                      forbidden.append(
                                          {
                                              "kind": "subprocess_shell",
                                              **_location(relative, node),
                                              "detail": name,
                                          }
                                      )

              forbidden.sort(key=lambda item: (item["path"], item["line"], item["kind"]))
              advisory.sort(key=lambda item: (item["path"], item["line"], item["kind"]))
              return {
                  "schema": "aspenops.source-tree-audit/v1",
                  "root": root.as_posix(),
                  "status": "PASS" if not forbidden else "FAIL",
                  "totals": totals,
                  "forbidden_findings": forbidden,
                  "advisory_findings": advisory,
              }


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description="Audit AspenOps Python source for unsafe constructs")
              parser.add_argument("--root", type=Path, default=Path("."))
              parser.add_argument("--output", type=Path)
              args = parser.parse_args(argv)
              report = audit_tree(args.root)
              payload = json.dumps(report, indent=2, sort_keys=True, allow_nan=False)
              if args.output is not None:
                  args.output.parent.mkdir(parents=True, exist_ok=True)
                  args.output.write_text(payload + "\n", encoding="utf-8")
              print(payload)
              return 0 if report["status"] == "PASS" else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > tests/test_source_tree_audit.py <<'PY'
          from __future__ import annotations

          import json
          import runpy
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / "scripts" / "audit_source_tree.py"
          NAMESPACE = runpy.run_path(str(SCRIPT))
          audit_tree = NAMESPACE["audit_tree"]
          main = NAMESPACE["main"]


          def test_repository_source_tree_has_no_forbidden_constructs() -> None:
              report = audit_tree(ROOT)

              assert report["status"] == "PASS"
              assert report["totals"]["files"] >= 50
              assert report["totals"]["lines"] > 5000
              assert report["totals"]["functions"] > 100
              assert report["forbidden_findings"] == []
              json.dumps(report, allow_nan=False)


          def test_audit_detects_dynamic_execution_deserialization_and_shell(tmp_path: Path) -> None:
              source = tmp_path / "src"
              source.mkdir()
              (source / "unsafe.py").write_text(
                  "import pickle\n"
                  "import subprocess\n"
                  "value = eval('1 + 1')\n"
                  "payload = pickle.loads(b'bad')\n"
                  "subprocess.run('echo bad', shell=True)\n",
                  encoding="utf-8",
              )

              report = audit_tree(tmp_path)
              kinds = {item["kind"] for item in report["forbidden_findings"]}

              assert report["status"] == "FAIL"
              assert {"dynamic_eval", "unsafe_deserialization", "subprocess_shell"} <= kinds


          def test_broad_exception_is_advisory_not_a_false_security_pass(tmp_path: Path) -> None:
              source = tmp_path / "scripts"
              source.mkdir()
              (source / "boundary.py").write_text(
                  "def boundary():\n"
                  "    try:\n"
                  "        return 1\n"
                  "    except Exception:\n"
                  "        return 0\n",
                  encoding="utf-8",
              )

              report = audit_tree(tmp_path)

              assert report["status"] == "PASS"
              assert report["forbidden_findings"] == []
              assert [item["kind"] for item in report["advisory_findings"]] == [
                  "broad_exception_handler"
              ]


          def test_audit_cli_writes_machine_readable_failure(tmp_path: Path) -> None:
              source = tmp_path / "src"
              source.mkdir()
              (source / "unsafe.py").write_text("exec('pass')\n", encoding="utf-8")
              output = tmp_path / "audit.json"

              assert main(["--root", str(tmp_path), "--output", str(output)]) == 1
              report = json.loads(output.read_text(encoding="utf-8"))
              assert report["status"] == "FAIL"
              assert report["forbidden_findings"][0]["kind"] == "dynamic_exec"


          def test_ci_persists_compile_audit_and_95_percent_floor() -> None:
              linux = (ROOT / ".github" / "workflows" / "ci.yml").read_text(encoding="utf-8")
              windows = (ROOT / ".github" / "workflows" / "windows-control-plane.yml").read_text(
                  encoding="utf-8"
              )

              for workflow in (linux, windows):
                  assert "python -m compileall -q src scripts" in workflow
                  assert "scripts/audit_source_tree.py" in workflow
              assert "--cov-fail-under=95.0" in linux
              assert "--cov-fail-under=94.5" not in linux
          PY

          cat > tests/test_wheel_metadata_edges.py <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from zipfile import ZipFile

          import pytest

          from aspenops_nexus import wheel_metadata


          def _write_wheel(
              dist_dir: Path,
              *,
              filename: str = "aspenops_nexus-2.0.0-py3-none-any.whl",
              metadata_members: list[tuple[str, str]] | None = None,
          ) -> Path:
              dist_dir.mkdir(parents=True, exist_ok=True)
              wheel = dist_dir / filename
              members = metadata_members
              if members is None:
                  members = [
                      (
                          "aspenops_nexus-2.0.0.dist-info/METADATA",
                          "Metadata-Version: 2.4\n"
                          "Name: aspenops-nexus\n"
                          "Version: 2.0.0\n"
                          "Requires-Dist: mcp<2,>=1.9; extra == 'agent'\n\n",
                      )
                  ]
              with ZipFile(wheel, "w") as archive:
                  for name, content in members:
                      archive.writestr(name, content)
              return wheel


          @pytest.mark.parametrize(
              ("requirement", "message"),
              [
                  ("other>=1.9,<2; extra == 'agent'", "unexpected package name"),
                  ("mcp>=1.9; extra == 'agent'", "must constrain"),
                  ("mcp>=1.9,<2", "scoped to the agent extra"),
                  ("mcp>=1.9,<2; extra == 'other'", "scoped to the agent extra"),
              ],
          )
          def test_mcp_requirement_contract_rejects_every_boundary(
              requirement: str,
              message: str,
          ) -> None:
              with pytest.raises(RuntimeError, match=message):
                  wheel_metadata._validate_mcp_requirement(requirement)


          def test_inspect_wheel_requires_exactly_one_distribution(tmp_path: Path) -> None:
              with pytest.raises(RuntimeError, match="found 0"):
                  wheel_metadata.inspect_wheel(tmp_path)

              _write_wheel(tmp_path)
              _write_wheel(
                  tmp_path,
                  filename="aspenops_nexus-2.0.1-py3-none-any.whl",
              )
              with pytest.raises(RuntimeError, match="found 2"):
                  wheel_metadata.inspect_wheel(tmp_path)


          @pytest.mark.parametrize("member_count", [0, 2])
          def test_inspect_wheel_requires_one_metadata_member(
              tmp_path: Path,
              member_count: int,
          ) -> None:
              members = [
                  (f"package_{index}.dist-info/METADATA", "Metadata-Version: 2.4\n\n")
                  for index in range(member_count)
              ]
              _write_wheel(tmp_path, metadata_members=members)

              with pytest.raises(RuntimeError, match=f"found {member_count}"):
                  wheel_metadata.inspect_wheel(tmp_path)


          def test_inspect_wheel_rejects_oversized_metadata(tmp_path: Path) -> None:
              oversized = "X-Metadata: " + ("x" * wheel_metadata._MAX_METADATA_BYTES)
              _write_wheel(
                  tmp_path,
                  metadata_members=[
                      ("aspenops_nexus-2.0.0.dist-info/METADATA", oversized)
                  ],
              )

              with pytest.raises(RuntimeError, match="METADATA exceeds"):
                  wheel_metadata.inspect_wheel(tmp_path)


          @pytest.mark.parametrize("mcp_entries", [0, 2])
          def test_inspect_wheel_requires_one_mcp_requirement(
              tmp_path: Path,
              mcp_entries: int,
          ) -> None:
              requirements = "".join(
                  "Requires-Dist: mcp<2,>=1.9; extra == 'agent'\n"
                  for _ in range(mcp_entries)
              )
              metadata = (
                  "Metadata-Version: 2.4\n"
                  "Name: aspenops-nexus\n"
                  "Version: 2.0.0\n"
                  f"{requirements}\n"
              )
              _write_wheel(
                  tmp_path,
                  metadata_members=[
                      ("aspenops_nexus-2.0.0.dist-info/METADATA", metadata)
                  ],
              )

              with pytest.raises(RuntimeError, match=f"found {mcp_entries}"):
                  wheel_metadata.inspect_wheel(tmp_path)


          def test_wheel_metadata_cli_writes_the_same_json_it_prints(
              tmp_path: Path,
              capsys: pytest.CaptureFixture[str],
          ) -> None:
              dist_dir = tmp_path / "dist"
              wheel = _write_wheel(dist_dir)
              output = tmp_path / "reports" / "wheel.json"

              assert wheel_metadata.main(
                  ["--dist-dir", str(dist_dir), "--output", str(output)]
              ) == 0
              printed = json.loads(capsys.readouterr().out)
              stored = json.loads(output.read_text(encoding="utf-8"))

              assert printed == stored
              assert stored["ok"] is True
              assert stored["wheel"] == wheel.name
          PY

          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected source missing in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              ".github/workflows/ci.yml",
              "      - name: Strict mypy\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          uv run mypy src 2>&1 | tee var/ci/mypy.log\n"
              "      - name: Bandit security analysis\n",
              "      - name: Strict mypy\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          uv run mypy src 2>&1 | tee var/ci/mypy.log\n"
              "      - name: Compile Python sources\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          uv run python -m compileall -q src scripts\n"
              "      - name: Audit Python source tree\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          uv run python scripts/audit_source_tree.py \\\n"
              "            --output var/ci/source-tree-audit.json\n"
              "      - name: Bandit security analysis\n",
          )
          ci = Path(".github/workflows/ci.yml")
          ci.write_text(
              ci.read_text(encoding="utf-8").replace("--cov-fail-under=94.5", "--cov-fail-under=95.0"),
              encoding="utf-8",
          )

          replace_once(
              ".github/workflows/windows-control-plane.yml",
              "      - name: Strict mypy\n"
              "        shell: pwsh\n"
              "        run: |\n"
              "          uv run mypy src *>&1 |\n"
              "            Tee-Object -FilePath var/ci/mypy.log\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
              "      - name: Process, scheduler, archive, backend, certification, IR, and workflow contracts\n",
              "      - name: Strict mypy\n"
              "        shell: pwsh\n"
              "        run: |\n"
              "          uv run mypy src *>&1 |\n"
              "            Tee-Object -FilePath var/ci/mypy.log\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
              "      - name: Compile and audit Python sources\n"
              "        shell: pwsh\n"
              "        run: |\n"
              "          uv run python -m compileall -q src scripts\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
              "          uv run python scripts/audit_source_tree.py `\n"
              "            --output var/ci/source-tree-audit.json\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
              "      - name: Process, scheduler, archive, backend, certification, IR, and workflow contracts\n",
          )
          replace_once(
              ".github/workflows/windows-control-plane.yml",
              "            tests/test_wheel_smoke_governance.py `\n"
              "            --junitxml=var/ci/windows-contracts.xml `\n",
              "            tests/test_wheel_smoke_governance.py `\n"
              "            tests/test_wheel_metadata_edges.py `\n"
              "            tests/test_source_tree_audit.py `\n"
              "            --junitxml=var/ci/windows-contracts.xml `\n",
          )

          for path in ("README.md", "README.en.md", "AGENTS.md", "CONTRIBUTING.md"):
              target = Path(path)
              target.write_text(
                  target.read_text(encoding="utf-8").replace("--cov-fail-under=94.5", "--cov-fail-under=95.0"),
                  encoding="utf-8",
              )
          for path in ("README.md", "README.en.md"):
              target = Path(path)
              target.write_text(
                  target.read_text(encoding="utf-8").replace("| 覆盖率门槛 | 94.5% |", "| 覆盖率门槛 | 95.0% |")
                  .replace("| Coverage floor | 94.5% |", "| Coverage floor | 95.0% |"),
                  encoding="utf-8",
              )
          quality = Path("docs/quality-report.md")
          quality.write_text(
              quality.read_text(encoding="utf-8").replace(
                  "the 94.5% branch-coverage floor",
                  "the 95.0% branch-coverage floor",
              ),
              encoding="utf-8",
          )
          visual = Path("docs/assets/readme/test-matrix.svg")
          visual.write_text(
              visual.read_text(encoding="utf-8").replace(
                  "BRANCH COVERAGE 94.5%",
                  "BRANCH COVERAGE 95.0%",
              ),
              encoding="utf-8",
          )
          contracts = Path("tests/test_documentation_contracts.py")
          contracts.write_text(
              contracts.read_text(encoding="utf-8").replace(
                  'assert "--cov-fail-under=94.5" in text',
                  'assert "--cov-fail-under=95.0" in text',
              ),
              encoding="utf-8",
          )
          PY

          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py --output "$evidence_dir/source-tree-audit.json"

          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              uv audit --frozen \
                --python-platform "$platform" \
                --python-version "$version" \
                --output-format json \
                > "$evidence_dir/dependency-audit-${platform}-py${version}.json"
              python -m json.tool "$evidence_dir/dependency-audit-${platform}-py${version}.json" >/dev/null
            done
          done

          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:"$evidence_dir/coverage.json" \
            --junitxml="$evidence_dir/junit.xml" \
            --durations=20 \
            --cov-fail-under=95.0
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir "$evidence_dir/order"
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output "$evidence_dir/bandit.json"
          python -m json.tool "$evidence_dir/bandit.json" >/dev/null
          uv build
          uv run python scripts/check_wheel_metadata.py \
            --dist-dir dist \
            --output "$evidence_dir/wheel-metadata.json"
          uv export --frozen --extra agent --no-default-groups --no-emit-project \
            --format requirements.txt --output-file "$evidence_dir/runtime-requirements.txt"
          uv venv --python 3.12 /tmp/aspenops-deep-audit-wheel
          uv pip sync --python /tmp/aspenops-deep-audit-wheel/bin/python \
            --require-hashes "$evidence_dir/runtime-requirements.txt"
          uv pip install --python /tmp/aspenops-deep-audit-wheel/bin/python \
            --offline --no-deps dist/*.whl
          uv pip check --python /tmp/aspenops-deep-audit-wheel/bin/python
          /tmp/aspenops-deep-audit-wheel/bin/aspenops --version
          /tmp/aspenops-deep-audit-wheel/bin/aspenops demo

          EVIDENCE_DIR="$evidence_dir" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          coverage = json.loads((evidence_dir / "coverage.json").read_text(encoding="utf-8"))[
              "totals"
          ]["percent_covered"]
          import xml.etree.ElementTree as ET

          root = ET.parse(evidence_dir / "junit.xml").getroot()
          suite = root if "tests" in root.attrib else root.find("testsuite")
          tests = int(suite.attrib.get("tests", 0)) if suite is not None else 0
          run_id = os.environ["GITHUB_RUN_ID"]
          source_sha = os.environ["GITHUB_SHA"]

          def upsert_row(path: str, label: str, value: str, after: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              row = f"| {label} | {value} |"
              for index, line in enumerate(lines):
                  if line.startswith(f"| {label} |"):
                      lines[index] = row
                      break
              else:
                  index = next(i for i, line in enumerate(lines) if line.startswith(after))
                  lines.insert(index + 1, row)
              target.write_text("\n".join(lines) + "\n", encoding="utf-8")

          upsert_row(
              "README.md",
              "最新 Linux 深度资格证据",
              f"Actions run `{run_id}`，{tests} passed，0 failed，分支覆盖率 {coverage:.6f}%，源 SHA `{source_sha}`",
              "| 公共测试矩阵 |",
          )
          upsert_row(
              "README.en.md",
              "Latest Linux deep qualification",
              f"Actions run `{run_id}`; {tests} passed, 0 failed; branch coverage {coverage:.6f}%; source SHA `{source_sha}`",
              "| Public test matrix |",
          )

          quality = Path("docs/quality-report.md")
          text = quality.read_text(encoding="utf-8")
          marker = "## Current deep qualification"
          section = (
              f"{marker}\n\nHosted Linux run `{run_id}` at source SHA `{source_sha}` recorded "
              f"{tests} passed, zero failures/errors/skips and {coverage:.6f}% branch-aware coverage "
              "against the permanent 95.0% floor. The same gate compiled every Python source, "
              "ran the repository source-tree AST audit, six frozen dependency audits, exact "
              "Bandit 1.9.4 high/high analysis, reverse and seeded-random full-suite reruns, build, "
              "Wheel metadata validation and isolated Wheel installation.\n"
          )
          if marker in text:
              start = text.index(marker)
              end = text.find("\n## ", start + len(marker))
              if end < 0:
                  text = text[:start].rstrip() + "\n\n" + section
              else:
                  text = text[:start].rstrip() + "\n\n" + section + "\n" + text[end + 1 :]
          else:
              insert = text.index("\n## Public gates")
              text = text[:insert].rstrip() + "\n\n" + section + text[insert:]
          quality.write_text(text, encoding="utf-8")
          PY

          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py \
            tests/test_source_tree_audit.py
          git diff --check

  windows-qualification:
    needs: linux-upgrade
    if: ${{ needs.linux-upgrade.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Qualify the upgraded final tree on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDir = "var/deep-audit-windows"
          Remove-Item -LiteralPath $evidenceDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          $statusPath = Join-Path $evidenceDir "status.tsv"
          Set-Content -LiteralPath $statusPath -Value "" -NoNewline
          $script:failed = 0

          function Invoke-Gate {
            param([string]$Name, [scriptblock]$Command)
            $logPath = Join-Path $evidenceDir "$Name.log"
            $code = 0
            try {
              & $Command *>&1 | Out-File -LiteralPath $logPath -Encoding utf8
              if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
            } catch {
              $_ | Out-String | Out-File -LiteralPath $logPath -Encoding utf8 -Append
              $code = 1
            }
            Add-Content -LiteralPath $statusPath -Value "$Name`t$code"
            if ($code -ne 0) { $script:failed = 1 }
          }

          Invoke-Gate "lock-check" { uv lock --check }
          Invoke-Gate "sync" { uv sync --frozen --extra dev --extra windows --extra agent --extra signing }
          Invoke-Gate "ruff" { uv run ruff check . }
          Invoke-Gate "ruff-format" { uv run ruff format --check . }
          Invoke-Gate "mypy" { uv run mypy src }
          Invoke-Gate "compileall" { uv run python -m compileall -q src scripts }
          Invoke-Gate "source-audit" {
            uv run python scripts/audit_source_tree.py --output var/deep-audit-windows/source-tree-audit.json
          }
          Invoke-Gate "pytest" {
            uv run pytest -W error::ResourceWarning `
              --junitxml=var/deep-audit-windows/junit.xml `
              --durations=20
          }
          Invoke-Gate "build" { uv build }
          Invoke-Gate "wheel-metadata" {
            uv run python scripts/check_wheel_metadata.py `
              --dist-dir dist `
              --output var/deep-audit-windows/wheel-metadata.json
          }
          Invoke-Gate "cli" {
            uv run aspenops --version
            uv run aspenops --help *> $null
            uv run aspenops doctor *> $null
          }

          $env:EVIDENCE_DIR = $evidenceDir
          $env:FAILED = [string]$script:failed
          @'
          from __future__ import annotations

          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          statuses = {}
          for line in (evidence_dir / "status.tsv").read_text(encoding="utf-8-sig").splitlines():
              if line.strip():
                  name, code = line.split("\t")
                  statuses[name] = int(code)
          junit = {}
          path = evidence_dir / "junit.xml"
          if path.exists():
              root = ET.parse(path).getroot()
              suite = root if "tests" in root.attrib else root.find("testsuite")
              if suite is not None:
                  junit = {
                      "tests": int(suite.attrib.get("tests", 0)),
                      "failures": int(suite.attrib.get("failures", 0)),
                      "errors": int(suite.attrib.get("errors", 0)),
                      "skipped": int(suite.attrib.get("skipped", 0)),
                      "time_seconds": float(suite.attrib.get("time", 0.0)),
                  }
          failure_tail = {}
          for name, code in statuses.items():
              if code:
                  log = evidence_dir / f"{name}.log"
                  failure_tail[name] = log.read_text(
                      encoding="utf-8-sig", errors="replace"
                  ).splitlines()[-160:]
          payload = {
              "schema": "aspenops.deep-audit/v1",
              "platform": "windows",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "junit": junit,
              "gate_status": statuses,
              "overall": "PASS" if statuses and all(code == 0 for code in statuses.values()) else "FAIL",
              "failure_tail": failure_tail,
          }
          Path("docs/deep-audit-windows.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          '@ | uv run python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($script:failed -ne 0) {
            git add docs/deep-audit-windows.json
            git commit -m "test: record Windows deep audit blocker"
            git push origin HEAD:main
            exit 1
          }

          $env:DEEP_AUDIT_RUN_ID = $env:GITHUB_RUN_ID
          $env:DEEP_AUDIT_SOURCE_SHA = $env:GITHUB_SHA
          @'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path("docs/deep-audit-windows.json").read_text(encoding="utf-8"))
          tests = evidence["junit"]["tests"]
          run_id = os.environ["DEEP_AUDIT_RUN_ID"]
          source_sha = os.environ["DEEP_AUDIT_SOURCE_SHA"]

          def upsert_row(path: str, label: str, value: str, after: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              row = f"| {label} | {value} |"
              for index, line in enumerate(lines):
                  if line.startswith(f"| {label} |"):
                      lines[index] = row
                      break
              else:
                  index = next(i for i, line in enumerate(lines) if line.startswith(after))
                  lines.insert(index + 1, row)
              target.write_text("\n".join(lines) + "\n", encoding="utf-8")

          upsert_row(
              "README.md",
              "最新 Windows 深度资格证据",
              f"Actions run `{run_id}`，{tests} passed，0 failed，源 SHA `{source_sha}`",
              "| 最新 Linux 深度资格证据 |",
          )
          upsert_row(
              "README.en.md",
              "Latest Windows deep qualification",
              f"Actions run `{run_id}`; {tests} passed, 0 failed; source SHA `{source_sha}`",
              "| Latest Linux deep qualification |",
          )
          PY
          uv run pytest -W error::ResourceWarning `
            tests/test_documentation_contracts.py `
            tests/test_readme_visual_assets.py `
            tests/test_source_tree_audit.py
          git add -A
          git commit -m "test: record passing Windows deep audit"
          git push origin HEAD:main
