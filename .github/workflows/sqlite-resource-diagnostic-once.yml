name: AspenOps SQLite Resource Diagnostic Once

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: aspenops-sqlite-resource-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.issue.title == 'ASPENOPS_SQLITE_RESOURCE_DIAGNOSTIC_20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.13"
          enable-cache: true
      - name: Run traced resource diagnostic
        shell: bash
        run: |
          set -euo pipefail
          SELF=.github/workflows/sqlite-resource-diagnostic-once.yml
          uv sync --python 3.13 --frozen --extra dev --extra agent --extra signing
          grep -RInE 'sqlite3\.connect|\.connect\(' src tests scripts > /tmp/sqlite-sites.txt || true
          set +e
          PYTHONTRACEMALLOC=25 uv run --python 3.13 pytest -W always::ResourceWarning > /tmp/pytest-resource.log 2>&1
          code=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          log = Path('/tmp/pytest-resource.log').read_text(encoding='utf-8', errors='replace').splitlines()
          excerpts = []
          for index, line in enumerate(log):
              if 'ResourceWarning: unclosed database' in line:
                  start = max(0, index - 35)
                  end = min(len(log), index + 12)
                  excerpt = log[start:end]
                  if excerpt not in excerpts:
                      excerpts.append(excerpt)
          sites = Path('/tmp/sqlite-sites.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          result = {
              'schema': 'aspenops.sqlite-resource-diagnostic/v1',
              'pytest_exit': int(Path('/tmp/pytest-exit.txt').read_text()) if Path('/tmp/pytest-exit.txt').exists() else None,
              'sqlite_connect_sites': sites,
              'resource_warning_count': sum('ResourceWarning: unclosed database' in line for line in log),
              'resource_warning_excerpts': excerpts[:30],
          }
          Path('docs/SQLITE_RESOURCE_DIAGNOSTIC.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          printf '%s' "$code" > /tmp/pytest-exit.txt
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/SQLITE_RESOURCE_DIAGNOSTIC.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['pytest_exit'] = int(Path('/tmp/pytest-exit.txt').read_text())
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -f "$SELF"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: record SQLite resource diagnostic'
          git push origin HEAD:main
