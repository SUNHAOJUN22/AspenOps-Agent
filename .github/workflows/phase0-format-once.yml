name: Phase 0 one-time formatter

on:
  push:
    branches:
      - feature/aspenops-natural-language-flowsheet-v3
    paths:
      - .github/workflows/phase0-format-once.yml

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-natural-language-flowsheet-v3
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Format changed Python files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/provenance.py \
            src/aspenops_nexus/worker.py
          rm .github/workflows/phase0-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/provenance.py \
            src/aspenops_nexus/worker.py \
            .github/workflows/phase0-format-once.yml
          git commit -m "style: apply repository Ruff formatter"
          git push origin HEAD:feature/aspenops-natural-language-flowsheet-v3
