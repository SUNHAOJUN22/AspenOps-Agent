name: Optimize result deepcopy once V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-result-deepcopy-once-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-result-deepcopy-once-v2
  cancel-in-progress: false

jobs:
  optimize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: register result deepcopy optimization v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Verify registration boundary
        shell: bash
        env:
          EXPECTED_PARENT: 87a2bf193644b776b184f7bc6d15cb5b1169d210
          WORKFLOW_PATH: .github/workflows/optimize-result-deepcopy-once-v2.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          git diff --check HEAD^ HEAD

      - name: Apply candidate and remove temporary assets from worktree
        shell: bash
        run: |
          set -euo pipefail
          python tools/optimize_result_deepcopy_once.py
          rm -f \
            .github/workflows/optimize-result-deepcopy-once.yml \
            .github/workflows/optimize-result-deepcopy-once-v2.yml \
            tools/optimize_result_deepcopy_once.py
          uv tool run --from 'ruff==0.11.13' ruff format \
            src/aspenops_nexus/models.py \
            scripts/benchmark_result_deepcopy.py \
            tests/test_evaluation_result_deepcopy.py
          uv tool run --from 'ruff==0.11.13' ruff check --fix \
            src/aspenops_nexus/models.py \
            scripts/benchmark_result_deepcopy.py \
            tests/test_evaluation_result_deepcopy.py
          git diff --check

      - name: Install locked Python toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11 3.12 3.13

      - name: Run measured benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/optimization
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          uv run python scripts/benchmark_result_deepcopy.py \
            --output var/optimization/result-deepcopy-benchmark.json \
            --min-speedup 1.5 \
            | tee var/optimization/result-deepcopy-benchmark.log

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -W error::ResourceWarning \
            tests/test_evaluation_result_deepcopy.py \
            tests/test_runtime_closure.py \
            tests/test_finite_aggregation.py \
            --junitxml=var/optimization/focused.xml \
            2>&1 | tee var/optimization/focused.log

      - name: Run full Python matrix
        shell: bash
        run: |
          set -euo pipefail
          for version in 3.11 3.12 3.13; do
            uv sync --python "$version" --frozen --extra dev --extra agent --extra signing
            uv run pytest -W error::ResourceWarning \
              --junitxml="var/optimization/junit-${version}.xml" \
              2>&1 | tee "var/optimization/pytest-${version}.log"
          done

      - name: Run quality, security and build gates
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py \
            --output var/optimization/source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/optimization/bandit.json
          uv build 2>&1 | tee var/optimization/build.log
          uv run python scripts/measure_operation_counts.py \
            --output var/optimization/operation-counts.json
          git diff --check

      - name: Write retained evidence
        shell: bash
        env:
          SOURCE_PARENT: 0e12306bc49985b6a2c71d9db04ab39ed13fa15d
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          benchmark = json.loads(
              Path("var/optimization/result-deepcopy-benchmark.json").read_text(
                  encoding="utf-8"
              )
          )
          operation = json.loads(
              Path("var/optimization/operation-counts.json").read_text(encoding="utf-8")
          )
          report = {
              "schema": "aspenops.result-deepcopy-optimization/v1",
              "decision": "PASS",
              "source_parent": os.environ["SOURCE_PARENT"],
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "aspen_executed": False,
              "boundary": (
                  "Portable Python result-cloning optimization; not licensed Aspen solve "
                  "or engineering certification evidence."
              ),
              "change": (
                  "EvaluationResult now supplies a field-aware __deepcopy__ implementation. "
                  "Unbounded values and diagnostics remain recursively copied; validated "
                  "string and numeric containers use direct copies."
              ),
              "benchmark": benchmark,
              "operation_counts": {
                  "pool": operation["pool"],
                  "memory": operation["memory"],
                  "profile": operation["profile"],
              },
              "qualification": {
                  "focused": "PASS",
                  "python_3_11": "PASS",
                  "python_3_12": "PASS",
                  "python_3_13": "PASS",
                  "ruff": "PASS",
                  "format": "PASS",
                  "mypy": "PASS",
                  "compileall": "PASS",
                  "source_audit": "PASS",
                  "bandit": "PASS",
                  "build": "PASS",
              },
          }
          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          (docs / "RESULT_DEEPCOPY_OPTIMIZATION.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          markdown = (
              "# EvaluationResult deepcopy optimization\n\n"
              "Decision: **PASS**\n\n"
              f"- Generic dataclass deepcopy median: `{benchmark['legacy_seconds']:.9f} s`\n"
              f"- Field-aware deepcopy median: `{benchmark['optimized_seconds']:.9f} s`\n"
              f"- Measured speedup: `{benchmark['speedup']:.3f}x`\n"
              f"- Equivalence: `{benchmark['equivalent']}`\n"
              f"- Deep isolation: `{benchmark['deep_isolation']}`\n"
              "- Python 3.11 / 3.12 / 3.13 full suites: `PASS`\n"
              "- Ruff / format / strict mypy / compileall / source audit / Bandit / build: `PASS`\n\n"
              "Boundary: portable Python result cloning only; no licensed Aspen execution was performed.\n"
          )
          (docs / "RESULT_DEEPCOPY_OPTIMIZATION.md").write_text(
              markdown,
              encoding="utf-8",
          )
          PY

      - name: Publish qualified optimization to main
        shell: bash
        run: |
          set -euo pipefail
          registration_sha="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$registration_sha"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: specialize result deepcopy"
          git push origin HEAD:main

      - name: Upload optimization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-deepcopy-optimization-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/optimization
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
