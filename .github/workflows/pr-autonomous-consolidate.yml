name: PR-observable AspenOps v2 consolidation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aspenops-v2-pr-consolidation
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'agent/aspenops-v2-reliability-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Apply consolidation
        run: uv run python scripts/autonomous_consolidate.py
      - name: Format and lint
        shell: bash
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
      - name: Strict typing
        run: uv run mypy src
      - name: Tests and branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage.json \
            --junitxml=var/ci/junit.xml \
            --cov-fail-under=63 \
            2>&1 | tee var/ci/pytest.log
      - name: Build, API and benchmark smoke
        shell: bash
        run: |
          uv build
          uv run aspenops --version
          uv run aspenops demo
          uv run python scripts/check_mcp.py
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/ci/benchmark-smoke.json \
            --smoke
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Materialize verified tree evidence
        shell: bash
        run: |
          git add -A
          git diff --cached --name-status > var/ci/changed-files.tsv
          mkdir -p var/ci/consolidated-tree
          while IFS=$'\t' read -r status path extra; do
            case "$status" in
              A|M)
                mkdir -p "var/ci/consolidated-tree/$(dirname "$path")"
                cp "$path" "var/ci/consolidated-tree/$path"
                ;;
              D)
                printf '%s\n' "$path" >> var/ci/deleted-files.txt
                ;;
              R*)
                printf '%s\n' "$path" >> var/ci/deleted-files.txt
                mkdir -p "var/ci/consolidated-tree/$(dirname "$extra")"
                cp "$extra" "var/ci/consolidated-tree/$extra"
                ;;
            esac
          done < var/ci/changed-files.tsv
          git diff --cached --binary > var/ci/consolidated.patch
          git rev-parse HEAD > var/ci/base-head.txt
      - name: Upload verified implementation and evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr-consolidation-evidence
          path: var/ci
          if-no-files-found: error
          include-hidden-files: true
