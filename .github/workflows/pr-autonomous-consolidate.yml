name: PR-observable AspenOps v2 consolidation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-v2-pr-consolidation
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'agent/aspenops-v2-reliability-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Apply consolidation
        run: uv run python scripts/autonomous_consolidate.py
      - name: Format and lint
        shell: bash
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
      - name: Strict typing
        run: uv run mypy src
      - name: Tests and branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage.json \
            --junitxml=var/ci/junit.xml \
            --cov-fail-under=63 \
            2>&1 | tee var/ci/pytest.log
      - name: Build, API and benchmark smoke
        shell: bash
        run: |
          uv build
          uv run aspenops --version
          uv run aspenops demo
          uv run python scripts/check_mcp.py
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/ci/benchmark-smoke.json \
            --smoke
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Upload verified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-consolidation-evidence
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Commit verified non-workflow implementation
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: consolidate AspenOps 2.0 implementation"
          git fetch origin agent/aspenops-v2-reliability-performance
          git rebase origin/agent/aspenops-v2-reliability-performance
          git push origin HEAD:agent/aspenops-v2-reliability-performance
