name: One-shot AspenOps dimensionless optimization remediation

on:
  push:
    branches:
      - remediation/dimensionless-optimization-ci

permissions:
  contents: write

concurrency:
  group: aspenops-dimensionless-optimization-remediation
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/dimensionless-optimization-ci
          fetch-depth: 0

      - name: Set up locked uv toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.11.16
          python-version: '3.13'
          enable-cache: true

      - name: Apply exact-tree patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aspenops.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/aspenops.patch.gz.b64 | gzip --decompress > /tmp/aspenops.patch
          printf '%s  %s\n' '8a47059cb01ac95090636edda8977fbe4fddaed961522517ed60cb8d585312c7' /tmp/aspenops.patch | sha256sum --check
          git apply --index /tmp/aspenops.patch
          rm .github/workflows/remediation-apply-dimensionless-optimization.yml

      - name: Install exact locked validation stack
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing

      - name: Format and qualify the closed source tree
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            src/aspenops_nexus/optimization.py \
            tests/test_dimensionless_objective_contract_v20.py \
            tests/test_optimization_contracts.py \
            tests/test_optimization_validation_complete.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -q
          uv run python scripts/verify_delivery.py --root . --output /tmp/delivery.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/delivery.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS', report
          PY
          git diff --check

      - name: Verify exact final diff and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/exact-tree-export.yml',
              '.github/workflows/remediation-apply-dimensionless-optimization.yml',
              '.github/workflows/v19-skill-contract.yml',
              'docs/optimization-engine.md',
              'examples/optimization-request.example.json',
              'src/aspenops_nexus/optimization.py',
              'tests/test_dimensionless_objective_contract_v20.py',
              'tests/test_optimization_contracts.py',
              'tests/test_optimization_validation_complete.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected final diff: expected={sorted(expected)!r} actual={sorted(actual)!r}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(optimization): require dimensionless multi-objective scalarization"
          git push origin HEAD:remediation/dimensionless-optimization-ci
