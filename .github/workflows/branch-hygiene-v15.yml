name: V15 branch hygiene

on:
  push:
    branches: [main]
    paths: [.github/workflows/branch-hygiene-v15.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remove-audited-marker-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Close marker PRs and delete audited branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ['REPOSITORY']
          owner = repo.split('/', 1)[0]
          token = os.environ['GH_TOKEN']
          branches = ['agent/source-export-20260810']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise
          for branch in branches:
              query = urllib.parse.urlencode({'state': 'open', 'head': f'{owner}:{branch}'})
              _, pulls = request('GET', f'https://api.github.com/repos/{repo}/pulls?{query}')
              for pull in pulls or []:
                  request('PATCH', f"https://api.github.com/repos/{repo}/pulls/{pull['number']}", {'state': 'closed'})
              encoded = urllib.parse.quote(branch, safe='')
              status, _ = request('DELETE', f'https://api.github.com/repos/{repo}/git/refs/heads/{encoded}')
              print(branch, 'deleted' if status == 204 else 'absent')
          PY
