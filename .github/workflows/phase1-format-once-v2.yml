name: Phase 1 one-time formatter v2

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-format-once-v2.yml

permissions:
  contents: write

jobs:
  normalize-format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Normalize and format Phase 1 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/process_ir_v2.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _scalar(value: Any, label: str) -> ScalarValue:
              if isinstance(value, bool | str | int):
                  return value
              if isinstance(value, float) and math.isfinite(value):
                  return value
              raise ValueError(f"{label} must be a finite scalar JSON value")
          '''
          new = '''def _scalar(value: Any, label: str) -> ScalarValue:
              if isinstance(value, str):
                  return _text(value, label)
              if isinstance(value, bool | int):
                  return value
              if isinstance(value, float) and math.isfinite(value):
                  return value
              raise ValueError(f"{label} must be a finite scalar JSON value")
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError("Expected one ProcessDesignIR scalar helper")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/process_requirement.py \
            src/aspenops_nexus/process_ir_v2.py \
            src/aspenops_nexus/engineering_rules.py \
            src/aspenops_nexus/plant_templates.py \
            src/aspenops_nexus/flowsheet_preview.py \
            tests/test_process_requirement_v1.py \
            tests/test_process_ir_v2_rules.py \
            tests/test_plant_templates_v3.py \
            tests/test_flowsheet_preview_v3.py
          rm -f \
            .github/workflows/phase1-validate-once.yml \
            .github/workflows/phase1-format-once-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize and format Phase 1 design layer"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
