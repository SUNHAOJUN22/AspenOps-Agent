name: Phase 1 one-time build-contract qualification v2

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-qualification-once-v2.yml

permissions:
  contents: write

concurrency:
  group: phase1-build-contract-qualification-v2
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-*.yml
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py --output /tmp/phase1-source-audit.json
          uv build
          python - <<'PY'
          import json
          from pathlib import Path
          from aspenops_nexus.process_requirement import ProcessRequirementDocument

          requirement_path = Path("examples/process-requirement-v1.example.json")
          design_path = Path("examples/process-design-v2.example.json")
          requirement = ProcessRequirementDocument.from_dict(
              json.loads(requirement_path.read_text(encoding="utf-8"))
          )
          design = json.loads(design_path.read_text(encoding="utf-8"))
          design["requirement_hash"] = requirement.digest()
          linked = Path("/tmp/linked-design.json")
          linked.write_text(json.dumps(design, ensure_ascii=False), encoding="utf-8")
          PY
          uv run python scripts/validate_process_design_v2.py \
            examples/process-requirement-v1.example.json \
            /tmp/linked-design.json \
            --report-output /tmp/phase1-linked-report.json \
            --graph-output /tmp/phase1-linked-graph.json \
            --svg-output /tmp/phase1-linked-preview.svg
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/phase1-linked-report.json").read_text())
          assert report["valid"] is True
          assert report["status"] == "PLAN_ONLY"
          assert report["preview"] is not None
          assert "does not authorize COM execution" in report["boundary"]
          PY

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            coverage-floor: "94.5"
          - python-version: "3.12"
            coverage-floor: "95.0"
          - python-version: "3.13"
            coverage-floor: "94.5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-*.yml
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=${{ matrix.coverage-floor }}
      - if: ${{ matrix.python-version == '3.12' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir /tmp/phase1-order

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: pwsh
        run: |
          Remove-Item .github/workflows/phase1-*.yml -Force -ErrorAction SilentlyContinue
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev --extra windows --extra agent --extra signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest -W error::ResourceWarning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  finalize:
    needs: [quality, tests, windows]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - name: Record qualified build-contract status and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          report = Path("ASPENOPS_V3_PHASE1_IMPLEMENTATION_REPORT.md")
          text = report.read_text(encoding="utf-8")
          text = text.replace("FAIL_CLOSED_PENDING_CI", "PASS_BUILD_CONTRACTS")
          text = text.replace(
              "Phase 1 can advance to `PASS_BUILD_CONTRACTS` only when the stacked PR completes:",
              "Phase 1 achieved `PASS_BUILD_CONTRACTS` after the stacked qualification completed:",
          )
          text = text.replace(
              "Until then, status remains `FAIL_CLOSED_PENDING_CI`.",
              "This status qualifies only simulator-neutral build contracts; real simulator status remains `PENDING_REAL_ASPEN_CERTIFICATION`.",
          )
          report.write_text(text, encoding="utf-8")

          audit = Path("ASPENOPS_V3_PHASE1_REVERSE_AUDIT.md")
          text = audit.read_text(encoding="utf-8")
          text = text.replace("FAIL_CLOSED_PENDING_CI", "PASS_BUILD_CONTRACTS")
          if "## Qualification result" not in text:
              text += (
                  "\n## Qualification result\n\n"
                  "The one-time Phase 1 qualification completed Linux quality/build gates, "
                  "Python 3.11/3.12/3.13 full suites with branch coverage, Python 3.12 order "
                  "independence, and Windows full tests. This grants only "
                  "`PASS_BUILD_CONTRACTS`; it does not grant native simulator or engineering "
                  "certification.\n"
              )
          audit.write_text(text, encoding="utf-8")

          matrix = Path("ASPENOPS_V3_PHASE1_VALIDATION_MATRIX.json")
          text = matrix.read_text(encoding="utf-8")
          text = text.replace('"current_status": "FAIL_CLOSED_PENDING_CI"', '"current_status": "PASS_BUILD_CONTRACTS"')
          text = text.replace("IMPLEMENTED_PENDING_CI", "PASS_BUILD_CONTRACTS")
          for key in (
              "ruff",
              "ruff_format",
              "mypy",
              "python_3_11",
              "python_3_12",
              "python_3_13",
              "order_independence",
              "branch_coverage",
              "build",
              "wheel_smoke",
              "mcp_smoke",
              "windows_control_plane",
          ):
              text = text.replace(f'"{key}": "PENDING_FINAL_HEAD"', f'"{key}": "PASS"')
          matrix.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase1-*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: qualify Phase 1 simulator-neutral build contracts"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
