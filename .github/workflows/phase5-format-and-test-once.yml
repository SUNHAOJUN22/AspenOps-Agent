name: Phase 5 exact format and targeted gate

on:
  pull_request:
    branches:
      - feature/aspenops-qualified-licensed-link
    paths:
      - .github/workflows/phase5-format-and-test-once.yml

permissions:
  contents: write

jobs:
  format-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-fresh-runtime-authorization
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff check --fix \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/runtime_execution_authorization.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: format Phase 5 runtime authorization contracts"
            git push origin HEAD:feature/aspenops-fresh-runtime-authorization
          fi
