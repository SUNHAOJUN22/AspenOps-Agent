name: Autonomous AspenOps v2 consolidation

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/autonomous-consolidate.yml

permissions:
  contents: write

concurrency:
  group: aspenops-v2-autonomous-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Apply deterministic consolidation
        run: uv run python scripts/autonomous_consolidate.py
      - name: Normalize source and tests
        shell: bash
        run: |
          uv run ruff check --fix .
          uv run ruff format .
      - name: Static quality
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee var/ci/format.log
          uv run ruff check . 2>&1 | tee var/ci/ruff.log
          uv run mypy src 2>&1 | tee var/ci/mypy.log
      - name: Full portable tests and branch coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage.json \
            --junitxml=var/ci/junit.xml \
            --cov-fail-under=63 \
            2>&1 | tee var/ci/pytest.log
      - name: Build and smoke
        shell: bash
        run: |
          uv build
          uv run aspenops --version
          uv run aspenops demo
          uv run python scripts/check_mcp.py
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/ci/benchmark-smoke.json \
            --smoke
      - name: Wheel install smoke
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-consolidation-evidence
          path: var/ci
          if-no-files-found: ignore
      - name: Commit consolidated implementation
        shell: bash
        run: |
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit"
            exit 0
          fi
          git commit -m "release: consolidate AspenOps 2.0 implementation"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
