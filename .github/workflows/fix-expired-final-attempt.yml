name: One-shot fix expired final job attempts

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/fix-expired-final-attempt.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-fix-expired-final-attempt
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Patch restart and lease-expiry recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/scheduler.py")
          text = path.read_text(encoding="utf-8")
          old_restart = '''        connection.execute(
                      """
                      UPDATE jobs
                      SET status='retry_wait', error='service restarted while job held a lease',
                          updated_at=?, lease_owner=NULL, lease_expires_at=NULL
                      WHERE status IN ('claimed','running') AND cancel_requested=0
                      """,
                      (now,),
                  )
          '''
          new_restart = '''        connection.execute(
                      """
                      UPDATE jobs
                      SET status=CASE
                              WHEN attempt < max_attempts THEN 'retry_wait'
                              ELSE 'dead_letter'
                          END,
                          error=CASE
                              WHEN attempt < max_attempts
                                  THEN 'service restarted while job held a lease'
                              ELSE 'service restarted after final job attempt'
                          END,
                          error_class='service_restart',
                          finished_at=CASE
                              WHEN attempt < max_attempts THEN NULL ELSE ?
                          END,
                          updated_at=?, lease_owner=NULL, lease_expires_at=NULL
                      WHERE status IN ('claimed','running') AND cancel_requested=0
                      """,
                      (now, now),
                  )
          '''
          if old_restart not in text:
              raise SystemExit("restart recovery block not found")
          text = text.replace(old_restart, new_restart, 1)
          old_expiry = '''        retryable = connection.execute(
                      """
                      SELECT job_id FROM jobs
                      WHERE status IN ('claimed','running')
                        AND lease_expires_at IS NOT NULL AND lease_expires_at < ?
                        AND cancel_requested=0
                      """,
                      (now,),
                  ).fetchall()
                  connection.execute(
                      """
                      UPDATE jobs
                      SET status='retry_wait', error='job lease expired', updated_at=?,
                          lease_owner=NULL, lease_expires_at=NULL
                      WHERE status IN ('claimed','running')
                        AND lease_expires_at IS NOT NULL AND lease_expires_at < ?
                        AND cancel_requested=0
                      """,
                      (now, now),
                  )
                  for row in retryable:
                      self._event(connection, str(row[0]), "lease_expired")
          '''
          new_expiry = '''        expired = connection.execute(
                      """
                      SELECT job_id,attempt,max_attempts FROM jobs
                      WHERE status IN ('claimed','running')
                        AND lease_expires_at IS NOT NULL AND lease_expires_at < ?
                        AND cancel_requested=0
                      """,
                      (now,),
                  ).fetchall()
                  connection.execute(
                      """
                      UPDATE jobs
                      SET status=CASE
                              WHEN attempt < max_attempts THEN 'retry_wait'
                              ELSE 'dead_letter'
                          END,
                          error=CASE
                              WHEN attempt < max_attempts THEN 'job lease expired'
                              ELSE 'job lease expired after final attempt'
                          END,
                          error_class='lease_expired',
                          finished_at=CASE
                              WHEN attempt < max_attempts THEN NULL ELSE ?
                          END,
                          updated_at=?, lease_owner=NULL, lease_expires_at=NULL
                      WHERE status IN ('claimed','running')
                        AND lease_expires_at IS NOT NULL AND lease_expires_at < ?
                        AND cancel_requested=0
                      """,
                      (now, now, now),
                  )
                  for row in expired:
                      attempt = int(row[1])
                      max_attempts = int(row[2])
                      event = (
                          "lease_expired"
                          if attempt < max_attempts
                          else "dead_letter_after_lease_expiry"
                      )
                      self._event(
                          connection,
                          str(row[0]),
                          event,
                          {"attempt": attempt, "max_attempts": max_attempts},
                      )
          '''
          if old_expiry not in text:
              raise SystemExit("lease expiry recovery block not found")
          path.write_text(text.replace(old_expiry, new_expiry, 1), encoding="utf-8")
          PY
      - name: Normalize and validate scheduler
        run: |
          uv sync --extra dev
          uv run ruff check src/aspenops_nexus/scheduler.py
          uv run ruff format src/aspenops_nexus/scheduler.py
          uv run mypy src/aspenops_nexus/scheduler.py
          uv run pytest tests/test_scheduler.py tests/test_scheduler_edge_cases.py
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-expired-final-attempt.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/scheduler.py \
            .github/workflows/fix-expired-final-attempt.yml
          git commit -m "fix: dead-letter expired final job attempts"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
