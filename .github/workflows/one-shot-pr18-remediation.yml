name: One-shot PR 18 contract remediation

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-pr18-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'SUNHAOJUN22/AspenOps-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Reconcile stale contracts and example plan
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")


          path = Path("tests/test_small_logic_edges.py")
          replace_once(
              path,
              """    assert math.isinf(absolute)\n    assert math.isinf(relative)\n""",
              """    assert absolute is None\n    assert relative is None\n""",
          )
          replace_once(
              path,
              """    with pytest.raises(ValueError, match=\"at least two\"):\n        certification.certify_batch_document(data, settings, repeats=1)\n""",
              """    with pytest.raises(ValueError, match=\"between 2 and 100\"):\n        certification.certify_batch_document(data, settings, repeats=1)\n""",
          )
          text = path.read_text(encoding="utf-8")
          if text.count('with pytest.raises(ValueError, match="cannot be negative"):') != 2:
              raise RuntimeError("Expected two stale negative-tolerance assertions")
          path.write_text(
              text.replace(
                  'with pytest.raises(ValueError, match="cannot be negative"):',
                  'with pytest.raises(ValueError, match="finite non-negative"):',
              ),
              encoding="utf-8",
          )
          replace_once(
              path,
              """    assert math.isinf(report[\"max_absolute_error\"])\n""",
              """    assert report[\"max_absolute_error\"] == pytest.approx(0.5)\n    structural = [\n        item\n        for item in report[\"comparisons\"]\n        if item[\"key\"] in {\"only_candidate\", \"only_reference\"}\n    ]\n    assert structural\n    assert all(item[\"absolute_error\"] is None for item in structural)\n""",
          )
          replace_once(
              path,
              """def test_certification_can_pass_for_identical_nonmock_runs(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    data, settings = certification_inputs(tmp_path)\n    data[\"backend\"] = \"hysys\"\n    response = [{\"ok\": True, \"values\": {\"x\": 1.0, \"label\": \"stable\"}}]\n    monkeypatch.setattr(\n        certification,\n        \"run_batch_document\",\n        lambda request, isolated: response,\n    )\n    report = certification.certify_batch_document(data, settings, repeats=2)\n    assert report[\"passed\"] is True\n    assert report[\"qualification_level\"] == \"licensed-simulator-runtime\"\n    assert report[\"comparisons\"]\n""",
              """def test_certification_requires_approved_tolerances_for_nonmock_runs(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    data, settings = certification_inputs(tmp_path)\n    data[\"backend\"] = \"hysys\"\n    response = [{\"ok\": True, \"values\": {\"x\": 1.0, \"label\": \"stable\"}}]\n    monkeypatch.setattr(\n        certification,\n        \"run_batch_document\",\n        lambda request, isolated: response,\n    )\n\n    missing_tolerances = certification.certify_batch_document(data, settings, repeats=2)\n    assert missing_tolerances[\"passed\"] is False\n    assert missing_tolerances[\"runs\"] == []\n\n    pending_acceptance = certification.certify_batch_document(\n        data,\n        settings,\n        repeats=2,\n        abs_tol=1e-8,\n        rel_tol=1e-6,\n    )\n    assert pending_acceptance[\"passed\"] is False\n    assert pending_acceptance[\"runs\"] == []\n\n    report = certification.certify_batch_document(\n        data,\n        settings,\n        repeats=2,\n        abs_tol=1e-8,\n        rel_tol=1e-6,\n        engineering_approved=True,\n    )\n    assert report[\"passed\"] is True\n    assert report[\"qualification_level\"] == \"licensed-runtime-repeatability\"\n    assert report[\"certification_status\"] == certification.PENDING_REAL_ASPEN_CERTIFICATION\n    assert report[\"comparisons\"]\n""",
          )

          example = Path("examples/licensed-certification-plan.example.json")
          document = json.loads(example.read_text(encoding="utf-8"))
          document["request"]["reads"] = [
              {"key": "replace.with.semantic.output.key", "required": True}
          ]
          example.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Format and validate remediation
        shell: bash
        run: |
          uv sync --extra dev --extra agent --extra signing
          uv run ruff format \
            tests/test_licensed_certification_workflow.py \
            tests/test_small_logic_edges.py \
            tests/test_licensed_certification_validation_edges.py
          uv run ruff check .
          uv run pytest -q \
            tests/test_small_logic_edges.py \
            tests/test_licensed_certification_governance.py \
            tests/test_licensed_certification_validation_edges.py \
            tests/test_licensed_certification_workflow.py
      - name: Remove one-shot workflow and publish validated fix
        shell: bash
        run: |
          rm .github/workflows/one-shot-pr18-remediation.yml
          git config user.name "aspenops-maintenance"
          git config user.email "aspenops-maintenance@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: reconcile certification contracts and coverage"
          git pull --rebase origin agent/aspenops-v2-reliability-performance
          git push origin HEAD:agent/aspenops-v2-reliability-performance
