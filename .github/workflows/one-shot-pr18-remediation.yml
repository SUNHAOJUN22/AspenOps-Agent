name: One-shot PR 18 formatter

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-pr18-formatter
  cancel-in-progress: true

jobs:
  format-and-remove:
    if: github.repository == 'SUNHAOJUN22/AspenOps-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply canonical formatting
        run: |
          set -euo pipefail
          uv sync --extra dev --extra agent --extra signing
          uv run ruff format .
          uv run ruff check --fix .
          rm .github/workflows/one-shot-pr18-remediation.yml
      - name: Publish and self-remove
        run: |
          set -euo pipefail
          git config user.name "aspenops-maintenance"
          git config user.email "aspenops-maintenance@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: finalize candidate formatting and remove one-shot workflow"
          git pull --rebase origin agent/aspenops-v2-reliability-performance
          git push origin HEAD:agent/aspenops-v2-reliability-performance
