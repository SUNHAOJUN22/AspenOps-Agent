name: Apply optimization strict types

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/apply-optimization-strict-types.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra agent
      - name: Apply strict type migration
        run: uv run python scripts/apply_optimization_strict_types.py
      - name: Validate migration
        run: |
          uv run ruff check src/aspenops_nexus/optimization.py
          uv run mypy src
      - name: Commit migration
        run: |
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce strict optimization JSON types"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
