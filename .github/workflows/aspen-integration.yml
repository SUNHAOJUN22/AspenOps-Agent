name: Licensed Aspen Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-aspen:
    runs-on: [self-hosted, Windows, aspen-plus]
    timeout-minutes: 45
    env:
      ASPENOPS_TEST_CASE: ${{ vars.ASPENOPS_TEST_CASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Validate configured case path
        shell: powershell
        run: |
          if (-not $env:ASPENOPS_TEST_CASE) { throw "Repository variable ASPENOPS_TEST_CASE is not set" }
          if (-not (Test-Path $env:ASPENOPS_TEST_CASE)) { throw "Integration case does not exist on this runner" }
      - name: Sync Windows dependencies
        run: uv sync --extra windows --extra dev
      - name: Probe local Aspen Automation Server
        run: uv run aspenops doctor --probe
      - name: Run licensed integration test
        run: uv run pytest -m aspen_integration -s
