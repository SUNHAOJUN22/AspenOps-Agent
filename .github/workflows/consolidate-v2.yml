name: Consolidate AspenOps v2

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/consolidate-v2.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Let staged migrations settle
        run: sleep 90
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra agent
      - name: Consolidate staged migrations
        run: uv run python scripts/consolidate_v2.py
      - name: Full quality gate
        shell: bash
        run: |
          mkdir -p var/ci
          uv run ruff check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage.json \
            --junitxml=var/ci/junit.xml \
            --cov-fail-under=63
          uv build
          uv run aspenops demo
          uv run python scripts/check_mcp.py
      - name: Write quality report
        shell: python
        run: |
          import json
          import xml.etree.ElementTree as ET
          from datetime import UTC, datetime
          from pathlib import Path

          coverage = json.loads(Path("var/ci/coverage.json").read_text())
          root = ET.parse("var/ci/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(item.attrib.get("tests", 0)) for item in suites)
          failures = sum(int(item.attrib.get("failures", 0)) for item in suites)
          errors = sum(int(item.attrib.get("errors", 0)) for item in suites)
          skipped = sum(int(item.attrib.get("skipped", 0)) for item in suites)
          total = coverage["totals"]
          report = f"""# AspenOps v2 quality report

          Generated: {datetime.now(UTC).isoformat()}

          - Python: 3.12 consolidation runner
          - Tests: {tests}
          - Failures: {failures}
          - Errors: {errors}
          - Skipped: {skipped}
          - Statement coverage: {total['percent_covered_display']}%
          - Covered lines: {total['covered_lines']}
          - Missing lines: {total['missing_lines']}
          - Branch status: portable control-plane validation
          - Real Aspen status: `PENDING_REAL_ASPEN_CERTIFICATION`

          The portable gate proves orchestration, scheduling, cache, integrity,
          optimization and failure-handling behavior against deterministic/Fake
          backends. It does not claim licensed Aspen physical qualification.
          """
          Path("docs/quality-report.md").write_text(report, encoding="utf-8")
      - name: Commit consolidated implementation
        run: |
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git commit -m "test: consolidate AspenOps v2 quality gate"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
