name: Final branch archive diagnostics

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/AspenOps-Agent' &&
      github.event.issue.title == 'AspenOps final branch archive diagnostics' &&
      github.event.issue.body == 'RUN_FINAL_TAG_DIAGNOSTICS_20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish run identity
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Tag diagnostics started. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Create and verify first annotated recovery tag through JSON API
        shell: bash
        run: |
          set -euxo pipefail
          repo="$GITHUB_REPOSITORY"
          branch='agent/aspenops-1.0-production-runtime'
          commit_sha='2d5ae6cb08df1bdaad26f596f1060c4d397bf020'
          tag='archive/branch/agent-aspenops-1.0-production-runtime/20260721/2d5ae6c'
          encoded="$(python - "$tag" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
          gh api "repos/$repo/git/commits/$commit_sha" --jq .sha
          if ref_json="$(gh api "repos/$repo/git/ref/tags/$encoded" 2>/dev/null)"; then
            ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            target_sha="$(gh api "repos/$repo/git/tags/$ref_sha" --jq '.object.sha')"
            [[ "$target_sha" == "$commit_sha" ]]
          else
            jq -n \
              --arg tag "$tag" \
              --arg message "Archive of $branch at $commit_sha. Classification: SUPERSEDED." \
              --arg object "$commit_sha" \
              '{tag:$tag,message:$message,object:$object,type:"commit",tagger:{name:"AspenOps Archive",email:"aspenops-archive@users.noreply.github.com",date:"2026-07-21T09:45:00Z"}}' \
              > /tmp/tag.json
            tag_object_sha="$(gh api --method POST "repos/$repo/git/tags" --input /tmp/tag.json --jq .sha)"
            jq -n --arg ref "refs/tags/$tag" --arg sha "$tag_object_sha" '{ref:$ref,sha:$sha}' \
              > /tmp/ref.json
            gh api --method POST "repos/$repo/git/refs" --input /tmp/ref.json >/dev/null
          fi
          ref_json="$(gh api "repos/$repo/git/ref/tags/$encoded")"
          ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          target_sha="$(gh api "repos/$repo/git/tags/$ref_sha" --jq '.object.sha')"
          [[ "$target_sha" == "$commit_sha" ]]
          gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body \
            "Tag diagnostics PASS: $tag -> $commit_sha. Run: https://github.com/$repo/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$repo" --reason completed
      - name: Report diagnostic failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Tag diagnostics FAILED. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
