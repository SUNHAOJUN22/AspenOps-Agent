name: Diagnose stable-anchor native adapter run once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-native-adapter-392-once.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read target run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 392cd64d7c1cdcdb728483c5950c84d865123525
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AspenOps-392-Diagnostic",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          repo = os.environ["REPO"]
          sha = os.environ["TARGET_SHA"]
          runs = get(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          ).get("workflow_runs", [])
          output = {"target_sha": sha, "runs": []}
          for run in runs:
              jobs = get(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"
              ).get("jobs", [])
              output["runs"].append(
                  {
                      "id": run["id"],
                      "name": run["name"],
                      "path": run.get("path"),
                      "status": run["status"],
                      "conclusion": run.get("conclusion"),
                      "jobs": [
                          {
                              "id": job["id"],
                              "name": job["name"],
                              "status": job["status"],
                              "conclusion": job.get("conclusion"),
                              "failed_steps": [
                                  step["name"]
                                  for step in job.get("steps", [])
                                  if step.get("conclusion") == "failure"
                              ],
                          }
                          for job in jobs
                      ],
                  }
              )
          Path("docs/NATIVE_ADAPTER_392_DIAGNOSTIC.json").write_text(
              json.dumps(output, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit diagnostic and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-native-adapter-392-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/NATIVE_ADAPTER_392_DIAGNOSTIC.json .github/workflows/diagnose-native-adapter-392-once.yml
          git commit -m "test: record stable-anchor native adapter diagnostic"
          git push origin HEAD:main
