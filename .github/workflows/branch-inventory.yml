name: Branch consolidation inventory

on:
  pull_request:
    paths: [.github/workflows/branch-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every remote branch and build inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/consolidation
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          candidate = 'origin/agent/aspenops-v2-reliability-performance'
          main = 'origin/main'
          refs = run(
              'git',
              'for-each-ref',
              '--format=%(refname:strip=3)|%(objectname)|%(committerdate:iso8601-strict)',
              'refs/remotes/origin',
          ).splitlines()
          branches = []
          for raw in refs:
              if not raw or raw.startswith('HEAD|'):
                  continue
              name, sha, committed_at = raw.split('|', 2)
              ref = f'origin/{name}'
              merge_base = run('git', 'merge-base', candidate, ref)
              candidate_only, branch_only = [
                  int(value)
                  for value in run(
                      'git',
                      'rev-list',
                      '--left-right',
                      '--count',
                      f'{candidate}...{ref}',
                  ).split()
              ]
              main_only, branch_only_from_main = [
                  int(value)
                  for value in run(
                      'git',
                      'rev-list',
                      '--left-right',
                      '--count',
                      f'{main}...{ref}',
                  ).split()
              ]
              branches.append(
                  {
                      'name': name,
                      'sha': sha,
                      'committed_at': committed_at,
                      'candidate_merge_base': merge_base,
                      'candidate_only_commits': candidate_only,
                      'branch_only_commits': branch_only,
                      'main_only_commits': main_only,
                      'branch_only_from_main': branch_only_from_main,
                  }
              )
          payload = {
              'schema': 'aspenops.branch-inventory/v1',
              'candidate_sha': run('git', 'rev-parse', candidate),
              'main_sha': run('git', 'rev-parse', main),
              'branch_count': len(branches),
              'branches': sorted(branches, key=lambda item: item['name']),
          }
          Path('var/consolidation/branch-inventory.raw.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: branch-consolidation-inventory
          path: var/consolidation/branch-inventory.raw.json
          if-no-files-found: error
          retention-days: 90
