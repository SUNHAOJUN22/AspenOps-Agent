name: Phase 1 finalizer

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply idempotent final Phase 1 hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one anchor in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          requirement = Path("src/aspenops_nexus/process_requirement.py")
          replace_once(
              requirement,
              '''def _array(value: Any, label: str, *, maximum: int) -> list[Any]:
          ''',
              '''def _reject_unknown(mapping: dict[str, Any], allowed: set[str], label: str) -> None:
              unknown = sorted(set(mapping) - allowed)
              if unknown:
                  raise ValueError(f"{label} contains unsupported fields: {', '.join(unknown)}")


          def _array(value: Any, label: str, *, maximum: int) -> list[Any]:
          ''',
          )
          replace_once(
              requirement,
              '''        project = _object(mapping.get("project"), "process requirement.project")
          ''',
              '''        project = _object(mapping.get("project"), "process requirement.project")
                  _reject_unknown(
                      project,
                      {"name", "target_simulator", "target_version", "language"},
                      "process requirement.project",
                  )
          ''',
          )
          replace_once(
              requirement,
              '''        objective_mapping = _object(
                      mapping.get("process_objective"),
                      "process requirement.process_objective",
                  )
          ''',
              '''        objective_mapping = _object(
                      mapping.get("process_objective"),
                      "process requirement.process_objective",
                  )
                  _reject_unknown(
                      objective_mapping,
                      {"description"},
                      "process requirement.process_objective",
                  )
          ''',
          )
          replace_once(
              requirement,
              '''        assumptions = _object(mapping.get("assumptions", {}), "process requirement.assumptions")
          ''',
              '''        assumptions = _object(mapping.get("assumptions", {}), "process requirement.assumptions")
                  _reject_unknown(
                      assumptions,
                      {"accepted", "unresolved"},
                      "process requirement.assumptions",
                  )
          ''',
          )
          replace_once(
              requirement,
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process requirement.metadata")
          ''',
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process requirement.metadata")
                  if len(metadata_mapping) > 1024:
                      raise ValueError(
                          f"process requirement.metadata contains {len(metadata_mapping)} entries; "
                          "limit is 1024"
                      )
          ''',
          )

          design = Path("src/aspenops_nexus/process_ir_v2.py")
          text = design.read_text(encoding="utf-8")
          text = re.sub(
              r'''def _scalar\(value: Any, label: str\) -> ScalarValue:\n\s+if isinstance\(value, bool \| str \| int\):\n\s+return value''',
              '''def _scalar(value: Any, label: str) -> ScalarValue:\n    if isinstance(value, str):\n        return _text(value, label)\n    if isinstance(value, bool | int):\n        return value''',
              text,
              count=1,
          )
          design.write_text(text, encoding="utf-8")
          replace_once(
              design,
              '''def _array(value: Any, label: str, *, maximum: int) -> list[Any]:
          ''',
              '''def _bounded_object(value: Any, label: str, *, maximum: int) -> dict[str, Any]:
              mapping = _object(value, label)
              if len(mapping) > maximum:
                  raise ValueError(f"{label} contains {len(mapping)} entries; limit is {maximum}")
              return mapping


          def _array(value: Any, label: str, *, maximum: int) -> list[Any]:
          ''',
          )
          replace_once(
              design,
              '''        vendor_mapping = _object(mapping.get("vendor_ids", {}), f"{label}.vendor_ids")
          ''',
              '''        vendor_mapping = _bounded_object(
                      mapping.get("vendor_ids", {}),
                      f"{label}.vendor_ids",
                      maximum=16,
                  )
          ''',
          )
          replace_once(
              design,
              '''        raw_stoichiometry = _object(mapping.get("stoichiometry", {}), f"{label}.stoichiometry")
          ''',
              '''        raw_stoichiometry = _bounded_object(
                      mapping.get("stoichiometry", {}),
                      f"{label}.stoichiometry",
                      maximum=MAX_COMPONENTS,
                  )
          ''',
          )
          replace_once(
              design,
              '''        metadata_mapping = _object(mapping.get("metadata", {}), "process design.metadata")
          ''',
              '''        metadata_mapping = _bounded_object(
                      mapping.get("metadata", {}),
                      "process design.metadata",
                      maximum=1024,
                  )
          ''',
          )
          replace_once(
              design,
              '''_REACTION_KINDS = {
          ''',
              '''_TARGET_SIMULATORS = {"aspen_plus", "hysys"}
          _TARGET_VERSIONS = {"14", "15", "approved-version"}
          _REACTION_KINDS = {
          ''',
          )
          text = design.read_text(encoding="utf-8")
          if "Unsupported process design simulator" not in text:
              pattern = re.compile(
                  r'''\s+return cls\(\n\s+name=_text\(mapping\.get\("name"\), "process design\.name"\),\n\s+target_simulator=_text\(\n\s+mapping\.get\("target_simulator"\),\n\s+"process design\.target_simulator",\n\s+\)\.casefold\(\),\n\s+target_version=_text\(mapping\.get\("target_version"\), "process design\.target_version"\),'''
              )
              replacement = '''
                  target_simulator = _text(
                      mapping.get("target_simulator"),
                      "process design.target_simulator",
                  ).casefold()
                  if target_simulator not in _TARGET_SIMULATORS:
                      raise ValueError(f"Unsupported process design simulator: {target_simulator}")
                  target_version = _text(
                      mapping.get("target_version"),
                      "process design.target_version",
                  ).casefold()
                  if target_version not in _TARGET_VERSIONS:
                      raise ValueError(f"Unsupported process design version: {target_version}")
                  return cls(
                      name=_text(mapping.get("name"), "process design.name"),
                      target_simulator=target_simulator,
                      target_version=target_version,'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError("Could not locate ProcessDesignIR target constructor")
              design.write_text(text, encoding="utf-8")

          rules = Path("src/aspenops_nexus/engineering_rules.py")
          text = rules.read_text(encoding="utf-8")
          if '"ENGINEERING_BLOCKER",\n                "equipment.contract_unavailable"' not in text:
              old = '"WARNING",\n                "equipment.contract_unavailable"'
              if text.count(old) != 1:
                  raise RuntimeError("Could not locate unknown equipment severity")
              rules.write_text(text.replace(old, '"ENGINEERING_BLOCKER",\n                "equipment.contract_unavailable"', 1), encoding="utf-8")
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/process_requirement.py \
            src/aspenops_nexus/process_ir_v2.py \
            src/aspenops_nexus/engineering_rules.py \
            src/aspenops_nexus/plant_templates.py \
            src/aspenops_nexus/flowsheet_preview.py \
            src/aspenops_nexus/design_contract.py \
            src/aspenops_nexus/design_validation.py \
            scripts/validate_process_design_v2.py \
            tests/test_process_requirement_v1.py \
            tests/test_process_ir_v2_rules.py \
            tests/test_plant_templates_v3.py \
            tests/test_flowsheet_preview_v3.py \
            tests/test_design_contract_v3.py \
            tests/test_phase1_unicode_resource_edges.py \
            tests/test_phase1_nested_schema_edges.py \
            tests/test_phase1_fail_closed_targets.py \
            tests/test_design_validation_v3.py
          rm -f .github/workflows/phase1-*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize fail-closed Phase 1 schema contracts"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
