name: Temporary exact acceptance finalizer

on:
  push:
    branches:
      - agent/final-acceptance-20260807

permissions:
  contents: write

concurrency:
  group: aspenops-exact-acceptance-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.11.16
          python-version: "3.12"
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev --extra agent --extra signing
      - name: Format governed Python files
        run: |
          uv run ruff format \
            scripts/build_delivery_bundle.py \
            scripts/verify_delivery.py \
            tests/test_delivery_acceptance.py \
            tests/test_delivery_bundle.py \
            tests/test_delivery_qualification_writer.py
      - name: Close bilingual README contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          chinese = Path("README.md")
          text = chinese.read_text(encoding="utf-8")
          text = text.replace("## 数理与工程合同", "## 数学与工程合同", 1)
          if "--require-current-qualification" not in text:
              text += """

### 当前交付树强制验收

最终交付必须把测试结果、覆盖率与 Git 身份绑定到当前树；历史 PASS 不能代替当前源码资格。

```bash
uv run python scripts/verify_delivery.py \\
  --root . \\
  --require-current-qualification \\
  --output var/ci/delivery-acceptance-current.json
```

验收面板包括 `test-dashboard-quality.html`、`test-dashboard-windows.html`、`test-dashboard-licensed-mock.html` 与各 Python 版本面板。面板只汇总对应作业证据，不构成真实 Aspen 工程认证。
"""
          chinese.write_text(text, encoding="utf-8", newline="\n")

          english = Path("README.en.md")
          text = english.read_text(encoding="utf-8")
          if "--require-current-qualification" not in text:
              text += """

### Exact current-tree acceptance

Final delivery binds tests, coverage, and Git identity to the current source tree. A historical PASS never substitutes for current-tree qualification.

```bash
uv run python scripts/verify_delivery.py \\
  --root . \\
  --require-current-qualification \\
  --output var/ci/delivery-acceptance-current.json
```

Acceptance dashboards include `test-dashboard-quality.html`, `test-dashboard-windows.html`, `test-dashboard-licensed-mock.html`, and the per-Python dashboards. Each dashboard summarizes only its own job evidence and is not real-Aspen engineering certification.
"""
          english.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Remove temporary workflow and publish exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-artifact-temporary.yml
          git add README.md README.en.md \
            scripts/build_delivery_bundle.py \
            scripts/verify_delivery.py \
            tests/test_delivery_acceptance.py \
            tests/test_delivery_bundle.py \
            tests/test_delivery_qualification_writer.py
          git diff --cached --check
          git commit -m "fix: close acceptance formatting and README contracts"
          git push origin HEAD:agent/final-acceptance-20260807
