name: Main cryptography lock refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-cryptography-lock-refresh-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-main-cryptography-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Upgrade the vulnerable signing dependency in the frozen lock
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          uv lock --upgrade-package cryptography
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = [
              item["version"]
              for item in lock.get("package", [])
              if item.get("name") == "cryptography"
          ]
          if len(versions) != 1:
              raise SystemExit(f"Expected one locked cryptography version, found {versions!r}")
          parts = tuple(int(piece) for piece in versions[0].split(".")[:3])
          if parts < (50, 0, 0):
              raise SystemExit(f"cryptography is still vulnerable: {versions[0]}")
          print(f"locked cryptography={versions[0]}")
          PY
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              output="/tmp/audit-${platform}-${version}.json"
              uv audit --frozen \
                --python-platform "$platform" \
                --python-version "$version" \
                --output-format json > "$output"
              python - <<'PY' "$output"
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          summary = payload.get("summary", {})
          if summary.get("vulnerabilities", 0) != 0:
              raise SystemExit(f"Vulnerabilities remain in {sys.argv[1]}: {summary}")
          if summary.get("adverse_statuses", 0) != 0:
              raise SystemExit(f"Adverse statuses remain in {sys.argv[1]}: {summary}")
          PY
            done
          done
      - name: Commit the audited lock and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-cryptography-lock-refresh-once.yml
          git add uv.lock
          git commit -m "security: lock cryptography 50 after six-target audit"
          git push origin HEAD:main
