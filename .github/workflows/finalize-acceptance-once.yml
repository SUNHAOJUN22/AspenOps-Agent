name: One-time clean-tree acceptance finalizer

on:
  push:
    branches:
      - agent/final-acceptance-20260807

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Repair dashboard references and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): ('`test-dashboard-licensed-mock.html`', '`test-dashboard-licensed.html`、`test-dashboard-licensed-mock.html`'),
              Path('README.en.md'): ('`test-dashboard-licensed-mock.html`', '`test-dashboard-licensed.html`, `test-dashboard-licensed-mock.html`'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if 'test-dashboard-licensed.html' not in text:
                  if old not in text:
                      raise SystemExit(f'expected dashboard anchor missing: {path}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-acceptance-once.yml
          git add README.md README.en.md
          git diff --cached --check
          git commit -m 'fix: publish clean acceptance tree and dashboard contract'
          git push origin HEAD:agent/final-acceptance-20260807
