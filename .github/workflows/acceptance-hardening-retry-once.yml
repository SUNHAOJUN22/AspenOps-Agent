name: Acceptance hardening retry once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acceptance-hardening-retry-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-acceptance-hardening-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply validate and publish
        shell: bash
        run: |
          set -uo pipefail
          base_sha="$(git rev-parse HEAD)"
          log=/tmp/acceptance-hardening-retry.log
          : > "$log"
          status=0
          {
            set -e
            awk '
              /^          python - <<.PY.$/ {inside=1; next}
              /^          PY$/ {inside=0}
              inside {sub(/^          /, ""); print}
            ' .github/workflows/acceptance-hardening-once.yml > /tmp/apply-acceptance.py
            test -s /tmp/apply-acceptance.py
            python /tmp/apply-acceptance.py
            python - <<'PY'
            from pathlib import Path

            def replace(path: str, old: str, new: str) -> None:
                target = Path(path)
                text = target.read_text(encoding="utf-8")
                if text.count(old) != 1:
                    raise RuntimeError(f"repair anchor mismatch: {path}: {old!r}")
                target.write_text(text.replace(old, new, 1), encoding="utf-8")

            replace(
                "src/aspenops_nexus/engineering_rules.py",
                "set(zip(cycle, cycle[1:]))",
                "set(zip(cycle, cycle[1:], strict=False))",
            )
            replace(
                "src/aspenops_nexus/optimization.py",
                'if balance.get("passed") not in {True, 1.0}:',
                'if _finite_output(balance.get("passed")) != 1.0:',
            )
            PY
            rm -f \
              .github/workflows/acceptance-hardening-once.yml \
              .github/workflows/acceptance-hardening-retry-once.yml \
              docs/ACCEPTANCE_HARDENING_DIAGNOSTIC.json
            uv lock --check
            uv sync --frozen --extra dev --extra agent --extra signing
            uv run ruff format src tests
            uv run ruff check .
            uv run mypy src
            uv run python -m compileall -q src scripts tests
            uv run python scripts/audit_source_tree.py --output /tmp/source-tree-audit.json
            uv tool run --isolated --from 'bandit==1.9.4' bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high
            uv run pytest -W error::ResourceWarning \
              --cov=aspenops_nexus \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=95.0
            uv run python scripts/run_test_order_gate.py \
              --seed 20260728 \
              --output-dir /tmp/acceptance-order-gate
            git diff --check
          } > >(tee "$log") 2>&1 || status=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$status" -eq 0 ]]; then
            git add -A
            git commit -m "fix: harden acceptance-critical runtime contracts"
            git push origin HEAD:main
            exit 0
          fi

          git reset --hard "$base_sha"
          rm -f .github/workflows/acceptance-hardening-retry-once.yml
          {
            printf 'acceptance hardening retry failed with status %s\n\n' "$status"
            tail -n 800 "$log"
          } > docs/ACCEPTANCE_HARDENING_RETRY_DIAGNOSTIC.txt
          git add -A
          git commit -m "test: record acceptance hardening retry diagnostic"
          git push origin HEAD:main
          exit "$status"
