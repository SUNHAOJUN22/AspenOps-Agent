name: One-shot main governance audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-shot-main-governance-audit
  cancel-in-progress: true

jobs:
  linux-gate:
    name: Complete Linux production gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run full portable qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/audit
          uv sync --extra dev --extra agent --extra signing
          uv run ruff check . | tee var/audit/ruff.log
          uv run ruff format --check . | tee var/audit/ruff-format.log
          uv run mypy src | tee var/audit/mypy.log
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/audit/coverage.json \
            --junitxml=var/audit/junit.xml \
            --cov-fail-under=94.5 \
            | tee var/audit/pytest.log
          uv build
          uv run aspenops demo | tee var/audit/demo.log
          uv run python scripts/check_mcp.py | tee var/audit/mcp.json
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/audit/benchmark-smoke.json \
            --smoke
          uv run python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc var/audit/performance-baseline.md \
            --after-doc var/audit/performance-after.md \
            --fail-on-stable-regression \
            | tee var/audit/performance-policy.log
          python -m venv /tmp/aspenops-governance-wheel
          /tmp/aspenops-governance-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-governance-wheel/bin/aspenops --version \
            | tee var/audit/wheel-version.log
          /tmp/aspenops-governance-wheel/bin/aspenops demo \
            | tee var/audit/wheel-demo.log
          /tmp/aspenops-governance-wheel/bin/aspenops certification-preflight --help >/dev/null
          /tmp/aspenops-governance-wheel/bin/aspenops certify-licensed --help >/dev/null
          /tmp/aspenops-governance-wheel/bin/aspenops verify-licensed-bundle --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: main-governance-linux
          path: var/audit
          if-no-files-found: error
          retention-days: 90

  windows-gate:
    name: Complete Windows control-plane gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run public Windows contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force var/audit | Out-Null
          uv sync --extra dev --extra windows --extra agent --extra signing
          uv run ruff check src tests *>&1 | Tee-Object var/audit/ruff.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src *>&1 | Tee-Object var/audit/mypy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest -W error::ResourceWarning `
            tests/test_windows_job.py `
            tests/test_windows_job_edges.py `
            tests/test_aspen_process_ownership.py `
            tests/test_convergence.py `
            tests/test_backends_convergence.py `
            tests/test_v2_reliability.py `
            tests/test_singleflight.py `
            tests/test_worker_contracts.py `
            tests/test_worker_protocol_hardening.py `
            tests/test_pool_manager_creation.py `
            tests/test_scheduler_active_leases.py `
            tests/test_provenance_zip_safety.py `
            tests/test_archive_safety_complete.py `
            tests/test_licensed_certification.py `
            tests/test_licensed_bundle_integrity.py `
            tests/test_licensed_certification_workflow.py *>&1 `
            | Tee-Object var/audit/windows-contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: main-governance-windows
          path: var/audit
          if-no-files-found: error
          retention-days: 90

  consolidate:
    name: Retire branches and publish immutable audit
    needs: [linux-gate, windows-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: main-governance-linux
          path: var/audit/linux
      - uses: actions/download-artifact@v4
        with:
          name: main-governance-windows
          path: var/audit/windows
      - name: Archive and remove every non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          date_stamp="$(date -u +%Y%m%d)"
          mkdir -p var/audit/governance docs

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/audit/governance/refs-before.tsv
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' | sort -u \
            > var/audit/governance/open-prs-before.tsv
          : > var/audit/governance/deleted-branches.tsv
          : > var/audit/governance/archive-tags.tsv
          : > var/audit/governance/closed-prs.tsv

          create_archive_tag() {
            local branch="$1" commit_sha="$2"
            local sanitized tag encoded tag_object_sha
            sanitized="${branch//\//-}"
            tag="archive/retired-branch/${sanitized}/${date_stamp}/${commit_sha:0:12}"
            encoded="$(python - "$tag" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
            if ! gh api "repos/$repo/git/ref/tags/$encoded" >/dev/null 2>&1; then
              tag_object_sha="$(
                gh api --method POST "repos/$repo/git/tags" \
                  -f tag="$tag" \
                  -f message="Archived $branch at $commit_sha before single-main retirement. This tag preserves recoverability but is not a production certification." \
                  -f object="$commit_sha" \
                  -f type="commit" \
                  -f 'tagger[name]=AspenOps Governance' \
                  -f 'tagger[email]=aspenops-governance@users.noreply.github.com' \
                  -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --jq '.sha'
              )"
              gh api --method POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$tag_object_sha" >/dev/null
            fi
            printf '%s\t%s\t%s\n' "$branch" "$commit_sha" "$tag" \
              >> var/audit/governance/archive-tags.tsv
          }

          while IFS=$'\t' read -r ref commit_sha; do
            [[ -n "$ref" ]] || continue
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue
            create_archive_tag "$branch" "$commit_sha"

            while IFS=$'\t' read -r pr_number head_ref head_repo; do
              [[ -n "$pr_number" ]] || continue
              if [[ "$head_ref" == "$branch" && "$head_repo" == "$repo" ]]; then
                gh api --method PATCH "repos/$repo/pulls/$pr_number" -f state=closed >/dev/null
                printf '%s\t%s\n' "$pr_number" "$branch" \
                  >> var/audit/governance/closed-prs.tsv
              fi
            done < var/audit/governance/open-prs-before.tsv

            encoded_ref="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote('heads/' + sys.argv[1], safe=''))
          PY
          )"
            gh api --method DELETE "repos/$repo/git/refs/$encoded_ref"
            printf '%s\t%s\n' "$branch" "$commit_sha" \
              >> var/audit/governance/deleted-branches.tsv
          done < var/audit/governance/refs-before.tsv

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/audit/governance/refs-after.tsv
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' | sort -u \
            > var/audit/governance/open-prs-after.tsv

          [[ "$(wc -l < var/audit/governance/refs-after.tsv | tr -d ' ')" == "1" ]]
          grep -Eq '^refs/heads/main[[:space:]][0-9a-f]{40}$' \
            var/audit/governance/refs-after.tsv

      - name: Write audit, remove temporary workflows, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort \
            > var/audit/governance/workflows-before.txt

          python - <<'PY'
          import json
          import subprocess
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          gov = root / 'var/audit/governance'

          def tsv(name, fields):
              path = gov / name
              rows = []
              if not path.exists():
                  return rows
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line:
                      continue
                  parts = line.split('\t')
                  rows.append(dict(zip(fields, parts, strict=False)))
              return rows

          coverage = json.loads((root / 'var/audit/linux/coverage.json').read_text())
          totals = coverage['totals']
          junit_root = ET.parse(root / 'var/audit/linux/junit.xml').getroot()
          tests = int(junit_root.attrib.get('tests', 0))
          if not tests:
              tests = sum(int(node.attrib.get('tests', 0)) for node in junit_root.findall('testsuite'))
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          workflows = (gov / 'workflows-before.txt').read_text().splitlines()
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          audit = {
              'schema': 'aspenops.single-main-audit/v2',
              'repository': 'SUNHAOJUN22/AspenOps-Agent',
              'source_main_sha': source_sha,
              'default_branch': 'main',
              'package': project['name'],
              'version': project['version'],
              'branch_refs_before': tsv('refs-before.tsv', ('ref', 'sha')),
              'branch_refs_after': tsv('refs-after.tsv', ('ref', 'sha')),
              'deleted_branches': tsv('deleted-branches.tsv', ('branch', 'sha')),
              'archive_tags': tsv('archive-tags.tsv', ('branch', 'sha', 'tag')),
              'closed_pull_requests': tsv('closed-prs.tsv', ('number', 'branch')),
              'open_pull_requests_after': tsv('open-prs-after.tsv', ('number', 'branch', 'repository')),
              'workflows_before_cleanup': workflows,
              'linux_gate': 'PASS',
              'windows_control_plane_gate': 'PASS',
              'test_count_python_3_12': tests,
              'combined_branch_aware_coverage_percent': totals['percent_covered'],
              'coverage_floor_percent': 94.5,
              'build': 'PASS',
              'wheel_install': 'PASS',
              'mcp_surface': 'PASS',
              'benchmark_stable_regression_gate': 'PASS',
              'real_aspen_status': 'PENDING_REAL_ASPEN_CERTIFICATION',
              'status': 'PASS',
          }
          (root / 'docs/single-main-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          md = f'''# AspenOps single-main audit

- Status: **PASS**
- Source main SHA: `{source_sha}`
- Package: `{project['name']} {project['version']}`
- Remaining branch refs: `{len(audit['branch_refs_after'])}` (`main` only)
- Deleted in this run: `{len(audit['deleted_branches'])}`
- Open pull requests after cleanup: `{len(audit['open_pull_requests_after'])}`
- Linux production gate: **PASS**
- Windows control-plane gate: **PASS**
- Python 3.12 tests: **{tests} passed**
- Branch-aware combined coverage: **{totals['percent_covered']:.2f}%**
- Coverage floor: **94.5%**
- Build / wheel / MCP / benchmark policy: **PASS**
- Real Aspen status: `PENDING_REAL_ASPEN_CERTIFICATION`

The licensed Aspen boundary remains explicit: public CI verifies the control plane and does not claim physical Aspen certification.
'''
          (root / 'docs/single-main-audit.md').write_text(md, encoding='utf-8')
          PY

          stale_regex='(final-main|single-main|one-shot|consolidat|materializ|branch-clean|diagnostic|cleanup)'
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if grep -Eiq "$stale_regex" <<<"$file"; then
              rm -f ".github/workflows/$file"
            fi
          done < var/audit/governance/workflows-before.txt

          git config user.name "AspenOps Governance"
          git config user.email "aspenops-governance@users.noreply.github.com"
          git add docs/single-main-audit.json docs/single-main-audit.md .github/workflows
          git diff --cached --check
          git commit -m "chore: finalize verified single-main governance"
          git push origin HEAD:main
