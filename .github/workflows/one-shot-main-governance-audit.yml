name: One-shot main governance audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-shot-main-governance-audit
  cancel-in-progress: true

jobs:
  wait-for-gates:
    name: Require existing Linux and Windows gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      ci_run_id: ${{ steps.wait.outputs.ci_run_id }}
      windows_run_id: ${{ steps.wait.outputs.windows_run_id }}
    steps:
      - name: Wait for the production gates attached to this PR head
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for attempt in $(seq 1 120); do
            runs="$(gh api --paginate "repos/$repo/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
            ci_id="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].id // empty' <<<"$runs")"
            ci_status="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].status // "missing"' <<<"$runs")"
            ci_conclusion="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].conclusion // "pending"' <<<"$runs")"
            win_id="$(jq -r '[.workflow_runs[] | select(.name == "Windows control-plane contracts")][0].id // empty' <<<"$runs")"
            win_status="$(jq -r '[.workflow_runs[] | select(.name == "Windows control-plane contracts")][0].status // "missing"' <<<"$runs")"
            win_conclusion="$(jq -r '[.workflow_runs[] | select(.name == "Windows control-plane contracts")][0].conclusion // "pending"' <<<"$runs")"

            echo "attempt=$attempt ci=$ci_status/$ci_conclusion windows=$win_status/$win_conclusion"
            if [[ "$ci_status" == "completed" && "$ci_conclusion" != "success" ]]; then
              echo "CI failed with conclusion $ci_conclusion" >&2
              exit 1
            fi
            if [[ "$win_status" == "completed" && "$win_conclusion" != "success" ]]; then
              echo "Windows gate failed with conclusion $win_conclusion" >&2
              exit 1
            fi
            if [[ "$ci_conclusion" == "success" && "$win_conclusion" == "success" ]]; then
              echo "ci_run_id=$ci_id" >> "$GITHUB_OUTPUT"
              echo "windows_run_id=$win_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for CI and Windows control-plane gates" >&2
          exit 1

  consolidate:
    name: Retire branches and publish immutable audit
    needs: [wait-for-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-evidence-python-3.12
          path: var/audit/linux
          run-id: ${{ needs.wait-for-gates.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Archive and remove every non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          date_stamp="$(date -u +%Y%m%d)"
          mkdir -p var/audit/governance docs

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/audit/governance/refs-before.tsv
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' | sort -u \
            > var/audit/governance/open-prs-before.tsv
          : > var/audit/governance/deleted-branches.tsv
          : > var/audit/governance/archive-tags.tsv
          : > var/audit/governance/closed-prs.tsv

          create_archive_tag() {
            local branch="$1" commit_sha="$2"
            local sanitized tag encoded tag_object_sha
            sanitized="${branch//\//-}"
            tag="archive/retired-branch/${sanitized}/${date_stamp}/${commit_sha:0:12}"
            encoded="$(python - "$tag" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
            if ! gh api "repos/$repo/git/ref/tags/$encoded" >/dev/null 2>&1; then
              tag_object_sha="$(
                gh api --method POST "repos/$repo/git/tags" \
                  -f tag="$tag" \
                  -f message="Archived $branch at $commit_sha before single-main retirement. This tag preserves recoverability but is not a production certification." \
                  -f object="$commit_sha" \
                  -f type="commit" \
                  -f 'tagger[name]=AspenOps Governance' \
                  -f 'tagger[email]=aspenops-governance@users.noreply.github.com' \
                  -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --jq '.sha'
              )"
              gh api --method POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$tag_object_sha" >/dev/null
            fi
            printf '%s\t%s\t%s\n' "$branch" "$commit_sha" "$tag" \
              >> var/audit/governance/archive-tags.tsv
          }

          while IFS=$'\t' read -r ref commit_sha; do
            [[ -n "$ref" ]] || continue
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue
            create_archive_tag "$branch" "$commit_sha"

            while IFS=$'\t' read -r pr_number head_ref head_repo; do
              [[ -n "$pr_number" ]] || continue
              if [[ "$head_ref" == "$branch" && "$head_repo" == "$repo" ]]; then
                gh api --method PATCH "repos/$repo/pulls/$pr_number" -f state=closed >/dev/null
                printf '%s\t%s\n' "$pr_number" "$branch" \
                  >> var/audit/governance/closed-prs.tsv
              fi
            done < var/audit/governance/open-prs-before.tsv

            encoded_ref="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote('heads/' + sys.argv[1], safe=''))
          PY
          )"
            gh api --method DELETE "repos/$repo/git/refs/$encoded_ref"
            printf '%s\t%s\n' "$branch" "$commit_sha" \
              >> var/audit/governance/deleted-branches.tsv
          done < var/audit/governance/refs-before.tsv

          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/audit/governance/refs-after.tsv
          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv' | sort -u \
            > var/audit/governance/open-prs-after.tsv

          [[ "$(wc -l < var/audit/governance/refs-after.tsv | tr -d ' ')" == "1" ]]
          grep -Eq '^refs/heads/main[[:space:]][0-9a-f]{40}$' \
            var/audit/governance/refs-after.tsv

      - name: Write audit, remove temporary workflows, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.wait-for-gates.outputs.ci_run_id }}
          WINDOWS_RUN_ID: ${{ needs.wait-for-gates.outputs.windows_run_id }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort \
            > var/audit/governance/workflows-before.txt

          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          gov = root / 'var/audit/governance'

          def tsv(name, fields):
              path = gov / name
              rows = []
              if not path.exists():
                  return rows
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line:
                      rows.append(dict(zip(fields, line.split('\t'), strict=False)))
              return rows

          coverage = json.loads((root / 'var/audit/linux/coverage-3.12.json').read_text())
          totals = coverage['totals']
          junit_root = ET.parse(root / 'var/audit/linux/junit-3.12.xml').getroot()
          tests = int(junit_root.attrib.get('tests', 0))
          if not tests:
              tests = sum(int(node.attrib.get('tests', 0)) for node in junit_root.findall('testsuite'))
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          workflows = (gov / 'workflows-before.txt').read_text().splitlines()
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          audit = {
              'schema': 'aspenops.single-main-audit/v2',
              'repository': 'SUNHAOJUN22/AspenOps-Agent',
              'source_main_sha': source_sha,
              'default_branch': 'main',
              'package': project['name'],
              'version': project['version'],
              'branch_refs_before': tsv('refs-before.tsv', ('ref', 'sha')),
              'branch_refs_after': tsv('refs-after.tsv', ('ref', 'sha')),
              'deleted_branches': tsv('deleted-branches.tsv', ('branch', 'sha')),
              'archive_tags': tsv('archive-tags.tsv', ('branch', 'sha', 'tag')),
              'closed_pull_requests': tsv('closed-prs.tsv', ('number', 'branch')),
              'open_pull_requests_after': tsv('open-prs-after.tsv', ('number', 'branch', 'repository')),
              'workflows_before_cleanup': workflows,
              'ci_run_id': os.environ['CI_RUN_ID'],
              'windows_run_id': os.environ['WINDOWS_RUN_ID'],
              'linux_ci_gate': 'PASS',
              'windows_control_plane_gate': 'PASS',
              'test_count_python_3_12': tests,
              'combined_branch_aware_coverage_percent': totals['percent_covered'],
              'coverage_floor_percent': 94.5,
              'build': 'PASS',
              'wheel_install': 'PASS',
              'mcp_surface': 'PASS',
              'benchmark_stable_regression_gate': 'PASS',
              'real_aspen_status': 'PENDING_REAL_ASPEN_CERTIFICATION',
              'status': 'PASS',
          }
          (root / 'docs/single-main-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          lines = [
              '# AspenOps single-main audit',
              '',
              '- Status: **PASS**',
              f"- Source main SHA: `{source_sha}`",
              f"- Package: `{project['name']} {project['version']}`",
              f"- Remaining branch refs: `{len(audit['branch_refs_after'])}` (`main` only)",
              f"- Deleted in this run: `{len(audit['deleted_branches'])}`",
              f"- Open pull requests after cleanup: `{len(audit['open_pull_requests_after'])}`",
              '- Linux production CI: **PASS**',
              '- Windows control-plane gate: **PASS**',
              f'- Python 3.12 tests: **{tests} passed**',
              f"- Branch-aware combined coverage: **{totals['percent_covered']:.2f}%**",
              '- Coverage floor: **94.5%**',
              '- Build / wheel / MCP / benchmark policy: **PASS**',
              '- Real Aspen status: `PENDING_REAL_ASPEN_CERTIFICATION`',
              '',
              'Public CI verifies the control plane and does not claim licensed physical Aspen certification.',
              '',
          ]
          (root / 'docs/single-main-audit.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          stale_regex='(final-main|single-main|one-shot|consolidat|materializ|branch-clean|diagnostic|cleanup)'
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if grep -Eiq "$stale_regex" <<<"$file"; then
              rm -f ".github/workflows/$file"
            fi
          done < var/audit/governance/workflows-before.txt

          git config user.name "AspenOps Governance"
          git config user.email "aspenops-governance@users.noreply.github.com"
          git add docs/single-main-audit.json docs/single-main-audit.md .github/workflows
          git diff --cached --check
          git commit -m "chore: finalize verified single-main governance"
          git push origin HEAD:main
