name: Diagnose stalled README qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-readme-qualification-once.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read qualification run and logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 5757ac51254b21480068166e5c7fbca87415d765
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, zipfile, io

          repo = os.environ['REPO']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AspenOps-Qualification-Diagnostic',
          }

          def get_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def get_bytes(url: str) -> bytes:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          runs = get_json(
              f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          ).get('workflow_runs', [])
          payload = {'schema': 'aspenops.readme-qualification-diagnostic/v1', 'target_sha': sha, 'runs': []}
          for run in runs:
              jobs = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100"
              ).get('jobs', [])
              run_record = {
                  'id': run['id'],
                  'name': run['name'],
                  'path': run.get('path'),
                  'status': run['status'],
                  'conclusion': run.get('conclusion'),
                  'event': run['event'],
                  'html_url': run['html_url'],
                  'jobs': [],
              }
              for job in jobs:
                  failed_steps = [
                      step['name'] for step in job.get('steps', [])
                      if step.get('conclusion') == 'failure'
                  ]
                  record = {
                      'id': job['id'],
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job.get('conclusion'),
                      'failed_steps': failed_steps,
                      'log_tail': [],
                  }
                  if job.get('conclusion') in {'failure', 'timed_out', 'cancelled'}:
                      try:
                          raw = get_bytes(
                              f"https://api.github.com/repos/{repo}/actions/jobs/{job['id']}/logs"
                          )
                          text = raw.decode('utf-8', errors='replace')
                          lines = [line for line in text.splitlines() if line.strip()]
                          record['log_tail'] = lines[-120:]
                      except Exception as exc:
                          record['log_error'] = f'{type(exc).__name__}: {exc}'
                  run_record['jobs'].append(record)
              payload['runs'].append(run_record)

          path = pathlib.Path('docs/README_QUALIFICATION_DIAGNOSTIC.json')
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-readme-qualification-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/README_QUALIFICATION_DIAGNOSTIC.json .github/workflows/diagnose-readme-qualification-once.yml
          git commit -m "test: record stalled README qualification diagnostic"
          git push origin HEAD:main
