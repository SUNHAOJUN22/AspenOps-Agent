name: Phase 1 one-time safety patch

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-safety-patch-once.yml

permissions:
  contents: write

jobs:
  patch-format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Tighten design target and equipment contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once_or_confirm(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one patch target in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          ir = Path("src/aspenops_nexus/process_ir_v2.py")
          replace_once_or_confirm(
              ir,
              '''_REACTION_KINDS = {
              ''',
              '''_TARGET_SIMULATORS = {"aspen_plus", "hysys"}
              _TARGET_VERSIONS = {"14", "15", "approved-version"}
              _REACTION_KINDS = {
              ''',
          )
          replace_once_or_confirm(
              ir,
              '''        return cls(
                          name=_text(mapping.get("name"), "process design.name"),
                          target_simulator=_text(
                              mapping.get("target_simulator"),
                              "process design.target_simulator",
                          ).casefold(),
                          target_version=_text(mapping.get("target_version"), "process design.target_version"),
              ''',
              '''        target_simulator = _text(
                          mapping.get("target_simulator"),
                          "process design.target_simulator",
                      ).casefold()
                      if target_simulator not in _TARGET_SIMULATORS:
                          raise ValueError(f"Unsupported process design simulator: {target_simulator}")
                      target_version = _text(
                          mapping.get("target_version"),
                          "process design.target_version",
                      ).casefold()
                      if target_version not in _TARGET_VERSIONS:
                          raise ValueError(f"Unsupported process design version: {target_version}")
                      return cls(
                          name=_text(mapping.get("name"), "process design.name"),
                          target_simulator=target_simulator,
                          target_version=target_version,
              ''',
          )

          rules = Path("src/aspenops_nexus/engineering_rules.py")
          replace_once_or_confirm(
              rules,
              '''                "WARNING",
                              "equipment.contract_unavailable",
              ''',
              '''                "ENGINEERING_BLOCKER",
                              "equipment.contract_unavailable",
              ''',
          )
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            src/aspenops_nexus/process_ir_v2.py \
            src/aspenops_nexus/engineering_rules.py
          rm -f \
            .github/workflows/phase1-validate-once.yml \
            .github/workflows/phase1-format-once-v2.yml \
            .github/workflows/phase1-final-format-once.yml \
            .github/workflows/phase1-safety-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fail closed on unsupported design targets and equipment"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
