name: One-time dependency lock refresh evidence

on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-lock-evidence.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: false
      - name: Refresh only the vulnerable locked packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/lock-refresh
          uv lock --upgrade-package pyjwt --upgrade-package cryptography \
            2>&1 | tee var/lock-refresh/lock-refresh.log
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing \
            2>&1 | tee var/lock-refresh/sync.log
          audit_failed=0
          export UV_PREVIEW_FEATURES=json-output
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              output="var/lock-refresh/audit-${platform}-py${version}.json"
              if ! uv audit --frozen --python-platform "$platform" \
                --python-version "$version" --output-format json > "$output"; then
                audit_failed=1
              fi
              python -m json.tool "$output" >/dev/null
            done
          done
          cp uv.lock var/lock-refresh/uv.lock
          sha256sum uv.lock > var/lock-refresh/SHA256SUMS
          test "$audit_failed" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/lock-refresh
          if-no-files-found: error
          retention-days: 7
      - name: Publish the audited lock and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git diff -- uv.lock)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git rm .github/workflows/refresh-lock-evidence.yml
          git commit -m "fix: refresh audited Python dependency lock"
          git push origin HEAD:main
