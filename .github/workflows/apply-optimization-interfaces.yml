name: Apply optimization interfaces

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/apply-optimization-interfaces.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra agent
      - name: Apply interfaces
        run: uv run python scripts/apply_optimization_interfaces.py
      - name: Validate interfaces
        run: |
          uv run ruff check .
          uv run mypy src
          uv run pytest tests/test_optimizer.py tests/test_optimization.py \
            tests/test_optimization_interfaces.py tests/test_mcp.py
      - name: Commit interfaces
        run: |
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose durable batch optimization"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
