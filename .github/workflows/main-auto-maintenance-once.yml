name: AspenOps Main Auto Maintenance Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-main-auto-maintenance-once
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event.issue.title == 'ASPENOPS_MAIN_AUTO_MAINTENANCE_V1_20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Check, repair and qualify current main
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          INPUT_SHA="$(git rev-parse HEAD^)"
          SELF=.github/workflows/main-auto-maintenance-once.yml
          E=var/auto-maintenance
          rm -rf "$E" dist /tmp/aspenops-auto-wheel
          mkdir -p "$E"
          rm -f "$SELF" docs/AUTO_MAINTENANCE_BLOCKER.json

          : > "$E/status.tsv"
          failed=0
          gate() {
            local name="$1"
            shift
            set +e
            "$@" >"$E/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          gate lock-check uv lock --check
          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate dependency-audit bash -lc '
            set -euo pipefail
            result=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem="var/auto-maintenance/dependency-${platform}-${version}"
                uv audit --frozen \
                  --python-platform "$platform" \
                  --python-version "$version" \
                  --output-format json >"${stem}.json" 2>"${stem}.log" || result=1
                python -m json.tool "${stem}.json" >/dev/null || result=1
              done
            done
            exit "$result"
          '

          gate p0-ruff-fix uv run --python 3.12 ruff check --fix --unsafe-fixes \
            src/aspenops_nexus/research.py \
            src/aspenops_nexus/research_*.py \
            tests/test_research_*.py
          gate p0-format-fix uv run --python 3.12 ruff format \
            src/aspenops_nexus/research.py \
            src/aspenops_nexus/research_*.py \
            tests/test_research_*.py
          gate boundary-check python - <<'PY'
          import subprocess

          allowed = (
              '.github/workflows/main-auto-maintenance-once.yml',
              'docs/AUTO_MAINTENANCE_',
              'docs/CLOSED_LOOP_VALIDATION_RESEARCH_P0',
              'docs/P0_PHASE_RESULT.json',
              'docs/research-layer-p0-',
              'src/aspenops_nexus/research.py',
              'src/aspenops_nexus/research_',
              'tests/test_research_',
          )
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unexpected = [path for path in changed if not path.startswith(allowed)]
          if unexpected:
              raise SystemExit('runtime-core boundary violation: ' + ', '.join(unexpected))
          PY
          gate diff-check git diff --check
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py \
            --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high \
              --format json \
              --output var/auto-maintenance/bandit.json \
              2>var/auto-maintenance/bandit.log || status=$?
            python -m json.tool var/auto-maintenance/bandit.json >/dev/null
            exit "$status"
          '

          gate p0-contract uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_examples.py \
            tests/test_research_governance.py \
            tests/test_research_contract_edges.py \
            --cov=aspenops_nexus.research \
            --cov=aspenops_nexus.research_common \
            --cov=aspenops_nexus.research_data \
            --cov=aspenops_nexus.research_parameters \
            --cov=aspenops_nexus.research_runs \
            --cov=aspenops_nexus.research_claims \
            --cov=aspenops_nexus.research_document \
            --cov=aspenops_nexus.research_graph \
            --cov=aspenops_nexus.research_graph_support \
            --cov=aspenops_nexus.research_graph_basic \
            --cov=aspenops_nexus.research_graph_runs \
            --cov=aspenops_nexus.research_graph_claims \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:"$E/p0-coverage.json" \
            --junitxml="$E/p0-junit.xml" \
            --cov-fail-under=98.0

          for version in 3.11 3.12 3.13; do
            floor=94.5
            if [[ "$version" == 3.12 ]]; then floor=95.0; fi
            gate "full-${version}" bash -lc "
              set -euo pipefail
              uv sync --python ${version} --frozen --extra dev --extra agent --extra signing
              uv run --python ${version} pytest -W error::ResourceWarning \
                --cov=aspenops_nexus \
                --cov-branch \
                --cov-report=term-missing \
                --cov-report=json:${E}/coverage-${version}.json \
                --junitxml=${E}/junit-${version}.xml \
                --cov-fail-under=${floor}
            "
          done

          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py \
            --seed 20260730 \
            --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$E/process-intent-canonical.json" \
            --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py \
            --dist-dir dist \
            --output "$E/wheel-metadata.json"
          gate demo uv run --python 3.12 aspenops demo
          gate wheel-smoke bash -lc '
            set -euo pipefail
            python -m venv /tmp/aspenops-auto-wheel
            /tmp/aspenops-auto-wheel/bin/pip install --no-deps dist/*.whl
            /tmp/aspenops-auto-wheel/bin/aspenops --version
            /tmp/aspenops-auto-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-auto-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-auto-wheel/bin/python - <<"PY"
            import importlib.resources as resources
            import aspenops_nexus.research

            root = resources.files("aspenops_nexus").joinpath("data")
            observed = {
                path.name
                for path in root.iterdir()
                if path.name.startswith("research-") and path.name.endswith(".schema.json")
            }
            expected = {
                "research-common.schema.json",
                "research-study.schema.json",
                "research-dataset.schema.json",
                "research-target.schema.json",
                "research-parameter.schema.json",
                "research-assumption.schema.json",
                "research-calibration.schema.json",
                "research-validation.schema.json",
                "research-claim.schema.json",
            }
            assert observed == expected, (observed, expected)
            PY
          '

          if [[ "$failed" -ne 0 ]]; then
            git reset --hard "$BASE"
            rm -f "$SELF"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path('var/auto-maintenance')
          status = {}
          tails = {}
          for line in (evidence / 'status.tsv').read_text(encoding='utf-8').splitlines():
              name, code = line.split('\t')
              status[name] = int(code)
          for name, code in status.items():
              log = evidence / f'{name}.log'
              if code and log.exists():
                  tails[name] = log.read_text(encoding='utf-8', errors='replace').splitlines()[-120:]
          payload = {
              'schema': 'aspenops.auto-maintenance-blocker/v1',
              'decision': 'FAIL',
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'gate_status': status,
              'failure_tail': tails,
              'source_changes_retained': False,
              'runtime_core_changed': False,
              'last_known_good_p0_retained': True,
          }
          Path('docs/AUTO_MAINTENANCE_BLOCKER.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: record automatic maintenance blocker'
            git push origin HEAD:main
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path('var/auto-maintenance')
          status = {}
          for line in (evidence / 'status.tsv').read_text(encoding='utf-8').splitlines():
              name, code = line.split('\t')
              status[name] = int(code)

          def junit(path: Path) -> dict[str, int | float]:
              root = ET.parse(path).getroot()
              suite = root if root.tag == 'testsuite' else root.find('testsuite')
              if suite is None:
                  raise RuntimeError(f'no testsuite in {path}')
              return {
                  'tests': int(suite.attrib.get('tests', 0)),
                  'failures': int(suite.attrib.get('failures', 0)),
                  'errors': int(suite.attrib.get('errors', 0)),
                  'skipped': int(suite.attrib.get('skipped', 0)),
                  'time_seconds': float(suite.attrib.get('time', 0.0)),
              }

          def coverage(path: Path) -> dict[str, float]:
              totals = json.loads(path.read_text(encoding='utf-8'))['totals']
              branches = int(totals.get('num_branches', 0))
              covered_branches = int(totals.get('covered_branches', 0))
              return {
                  'total_percent': float(totals['percent_covered']),
                  'branch_percent': 100.0 if not branches else 100.0 * covered_branches / branches,
              }

          p0_tests = junit(evidence / 'p0-junit.xml')
          full_tests = {
              version: junit(evidence / f'junit-{version}.xml')
              for version in ('3.11', '3.12', '3.13')
          }
          coverage_results = {
              'p0': coverage(evidence / 'p0-coverage.json'),
              **{
                  version: coverage(evidence / f'coverage-{version}.json')
                  for version in ('3.11', '3.12', '3.13')
              },
          }
          result = {
              'schema': 'aspenops.auto-maintenance-result/v1',
              'decision': 'PASS',
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'checked_input_main_sha': os.environ.get('INPUT_SHA', ''),
              'hard_gates': status,
              'p0_tests': p0_tests,
              'full_tests': full_tests,
              'coverage': coverage_results,
              'runtime_core_changed': False,
              'aspen_executed': False,
              'parameter_estimation_executed': False,
              'dynamic_modeling_executed': False,
              'machine_learning_executed': False,
          }
          Path('docs/AUTO_MAINTENANCE_RESULT.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          p0 = json.loads(Path('docs/P0_PHASE_RESULT.json').read_text(encoding='utf-8'))
          p0['decision'] = 'PASS'
          p0['qualification_run'] = {
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
          }
          p0['p0_tests'] = p0_tests
          p0['full_tests'] = full_tests
          p0['coverage'] = coverage_results
          p0['hard_gates'] = status
          Path('docs/P0_PHASE_RESULT.json').write_text(
              json.dumps(p0, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          rm -f docs/AUTO_MAINTENANCE_BLOCKER.json
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh automatic code qualification'
          git push origin HEAD:main
      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close '${{ github.event.issue.number }}' \
            --repo '${{ github.repository }}' \
            --comment 'Automatic main qualification completed; inspect docs/AUTO_MAINTENANCE_RESULT.json or docs/AUTO_MAINTENANCE_BLOCKER.json.'
