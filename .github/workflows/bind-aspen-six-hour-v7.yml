name: Bind Aspen six-hour gate v7

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  bind:
    if: github.event.issue.number == 114 && github.event.comment.body == '/bind-aspen-six-hour-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Bind prior active gate to repaired source
        shell: bash
        run: |
          set -euo pipefail
          git show 49aa507e349f01ab97925e868447bfb7bc620909:.github/workflows/one-time-six-hour-active.yml > /tmp/aspen-active.yml
          python - <<'PY'
          from pathlib import Path

          template = Path('/tmp/aspen-active.yml').read_text(encoding='utf-8')
          old_sha = 'de952b7df54134eed269e5545f0e710f56efd66d'
          new_sha = '6489c9109b827392ba4ba3f8944d5b1ce42b2e4e'
          old_command = '/run-six-hour-active-v3'
          new_command = '/run-aspen-six-hour-active-v7'
          if template.count(old_sha) != 3:
              raise SystemExit(f'old source count drifted: {template.count(old_sha)}')
          if template.count(old_command) != 3:
              raise SystemExit(f'old command count drifted: {template.count(old_command)}')
          active = template.replace(old_sha, new_sha).replace(old_command, new_command)
          if active.count('mkdir -p six-hour-evidence') != 2:
              raise SystemExit('Aspen evidence-directory count drifted')
          active = active.replace(
              'mkdir -p six-hour-evidence',
              'mkdir -p "$RUNNER_TEMP/six-hour-evidence"',
          )
          if active.count('evidence_dir = Path("six-hour-evidence")') != 2:
              raise SystemExit('Aspen evidence-path count drifted')
          active = active.replace(
              'evidence_dir = Path("six-hour-evidence")',
              'evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "six-hour-evidence"',
          )
          if active.count('path: six-hour-evidence/') != 2:
              raise SystemExit('Aspen upload-path count drifted')
          expression = '$' + '{{ runner.temp }}'
          active = active.replace(
              'path: six-hour-evidence/',
              f'path: {expression}/six-hour-evidence/',
          )
          Path('.github/workflows/one-time-aspen-six-hour-active-v7.yml').write_text(active, encoding='utf-8')
          Path('.github/workflows/bind-aspen-six-hour-v7.yml').unlink()
          PY
          git diff --check

      - name: Publish bound gate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: bind Aspen six-hour gate to repaired source"
          git push origin HEAD:main
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record binding result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_SHA: ${{ steps.publish.outputs.harness_sha }}
        run: |
          set -euo pipefail
          gh issue comment 114 --repo "$GITHUB_REPOSITORY" --body "ASPEN_BIND_V7 status=${{ job.status }} harness_sha=${HARNESS_SHA:-UNPUBLISHED} source=6489c9109b827392ba4ba3f8944d5b1ce42b2e4e next=/run-aspen-six-hour-active-v7"
