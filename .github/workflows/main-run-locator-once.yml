name: Main run locator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-run-locator-once.yml

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 7631cb0c0d7ac08c28034d4685c854cf958a6be2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Locate runs and clean diagnostic workflows
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo SUNHAOJUN22/AspenOps-Agent \
            --commit "$TARGET_SHA" \
            --limit 30 \
            --json databaseId,workflowName,status,conclusion,event,createdAt,updatedAt,url \
            > docs/MAIN_RUN_LOCATOR.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-run-locator-once.yml
          git rm -f .github/workflows/main-dependency-audit-diagnostic-once.yml
          git add docs/MAIN_RUN_LOCATOR.json
          git commit -m "test: record main workflow run locator"
          git push origin HEAD:main
