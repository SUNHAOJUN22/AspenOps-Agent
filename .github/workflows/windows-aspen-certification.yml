name: Licensed Windows Aspen certification

on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: [self-hosted, Windows, Aspen]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra windows --extra dev --extra agent
      - run: uv run aspenops doctor --probe
      - name: Repeat approved qualification case
        shell: powershell
        run: |
          if (-not $env:ASPENOPS_CERT_REQUEST) { throw "ASPENOPS_CERT_REQUEST is required" }
          uv run aspenops dry-run $env:ASPENOPS_CERT_REQUEST
          uv run aspenops certify $env:ASPENOPS_CERT_REQUEST `
            --output var/real-aspen-certification-report.json `
            --repeats 3
      - uses: actions/upload-artifact@v4
        with:
          name: aspen-certification-evidence
          path: var/real-aspen-certification-report.json
