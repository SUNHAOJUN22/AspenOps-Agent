name: Format six-repository qualification runner once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: format-six-repository-runner-once
  cancel-in-progress: false

jobs:
  format-and-qualify:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/format-six-repository-runner-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Install exact repository environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
      - name: Format runner and remove temporary controller
        run: |
          set -euo pipefail
          uv run ruff format scripts/run_six_repository_active_gate.py
          rm .github/workflows/format-six-repository-runner-once.yml
          git diff --check
      - name: Create controller-free exact-tree candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            scripts/run_six_repository_active_gate.py \
            .github/workflows/format-six-repository-runner-once.yml
          git commit -m 'style: format exact-SHA active qualification runner'
          echo 'candidate_sha='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete AspenOps baseline on candidate
        run: |
          set -euo pipefail
          uv run python scripts/refresh_current_main_readme.py --check
          uv run python -m py_compile scripts/run_six_repository_active_gate.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning -q
          git diff --exit-code
          git diff --check
      - name: Publish exact qualified candidate
        run: |
          set -euo pipefail
          git fetch origin main
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          if [ "$EXPECTED_PARENT" != "$REMOTE_MAIN" ]; then
            echo "STALE_MAIN expected_parent=${EXPECTED_PARENT} remote_main=${REMOTE_MAIN}" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          gh issue comment "$ISSUE" --body "FORMAT_SIX_REPOSITORY_RUNNER_V2 outcome=${OUTCOME} candidate=${CANDIDATE:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} controller=self_removed"
