name: One-shot align current contract tests

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/fix-current-contract-tests.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Align tests with owner fencing and maximize sentinel semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_mcp_tools.py")
          text = path.read_text(encoding="utf-8")
          old = '        assert scheduler.store.complete(job_id, result_payload, bundle, "token")\n'
          new = (
              '        assert scheduler.store.complete(\n'
              '            job_id, result_payload, bundle, "token", owner="test-owner"\n'
              '        )\n'
          )
          if old not in text:
              raise SystemExit("MCP owner-fencing assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_optimization_contracts.py")
          text = path.read_text(encoding="utf-8")
          old = '        Settings(state_dir=tmp_path / "state", allowed_roots=(allowed,)),\n'
          new = (
              '        Settings(\n'
              '            state_dir=tmp_path / "state",\n'
              '            allowed_roots=(ROOT, allowed),\n'
              '        ),\n'
          )
          if old not in text:
              raise SystemExit("checkpoint allowed-roots assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_optimization_validation_complete.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert active.trace[1].objectives == (1e12, 1e12)\n'
          new = '    assert active.trace[1].objectives == (1e12, -1e12)\n'
          if old not in text:
              raise SystemExit("maximize missing-output assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate focused contracts
        run: |
          uv sync --extra dev --extra agent
          uv run ruff format tests/test_mcp_tools.py tests/test_optimization_contracts.py tests/test_optimization_validation_complete.py
          uv run ruff check tests/test_mcp_tools.py tests/test_optimization_contracts.py tests/test_optimization_validation_complete.py
          uv run pytest tests/test_mcp_tools.py tests/test_optimization_contracts.py tests/test_optimization_validation_complete.py
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/fix-current-contract-tests.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add tests/test_mcp_tools.py tests/test_optimization_contracts.py tests/test_optimization_validation_complete.py .github/workflows/fix-current-contract-tests.yml
          git commit -m "test: align owner-fenced and maximize contracts"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
