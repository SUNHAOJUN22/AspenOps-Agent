name: Phase 2 one-time correctness and formatting fix

on:
  pull_request:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase2-fix-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-v15-compilation-contracts
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply Phase 2 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          topology = Path("src/aspenops_nexus/native_topology.py")
          text = topology.read_text(encoding="utf-8")
          old = '''    def to_dict(self) -> dict[str, Any]:
                  return {
                      "schema": self.schema,
                      "simulator": self.simulator,
                      "marketing_version": self.marketing_version,
                      "nodes": [item.to_dict() for item in self.nodes],
                      "edges": [item.to_dict() for item in self.edges],
                      "source": self.source,
                  }

              def digest(self) -> str:
                  return _canonical_hash(self.to_dict())
          '''
          new = '''    def identity_dict(self) -> dict[str, Any]:
                  return {
                      "schema": self.schema,
                      "simulator": self.simulator,
                      "marketing_version": self.marketing_version,
                      "nodes": [item.to_dict() for item in self.nodes],
                      "edges": [item.to_dict() for item in self.edges],
                  }

              def to_dict(self) -> dict[str, Any]:
                  return {**self.identity_dict(), "source": self.source}

              def digest(self) -> str:
                  return _canonical_hash(self.identity_dict())
          '''
          if old not in text:
              raise RuntimeError("Native topology digest target not found")
          topology.write_text(text.replace(old, new, 1), encoding="utf-8")

          compilation_test = Path("tests/test_compilation_plan_v15.py")
          text = compilation_test.read_text(encoding="utf-8")
          marker = '''def test_recycle_design_adds_closed_loop_steps() -> None:
              value = document()
          '''
          replacement = '''def test_recycle_design_adds_closed_loop_steps() -> None:
              value = document()
              value["streams"] = [item for item in value["streams"] if item["id"] != "S004"]
              value["equipment"] = [
                  item for item in value["equipment"] if item["id"] != "LIQ_PROD_001"
              ]
          '''
          if marker not in text:
              raise RuntimeError("Recycle test target not found")
          text = text.replace(marker, replacement, 1)
          old_assert = '''    plan = compile_process_design(process_design, profile)
              operations = [item.operation for item in plan.steps]
          '''
          new_assert = '''    plan = compile_process_design(process_design, profile)
              assert plan.status == "EXECUTABLE"
              operations = [item.operation for item in plan.steps]
          '''
          if old_assert not in text:
              raise RuntimeError("Recycle plan assertion target not found")
          compilation_test.write_text(text.replace(old_assert, new_assert, 1), encoding="utf-8")

          topology_test = Path("tests/test_native_topology_contract.py")
          text = topology_test.read_text(encoding="utf-8")
          marker = '''def test_topology_exact_match() -> None:
          '''
          addition = '''def test_topology_source_metadata_does_not_change_identity() -> None:
              expected = snapshot()
              observed = replace(expected, source="native-readback")
              assert observed.to_dict()["source"] == "native-readback"
              assert observed.identity_dict() == expected.identity_dict()
              assert observed.digest() == expected.digest()
              assert compare_topology(expected, observed).matches is True


          def test_topology_exact_match() -> None:
          '''
          if marker not in text:
              raise RuntimeError("Topology source identity target not found")
          topology_test.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            tests/test_compilation_plan_v15.py \
            tests/test_native_topology_contract.py \
            tests/test_simulator_capabilities_v15.py
          uv run ruff format \
            src/aspenops_nexus/native_topology.py \
            tests/test_compilation_plan_v15.py \
            tests/test_native_topology_contract.py \
            tests/test_simulator_capabilities_v15.py
          uv run ruff check .
          uv run mypy src
          uv run pytest \
            tests/test_simulator_capabilities_v15.py \
            tests/test_native_topology_contract.py \
            tests/test_compilation_plan_v15.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/native_topology.py \
            tests/test_compilation_plan_v15.py \
            tests/test_native_topology_contract.py \
            tests/test_simulator_capabilities_v15.py
          git commit -m "fix: close Phase 2 topology and recycle contracts"
          git push origin HEAD:feature/aspenops-v15-compilation-contracts
