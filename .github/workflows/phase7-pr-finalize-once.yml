name: Phase 7 PR finalizer

on:
  push:
    branches:
      - feature/aspenops-revocation-witness
    paths:
      - .github/workflows/phase7-pr-finalize-once.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-update-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-revocation-witness
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f ASPENOPS_V3_PHASE7_IMPLEMENTATION_REPORT.md
          test -f ASPENOPS_V3_PHASE7_VALIDATION_MATRIX.json
          test -f ASPENOPS_V3_PHASE7_REVERSE_AUDIT.md
          test ! -e .github/workflows/phase7-final-qualification-once.yml
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:/tmp/phase7-final-coverage.json \
            --cov-fail-under=95.0
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir /tmp/phase7-final-order
          python - <<'PY'
          import json
          from pathlib import Path

          matrix = json.loads(
              Path("ASPENOPS_V3_PHASE7_VALIDATION_MATRIX.json").read_text(
                  encoding="utf-8"
              )
          )
          py = matrix["python_matrix"]
          body = f'''## Scope

          This stacked draft PR adds an independently signed, short-lived witness receipt
          for the signed revocation policy and protected local checkpoint.

          ### Implemented contracts

          - separate Ed25519 revocation-witness trust namespace
          - strict witness statement and envelope schemas
          - binding to policy sequence, policy evidence SHA-256, policy-authority key ID
            and checkpoint SHA-256
          - maximum 24-hour receipt validity with current-time verification
          - mandatory witness receipt and current witness public key
          - rejection when witness and policy authority use the same key
          - witness evidence, key, ID and expiry in authorization and execution records
          - authorization expiry bounded by qualification, policy and witness expiry
          - explicit two-decimal coverage reporting; no integer-rounding acceptance

          ### Validation result

          Phase 7 status: `PASS_BUILD_CONTRACTS`.

          Qualification scope: `INDEPENDENT_REVOCATION_WITNESS_CONTRACTS`.

          Execution scope: `SOFTWARE_AUTHORIZATION_ONLY`.

          Validated implementation head: `{matrix['validated_head']}`.

          Qualification workflow run: `{matrix['qualification_run']}`.

          - Python 3.11: {py['3.11']['tests_passed']} passed,
            {py['3.11']['branch_coverage_percent']:.2f}% branch coverage
          - Python 3.12: {py['3.12']['tests_passed']} passed,
            {py['3.12']['branch_coverage_percent']:.2f}% branch coverage
          - Python 3.13: {py['3.13']['tests_passed']} passed,
            {py['3.13']['branch_coverage_percent']:.2f}% branch coverage
          - Python 3.12 reverse and fixed-seed order-independence: passed for all
            {matrix['order_independence']['tests_checked']} tests
          - Ruff, exact formatter, strict mypy, Bandit, source/dependency audits and
            distribution build: passed
          - Windows full suite: passed

          Formal artifacts:

          - `ASPENOPS_V3_PHASE7_IMPLEMENTATION_REPORT.md`
          - `ASPENOPS_V3_PHASE7_VALIDATION_MATRIX.json`
          - `ASPENOPS_V3_PHASE7_REVERSE_AUDIT.md`

          ### Security conclusion

          Execution requires a current receipt signed by an authority distinct from the
          policy authority. The receipt binds the exact signed policy and checkpoint and
          is checked before adapter access.

          ### Explicit boundary

          This is an offline receipt contract, not a live remote witness query. A valid
          receipt can be replayed until expiry; coordinated rollback during that window
          remains possible if all local trust files are restored consistently. No
          production witness, native Aspen/HYSYS adapter, commercial solver execution,
          real Golden Case, repeatability evidence or human engineering acceptance exists.

          Real simulator status remains `PENDING_REAL_ASPEN_CERTIFICATION`.

          This PR is stacked on `feature/aspenops-signed-revocation-policy`, remains draft
          and must not be merged automatically.
          '''
          Path("/tmp/phase7-pr-body.md").write_text(
              body.replace("          ", ""), encoding="utf-8"
          )
          PY
          gh pr edit 110 --repo SUNHAOJUN22/AspenOps-Agent \
            --body-file /tmp/phase7-pr-body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase7-pr-finalize-once.yml
          git commit -m "chore: finalize Phase 7 PR evidence"
          git push origin HEAD:feature/aspenops-revocation-witness
