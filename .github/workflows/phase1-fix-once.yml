name: Phase 1 one-time correctness fix

on:
  pull_request:
    branches:
      - feature/aspenops-natural-language-flowsheet-v3
    paths:
      - .github/workflows/phase1-fix-once.yml

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply correctness fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          requirement = Path("src/aspenops_nexus/process_requirement.py")
          text = requirement.read_text(encoding="utf-8")
          if "if isinstance(value, bool | str | int):" in text:
              text = text.replace(
                  "    if isinstance(value, bool | str | int):\n        return value\n",
                  "    if isinstance(value, str):\n        return _text(value, label)\n"
                  "    if isinstance(value, bool | int):\n        return value\n",
                  1,
              )
          if "if isinstance(value, str):\n        return _text(value, label)" not in text:
              raise RuntimeError("ProcessRequirement scalar fix was not applied")
          requirement.write_text(text, encoding="utf-8")

          rules = Path("src/aspenops_nexus/engineering_rules.py")
          text = rules.read_text(encoding="utf-8")
          if "        stream = stream_map.get(recycle.stream_id)" in text:
              text = text.replace(
                  "        stream = stream_map.get(recycle.stream_id)",
                  "        recycle_stream = stream_map.get(recycle.stream_id)",
                  1,
              )
              text = text.replace(
                  "        if stream is None:",
                  "        if recycle_stream is None:",
                  1,
              )
          if "        recycle_stream = stream_map.get(recycle.stream_id)" not in text:
              raise RuntimeError("Engineering rule Optional fix was not applied")
          rules.write_text(text, encoding="utf-8")

          qualification = Path(".github/workflows/phase1-qualification-once-v2.yml")
          text = qualification.read_text(encoding="utf-8")
          text = text.replace(
              "          Remove-Item .github/workflows/phase1-*.yml -Force -ErrorAction SilentlyContinue",
              "          Get-ChildItem .github/workflows -Filter 'phase1-*.yml' | "
              "Remove-Item -Force -ErrorAction SilentlyContinue",
          )
          qualification.write_text(text, encoding="utf-8")
          PY
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix --exit-zero tests/test_phase1_schema_coverage.py
          uv run ruff format \
            src/aspenops_nexus/process_requirement.py \
            src/aspenops_nexus/engineering_rules.py \
            tests/test_phase1_schema_coverage.py \
            tests/test_phase1_rule_coverage.py
          uv run ruff check .
          uv run mypy src
          rm .github/workflows/phase1-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Phase 1 Unicode typing and Windows gaps"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
