name: Aspen v11 exact Ruff preformat

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspen-v11-preformat
  cancel-in-progress: false

jobs:
  format-and-publish:
    if: >-
      github.event.issue.number == 114 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/format-aspen-current-main-v11-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Apply repository-pinned Ruff formatter and verify candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$parent"
          git rm .github/workflows/one-time-aspen-v11-preformat.yml
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff format \
            scripts/run_six_repository_active_gate.py \
            tests/test_six_repository_active_runner.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q \
            tests/test_six_repository_active_runner.py \
            tests/test_current_main_readme_generator.py \
            tests/test_workflow_governance.py
          uv run python scripts/refresh_current_main_readme.py --check
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(acceptance): apply pinned Ruff formatting before v11'
          clean_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$clean_sha"
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"
      - name: Record formatter result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
        shell: bash
        run: |
          gh issue comment 114 --repo "$GITHUB_REPOSITORY" --body "ASPEN_V11_PREFORMAT outcome=$OUTCOME clean_sha=${CLEAN_SHA:-UNPUBLISHED} run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ruff=pinned-0.15.22 controller=self-removed-on-success"
          test "$OUTCOME" = success
