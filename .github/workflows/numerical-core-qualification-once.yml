name: Numerical Core Qualification Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-numerical-core-qualification-once
  cancel-in-progress: false

env:
  PREVIOUS_GOOD_SHA: aa91f4ba154756bee2fc597d957706119a249846

jobs:
  qualify:
    if: github.event.issue.title == 'ASPENOPS_NUMERICAL_CORE_OPTIMIZATION_V1_20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Benchmark, validate and retain only qualified changes
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/numerical-core-qualification-once.yml
          E=var/numerical-core
          rm -rf "$E" dist /tmp/aspenops-numerical-wheel
          mkdir -p "$E"
          : > "$E/status.tsv"
          failed=0

          gate() {
            local name="$1"
            shift
            set +e
            "$@" >"$E/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          gate lock-check uv lock --check
          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing

          git show "$PREVIOUS_GOOD_SHA:src/aspenops_nexus/optimizer.py" > /tmp/optimizer-before.py
          git show "$PREVIOUS_GOOD_SHA:src/aspenops_nexus/units.py" > /tmp/units-before.py
          cat > /tmp/benchmark-numerical-core.py <<'PY'
          from __future__ import annotations

          import gc
          import importlib.util
          import json
          import math
          import sys
          import time
          from pathlib import Path
          from types import ModuleType
          from typing import Callable

          ROOT = Path.cwd()

          def load(name: str, path: Path) -> ModuleType:
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          before_optimizer = load("optimizer_before", Path("/tmp/optimizer-before.py"))
          after_optimizer = load("optimizer_after", ROOT / "src/aspenops_nexus/optimizer.py")
          before_units = load("units_before", Path("/tmp/units-before.py"))
          after_units = load("units_after", ROOT / "src/aspenops_nexus/units.py")

          def best_time(function: Callable[[], object], repeats: int = 3) -> float:
              samples = []
              for _ in range(repeats):
                  gc.collect()
                  started = time.perf_counter()
                  function()
                  samples.append(time.perf_counter() - started)
              return min(samples)

          def pareto_measure(module: ModuleType) -> tuple[float, int]:
              points = [
                  module.ParetoPoint(
                      (float(index),),
                      (float(index), float(1400 - index)),
                      0.0,
                  )
                  for index in range(1400)
              ]
              size = 0
              def run() -> None:
                  nonlocal size
                  size = len(module.pareto_front(points))
              elapsed = best_time(run)
              return elapsed, size

          pairs = (
              ("C", "K"), ("K", "C"), ("bar", "kPa"), ("atm", "Pa"),
              ("kg/h", "kg/s"), ("kmol/h", "mol/s"), ("MW", "kW"),
              ("cP", "Pa.s"),
          )
          def unit_measure(module: ModuleType) -> tuple[float, float]:
              accumulator = 0.0
              def run() -> None:
                  nonlocal accumulator
                  total = 0.0
                  for index in range(40000):
                      value = float(index % 1000) + 0.25
                      for source, target in pairs:
                          total += module.convert(value, source, target)
                  accumulator = total
              elapsed = best_time(run)
              return elapsed, accumulator

          pareto_before, size_before = pareto_measure(before_optimizer)
          pareto_after, size_after = pareto_measure(after_optimizer)
          units_before, accumulator_before = unit_measure(before_units)
          units_after, accumulator_after = unit_measure(after_units)
          speedups = {
              "pareto_2d": pareto_before / pareto_after,
              "unit_conversion": units_before / units_after,
          }
          checks = {
              "pareto_output_equal": size_before == size_after == 1400,
              "unit_output_equal": math.isclose(
                  accumulator_before,
                  accumulator_after,
                  rel_tol=0.0,
                  abs_tol=0.0,
              ),
              "pareto_speedup_at_least_2x": speedups["pareto_2d"] >= 2.0,
              "unit_conversion_no_regression": speedups["unit_conversion"] >= 0.85,
          }
          payload = {
              "schema": "aspenops.numerical-benchmark-comparison/v1",
              "before_seconds": {
                  "pareto_2d": pareto_before,
                  "unit_conversion": units_before,
              },
              "after_seconds": {
                  "pareto_2d": pareto_after,
                  "unit_conversion": units_after,
              },
              "speedups": speedups,
              "checks": checks,
              "decision": "PASS" if all(checks.values()) else "FAIL",
              "boundary": (
                  "Pure Python numerical microbenchmarks only; not licensed Aspen solver "
                  "performance evidence."
              ),
          }
          Path("var/numerical-core/benchmark-comparison.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if payload["decision"] != "PASS":
              raise SystemExit("numerical benchmark checks failed")
          PY
          gate numerical-benchmark uv run --python 3.12 python /tmp/benchmark-numerical-core.py

          rm -f "$SELF"
          gate ruff-fix uv run --python 3.12 ruff check --fix --unsafe-fixes \
            src/aspenops_nexus/optimizer.py src/aspenops_nexus/units.py \
            tests/test_numerical_core_optimization.py
          gate format-fix uv run --python 3.12 ruff format \
            src/aspenops_nexus/optimizer.py src/aspenops_nexus/units.py \
            tests/test_numerical_core_optimization.py
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py \
            --output "$E/source-audit.json"
          gate dependency-audit bash -lc '
            set -euo pipefail
            result=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem="var/numerical-core/dependency-${platform}-${version}"
                uv audit --frozen --python-platform "$platform" \
                  --python-version "$version" --output-format json \
                  >"${stem}.json" 2>"${stem}.log" || result=1
                python -m json.tool "${stem}.json" >/dev/null || result=1
              done
            done
            exit "$result"
          '
          gate bandit bash -lc '
            set -euo pipefail
            result=0
            uv tool run --isolated --from bandit==1.9.4 bandit \
              --recursive src scripts --severity-level high \
              --confidence-level high --format json \
              --output var/numerical-core/bandit.json \
              2>var/numerical-core/bandit.log || result=$?
            python -m json.tool var/numerical-core/bandit.json >/dev/null
            exit "$result"
          '
          gate focused-tests uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_numerical_core_optimization.py \
            tests/test_optimizer.py tests/test_optimizer_complete_edges.py \
            tests/test_optimizer_performance_contracts.py \
            tests/test_optimization.py tests/test_optimization_contracts.py \
            tests/test_optimization_edge_cases.py \
            tests/test_optimization_validation_complete.py tests/test_units.py \
            --junitxml="$E/focused-junit.xml"

          for version in 3.11 3.12 3.13; do
            floor=94.5
            if [[ "$version" == "3.12" ]]; then floor=95.0; fi
            gate "full-${version}" bash -lc "
              set -euo pipefail
              uv sync --python ${version} --frozen --extra dev --extra agent --extra signing
              uv run --python ${version} pytest -W error::ResourceWarning \\
                --cov=aspenops_nexus --cov-branch --cov-report=term-missing \\
                --cov-report=json:$E/coverage-${version}.json \\
                --junitxml=$E/junit-${version}.xml \\
                --cov-fail-under=${floor}
            "
          done
          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py \
            --seed 20260730 --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$E/process-intent.json" \
            --report-output "$E/process-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate portable-benchmark uv run --python 3.12 python scripts/run_benchmark_matrix.py \
            --repo-root . --output "$E/portable-benchmark.json" --smoke
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$E/wheel-metadata.json"
          gate demo uv run --python 3.12 aspenops demo
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups \
              --no-emit-project --format requirements.txt \
              --output-file var/numerical-core/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-numerical-wheel
            uv pip sync --python /tmp/aspenops-numerical-wheel/bin/python \
              --require-hashes var/numerical-core/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-numerical-wheel/bin/python \
              --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-numerical-wheel/bin/python
            /tmp/aspenops-numerical-wheel/bin/aspenops --version
            /tmp/aspenops-numerical-wheel/bin/aspenops demo
            /tmp/aspenops-numerical-wheel/bin/python -c \
              "from aspenops_nexus.optimizer import pareto_front; from aspenops_nexus.units import convert; assert pareto_front([]) == (); assert convert(1.0, 'bar', 'kPa') == 100.0"
          '
          gate diff-boundary bash -lc '
            set -euo pipefail
            allowed="src/aspenops_nexus/optimizer.py src/aspenops_nexus/units.py docs/optimization-engine.md tests/test_numerical_core_optimization.py"
            for path in $(git diff --name-only "$PREVIOUS_GOOD_SHA"); do
              case " $allowed " in
                *" $path "*) ;;
                *) echo "unexpected numerical optimization change: $path" >&2; exit 1 ;;
              esac
            done
          '

          if [[ "$failed" -ne 0 ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path("var/numerical-core")
          status = {}
          tails = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t", 1)
              status[name] = int(code)
          for name, code in status.items():
              log = evidence / f"{name}.log"
              if code and log.exists():
                  tails[name] = log.read_text(errors="replace").splitlines()[-120:]
          payload = {
              "schema": "aspenops.numerical-optimization-blocker/v1",
              "decision": "FAIL",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "hard_gates": status,
              "failure_tail": tails,
              "source_changes_retained": False,
              "runtime_control_plane_changed": False,
              "aspen_executed": False,
          }
          Path("/tmp/NUMERICAL_OPTIMIZATION_BLOCKER.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
            git reset --hard "$BASE"
            git checkout "$PREVIOUS_GOOD_SHA" -- \
              src/aspenops_nexus/optimizer.py src/aspenops_nexus/units.py \
              docs/optimization-engine.md
            git rm -f tests/test_numerical_core_optimization.py "$SELF"
            rm -f docs/NUMERICAL_OPTIMIZATION_RESULT.json \
              docs/NUMERICAL_OPTIMIZATION_RESULT.md
            cp /tmp/NUMERICAL_OPTIMIZATION_BLOCKER.json \
              docs/NUMERICAL_OPTIMIZATION_BLOCKER.json
            git add -A
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test: record numerical optimization blocker'
            git push origin HEAD:main
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path("var/numerical-core")
          status = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t", 1)
              status[name] = int(code)

          def junit(path: Path):
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              assert suite is not None
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          benchmark = json.loads(
              (evidence / "benchmark-comparison.json").read_text()
          )
          full = {
              version: junit(evidence / f"junit-{version}.xml")
              for version in ("3.11", "3.12", "3.13")
          }
          coverage = {
              version: json.loads(
                  (evidence / f"coverage-{version}.json").read_text()
              )["totals"]["percent_covered"]
              for version in ("3.11", "3.12", "3.13")
          }
          payload = {
              "schema": "aspenops.numerical-optimization-result/v1",
              "decision": "PASS",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "hard_gates": status,
              "benchmark": benchmark,
              "focused_tests": junit(evidence / "focused-junit.xml"),
              "full_tests": full,
              "coverage_percent": coverage,
              "mathematical_audit": {
                  "differential_evolution_strategy": "DE/rand/1/bin",
                  "pareto_one_objective": "O(n) exact minimum filter",
                  "pareto_two_objectives": "O(n log n) exact stable sweep",
                  "pareto_higher_dimensions": "exact incremental frontier",
                  "unit_conversion": "precomputed exact affine coefficients",
                  "conservation_summation": "math.fsum retained",
                  "constraint_and_convergence_semantics": "unchanged",
              },
              "source_files_changed": [
                  "src/aspenops_nexus/optimizer.py",
                  "src/aspenops_nexus/units.py",
              ],
              "runtime_control_plane_changed": False,
              "aspen_executed": False,
              "parameter_estimation_executed": False,
              "dynamic_modeling_executed": False,
              "machine_learning_executed": False,
              "qualification_boundary": (
                  "Portable numerical/Python evidence only; not licensed Aspen "
                  "solver-performance or physical-model certification evidence."
              ),
          }
          docs = Path("docs")
          (docs / "NUMERICAL_OPTIMIZATION_RESULT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          speedups = benchmark["speedups"]
          (docs / "NUMERICAL_OPTIMIZATION_RESULT.md").write_text(
              "# AspenOps Numerical Core Optimization\n\n"
              "**Decision: PASS**\n\n"
              f"- Two-objective Pareto speedup: {speedups['pareto_2d']:.2f}x\n"
              f"- Unit conversion speedup: {speedups['unit_conversion']:.2f}x\n"
              "- Numerical equivalence: PASS\n"
              "- Python 3.11/3.12/3.13 full regression: PASS\n"
              "- Aspen execution: not performed\n"
              "- Runtime control plane: unchanged\n",
              encoding="utf-8",
          )
          (docs / "NUMERICAL_OPTIMIZATION_BLOCKER.json").unlink(missing_ok=True)
          PY
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'perf: qualify accelerated numerical core'
          git push origin HEAD:main
      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --comment 'Numerical core qualification completed; inspect main and docs/NUMERICAL_OPTIMIZATION_RESULT.json.'
