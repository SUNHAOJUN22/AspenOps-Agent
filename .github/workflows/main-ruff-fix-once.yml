name: Main Ruff fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-ruff-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply the repository-pinned Ruff correction and self-delete
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix tests/test_phase7_coverage_closure.py
          uv run ruff format tests/test_phase7_coverage_closure.py
          uv run ruff check tests/test_phase7_coverage_closure.py
          uv run ruff format --check tests/test_phase7_coverage_closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-ruff-fix-once.yml
          git add tests/test_phase7_coverage_closure.py
          git commit -m "style: apply repository Ruff import ordering"
          git push origin HEAD:main
