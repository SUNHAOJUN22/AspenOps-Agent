name: Apply native adapter conformance payload once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-adapter-conformance-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Extract and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/native-adapter-conformance-once.yml').read_text(
              encoding='utf-8'
          )
          py_start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          py_end = source.index("\n          PY\n          cat > docs/assets/readme/adapter-conformance.svg", py_start)
          payload = textwrap.dedent(source[py_start:py_end])
          exec(compile(payload, '<native-adapter-conformance-payload>', 'exec'))

          svg_marker = "          cat > docs/assets/readme/adapter-conformance.svg <<'SVG'\n"
          svg_start = source.index(svg_marker, py_end) + len(svg_marker)
          svg_end = source.index("\n          SVG\n", svg_start)
          svg = textwrap.dedent(source[svg_start:svg_end]).strip() + '\n'
          Path('docs/assets/readme/adapter-conformance.svg').write_text(svg, encoding='utf-8')
          PY
          rm -f .github/workflows/native-adapter-conformance-once.yml
          rm -f .github/workflows/apply-native-adapter-conformance-once.yml
          rm -f docs/NATIVE_ADAPTER_CONFORMANCE_DIAGNOSTIC.json
      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix .
          uv run ruff format .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=95.0
          git diff --check
      - name: Commit workflow-free implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add native adapter conformance preflight"
          git push origin HEAD:main
