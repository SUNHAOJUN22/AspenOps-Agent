name: Apply native adapter conformance payload once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-adapter-conformance-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Extract and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/native-adapter-conformance-once.yml').read_text(
              encoding='utf-8'
          )
          py_marker = "          python - <<'PY'\n"
          py_start = source.index(py_marker) + len(py_marker)
          py_end = source.index(
              "\n          PY\n          cat > docs/assets/readme/adapter-conformance.svg",
              py_start,
          )
          raw_payload = source[py_start:py_end]
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_payload.splitlines()
          )
          fragile = """if identity_block not in builder:
    raise SystemExit('native_builder identity insertion point not found')
builder = builder.replace(identity_block, conformance_block)"""
          stable = """if identity_block in builder:
    builder = builder.replace(identity_block, conformance_block)
else:
    anchor = \"    step_records: list[StepExecutionRecord] = []\\n\"
    if anchor not in builder:
        raise SystemExit('native_builder stable insertion point not found')
    conformance_only = \"    try:\\n\" + conformance_block.split(\"    try:\\n\", 1)[1]
    conformance_only = conformance_only.rsplit(\"\\n\\n    step_records\", 1)[0]
    builder = builder.replace(anchor, conformance_only + \"\\n\\n\" + anchor, 1)"""
          if fragile not in payload:
              raise SystemExit('payload patch point not found')
          payload = payload.replace(fragile, stable)
          exec(compile(payload, '<native-adapter-conformance-payload>', 'exec'))

          svg_marker = "          cat > docs/assets/readme/adapter-conformance.svg <<'SVG'\n"
          svg_start = source.index(svg_marker, py_end) + len(svg_marker)
          svg_end = source.index("\n          SVG\n", svg_start)
          raw_svg = source[svg_start:svg_end]
          svg = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_svg.splitlines()
          ).strip() + '\n'
          Path('docs/assets/readme/adapter-conformance.svg').write_text(svg, encoding='utf-8')
          PY
          rm -f .github/workflows/native-adapter-conformance-once.yml
          rm -f .github/workflows/apply-native-adapter-conformance-once.yml
          rm -f docs/NATIVE_ADAPTER_CONFORMANCE_DIAGNOSTIC.json
          rm -f docs/NATIVE_ADAPTER_APPLY_DIAGNOSTIC.json
          rm -f docs/NATIVE_ADAPTER_C48_DIAGNOSTIC.json
      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix .
          uv run ruff format .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=95.0
          git diff --check
      - name: Commit workflow-free implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add native adapter conformance preflight"
          git push origin HEAD:main
