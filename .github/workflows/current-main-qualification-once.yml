name: Current main qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-main-qualification-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-current-main-qualification-once
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Remove one-time controller from qualified tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/current-main-qualification-once.yml
      - name: Exact Linux qualification
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py --output "$RUNNER_TEMP/source-tree-audit.json"
          uv run pytest -W error::ResourceWarning -q
          uv run python scripts/verify_delivery.py --root . --output "$RUNNER_TEMP/aspenops-delivery.json"
          git diff --exit-code
          git diff --check --cached
          test "$(git diff --cached --name-only)" = '.github/workflows/current-main-qualification-once.yml'

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Remove one-time controller from qualified tree
        shell: pwsh
        run: |
          git rm .github/workflows/current-main-qualification-once.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact Windows control-plane qualification
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev --extra windows --extra agent --extra signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m compileall -q src scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/audit_source_tree.py --output "$env:RUNNER_TEMP/source-tree-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest -W error::ResourceWarning -q tests/test_windows_job.py tests/test_windows_job_edges.py tests/test_aspen_process_ownership.py tests/test_batch_backend_default.py tests/test_cli_output_policy.py tests/test_config_registry_edge_cases.py tests/test_config_resource_budgets.py tests/test_documentation_contracts.py tests/test_artifact_upload_governance.py tests/test_test_dashboard.py tests/test_readme_visual_assets.py tests/test_process_ir.py tests/test_process_ir_edges.py tests/test_process_ir_dashboard.py tests/test_real_backend_state_policy.py tests/test_licensed_path_gate.py tests/test_convergence.py tests/test_backends_convergence.py tests/test_v2_reliability.py tests/test_singleflight.py tests/test_worker_contracts.py tests/test_worker_protocol_hardening.py tests/test_pool_manager_creation.py tests/test_scheduler_active_leases.py tests/test_provenance_zip_safety.py tests/test_archive_safety_complete.py tests/test_licensed_bundle_integrity.py tests/test_licensed_certification_cli.py tests/test_licensed_certification_workflow.py tests/test_workflow_governance.py tests/test_wheel_smoke_governance.py tests/test_wheel_metadata_edges.py tests/test_source_tree_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops doctor > "$env:RUNNER_TEMP/doctor.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check --cached
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staged = (git diff --cached --name-only).Trim()
          if ($staged -ne '.github/workflows/current-main-qualification-once.yml') { throw "unexpected staged path: $staged" }

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact qualified clean tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          parent="$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$parent"
          git rm .github/workflows/current-main-qualification-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove completed current-main qualifier'
          qualified="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$parent"
          git push origin HEAD:main
          echo "qualified=$qualified" >> "$GITHUB_OUTPUT"
      - name: Record machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          QUALIFIED: ${{ steps.publish.outputs.qualified }}
        shell: bash
        run: |
          gh issue comment 116 --body "CURRENT_MAIN_EXACT_QUALIFICATION outcome=${OUTCOME} tested_parent=${GITHUB_SHA} qualified=${QUALIFIED:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} linux=full-delivery windows=control-plane controller=self-removed licensed_aspen=PENDING_REAL_ASPEN_CERTIFICATION"
