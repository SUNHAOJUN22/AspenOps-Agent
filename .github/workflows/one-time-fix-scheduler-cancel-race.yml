name: One-time harden scheduler cancellation ordering

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  harden:
    if: >-
      github.event.issue.number == 114 &&
      github.event.comment.body == '/fix-scheduler-cancel-race-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Install exact frozen environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
      - name: Apply source fix and deterministic regression
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/one-time-six-hour-active.yml /tmp/aspen-six-hour-active-template.yml
          python - <<'PY'
          from pathlib import Path

          scheduler_path = Path('src/aspenops_nexus/scheduler.py')
          scheduler = scheduler_path.read_text(encoding='utf-8')
          old = '''        if self.store.is_cancel_requested(job_id):
              committed = self.store.finalize_cancelled(
          '''
          new = '''        if self.store.is_cancel_requested(job_id):
              # Publish the recycle-dispatch audit before exposing a cancelled
              # terminal state. Otherwise the worker loop can finalize the job
              # just before the cancellation watcher commits its audit event.
              active_pool = self._active_snapshot().get(job_id)
              recycle_events = (
                  []
                  if active_pool is None
                  else active_pool.force_recycle_all("cancel_completion")
              )
              self.store.mark_abort_dispatched(
                  job_id,
                  recycle_events,
                  owner=self.owner,
              )
              committed = self.store.finalize_cancelled(
          '''
          if scheduler.count(old) != 1:
              raise SystemExit('scheduler cancellation commit anchor drifted')
          scheduler_path.write_text(scheduler.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_scheduler.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''    assert any(event["event"] == "worker_recycle_dispatched" for event in events)
          '''
          regression = '''    assert any(event["event"] == "worker_recycle_dispatched" for event in events)


          def test_cancel_completion_orders_recycle_before_terminal(tmp_path: Path) -> None:
              slow_model = tmp_path / "slow-cooperative-cancel-case.json"
              model_data = json.loads(MODEL.read_text(encoding="utf-8"))
              model_data["solve_delay_ms"] = 1000
              slow_model.write_text(json.dumps(model_data), encoding="utf-8")
              batch = request()
              batch["model_path"] = str(slow_model)
              batch["workers"] = 1
              settings = Settings(
                  state_dir=tmp_path / "state",
                  max_workers=1,
                  license_slots=1,
                  scheduler_poll_s=0.02,
                  job_lease_s=2.0,
                  cancellation_grace_s=30.0,
              )
              scheduler = BackgroundScheduler(settings)
              job_id = scheduler.submit(batch)
              running = wait_for_status(scheduler, job_id, {"running", "completed", "failed"})
              assert running is not None and running["status"] == "running"
              assert wait_for_active_pool(scheduler, job_id)
              assert scheduler.cancel(job_id)
              record = wait_for_status(
                  scheduler,
                  job_id,
                  {"cancelled", "failed", "dead_letter"},
              )
              events = scheduler.store.events(job_id)
              scheduler.stop()
              assert record is not None
              assert record["status"] == "cancelled", record
              assert record["finished_at"] is not None
              recycle = next(
                  event
                  for event in events
                  if event["event"] == "worker_recycle_dispatched"
              )
              assert recycle["created_at"] <= record["finished_at"]
          '''
          if 'test_cancel_completion_orders_recycle_before_terminal' not in tests:
              if tests.count(marker) != 1:
                  raise SystemExit('scheduler regression insertion anchor drifted')
              tests = tests.replace(marker, regression, 1)
          test_path.write_text(tests, encoding='utf-8')

          for relative in (
              '.github/workflows/one-time-six-hour-active.yml',
              '.github/workflows/one-time-six-hour-controller.yml',
              '.github/workflows/one-time-fix-scheduler-cancel-race.yml',
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY
          git diff --check
      - name: Stress cancellation ordering and run full qualification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          for iteration in $(seq 1 50); do
            uv run pytest -q \
              tests/test_scheduler.py::test_running_job_is_cancelled_after_deadline \
              tests/test_scheduler.py::test_cancel_completion_orders_recycle_before_terminal
          done
          uv run pytest -q -W error::ResourceWarning
          uv run aspenops demo
          uv run python scripts/check_mcp.py
      - name: Publish clean source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: order cancellation recycle audit before terminal state"
          clean_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"
      - name: Generate isolated six-hour harness bound to clean source
        id: harness
        shell: bash
        env:
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          clean_sha = os.environ['CLEAN_SHA']
          template = Path('/tmp/aspen-six-hour-active-template.yml').read_text(
              encoding='utf-8'
          )
          old_sha = 'de952b7df54134eed269e5545f0e710f56efd66d'
          if template.count(old_sha) < 2:
              raise SystemExit('old Aspen qualification target was not found')
          template = template.replace(old_sha, clean_sha)

          if template.count('/run-six-hour-active-v3') != 3:
              raise SystemExit('Aspen qualification command count drifted')
          template = template.replace(
              '/run-six-hour-active-v3',
              '/run-six-hour-active-v4',
          )

          replacements = (
              (
                  'mkdir -p six-hour-evidence',
                  'mkdir -p "$RUNNER_TEMP/six-hour-evidence"',
                  2,
              ),
              (
                  'evidence_dir = Path("six-hour-evidence")',
                  'evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "six-hour-evidence"',
                  2,
              ),
          )
          for old, new, expected in replacements:
              if template.count(old) != expected:
                  raise SystemExit(f'Aspen harness source drift for {old!r}')
              template = template.replace(old, new)

          if template.count('path: six-hour-evidence/') != 2:
              raise SystemExit('Aspen upload path count drifted')
          expression = '$' + '{{ runner.temp }}'
          template = template.replace(
              'path: six-hour-evidence/',
              f'path: {expression}/six-hour-evidence/',
          )
          Path('.github/workflows/one-time-six-hour-active.yml').write_text(
              template,
              encoding='utf-8',
          )
          PY
          git add .github/workflows/one-time-six-hour-active.yml
          git diff --cached --check
          git commit -m "ci: bind AspenOps six-hour soak to repaired source"
          harness_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "harness_sha=$harness_sha" >> "$GITHUB_OUTPUT"
      - name: Record source and harness publication
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
          HARNESS_SHA: ${{ steps.harness.outputs.harness_sha }}
        run: |
          set -euo pipefail
          gh issue comment 114 --repo "$GITHUB_REPOSITORY" --body "Aspen scheduler cancellation race hardening: **${{ job.status }}**.

- clean repaired source: \`${CLEAN_SHA:-UNPUBLISHED}\`
- isolated soak-harness commit: \`${HARNESS_SHA:-UNPUBLISHED}\`
- next exact command: \`/run-six-hour-active-v4\`
- prior 38-cycle run is retained as failure evidence but contributes \`0 ns\` to the repaired source

The repair commits the worker-recycle audit before a cancelled terminal state becomes visible. All thresholds and external-approval boundaries remain unchanged."
