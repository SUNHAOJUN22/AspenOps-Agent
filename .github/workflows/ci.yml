name: Portable quality gate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra agent
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -W error::ResourceWarning --cov=aspenops --cov-branch --cov-report=term-missing --cov-fail-under=85
      - run: uv run python scripts/check_release_consistency.py
      - run: uv run python scripts/check_mcp.py
      - run: uv run aspenops demo
      - run: uv build --clear
      - name: Clean-wheel smoke
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          (cd /tmp && /tmp/aspenops-wheel/bin/aspenops version)
          (cd /tmp && /tmp/aspenops-wheel/bin/aspenops doctor)
          (cd /tmp && /tmp/aspenops-wheel/bin/aspenops demo)
