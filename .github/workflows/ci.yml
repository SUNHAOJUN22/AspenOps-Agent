name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-licensed-runtime-scope:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/aspenops-v2-reliability-performance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply, validate, and publish licensed runtime scope
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          {
            uv sync --extra dev --extra agent --extra signing
            uv run python scripts/materialize_licensed_runtime_scope.py
            rm scripts/materialize_licensed_runtime_scope.py
            uv run ruff format \
              src/aspenops_nexus/licensed_certification.py \
              tests/test_licensed_certification.py \
              tests/test_licensed_certification_cli.py \
              tests/test_licensed_certification_workflow.py
            uv run ruff check \
              src/aspenops_nexus/certification.py \
              src/aspenops_nexus/licensed_certification.py \
              src/aspenops_nexus/cli.py \
              tests/test_certification.py \
              tests/test_certification_v2.py \
              tests/test_licensed_certification.py \
              tests/test_licensed_certification_cli.py \
              tests/test_licensed_certification_workflow.py
            uv run mypy src
            uv run pytest \
              tests/test_certification.py \
              tests/test_certification_v2.py \
              tests/test_licensed_certification.py \
              tests/test_licensed_certification_cli.py \
              tests/test_licensed_certification_workflow.py
            git config user.name "aspenops-ci"
            git config user.email "aspenops-ci@users.noreply.github.com"
            git add -A
            git commit -m "feat: bind licensed evidence to approved runtime scope"
            git pull --rebase origin agent/aspenops-v2-reliability-performance
            git push origin HEAD:agent/aspenops-v2-reliability-performance
          } 2>&1 | tee var/ci/licensed-runtime-scope-materializer.log
      - name: Upload licensed runtime-scope diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensed-runtime-scope-materializer-diagnostics
          path: var/ci/licensed-runtime-scope-materializer.log
          if-no-files-found: warn

  portable:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Ruff
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff-${{ matrix.python-version }}.log
      - name: Ruff format
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee var/ci/ruff-format-${{ matrix.python-version }}.log
      - name: Strict mypy
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy-${{ matrix.python-version }}.log
      - name: Pytest with branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --cov-fail-under=94.5 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Build distributions
        run: uv build
      - name: Run portable demo
        run: uv run aspenops demo
      - name: Benchmark smoke
        run: uv run python scripts/run_benchmark_matrix.py --repo-root . --output var/ci/benchmark-smoke-${{ matrix.python-version }}.json --smoke
      - name: Wheel install smoke
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Verify MCP surface
        run: uv run python scripts/check_mcp.py
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
