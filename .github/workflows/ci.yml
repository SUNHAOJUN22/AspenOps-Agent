# One-shot P0 qualification using the established CI workflow identity.
name: CI

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: aspenops-p0-qualification
  cancel-in-progress: false

jobs:
  qualify-p0:
    if: github.event.issue.title == 'ASPENOPS_RESEARCH_PLATFORM_P0_GOVERNANCE_LAYER_V1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply final type repair and run complete qualification
        shell: bash
        env:
          QUALIFIED_SOURCE_SHA: 28abeb1f5a79e4e4e1cbe859b7762f24710769e5
          P0_BASELINE_SHA: f1ad69ae0d5e3b7e98eba4fce69f13ffc7e6d0c0
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/p0-preparation.log) 2>&1

          preparation_failed() {
            local code=$?
            trap - ERR
            set +e
            git checkout "$P0_BASELINE_SHA" -- .
            mapfile -t added < <(
              git diff --name-only --diff-filter=A \
                "$P0_BASELINE_SHA" "$QUALIFIED_SOURCE_SHA"
            )
            for path in "${added[@]}"; do
              rm -rf -- "$path"
            done
            mkdir -p docs
            PREPARATION_CODE="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log = Path("/tmp/p0-preparation.log")
          payload = {
              "schema": "aspenops.research-platform-p0-blocker/v1",
              "phase": "P0",
              "decision": "FAIL",
              "blocker_code": "QUALIFICATION_PREPARATION_FAILED",
              "exit_code": int(os.environ["PREPARATION_CODE"]),
              "failure_tail": {
                  "preparation": log.read_text(
                      encoding="utf-8", errors="replace"
                  ).splitlines()[-160:]
              },
              "p0_implementation_retained": False,
              "runtime_core_changed": False,
              "boundary": "P0 was removed because qualification preparation failed.",
          }
          Path("docs/research-layer-p0-blocker.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "test: record P0 qualification preparation blocker"
            git push origin HEAD:main
            exit "$code"
          }
          trap preparation_failed ERR

          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "41293b7a26f251539178f412f639647a1586f6a9:"
                  ".github/workflows/ci.yml",
              ],
              text=True,
          )
          lines = source.splitlines()
          marker = "      - name: Run complete P0 and repository qualification"
          start = lines.index(marker)
          run_index = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index] == "        run: |"
          )
          body = []
          for line in lines[run_index + 1 :]:
              if line.startswith("          "):
                  body.append(line[10:])
              else:
                  body.append(line)
          Path("/tmp/p0-qualification.sh").write_text(
              "\n".join(body) + "\n",
              encoding="utf-8",
          )
          PY

          git checkout "$QUALIFIED_SOURCE_SHA" -- .
          rm -f docs/research-layer-p0-blocker.json

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: patch target count is not one")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          runs = Path("src/aspenops_nexus/research_graph_runs.py")
          replace_once(
              runs,
              "            calibration = calibrations_by_id.get(producer.object_id)\n",
              "            resolved_calibration = "
              "calibrations_by_id.get(producer.object_id)\n",
          )
          replace_once(
              runs,
              "            if calibration is None:\n",
              "            if resolved_calibration is None:\n",
          )
          replace_once(
              runs,
              '            elif calibration.status != "accepted":\n',
              '            elif resolved_calibration.status != "accepted":\n',
          )
          replace_once(
              runs,
              "            elif calibration.accepted_parameter_snapshot is None or (\n"
              "                calibration.accepted_parameter_snapshot.sha256\n",
              "            elif resolved_calibration.accepted_parameter_snapshot "
              "is None or (\n"
              "                resolved_calibration.accepted_parameter_snapshot.sha256\n",
          )

          claims = Path("src/aspenops_nexus/research_graph_claims.py")
          replace_once(
              claims,
              "            value = ctx.resolve_typed(\n",
              "            resolved_validation = ctx.resolve_typed(\n",
          )
          replace_once(
              claims,
              "            if value is not None:\n"
              "                validations.append(value)\n",
              "            if resolved_validation is not None:\n"
              "                validations.append(resolved_validation)\n",
          )
          replace_once(
              claims,
              "            value = ctx.resolve_typed(\n",
              "            resolved_assumption = ctx.resolve_typed(\n",
          )
          replace_once(
              claims,
              "            if value is not None:\n"
              "                assumptions.append(value)\n",
              "            if resolved_assumption is not None:\n"
              "                assumptions.append(resolved_assumption)\n",
          )
          PY

          trap - ERR
          bash /tmp/p0-qualification.sh
