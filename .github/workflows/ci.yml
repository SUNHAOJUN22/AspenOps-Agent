name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-result-contracts:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/aspenops-v2-reliability-performance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply and validate strict result protocol
        shell: bash
        run: |
          python scripts/materialize_result_contracts.py
          uv sync --extra dev --extra agent
          uv run ruff format \
            src/aspenops_nexus/models.py \
            tests/test_result_protocol_contracts.py
          uv run ruff check \
            src/aspenops_nexus/models.py \
            src/aspenops_nexus/worker.py \
            tests/test_result_protocol_contracts.py \
            tests/test_worker_protocol_hardening.py
          uv run mypy src/aspenops_nexus/models.py src/aspenops_nexus/worker.py
          uv run pytest \
            tests/test_result_protocol_contracts.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_worker_contracts.py \
            tests/test_cache.py
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/models.py tests/test_result_protocol_contracts.py scripts/materialize_result_contracts.py
          git commit -m "fix: validate worker result payload schema"
          git push origin HEAD:agent/aspenops-v2-reliability-performance

  portable:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Ruff
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff-${{ matrix.python-version }}.log
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy-${{ matrix.python-version }}.log
      - name: Pytest with branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --cov-fail-under=94 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Build distributions
        run: uv build
      - name: Run portable demo
        run: uv run aspenops demo
      - name: Benchmark smoke
        run: uv run python scripts/run_benchmark_matrix.py --repo-root . --output var/ci/benchmark-smoke-${{ matrix.python-version }}.json --smoke
      - name: Wheel install smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Verify MCP surface
        run: uv run python scripts/check_mcp.py
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
