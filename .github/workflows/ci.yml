name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra agent
      - name: Ruff lint
        run: uv run ruff check . --output-format json --output-file ruff-report.json
      - name: Upload Ruff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-python-${{ matrix.python-version }}
          path: ruff-report.json
          if-no-files-found: error
      - name: Ruff format
        run: uv run ruff format --check --diff . > ruff-format.diff
      - name: Upload Ruff format evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-python-${{ matrix.python-version }}
          path: ruff-format.diff
          if-no-files-found: error
      - name: Strict mypy
        run: uv run mypy src > mypy-report.txt
      - name: Upload mypy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-python-${{ matrix.python-version }}
          path: mypy-report.txt
          if-no-files-found: error
      - name: Portable pytest
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-junit.xml \
            --cov-fail-under=63 2>&1 | tee pytest-report.txt
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: |
            pytest-report.txt
            pytest-junit.xml
            coverage.xml
          if-no-files-found: warn
      - run: uv build
      - run: uv run aspenops demo
      - run: uv run python scripts/check_mcp.py
