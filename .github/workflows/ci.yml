name: CI Recovery Hold

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspenops-ci-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Confirm write-free recovery state
        shell: bash
        run: |
          set -euo pipefail
          echo "Acceptance recovery is write-frozen pending final qualification."
