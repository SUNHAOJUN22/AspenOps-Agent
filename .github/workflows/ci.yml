name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-behavior-fixes:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/aspenops-v2-reliability-performance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply, format, and publish focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/aspenops_nexus/provenance.py')
          text = path.read_text(encoding='utf-8')
          old = '''            unexpected = sorted(actual_names - expected_names)
                      undeclared_missing = sorted(expected_names - actual_names)

                      member_checks: dict[str, bool] = {}
          '''
          new = '''            unexpected = sorted(actual_names - expected_names)
                      undeclared_missing = sorted(expected_names - actual_names)
                      if signed:
                          signing_missing = sorted(
                              {"manifest.sig", "signing-key-id.txt"} - actual_names
                          )
                          if signing_missing:
                              return _structure_invalid(
                                  "signed archive members are missing",
                                  missing=signing_missing,
                                  manifest=manifest,
                              )

                      member_checks: dict[str, bool] = {}
          '''
          if old not in text:
              raise SystemExit('provenance signing-member anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_worker_protocol_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '''    stage = tmp_path / "stage"
                  parent = FakeConnection(
          '''
          new = '''    stage = tmp_path / "stage"
                  stage.mkdir()
                  parent = FakeConnection(
          '''
          if old not in text:
              raise SystemExit('worker stage-directory anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uvx ruff@0.11.13 format \
            src/aspenops_nexus/provenance.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_archive_safety_complete.py
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add \
            src/aspenops_nexus/provenance.py \
            tests/test_worker_protocol_hardening.py \
            tests/test_archive_safety_complete.py
          git commit -m "fix: classify signed ZIP structure and startup cleanup"
          git push origin HEAD:agent/aspenops-v2-reliability-performance

  portable:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Ruff
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff-${{ matrix.python-version }}.log
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy-${{ matrix.python-version }}.log
      - name: Pytest with branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --cov-fail-under=94 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Build distributions
        run: uv build
      - name: Run portable demo
        run: uv run aspenops demo
      - name: Benchmark smoke
        run: uv run python scripts/run_benchmark_matrix.py --repo-root . --output var/ci/benchmark-smoke-${{ matrix.python-version }}.json --smoke
      - name: Wheel install smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Verify MCP surface
        run: uv run python scripts/check_mcp.py
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
