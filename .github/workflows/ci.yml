# Portable qualification gate for the single-main AspenOps runtime.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile and sync frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/ci
          uv lock --check 2>&1 | tee var/ci/uv-lock.log
          uv sync --frozen --extra dev --extra agent --extra signing \
            2>&1 | tee var/ci/uv-sync.log
      - name: Audit locked dependencies
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          audit_failed=0
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              stem="var/ci/dependency-audit-${platform}-py${version}"
              output="${stem}.json"
              error_log="${stem}.log"
              if ! uv audit --frozen \
                --python-platform "$platform" \
                --python-version "$version" \
                --output-format json > "$output" 2> "$error_log"; then
                audit_failed=1
              fi
              if ! python -m json.tool "$output" >/dev/null; then
                echo "Invalid JSON audit evidence: $output" >&2
                audit_failed=1
              fi
            done
          done
          if [[ "$audit_failed" -ne 0 ]]; then
            echo "One or more locked dependency audits failed" >&2
            exit 1
          fi
      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff.log
      - name: Ruff format
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check . 2>&1 | tee var/ci/ruff-format.log
      - name: Strict mypy
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy.log
      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m compileall -q src scripts
      - name: Audit Python source tree
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/audit_source_tree.py \
            --output var/ci/source-tree-audit.json
      - name: Bandit security analysis
        shell: bash
        run: |
          set -euo pipefail
          bandit_status=0
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/ci/bandit.json \
            2> var/ci/bandit.log || bandit_status=$?
          python -m json.tool var/ci/bandit.json >/dev/null
          if [[ "$bandit_status" -ne 0 ]]; then
            cat var/ci/bandit.log >&2
            python -m json.tool var/ci/bandit.json >&2
            exit "$bandit_status"
          fi
      - name: Verify documentation, durable CLI, artifact, dashboard and Process IR contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_artifact_upload_governance.py \
            tests/test_test_dashboard.py \
            tests/test_readme_visual_assets.py \
            tests/test_cli_durable_queue.py \
            tests/test_process_ir.py \
            tests/test_process_ir_edges.py \
            tests/test_process_ir_dashboard.py \
            tests/test_source_tree_audit.py \
            tests/test_wheel_metadata_edges.py \
            --junitxml=var/ci/documentation-contracts.xml \
            2>&1 | tee var/ci/documentation-contracts.log
      - name: Render quality test dashboard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/render_test_dashboard.py \
            --input-dir var/ci \
            --output-html var/ci/test-dashboard-quality.html \
            --output-svg var/ci/test-dashboard-quality.svg \
            --title "AspenOps quality dashboard" \
            --scope "Linux quality, documentation and artifact governance" \
            --note "This dashboard summarizes only evidence from the quality job."
      - name: Validate simulator-neutral Process Intent IR
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output var/ci/process-intent-canonical.json \
            --report-output var/ci/process-intent-report.json \
            2>&1 | tee var/ci/process-intent-validation.log
      - name: Render Process Intent IR dashboard
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/render_process_ir_dashboard.py \
            --input var/ci/process-intent-report.json \
            --output-html var/ci/process-ir-dashboard.html \
            --output-svg var/ci/process-ir-dashboard.svg
      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          uv build 2>&1 | tee var/ci/build.log
      - name: Run portable demo
        shell: bash
        run: |
          set -euo pipefail
          uv run aspenops demo 2>&1 | tee var/ci/demo.log
      - name: Verify README command paths and durable queue lifecycle
        shell: bash
        run: |
          set -euo pipefail
          uv run aspenops --version 2>&1 | tee var/ci/cli-version.log
          uv run aspenops --help > var/ci/cli-help.log
          uv run aspenops scheduler --help > var/ci/readme-scheduler-help.log
          uv run aspenops cancel --help > var/ci/readme-cancel-help.log
          uv run aspenops dry-run examples/batch-request.example.json \
            > var/ci/readme-dry-run.json
          uv run aspenops optimize examples/optimization-request.example.json \
            --output var/ci/readme-optimization.json \
            > var/ci/readme-optimization-cli.json
          rm -rf var/ci/durable-smoke-state
          submit_json="$(
            ASPENOPS_STATE_DIR=var/ci/durable-smoke-state \
              uv run aspenops submit examples/batch-request.example.json
          )"
          printf '%s\n' "$submit_json" > var/ci/readme-submit.json
          python -c \
            'import json,pathlib; data=json.loads(pathlib.Path("var/ci/readme-submit.json").read_text()); assert data["paths_pinned"] is True; assert pathlib.Path(data["submission_cwd"]).is_absolute()'
          job_id="$(
            printf '%s' "$submit_json" |
              python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])'
          )"
          ASPENOPS_STATE_DIR=var/ci/durable-smoke-state \
            uv run aspenops job "$job_id" > var/ci/readme-job-before-cancel.json
          ASPENOPS_STATE_DIR=var/ci/durable-smoke-state \
            uv run aspenops cancel "$job_id" --grace-s 0 \
            > var/ci/readme-cancel.json
          ASPENOPS_STATE_DIR=var/ci/durable-smoke-state \
            uv run aspenops job "$job_id" > var/ci/readme-job-after-cancel.json
          python -c \
            'import json,pathlib; assert json.loads(pathlib.Path("var/ci/readme-job-after-cancel.json").read_text())["job"]["status"] == "cancelled"'
          uv run aspenops benchmark --points 4 --workers 1,2 \
            > var/ci/readme-benchmark.json
          uv run aspenops certify examples/batch-request.example.json \
            --output var/ci/readme-certification.json \
            --repeats 2 \
            > var/ci/readme-certification-cli.json
          uv run python scripts/validate_process_ir.py --capabilities-only \
            > var/ci/readme-process-ir-capabilities.json
      - name: Benchmark smoke and committed performance policy
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/run_benchmark_matrix.py \
            --repo-root . \
            --output var/ci/benchmark-smoke.json \
            --smoke
          uv run python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc var/ci/performance-baseline.md \
            --after-doc var/ci/performance-after.md \
            --fail-on-stable-regression \
            2>&1 | tee var/ci/performance-policy.log
      - name: Verify MCP surface
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/check_mcp.py 2>&1 | tee var/ci/mcp.json
      - name: Wheel install and CLI smoke from locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen \
            --extra agent \
            --no-default-groups \
            --no-emit-project \
            --format requirements.txt \
            --output-file var/ci/runtime-requirements.txt
          uv venv --python 3.12 /tmp/aspenops-wheel
          uv pip sync \
            --python /tmp/aspenops-wheel/bin/python \
            --require-hashes \
            var/ci/runtime-requirements.txt \
            2>&1 | tee var/ci/wheel-runtime-sync.log
          uv pip install \
            --python /tmp/aspenops-wheel/bin/python \
            --offline \
            --no-deps \
            dist/*.whl \
            2>&1 | tee var/ci/wheel-install.log
          uv pip check --python /tmp/aspenops-wheel/bin/python \
            2>&1 | tee var/ci/wheel-dependency-check.log
          /tmp/aspenops-wheel/bin/aspenops --version \
            | tee var/ci/wheel-version.log
          /tmp/aspenops-wheel/bin/aspenops --help > var/ci/wheel-help.log
          /tmp/aspenops-wheel/bin/aspenops demo \
            | tee var/ci/wheel-demo.log
          /tmp/aspenops-wheel/bin/aspenops scheduler --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops cancel --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops optimize --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops mcp --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops certification-preflight --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops certify-licensed --help >/dev/null
          /tmp/aspenops-wheel/bin/aspenops verify-licensed-bundle --help >/dev/null
          /tmp/aspenops-wheel/bin/python -c \
            "from aspenops_nexus.mcp_server import _require_supported_mcp_sdk; print(_require_supported_mcp_sdk())" \
            | tee var/ci/wheel-mcp-version.log
          /tmp/aspenops-wheel/bin/python -c \
            "from aspenops_nexus.process_ir import ProcessIntent; print(ProcessIntent)"
          /tmp/aspenops-wheel/bin/python -c \
            "from aspenops_nexus.simulation_agents import capability_matrix; print(capability_matrix())"
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Verify lockfile and sync frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/ci
          uv lock --check 2>&1 | tee var/ci/uv-lock-${{ matrix.python-version }}.log
          uv sync --frozen --extra dev --extra agent --extra signing \
            2>&1 | tee var/ci/uv-sync-${{ matrix.python-version }}.log
      - name: Pytest with branch coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --durations=20 \
            --cov-fail-under=95.0 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Verify complete-suite order independence
        if: ${{ matrix.python-version == '3.12' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir var/ci \
            2>&1 | tee var/ci/test-order-gate.log
      - name: Render Python test dashboard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/render_test_dashboard.py \
            --input-dir var/ci \
            --output-html var/ci/test-dashboard-python-${{ matrix.python-version }}.html \
            --output-svg var/ci/test-dashboard-python-${{ matrix.python-version }}.svg \
            --title "AspenOps Python ${{ matrix.python-version }} dashboard" \
            --scope "Full Python test matrix with branch coverage" \
            --note "This dashboard summarizes only this Python job's evidence."
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  current-evidence-once:
    name: Current deep-audit evidence once
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Qualify current HEAD and persist evidence
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          evidence_dir="var/current-deep-audit"
          status_file="$evidence_dir/status.tsv"
          log_file="$evidence_dir/qualification.log"
          saved_evidence="$RUNNER_TEMP/current-deep-audit.json"
          rm -rf "$evidence_dir" /tmp/aspenops-current-wheel
          mkdir -p "$evidence_dir"
          : > "$status_file"
          : > "$log_file"
          exec > >(tee -a "$log_file") 2>&1

          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          marker = "\n  current-evidence-once:\n"
          if marker not in text:
              raise SystemExit("current evidence job marker missing")
          path.write_text(text[: text.index(marker)] + "\n", encoding="utf-8")
          PY

          failed=0
          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" > "$evidence_dir/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$status_file"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          run_gate lock-check uv lock --check
          run_gate sync uv sync --frozen --extra dev --extra agent --extra signing
          run_gate ruff uv run ruff check .
          run_gate ruff-format uv run ruff format --check .
          run_gate mypy uv run mypy src
          run_gate compileall uv run python -m compileall -q src scripts
          run_gate source-audit uv run python scripts/audit_source_tree.py \
            --output "$evidence_dir/source-tree-audit.json"
          run_gate dependency-audit bash -lc '
            set -euo pipefail
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                uv audit --frozen \
                  --python-platform "$platform" \
                  --python-version "$version" \
                  --output-format json \
                  > "var/current-deep-audit/audit-${platform}-py${version}.json"
                python -m json.tool \
                  "var/current-deep-audit/audit-${platform}-py${version}.json" >/dev/null
              done
            done
          '
          run_gate pytest uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:"$evidence_dir/coverage.json" \
            --junitxml="$evidence_dir/junit.xml" \
            --durations=20 \
            --cov-fail-under=95.0
          run_gate order uv run python scripts/run_test_order_gate.py \
            --seed 20260728 --output-dir "$evidence_dir/order"
          run_gate bandit bash -lc '
            set -euo pipefail
            uv tool run --isolated --from "bandit==1.9.4" bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high \
              --format json \
              --output var/current-deep-audit/bandit.json
            python -m json.tool var/current-deep-audit/bandit.json >/dev/null
          '
          run_gate process-ir uv run python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$evidence_dir/process-intent-canonical.json" \
            --report-output "$evidence_dir/process-intent-report.json"
          run_gate mcp uv run python scripts/check_mcp.py
          run_gate build uv build
          run_gate wheel-metadata uv run python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$evidence_dir/wheel-metadata.json"
          run_gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project \
              --format requirements.txt \
              --output-file var/current-deep-audit/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-current-wheel
            uv pip sync --python /tmp/aspenops-current-wheel/bin/python \
              --require-hashes var/current-deep-audit/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-current-wheel/bin/python \
              --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-current-wheel/bin/python
            /tmp/aspenops-current-wheel/bin/aspenops --version
            /tmp/aspenops-current-wheel/bin/aspenops demo
          '

          FAILED="$failed" EVIDENCE_DIR="$evidence_dir" SAVED_EVIDENCE="$saved_evidence" \
            python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          directory = Path(os.environ["EVIDENCE_DIR"])
          statuses = {}
          for line in (directory / "status.tsv").read_text(encoding="utf-8").splitlines():
              name, code = line.split("\t")
              statuses[name] = int(code)
          junit = {}
          junit_path = directory / "junit.xml"
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              suite = root if "tests" in root.attrib else root.find("testsuite")
              if suite is not None:
                  junit = {
                      "tests": int(suite.attrib.get("tests", 0)),
                      "failures": int(suite.attrib.get("failures", 0)),
                      "errors": int(suite.attrib.get("errors", 0)),
                      "skipped": int(suite.attrib.get("skipped", 0)),
                      "time_seconds": float(suite.attrib.get("time", 0.0)),
                  }
          coverage = None
          coverage_path = directory / "coverage.json"
          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text(encoding="utf-8"))["totals"][
                  "percent_covered"
              ]
          audit = {}
          audit_path = directory / "source-tree-audit.json"
          if audit_path.exists():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))
          failure_tail = {}
          for name, code in statuses.items():
              if code:
                  path = directory / f"{name}.log"
                  failure_tail[name] = path.read_text(
                      encoding="utf-8", errors="replace"
                  ).splitlines()[-120:]
          payload = {
              "schema": "aspenops.deep-audit/v1",
              "platform": "linux",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "coverage_floor_percent": 95.0,
              "branch_coverage_percent": coverage,
              "junit": junit,
              "source_tree_audit": audit,
              "gate_status": statuses,
              "overall": "PASS" if statuses and all(code == 0 for code in statuses.values()) else "FAIL",
              "failure_tail": failure_tail,
          }
          rendered = json.dumps(payload, indent=2, sort_keys=True) + "\n"
          Path(os.environ["SAVED_EVIDENCE"]).write_text(rendered, encoding="utf-8")
          PY

          cp "$saved_evidence" docs/deep-audit-linux.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml docs/deep-audit-linux.json
          git commit -m "test: record current Linux deep audit"
          git push origin HEAD:main
          exit "$failed"
