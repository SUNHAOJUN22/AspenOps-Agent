# Portable qualification gate for the single-main AspenOps runtime.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Ruff
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff.log
      - name: Ruff format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check . 2>&1 | tee var/ci/ruff-format.log
      - name: Strict mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy.log
      - name: Build distributions
        run: uv build
      - name: Run portable demo
        run: uv run aspenops demo
      - name: Benchmark smoke
        run: uv run python scripts/run_benchmark_matrix.py --repo-root . --output var/ci/benchmark-smoke.json --smoke
      - name: Verify MCP surface
        run: uv run python scripts/check_mcp.py
      - name: Wheel install smoke
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-quality
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Pytest with branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --cov-fail-under=94.5 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
