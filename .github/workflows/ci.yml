name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra agent
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-report=term --cov-fail-under=63
      - run: uv build
      - run: uv run aspenops demo
      - run: uv run python scripts/check_mcp.py
