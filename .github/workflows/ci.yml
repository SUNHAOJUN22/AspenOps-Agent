name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspenops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-owner-fencing:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/aspenops-v2-reliability-performance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Materialize staged owner-fencing patch
        shell: bash
        run: |
          mkdir -p var/ci
          if [[ ! -f scripts/materialize_owner_fencing.py ]]; then
            echo "No staged owner-fencing materializer." | tee var/ci/materialize-owner-fencing.log
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/materialize_owner_fencing.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"    def fail(\\n"', '"    def fail("')
          text = text.replace('"    def cancellation_due(\\n"', '"    def cancellation_due("')
          text = text.replace('"    def _watch_active_jobs(\\n"', '"    def _watch_active_jobs("')
          path.write_text(text, encoding="utf-8")
          PY
          set -o pipefail
          python scripts/materialize_owner_fencing.py \
            2>&1 | tee var/ci/materialize-owner-fencing.log
          uvx ruff@0.11.13 format \
            src/aspenops_nexus/scheduler.py \
            tests/test_job_store.py \
            tests/test_job_store_owner_fencing.py \
            tests/test_scheduler_edge_cases.py \
            2>&1 | tee -a var/ci/materialize-owner-fencing.log
          uvx ruff@0.11.13 check \
            src/aspenops_nexus/scheduler.py \
            tests/test_job_store.py \
            tests/test_job_store_owner_fencing.py \
            tests/test_scheduler_edge_cases.py \
            2>&1 | tee -a var/ci/materialize-owner-fencing.log
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: fence durable job commits by lease owner" \
            2>&1 | tee -a var/ci/materialize-owner-fencing.log
          git push origin HEAD:agent/aspenops-v2-reliability-performance \
            2>&1 | tee -a var/ci/materialize-owner-fencing.log
      - name: Upload materializer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-fencing-materializer-diagnostics
          path: var/ci/materialize-owner-fencing.log
          if-no-files-found: warn

  portable:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --extra agent
      - name: Ruff
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run ruff check . 2>&1 | tee var/ci/ruff-${{ matrix.python-version }}.log
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run mypy src 2>&1 | tee var/ci/mypy-${{ matrix.python-version }}.log
      - name: Pytest with branch coverage
        shell: bash
        run: |
          mkdir -p var/ci
          set -o pipefail
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/coverage-${{ matrix.python-version }}.json \
            --junitxml=var/ci/junit-${{ matrix.python-version }}.xml \
            --cov-fail-under=94 \
            2>&1 | tee var/ci/pytest-${{ matrix.python-version }}.log
      - name: Build distributions
        run: uv build
      - name: Run portable demo
        run: uv run aspenops demo
      - name: Benchmark smoke
        run: uv run python scripts/run_benchmark_matrix.py --repo-root . --output var/ci/benchmark-smoke-${{ matrix.python-version }}.json --smoke
      - name: Wheel install smoke
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m venv /tmp/aspenops-wheel
          /tmp/aspenops-wheel/bin/pip install dist/*.whl
          /tmp/aspenops-wheel/bin/aspenops --version
          /tmp/aspenops-wheel/bin/aspenops demo
      - name: Verify MCP surface
        run: uv run python scripts/check_mcp.py
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-python-${{ matrix.python-version }}
          path: var/ci
          if-no-files-found: ignore
          include-hidden-files: true
