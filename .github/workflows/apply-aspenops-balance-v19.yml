name: Apply AspenOps dimension-safe balance V19

on:
  push:
    branches: [main]
    paths:
      - .aspenops-v19/**
      - .github/workflows/apply-aspenops-balance-v19.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-balance-v19
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply dimension-safe balance contract and counterexamples
        run: python .aspenops-v19/apply_balance_v19.py
      - name: Preserve compatibility while retaining the scientific V19 contract
        run: python .aspenops-v19/post_apply_compat_v19.py
      - name: Remove one-shot application surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aspenops-v19
          rm -f .github/workflows/apply-aspenops-balance-v19.yml
      - name: Verify frozen environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
      - name: Normalize and validate changed surfaces
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            src/aspenops_nexus/models.py
            src/aspenops_nexus/evaluation_plan.py
            src/aspenops_nexus/evaluation.py
            tests/test_balance_dimension_contract_v19.py
          )
          uv run ruff check "${targets[@]}" --fix --unsafe-fixes --exit-zero
          uv run ruff format "${targets[@]}"
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts tests
          git diff --check
      - name: Run focused red-to-green scientific balance tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p var/v19
          uv run pytest -q tests/test_balance_dimension_contract_v19.py tests/test_evaluation.py 2>&1 | tee var/v19/focused.log
      - name: Run authoritative full repository gate
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/audit_source_tree.py --output var/v19/source-tree-audit.json
          uv run pytest -W error::ResourceWarning --cov=aspenops_nexus --cov-branch --cov-fail-under=95.0 2>&1 | tee var/v19/full-tests.log
          uv build 2>&1 | tee var/v19/build.log
          uv run python scripts/check_mcp.py
          uv run python scripts/check_wheel_metadata.py --dist-dir dist
          uv run python scripts/validate_process_ir.py examples/process-intent.example.json
          uv run aspenops --version
          uv run aspenops demo
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified direct source closure to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected balance V19 source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: enforce dimension-safe canonical balances V19'
          git push origin HEAD:main
      - name: Close the deduplicated AspenOps remediation issue with exact evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 139 --body "Dimension-safe balance V19 succeeded. workflow_run=${{ github.run_id }} source_commit=${{ github.sha }}. The pushed final commit is the current main head and the one-shot workflow was removed before qualification."
          gh issue close 139 --reason completed
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aspenops-balance-v19-failure-${{ github.run_id }}
          path: |
            var/v19/
            src/aspenops_nexus/models.py
            src/aspenops_nexus/evaluation_plan.py
            src/aspenops_nexus/evaluation.py
            tests/test_balance_dimension_contract_v19.py
          if-no-files-found: warn
          retention-days: 7
      - name: Update the deduplicated AspenOps issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 139 --body "Dimension-safe balance V19 failed. workflow_run=${{ github.run_id }} source_commit=${{ github.sha }}. Download artifact aspenops-balance-v19-failure-${{ github.run_id }} for exact logs."
