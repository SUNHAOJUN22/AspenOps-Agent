name: Phase 3 fix known failures

on:
  pull_request:
    branches:
      - feature/aspenops-v15-compilation-contracts
    paths:
      - .github/workflows/phase3-fix-known-failures-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-runtime-profile-qualification
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/runtime_qualification.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    if len(text) != _SHA256_LENGTH or any(character not in "0123456789abcdef" for character in text):\n',
                  '    if len(text) != _SHA256_LENGTH or any(\n'
                  '        character not in "0123456789abcdef" for character in text\n'
                  '    ):\n',
                  "digest validation formatting",
              ),
              (
                  '    if len(text) != _KEY_ID_LENGTH or any(character not in "0123456789abcdef" for character in text):\n',
                  '    if len(text) != _KEY_ID_LENGTH or any(\n'
                  '        character not in "0123456789abcdef" for character in text\n'
                  '    ):\n',
                  "key id validation formatting",
              ),
              (
                  '    def from_dict(cls, value: Any, *, label: str) -> GoldenCaseQualification:\n',
                  '    def from_dict(\n'
                  '        cls, value: Any, *, label: str = "golden case"\n'
                  '    ) -> GoldenCaseQualification:\n',
                  "golden case default label",
              ),
              (
                  '    statement_dict = statement.to_dict()\n',
                  '    statement_dict = RuntimeQualificationStatement.from_dict(\n'
                  '        statement.to_dict()\n'
                  '    ).to_dict()\n',
                  "statement normalization before signing",
              ),
              (
                  '        raise PermissionError("runtime qualification key resolved outside the trust directory") from exc\n',
                  '        raise PermissionError(\n'
                  '            "runtime qualification key resolved outside the trust directory"\n'
                  '        ) from exc\n',
                  "trust directory error formatting",
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} target, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aspenops_nexus/runtime_qualification.py \
            src/aspenops_nexus/qualified_compilation.py \
            src/aspenops_nexus/native_builder.py \
            tests/test_runtime_qualification.py \
            tests/test_qualified_compilation.py \
            tests/test_native_builder_contract.py
          git commit -m "fix: close Phase 3 signed qualification failures"
          git push origin HEAD:feature/aspenops-runtime-profile-qualification
