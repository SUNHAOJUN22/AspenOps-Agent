name: Apply final README source once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-final-readme-source-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Generate and test
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check scripts/update_readme_gallery.py
          uv run ruff format --check scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py
          git diff --check
      - name: Commit and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-readme-source-once.yml
          rm -f docs/README_FIX_DIAGNOSTIC.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize AI visual README contracts'
          git push origin HEAD:main
