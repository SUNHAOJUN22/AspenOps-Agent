name: Finalize README generator source once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-readme-source-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Fix source and verify README contracts
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/update_readme_gallery.py')
          text=path.read_text(encoding='utf-8')
          marker='# ruff: noqa: E501\n'
          if marker not in text:
              future='from __future__ import annotations\n\n'
              text=text.replace(future, future+marker+'\n', 1)
          text=text.replace(
              'Archived evidence proves only the cited source commit and Actions runs.',
              'Archived validated baseline evidence proves only the cited source commit and Actions runs.',
          )
          path.write_text(text,encoding='utf-8')
          PY
          uv run ruff check --fix scripts/update_readme_gallery.py
          uv run ruff format scripts/update_readme_gallery.py
          uv run ruff check scripts/update_readme_gallery.py
          uv run python scripts/update_readme_gallery.py
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py
          git diff --check
      - name: Commit final source and clean temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-readme-source-once.yml
          rm -f docs/README_FIX_DIAGNOSTIC.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize synchronized README generator'
          git push origin HEAD:main
