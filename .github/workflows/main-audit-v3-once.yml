name: AspenOps Main Audit Auto Update V3 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main-audit-v3-once.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-main-audit-v3
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Audit, apply governed hardening and qualify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/main-audit-v3-once.yml
          E=var/main-audit-v3
          WT=/tmp/aspenops-issue44-baseline
          rm -rf "$E" "$WT" /tmp/aspenops-v3-wheel /tmp/issue44-payload.py
          mkdir -p "$E"
          rm -f "$SELF" docs/MAIN_AUDIT_V3_BLOCKER.json

          : > "$E/status.tsv"
          failed=0
          gate() {
            name="$1"; shift
            set +e
            "$@" >"$E/$name.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            [[ "$code" -eq 0 ]] || failed=1
          }

          gate issue44-materialize bash -lc '
            set -euo pipefail
            gh api "repos/$REPO/issues/44" > var/main-audit-v3/issue44.json
            gh api --paginate --slurp "repos/$REPO/issues/44/comments" > var/main-audit-v3/issue44-comments.json
            python - <<"PY"
          from __future__ import annotations

          import ast
          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          evidence = Path("var/main-audit-v3")
          issue = json.loads((evidence / "issue44.json").read_text(encoding="utf-8"))
          pages = json.loads((evidence / "issue44-comments.json").read_text(encoding="utf-8"))
          comments: list[dict[str, object]] = []
          for page in pages:
              if isinstance(page, list):
                  comments.extend(item for item in page if isinstance(item, dict))
              elif isinstance(page, dict):
                  comments.append(page)

          body = str(issue.get("body", ""))
          expected = re.search(r"decoded_sha256:\s*([0-9a-f]{64})", body)
          baseline = re.search(r"baseline_sha:\s*([0-9a-f]{40})", body)
          parts_expected = re.search(r"parts:\s*(\d+)", body)
          if expected is None or baseline is None or parts_expected is None:
              raise SystemExit("Issue #44 metadata is incomplete")
          part_count = int(parts_expected.group(1))
          pattern = re.compile(
              r"ASPNHARDENING PART\s+(\d{2})/(\d{2})\s*\n(.*?)(?=ASPNHARDENING PART\s+\d{2}/\d{2}|\Z)",
              re.DOTALL,
          )
          parts: dict[int, str] = {}
          for comment in comments:
              text = str(comment.get("body", ""))
              for match in pattern.finditer(text):
                  index = int(match.group(1))
                  declared_total = int(match.group(2))
                  if declared_total != part_count:
                      raise SystemExit("Issue #44 part-count mismatch")
                  lines: list[str] = []
                  for raw_line in match.group(3).splitlines():
                      line = raw_line.strip()
                      if not line:
                          continue
                      if re.fullmatch(r"[A-Za-z0-9+/=]+", line) is None:
                          break
                      lines.append(line)
                  if not lines:
                      raise SystemExit(f"Issue #44 part {index} is empty")
                  if index in parts:
                      raise SystemExit(f"Issue #44 part {index} is duplicated")
                  parts[index] = "".join(lines)
          required = set(range(part_count))
          if set(parts) != required:
              raise SystemExit(f"Issue #44 parts missing: {sorted(required - set(parts))}")
          encoded = "".join(parts[index] for index in range(part_count))
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != expected.group(1):
              raise SystemExit(f"Issue #44 payload hash mismatch: {digest}")
          Path("/tmp/issue44-payload.py").write_bytes(payload)

          tree = ast.parse(payload, filename="issue44-payload.py")
          allowed_imports = {"__future__", "pathlib", "json", "textwrap"}
          denied_calls = {
              "eval", "exec", "compile", "open", "__import__", "input", "breakpoint",
              "getattr", "setattr", "delattr", "globals", "locals", "vars",
          }
          denied_attributes = {
              "system", "popen", "spawn", "fork", "forkpty", "execv", "execve",
              "run", "Popen", "check_call", "check_output", "urlopen", "connect",
              "chmod", "chown", "unlink", "rmdir", "rmtree", "remove", "rename",
              "symlink_to", "hardlink_to", "write_bytes",
          }
          allowed_roots = ("src/", "tests/", "docs/", "scripts/", "examples/", "README", "pyproject.toml")
          literals: dict[str, str] = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  for target in node.targets:
                      if isinstance(target, ast.Name):
                          literals[target.id] = node.value.value

          def literal_string(node: ast.AST) -> str | None:
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return node.value
              if isinstance(node, ast.Name):
                  return literals.get(node.id)
              return None

          paths: set[str] = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split(".")[0] not in allowed_imports:
                          raise SystemExit(f"Unsafe Issue #44 import: {alias.name}")
              if isinstance(node, ast.ImportFrom):
                  module = (node.module or "").split(".")[0]
                  if module not in allowed_imports:
                      raise SystemExit(f"Unsafe Issue #44 import-from: {node.module}")
              if isinstance(node, (ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda, ast.With, ast.AsyncWith, ast.Delete, ast.Global)):
                  raise SystemExit(f"Unsafe Issue #44 syntax: {type(node).__name__}")
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name) and node.func.id in denied_calls:
                      raise SystemExit(f"Unsafe Issue #44 call: {node.func.id}")
                  if isinstance(node.func, ast.Attribute) and node.func.attr in denied_attributes:
                      raise SystemExit(f"Unsafe Issue #44 attribute call: {node.func.attr}")
                  if isinstance(node.func, ast.Name) and node.func.id == "Path":
                      if len(node.args) != 1:
                          raise SystemExit("Issue #44 Path calls must have one literal argument")
                      value = literal_string(node.args[0])
                      if value is None:
                          raise SystemExit("Issue #44 Path argument is not a reviewed literal")
                      path = Path(value)
                      if path.is_absolute() or ".." in path.parts or not value.startswith(allowed_roots):
                          raise SystemExit(f"Issue #44 path outside reviewed roots: {value}")
                      paths.add(value)
                  if isinstance(node.func, ast.Name) and node.func.id == "replace_once":
                      if not node.args:
                          raise SystemExit("Issue #44 replace_once has no path")
                      value = literal_string(node.args[0])
                      if value is None:
                          raise SystemExit("Issue #44 replace_once path is not a reviewed literal")
                      path = Path(value)
                      if path.is_absolute() or ".." in path.parts or not value.startswith(allowed_roots):
                          raise SystemExit(f"Issue #44 replace path outside reviewed roots: {value}")
                      paths.add(value)

          metadata = {
              "schema": "aspenops.issue44-payload-audit/v1",
              "issue": 44,
              "part_count": part_count,
              "payload_sha256": digest,
              "baseline_sha": baseline.group(1),
              "ast_safety": "PASS",
              "literal_target_paths": sorted(paths),
          }
          (evidence / "issue44-payload-audit.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            baseline="$(python -c "import json; print(json.load(open('var/main-audit-v3/issue44-payload-audit.json'))['baseline_sha'])")"
            git cat-file -e "$baseline^{commit}"
            git worktree add --detach /tmp/aspenops-issue44-baseline "$baseline"
            py="$(command -v python3)"
            (
              cd /tmp/aspenops-issue44-baseline
              env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 PYTHONNOUSERSITE=1 "$py" /tmp/issue44-payload.py
            )
            git -C /tmp/aspenops-issue44-baseline diff --check
            git -C /tmp/aspenops-issue44-baseline diff --binary > var/main-audit-v3/issue44.patch
            git -C /tmp/aspenops-issue44-baseline diff --name-only > var/main-audit-v3/issue44-target-files.txt
            test -s var/main-audit-v3/issue44.patch
            python - <<"PY"
          import json
          from pathlib import Path
          evidence = Path("var/main-audit-v3")
          targets = [line for line in (evidence / "issue44-target-files.txt").read_text().splitlines() if line]
          forbidden = [path for path in targets if path.startswith(".github/") or path.startswith("src/aspenops_nexus/backends/")]
          if forbidden:
              raise SystemExit("Issue #44 attempts forbidden workflow/backend changes: " + ", ".join(forbidden))
          payload = json.loads((evidence / "issue44-payload-audit.json").read_text())
          payload["materialized_target_files"] = targets
          (evidence / "issue44-payload-audit.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            if git apply --reverse --check var/main-audit-v3/issue44.patch; then
              disposition=already_applied
            else
              git apply --3way --index var/main-audit-v3/issue44.patch
              disposition=applied
            fi
            python - "$disposition" <<"PY"
          import json
          import sys
          from pathlib import Path
          path = Path("var/main-audit-v3/issue44-payload-audit.json")
          payload = json.loads(path.read_text())
          payload["disposition"] = sys.argv[1]
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            git diff --check
          '

          gate lock-check uv lock --check
          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate dependency-audit bash -lc '
            set -euo pipefail
            export UV_PREVIEW_FEATURES=json-output
            bad=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem=var/main-audit-v3/audit-${platform}-${version}
                uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json >"$stem.json" 2>"$stem.log" || bad=1
                python -m json.tool "$stem.json" >/dev/null || bad=1
              done
            done
            exit "$bad"
          '
          gate ruff-fix uv run --python 3.12 ruff check --fix src tests scripts
          gate format-fix uv run --python 3.12 ruff format src tests scripts
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit -r src scripts -lll -iii -f json -o var/main-audit-v3/bandit.json 2>var/main-audit-v3/bandit.log || status=$?
            python -m json.tool var/main-audit-v3/bandit.json >/dev/null
            exit "$status"
          '

          changed_tests="$(git diff --name-only "$BASE" -- tests | tr '\n' ' ')"
          gate focused-tests bash -lc "
            set -euo pipefail
            uv run --python 3.12 pytest -W error::ResourceWarning \\
              tests/test_numerical_core_optimization.py \\
              tests/test_optimizer.py tests/test_optimizer_complete_edges.py \\
              tests/test_units.py tests/test_models_strict_contracts.py \\
              tests/test_config_registry_edge_cases.py \\
              tests/test_evaluation_plan.py tests/test_evaluation_plan_write_conflicts.py \\
              tests/test_worker_protocol_hardening.py tests/test_batch_resource_limits.py \\
              tests/test_job_store.py tests/test_job_store_lease_recovery.py \\
              tests/test_job_store_lease_strictness.py tests/test_job_store_owner_fencing.py \\
              tests/test_archive_safety_complete.py tests/test_provenance_zip_safety.py \\
              tests/test_mcp.py tests/test_mcp_tools.py \\
              tests/test_process_ir.py tests/test_process_ir_edges.py \\
              tests/test_research_study.py tests/test_research_schemas.py \\
              tests/test_research_examples.py tests/test_research_governance.py \\
              tests/test_research_contract_edges.py $changed_tests \\
              --junitxml=$E/focused-junit.xml
          "

          for version in 3.11 3.12 3.13; do
            floor=94.5
            [[ "$version" == 3.12 ]] && floor=95.0
            gate full-$version bash -lc "
              set -euo pipefail
              uv sync --python $version --frozen --extra dev --extra agent --extra signing
              uv run --python $version pytest -W error::ResourceWarning \\
                --cov=aspenops_nexus --cov-branch \\
                --cov-report=json:$E/coverage-$version.json \\
                --junitxml=$E/junit-$version.xml \\
                --cov-fail-under=$floor
            "
          done
          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py --seed 20260730 --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py examples/process-intent.example.json --canonical-output "$E/process-intent-canonical.json" --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py --repo-root . --output "$E/benchmark-smoke.json" --smoke
          gate performance-policy uv run --python 3.12 python scripts/compare_benchmarks.py --baseline var/benchmarks/baseline.json --after var/benchmarks/after.json --baseline-doc "$E/performance-baseline.md" --after-doc "$E/performance-after.md" --fail-on-stable-regression
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py --dist-dir dist --output "$E/wheel-metadata.json"

          cat > "$E/wheel_check.py" <<'PY'
          from aspenops_nexus.optimizer import ParetoPoint, pareto_front
          from aspenops_nexus.units import convert

          assert abs(convert(1.0, "bar", "kPa") - 100.0) < 1e-12
          point = ParetoPoint((0.0,), (1.0, 1.0), 0.0)
          assert pareto_front([point, point]) == (point,)
          try:
              from aspenops_nexus.json_contract import safe_json
          except ImportError:
              pass
          else:
              assert safe_json({"value": 1.0}, "wheel") == {"value": 1.0}
          PY
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project --format requirements.txt --output-file var/main-audit-v3/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-v3-wheel
            uv pip sync --python /tmp/aspenops-v3-wheel/bin/python --require-hashes var/main-audit-v3/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-v3-wheel/bin/python --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-v3-wheel/bin/python
            /tmp/aspenops-v3-wheel/bin/aspenops --version
            /tmp/aspenops-v3-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-v3-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-v3-wheel/bin/aspenops scheduler --help >/dev/null
            /tmp/aspenops-v3-wheel/bin/aspenops cancel --help >/dev/null
            /tmp/aspenops-v3-wheel/bin/aspenops optimize --help >/dev/null
            /tmp/aspenops-v3-wheel/bin/aspenops mcp --help >/dev/null
            /tmp/aspenops-v3-wheel/bin/python var/main-audit-v3/wheel_check.py
          '

          python - <<'PY'
          import subprocess
          allowed = ("src/", "tests/", "scripts/", "docs/", "examples/", "README", "pyproject.toml", "uv.lock")
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          forbidden = [path for path in changed if path != ".github/workflows/main-audit-v3-once.yml" and not path.startswith(allowed)]
          if forbidden:
              raise SystemExit("Unexpected changed paths: " + ", ".join(forbidden))
          PY

          if [[ "$failed" -ne 0 ]]; then
            issue_audit="$E/issue44-payload-audit.json"
            git reset --hard "$BASE"
            rm -f "$SELF"
            python - "$issue_audit" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = Path("var/main-audit-v3")
          status: dict[str, int] = {}
          tails: dict[str, list[str]] = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, raw_code = line.split("\t")
              code = int(raw_code)
              status[name] = code
              if code:
                  log = evidence / f"{name}.log"
                  if log.exists():
                      tails[name] = log.read_text(errors="replace").splitlines()[-160:]
          issue44 = None
          candidate = Path(sys.argv[1])
          if candidate.exists():
              issue44 = json.loads(candidate.read_text())
          payload = {
              "schema": "aspenops.main-audit-v3-blocker/v1",
              "decision": "FAIL",
              "source_changes_retained": False,
              "aspen_executed": False,
              "gate_status": status,
              "failure_tail": tails,
              "issue44_audit": issue44,
          }
          Path("docs/MAIN_AUDIT_V3_BLOCKER.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            git add -A
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test: record V3 main audit blocker'
            git push origin HEAD:main
            gh issue comment 44 --repo "$REPO" --body "V3 fail-closed review did not retain source changes. See docs/MAIN_AUDIT_V3_BLOCKER.json on main."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path("var/main-audit-v3")
          status: dict[str, int] = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)

          def junit(path: Path) -> dict[str, int | float]:
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  raise RuntimeError(f"No testsuite in {path}")
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          def coverage(path: Path) -> float:
              return float(json.loads(path.read_text())["totals"]["percent_covered"])

          issue44 = json.loads((evidence / "issue44-payload-audit.json").read_text())
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          source_changed = [path for path in changed if path.startswith(("src/", "tests/", "scripts/"))]
          sensitive = [
              path for path in source_changed
              if path.startswith((
                  "src/aspenops_nexus/worker.py",
                  "src/aspenops_nexus/pool.py",
                  "src/aspenops_nexus/scheduler.py",
                  "src/aspenops_nexus/batch.py",
                  "src/aspenops_nexus/models.py",
                  "src/aspenops_nexus/registry.py",
              ))
          ]
          issue44["qualified_source_files_changed"] = source_changed
          issue44["decision"] = "PASS"
          Path("docs/ISSUE_44_HARDENING_AUDIT.json").write_text(json.dumps(issue44, indent=2, sort_keys=True) + "\n")
          payload = {
              "schema": "aspenops.main-audit-v3-result/v1",
              "decision": "PASS",
              "qualification_run": {"run_id": os.environ["RUN_ID"], "run_attempt": os.environ["RUN_ATTEMPT"]},
              "hard_gates": status,
              "focused_tests": junit(evidence / "focused-junit.xml"),
              "full_tests": {version: junit(evidence / f"junit-{version}.xml") for version in ("3.11", "3.12", "3.13")},
              "coverage_percent": {version: coverage(evidence / f"coverage-{version}.json") for version in ("3.11", "3.12", "3.13")},
              "source_changes_retained": bool(source_changed),
              "source_files_changed": source_changed,
              "sensitive_runtime_files_changed": sensitive,
              "runtime_changes_qualified_by_full_matrix": bool(sensitive),
              "issue44_disposition": issue44.get("disposition"),
              "aspen_executed": False,
              "parameter_estimation_executed": False,
              "dynamic_modeling_executed": False,
              "machine_learning_executed": False,
              "external_gate": "PENDING_LICENSED_WINDOWS_ASPEN_ENGINEERING_CERTIFICATION",
          }
          Path("docs/MAIN_AUDIT_V3_RESULT.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          Path("docs/MAIN_AUDIT_V3_RESULT.md").write_text(
              "# AspenOps Main Audit V3\n\n"
              "**PASS**\n\n"
              f"- Issue #44 disposition: `{issue44.get('disposition')}`\n"
              f"- Source changes retained: `{bool(source_changed)}`\n"
              f"- Source files: `{source_changed}`\n"
              "- Aspen execution: no\n"
              "- Licensed Windows/Aspen engineering certification: pending\n",
              encoding="utf-8",
          )
          PY
          rm -f docs/MAIN_AUDIT_V3_BLOCKER.json
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: qualify V3 hardening and main audit'
          git push origin HEAD:main
          disposition="$(python -c "import json; print(json.load(open('docs/ISSUE_44_HARDENING_AUDIT.json'))['disposition'])")"
          gh issue close 44 --repo "$REPO" --reason completed --comment "V3 decoded and SHA-256 verified the eight-part hardening payload, materialized it on its declared baseline, disposition: $disposition, and passed the complete qualification matrix. Evidence: docs/ISSUE_44_HARDENING_AUDIT.json and docs/MAIN_AUDIT_V3_RESULT.json."
