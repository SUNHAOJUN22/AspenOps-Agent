name: Final temporary branch cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: >-
      github.repository == 'SUNHAOJUN22/AspenOps-Agent' &&
      github.event.issue.title == 'AspenOps final temporary branch cleanup' &&
      github.event.issue.body == 'RUN_FINAL_BRANCH_CLEANUP_20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete all non-main branches and verify final refs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | sort -k2 > /tmp/refs-before.tsv
          while IFS=$'\t' read -r commit_sha ref; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == 'main' ]] && continue
            git push origin --delete "$branch"
          done < /tmp/refs-before.tsv
          git ls-remote --heads origin | sort -k2 > /tmp/refs-after.tsv
          [[ "$(wc -l < /tmp/refs-after.tsv | tr -d ' ')" == '1' ]]
          grep -Eq '^[0-9a-f]{40}[[:space:]]+refs/heads/main$' /tmp/refs-after.tsv
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            'Temporary branch cleanup PASS. Remote heads contain only main.'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Temporary branch cleanup FAILED. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
