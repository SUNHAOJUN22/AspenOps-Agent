name: Verify and Materialize AspenOps 2.0

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.title == 'VERIFY_ASPENOPS_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find v2stage -maxdepth 1 -name 'part-*' | wc -l)" -eq 20
          cat $(find v2stage -maxdepth 1 -name 'part-*' | sort) > /tmp/aspenops-v2.patch.gz.b64
          echo "4876e994f6259f4a6bc542c99ce65d7629f3e0ee95e15f0f9dee22e94f55f9d4  /tmp/aspenops-v2.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/aspenops-v2.patch.gz.b64 > /tmp/aspenops-v2.patch.gz
          echo "0155a6457a21dcd989e186e8c3788a8612043d7b5c78ee7958efc0f53621ea9c  /tmp/aspenops-v2.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/aspenops-v2.patch.gz > /tmp/aspenops-v2.patch
          echo "078fe321490e68b8fdafc2e9fe8d47974a77537455548f83916568569e707ac5  /tmp/aspenops-v2.patch" | sha256sum --check --strict
          rm -rf v2stage
          git apply --check /tmp/aspenops-v2.patch
          git apply /tmp/aspenops-v2.patch

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run complete 2.0 release gate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra agent
          uv run ruff check .
          uv run mypy src/aspenops
          uv run pytest
          uv run aspenops version
          uv run aspenops demo
          uv run aspenops control-demo
          uv build

      - name: Publish clean candidate branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv .pytest_cache .mypy_cache .ruff_cache htmlcov dist build
          rm -f .coverage .coverage.* uv.lock
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C agent/aspenops-v2-candidate
          git add -A
          git commit -m "feat: upgrade AspenOps Agent to 2.0"
          git push --force origin agent/aspenops-v2-candidate
