# One-time qualification of the final bilingual delivery and handover surface.
name: Delivery qualification once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delivery-qualification-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-delivery-qualification-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Mark qualification running
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"schema":"aspenops.delivery-qualification-running/v1","run_id":"%s","source_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/DELIVERY_QUALIFICATION_RUNNING.json
          git add docs/DELIVERY_QUALIFICATION_RUNNING.json
          git commit -m "ci: mark delivery qualification running"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
      - name: Run final software delivery gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/ci
          rm -f .github/workflows/delivery-qualification-once.yml
          rm -f docs/DELIVERY_QUALIFICATION_RUNNING.json
          git add -A
          qualified_tree_sha="$(git write-tree)"
          git reset
          printf '%s\n' "$qualified_tree_sha" > var/ci/qualified-tree-sha.txt

          uv lock --check 2>&1 | tee var/ci/delivery-uv-lock.log
          uv sync --frozen --extra dev --extra agent --extra signing \
            2>&1 | tee var/ci/delivery-uv-sync.log
          uv run ruff check . 2>&1 | tee var/ci/delivery-ruff.log
          uv run ruff format --check . 2>&1 | tee var/ci/delivery-ruff-format.log
          uv run mypy src 2>&1 | tee var/ci/delivery-mypy.log
          uv run python -m compileall -q src scripts tests
          uv run python scripts/audit_source_tree.py \
            --output var/ci/delivery-source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/ci/delivery-bandit.json
          uv run python scripts/verify_delivery.py \
            --output var/ci/delivery-acceptance.json
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/delivery-coverage.json \
            --junitxml=var/ci/delivery-junit.xml \
            --cov-fail-under=95.0 \
            2>&1 | tee var/ci/delivery-pytest.log
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir var/ci/delivery-order \
            2>&1 | tee var/ci/delivery-order.log
          uv build 2>&1 | tee var/ci/delivery-build.log

          rm -rf var/ci/delivery-package
          uv run python scripts/build_delivery_bundle.py \
            --source-sha "$qualified_tree_sha" \
            --source-date-epoch 0 \
            --include-dist \
            --output-dir var/ci/delivery-package \
            > var/ci/delivery-build-report.json
          cd var/ci/delivery-package
          sha256sum -c SHA256SUMS
          sha256sum -c aspenops-handover-*.zip.sha256
          cd "$GITHUB_WORKSPACE"

          uv run python scripts/write_delivery_qualification.py \
            --coverage var/ci/delivery-coverage.json \
            --junit var/ci/delivery-junit.xml \
            --delivery-report var/ci/delivery-acceptance.json \
            --output docs/DELIVERY_QUALIFICATION.json \
            --source-sha "$GITHUB_SHA" \
            --qualified-tree-sha "$qualified_tree_sha" \
            --run-id "$GITHUB_RUN_ID"
          git diff --check
      - name: Publish qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/delivery-qualification-once.yml
          rm -f docs/DELIVERY_QUALIFICATION_RUNNING.json
          git add docs/DELIVERY_QUALIFICATION.json docs/DELIVERY_QUALIFICATION_RUNNING.json
          git commit -m "test: record final delivery qualification"
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          test "$(git rev-parse origin/main)" = "$expected_parent"
          git push origin HEAD:main
      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
