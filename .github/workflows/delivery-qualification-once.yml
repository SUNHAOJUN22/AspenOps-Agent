# One-time qualification for the final delivery documentation and verifier.
name: Delivery qualification once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aspenops-delivery-qualification-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Qualify delivery and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"schema":"aspenops.delivery-qualification-running/v1","run_id":"%s","source_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$source_sha" > docs/DELIVERY_QUALIFICATION_RUNNING.json
          git add docs/DELIVERY_QUALIFICATION_RUNNING.json
          git commit -m "ci: mark delivery qualification running"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$source_sha" ]]; then
            echo "main advanced before delivery qualification heartbeat" >&2
            exit 2
          fi
          git push origin HEAD:main
          heartbeat_sha="$(git rev-parse HEAD)"

          rm -f .github/workflows/delivery-qualification-once.yml
          rm -f docs/DELIVERY_QUALIFICATION_RUNNING.json
          mkdir -p var/ci
          uv lock --check 2>&1 | tee var/ci/delivery-uv-lock.log
          uv sync --frozen --extra dev --extra agent --extra signing \
            2>&1 | tee var/ci/delivery-uv-sync.log
          uv run ruff check . 2>&1 | tee var/ci/delivery-ruff.log
          uv run ruff format --check . 2>&1 | tee var/ci/delivery-ruff-format.log
          uv run mypy src 2>&1 | tee var/ci/delivery-mypy.log
          uv run python -m compileall -q src scripts tests
          uv run python scripts/audit_source_tree.py \
            --output var/ci/delivery-source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output var/ci/delivery-bandit.json
          uv run python scripts/verify_delivery.py \
            --output var/ci/delivery-acceptance.json
          uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/ci/delivery-coverage.json \
            --junitxml=var/ci/delivery-junit.xml \
            --cov-fail-under=95.0 \
            2>&1 | tee var/ci/delivery-pytest.log
          uv run python scripts/run_test_order_gate.py \
            --seed 20260728 \
            --output-dir var/ci/delivery-order \
            2>&1 | tee var/ci/delivery-order.log
          uv build 2>&1 | tee var/ci/delivery-build.log

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage = json.loads(
              Path("var/ci/delivery-coverage.json").read_text(encoding="utf-8")
          )["totals"]["percent_covered"]
          root = ET.parse("var/ci/delivery-junit.xml").getroot()
          suites = [root] if root.tag.endswith("testsuite") else list(root)
          tests = sum(int(item.attrib.get("tests", 0)) for item in suites)
          failures = sum(int(item.attrib.get("failures", 0)) for item in suites)
          errors = sum(int(item.attrib.get("errors", 0)) for item in suites)
          skipped = sum(int(item.attrib.get("skipped", 0)) for item in suites)
          evidence = {
              "schema": "aspenops.delivery-qualification/v1",
              "status": "PASS",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "python": "3.12",
              "passed": tests - failures - errors - skipped,
              "failed": failures,
              "errors": errors,
              "skipped": skipped,
              "branch_coverage_percent": round(float(coverage), 2),
              "reverse_order_gate": "PASS",
              "seeded_order_gate": {"status": "PASS", "seed": 20260728},
              "static_gates": {
                  "ruff": "PASS",
                  "ruff_format": "PASS",
                  "mypy_strict": "PASS",
                  "compileall": "PASS",
                  "source_tree_audit": "PASS",
                  "bandit_high_high": "PASS",
                  "delivery_verifier": "PASS",
                  "build": "PASS",
              },
              "real_aspen_status": "PENDING_REAL_ASPEN_CERTIFICATION",
          }
          Path("docs/DELIVERY_QUALIFICATION.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git checkout "$heartbeat_sha" -- .github/workflows/delivery-qualification-once.yml
          rm -f docs/DELIVERY_QUALIFICATION_RUNNING.json
          git add docs/DELIVERY_QUALIFICATION.json docs/DELIVERY_QUALIFICATION_RUNNING.json
          git commit -m "test: record delivery qualification evidence"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$heartbeat_sha" ]]; then
            echo "main advanced during delivery qualification" >&2
            exit 2
          fi
          git push origin HEAD:main
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
