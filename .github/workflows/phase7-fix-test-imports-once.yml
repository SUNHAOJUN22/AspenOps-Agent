name: Phase 7 fix shared test imports

on:
  push:
    branches:
      - feature/aspenops-revocation-witness
    paths:
      - .github/workflows/phase7-fix-test-imports-once.yml

permissions:
  contents: write

jobs:
  fix-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-revocation-witness
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "tests/test_runtime_execution_authorization.py",
              "tests/test_native_builder_contract.py",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = "from tests.revocation_witness_support import install_revocation_witness"
              new = "from revocation_witness_support import install_revocation_witness"
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one shared-test import in {filename}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff format \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_revocation_witness.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_runtime_execution_authorization.py \
            tests/test_native_builder_contract.py
          git commit -m "test: restore shared support imports"
          git push origin HEAD:feature/aspenops-revocation-witness
