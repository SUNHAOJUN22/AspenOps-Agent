name: Finalize README qualification evidence once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-readme-qualification-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Generate README files on a clean workflow tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-readme-qualification-once.yml
          rm -f .github/workflows/readme-main-qualification-once.yml
          rm -f docs/README_QUALIFICATION_DIAGNOSTIC.json
          rm -f docs/README_FINALIZER_DIAGNOSTIC.json
          rm -f docs/README_VALIDATION_DIAGNOSTIC.json
          rm -f docs/README_VALIDATION_DIAGNOSTIC.md
          rm -f docs/README_FIX_DIAGNOSTIC.json
          rm -f docs/README_COLLECTOR_DIAGNOSTIC.json
          rm -f docs/README_SOURCE_VALIDATION_DIAGNOSTIC.json
          rm -f docs/README_FINAL_MAIN_STATUS.json
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run python scripts/update_readme_gallery.py \
            --evidence docs/MAIN_SINGLE_BRANCH_VALIDATION.json
      - name: Validate final documentation and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py \
            tests/test_workflow_governance.py \
            tests/test_source_tree_audit.py \
            tests/test_artifact_upload_governance.py
          git diff --check
      - name: Commit final workflow-free README tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: publish final single-main README qualification"
          git push origin HEAD:main
