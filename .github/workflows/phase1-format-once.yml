name: Phase 1 one-time formatter

on:
  push:
    branches:
      - feature/aspenops-process-requirement-ir-v2
    paths:
      - .github/workflows/phase1-format-once.yml

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/aspenops-process-requirement-ir-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Fix, format and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check --fix \
            src/aspenops_nexus/engineering_rules.py \
            src/aspenops_nexus/plant_templates.py
          uv run ruff format \
            src/aspenops_nexus/process_requirement.py \
            src/aspenops_nexus/process_ir_v2.py \
            src/aspenops_nexus/engineering_rules.py \
            src/aspenops_nexus/plant_templates.py \
            src/aspenops_nexus/flowsheet_preview.py \
            tests/test_process_requirement_v1.py \
            tests/test_process_ir_v2_rules.py \
            tests/test_plant_templates_v2.py \
            tests/test_flowsheet_preview_v2.py
          uv run ruff check .
          rm .github/workflows/phase1-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Phase 1 engineering contracts"
          git push origin HEAD:feature/aspenops-process-requirement-ir-v2
