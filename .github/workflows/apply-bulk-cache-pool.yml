name: One-shot apply bulk cache pool optimization

on:
  push:
    branches: [agent/aspenops-v2-reliability-performance]
    paths:
      - .github/workflows/apply-bulk-cache-pool.yml

permissions:
  contents: write

concurrency:
  group: aspenops-one-shot-apply-bulk-cache-pool
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aspenops-v2-reliability-performance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply bulk cache and failure-cache safety changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/pool.py")
          text = path.read_text(encoding="utf-8")

          old_cacheable = '''    def _cacheable(self, request: EvaluationRequest, result: EvaluationResult) -> bool:
              if not request.reinitialize:
                  return False
              return result.ok or self.cache_failures
          '''
          new_cacheable = '''    def _cacheable(self, request: EvaluationRequest, result: EvaluationResult) -> bool:
              if not request.reinitialize:
                  return False
              if result.ok:
                  return True
              if not self.cache_failures:
                  return False
              return (
                  result.communication_ok
                  and result.engine_ok
                  and not bool(result.diagnostics.get("worker_tainted"))
              )
          '''
          if old_cacheable not in text:
              raise SystemExit("cacheable block not found")
          text = text.replace(old_cacheable, new_cacheable, 1)

          old_lookup = '''        output: list[EvaluationResult | None] = [None] * len(requests)
                  unique: dict[str, tuple[EvaluationRequest, list[int]]] = {}
                  for index, request in enumerate(requests):
                      key = self.cache_key(request)
                      if request.reinitialize:
                          cached = self.cache.get(key)
                          if cached is not None:
                              result = EvaluationResult.from_dict(cached)
                              result.cache_source = "persistent_cache"
                              result.cache_hit = True
                              result.request_hash = key
                              output[index] = result
                              continue
                      unique.setdefault(key, (request, []))[1].append(index)
          '''
          new_lookup = '''        keyed_requests = [(self.cache_key(request), request) for request in requests]
                  cached_payloads = self.cache.get_many(
                      [key for key, request in keyed_requests if request.reinitialize]
                  )
                  output: list[EvaluationResult | None] = [None] * len(requests)
                  unique: dict[str, tuple[EvaluationRequest, list[int]]] = {}
                  for index, (key, request) in enumerate(keyed_requests):
                      cached = cached_payloads.get(key) if request.reinitialize else None
                      if cached is not None:
                          result = EvaluationResult.from_dict(cached)
                          result.cache_source = "persistent_cache"
                          result.cache_hit = True
                          result.request_hash = key
                          output[index] = result
                          continue
                      unique.setdefault(key, (request, []))[1].append(index)
          '''
          if old_lookup not in text:
              raise SystemExit("cache lookup block not found")
          text = text.replace(old_lookup, new_lookup, 1)

          old_accumulators = '''        result_lock = threading.Lock()
                  errors: list[BaseException] = []
          '''
          new_accumulators = '''        result_lock = threading.Lock()
                  errors: list[BaseException] = []
                  cache_payloads: dict[str, dict[str, Any]] = {}
          '''
          if old_accumulators not in text:
              raise SystemExit("result accumulator block not found")
          text = text.replace(old_accumulators, new_accumulators, 1)

          old_result = '''                    result.request_hash = key
                              if self._cacheable(request, result):
                                  self.cache.put(key, result.to_dict())
                              with result_lock:
                                  for ordinal, index in enumerate(indexes):
                                      clone = EvaluationResult.from_dict(result.to_dict())
                                      if ordinal > 0:
                                          clone.cache_source = "same_batch_dedup"
                                          clone.cache_hit = True
                                      output[index] = clone
          '''
          new_result = '''                    result.request_hash = key
                              payload = result.to_dict()
                              clones: list[tuple[int, EvaluationResult]] = []
                              for ordinal, index in enumerate(indexes):
                                  clone = EvaluationResult.from_dict(payload)
                                  if ordinal > 0:
                                      clone.cache_source = "same_batch_dedup"
                                      clone.cache_hit = True
                                  clones.append((index, clone))
                              with result_lock:
                                  if self._cacheable(request, result):
                                      cache_payloads[key] = payload
                                  for index, clone in clones:
                                      output[index] = clone
          '''
          if old_result not in text:
              raise SystemExit("result caching block not found")
          text = text.replace(old_result, new_result, 1)

          old_finish = '''        for thread in threads:
                      thread.join()
                  if errors:
                      raise RuntimeError(f"CasePool dispatch failed: {errors[0]}") from errors[0]
          '''
          new_finish = '''        for thread in threads:
                      thread.join()
                  if cache_payloads:
                      self.cache.put_many(cache_payloads)
                  if errors:
                      raise RuntimeError(f"CasePool dispatch failed: {errors[0]}") from errors[0]
          '''
          if old_finish not in text:
              raise SystemExit("dispatch completion block not found")
          path.write_text(text.replace(old_finish, new_finish, 1), encoding="utf-8")
          PY
      - name: Normalize and validate pool optimization
        run: |
          uv sync --extra dev --extra agent
          uv run ruff format src/aspenops_nexus/pool.py
          uv run ruff check src/aspenops_nexus/pool.py
          uv run mypy src/aspenops_nexus/pool.py
          uv run pytest \
            tests/test_cache.py \
            tests/test_singleflight.py \
            tests/test_pool_manager.py \
            tests/test_v2_reliability.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-bulk-cache-pool.yml
          git config user.name "aspenops-ci"
          git config user.email "aspenops-ci@users.noreply.github.com"
          git add src/aspenops_nexus/pool.py \
            .github/workflows/apply-bulk-cache-pool.yml
          git commit -m "perf: batch persistent cache IO in CasePool"
          git push origin HEAD:agent/aspenops-v2-reliability-performance
