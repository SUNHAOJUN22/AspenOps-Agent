name: Collect final main README validation status once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/collect-final-main-status-once.yml

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 0bfe645302fa56d9b5cfc24ff9386422178040ab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Wait and record authoritative runs
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AspenOps-final-main-status',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          required = {
              '.github/workflows/ci.yml',
              '.github/workflows/windows-control-plane.yml',
          }
          deadline = time.monotonic() + 900
          selected = {}
          while True:
              url = (
                  f'https://api.github.com/repos/{repo}/actions/runs'
                  f'?head_sha={source}&event=push&per_page=100'
              )
              runs = get(url).get('workflow_runs', [])
              selected = {run.get('path'): run for run in runs if run.get('path') in required}
              if required <= selected.keys() and all(
                  selected[path]['status'] == 'completed' for path in required
              ):
                  break
              if time.monotonic() > deadline:
                  raise TimeoutError(f'Runs incomplete: {selected}')
              time.sleep(15)
          output = []
          for path in sorted(required):
              run = selected[path]
              jobs = get(run['jobs_url']).get('jobs', [])
              output.append({
                  'path': path,
                  'run_id': run['id'],
                  'status': run['status'],
                  'conclusion': run.get('conclusion'),
                  'artifacts_url': run['artifacts_url'],
                  'jobs': [
                      {
                          'id': job['id'],
                          'name': job['name'],
                          'status': job['status'],
                          'conclusion': job.get('conclusion'),
                          'failed_steps': [
                              step['name'] for step in job.get('steps', [])
                              if step.get('conclusion') == 'failure'
                          ],
                      }
                      for job in jobs
                  ],
              })
          payload = {
              'schema': 'aspenops.final-main-readme-status/v1',
              'source_sha': source,
              'runs': output,
          }
          Path('docs/README_FINAL_MAIN_STATUS.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Publish and remove collector
        run: |
          set -euo pipefail
          rm -f .github/workflows/collect-final-main-status-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record final main README validation status'
          git push origin HEAD:main
