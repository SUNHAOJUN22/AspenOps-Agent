name: AspenOps Actions Status Diagnostic Once

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write

concurrency:
  group: aspenops-actions-status-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.issue.title == 'ASPENOPS_ACTIONS_STATUS_DIAGNOSTIC_20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record issue-triggered workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            'repos/${{ github.repository }}/actions/runs?event=issues&per_page=100' \
            --jq '{total_count, workflow_runs: [.workflow_runs[] | {id, name, status, conclusion, event, head_sha, run_started_at, created_at, updated_at, html_url}]}' \
            > docs/ACTIONS_STATUS_DIAGNOSTIC.json
          rm -f .github/workflows/actions-status-diagnostic-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: record Actions status diagnostic'
          git push origin HEAD:main
