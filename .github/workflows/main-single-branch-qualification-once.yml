name: Main single-branch qualification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-single-branch-qualification-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: aspenops-main-single-branch-qualification
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality and Python 3.11-3.13 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      tests_311: ${{ steps.metrics.outputs.tests_311 }}
      coverage_311: ${{ steps.metrics.outputs.coverage_311 }}
      tests_312: ${{ steps.metrics.outputs.tests_312 }}
      coverage_312: ${{ steps.metrics.outputs.coverage_312 }}
      tests_313: ${{ steps.metrics.outputs.tests_313 }}
      coverage_313: ${{ steps.metrics.outputs.coverage_313 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove the one-time workflow from the qualification worktree
        shell: bash
        run: rm -f .github/workflows/main-single-branch-qualification-once.yml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Frozen dependency and quality gates
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          audit_failed=0
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              output="/tmp/audit-${platform}-${version}.json"
              log="/tmp/audit-${platform}-${version}.log"
              if ! uv audit --frozen \
                --python-platform "$platform" \
                --python-version "$version" \
                --output-format json > "$output" 2> "$log"; then
                audit_failed=1
              fi
              if ! python -m json.tool "$output" >/dev/null; then
                audit_failed=1
              fi
            done
          done
          test "$audit_failed" -eq 0
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run python scripts/audit_source_tree.py --output /tmp/source-tree-audit.json
          uv tool run --isolated --from 'bandit==1.9.4' bandit \
            --recursive src scripts \
            --severity-level high \
            --confidence-level high
          uv run pytest -W error::ResourceWarning \
            tests/test_documentation_contracts.py \
            tests/test_readme_visual_assets.py \
            tests/test_workflow_governance.py \
            tests/test_source_tree_audit.py
      - name: Complete Python matrix with branch coverage
        shell: bash
        run: |
          set -euo pipefail
          for version in 3.11 3.12 3.13; do
            env -u UV_PYTHON uv python install "$version"
            rm -rf .venv
            env -u UV_PYTHON uv sync --python "$version" --frozen \
              --extra dev --extra agent --extra signing
            env -u UV_PYTHON uv run --python "$version" pytest \
              -W error::ResourceWarning \
              --cov=aspenops_nexus \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report="json:/tmp/coverage-${version}.json" \
              --junitxml="/tmp/junit-${version}.xml" \
              --cov-fail-under="$(test "$version" = 3.12 && echo 95.0 || echo 94.5)"
            if [[ "$version" == "3.12" ]]; then
              env -u UV_PYTHON uv run --python "$version" python \
                scripts/run_test_order_gate.py \
                --seed 20260728 \
                --output-dir /tmp/main-order-gate
            fi
          done
      - id: metrics
        name: Publish exact Python metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import xml.etree.ElementTree as ET

          for version in ("3.11", "3.12", "3.13"):
              coverage = json.load(open(f"/tmp/coverage-{version}.json", encoding="utf-8"))
              root = ET.parse(f"/tmp/junit-{version}.xml").getroot()
              tests = int(root.attrib.get("tests", 0))
              if tests == 0:
                  tests = sum(int(item.attrib.get("tests", 0)) for item in root)
              suffix = version.replace(".", "")
              print(f"tests_{suffix}={tests}")
              print(f"coverage_{suffix}={coverage['totals']['percent_covered']:.2f}")
          PY
      - name: Build, demo, MCP and clean-wheel smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv dist build /tmp/aspenops-main-wheel
          env -u UV_PYTHON uv sync --python 3.12 --frozen \
            --extra dev --extra agent --extra signing
          env -u UV_PYTHON uv run --python 3.12 python -m build
          env -u UV_PYTHON uv run --python 3.12 aspenops --version
          env -u UV_PYTHON uv run --python 3.12 aspenops demo
          env -u UV_PYTHON uv run --python 3.12 python scripts/check_mcp.py
          env -u UV_PYTHON uv export --python 3.12 --frozen \
            --extra agent \
            --no-default-groups \
            --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/runtime-requirements.txt
          uv venv --python 3.12 /tmp/aspenops-main-wheel
          uv pip sync \
            --python /tmp/aspenops-main-wheel/bin/python \
            --require-hashes \
            /tmp/runtime-requirements.txt
          uv pip install \
            --python /tmp/aspenops-main-wheel/bin/python \
            --offline \
            --no-deps \
            dist/*.whl
          uv pip check --python /tmp/aspenops-main-wheel/bin/python
          /tmp/aspenops-main-wheel/bin/aspenops --version
          /tmp/aspenops-main-wheel/bin/aspenops --help >/dev/null
          /tmp/aspenops-main-wheel/bin/aspenops demo >/dev/null
          /tmp/aspenops-main-wheel/bin/aspenops mcp --help >/dev/null

  windows:
    name: Windows full control-plane suite
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remove the one-time workflow from the qualification worktree
        shell: pwsh
        run: Remove-Item .github/workflows/main-single-branch-qualification-once.yml -Force
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Windows quality and complete suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv lock --check
          uv sync --frozen --extra windows --extra dev --extra agent --extra signing
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run python -m compileall -q src scripts
          uv run pytest -W error::ResourceWarning
          uv run aspenops --version
          uv run aspenops demo | Out-Null

  finalize:
    name: Publish qualification and enforce main-only repository
    if: ${{ needs.linux.result == 'success' && needs.windows.result == 'success' }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRATION_SHA: ${{ github.sha }}
      QUALIFICATION_RUN_ID: ${{ github.run_id }}
      TESTS_311: ${{ needs.linux.outputs.tests_311 }}
      COVERAGE_311: ${{ needs.linux.outputs.coverage_311 }}
      TESTS_312: ${{ needs.linux.outputs.tests_312 }}
      COVERAGE_312: ${{ needs.linux.outputs.coverage_312 }}
      TESTS_313: ${{ needs.linux.outputs.tests_313 }}
      COVERAGE_313: ${{ needs.linux.outputs.coverage_313 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Generate evidence and README metrics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REGISTRATION_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = {
              "3.11": {"tests_passed": int(os.environ["TESTS_311"]), "branch_coverage_percent": float(os.environ["COVERAGE_311"])},
              "3.12": {"tests_passed": int(os.environ["TESTS_312"]), "branch_coverage_percent": float(os.environ["COVERAGE_312"])},
              "3.13": {"tests_passed": int(os.environ["TESTS_313"]), "branch_coverage_percent": float(os.environ["COVERAGE_313"])},
          }
          registration = os.environ["REGISTRATION_SHA"]
          run_id = int(os.environ["QUALIFICATION_RUN_ID"])
          report = f"""# AspenOps single-main qualification

          ## Decision

          `PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS`

          ## Scope

          - branch policy: `MAIN_ONLY`;
          - validated registration commit: `{registration}`;
          - qualification workflow run: `{run_id}`;
          - Linux quality/build/Wheel/MCP: passed;
          - Windows control plane: passed;
          - six-target locked dependency audit: passed with `cryptography>=50`;
          - real commercial Aspen/HYSYS runtime: not executed;
          - certification status: `PENDING_REAL_ASPEN_CERTIFICATION`.

          ## Python matrix

          | Python | Tests | Branch coverage |
          |---|---:|---:|
          | 3.11 | {metrics['3.11']['tests_passed']} | {metrics['3.11']['branch_coverage_percent']:.2f}% |
          | 3.12 | {metrics['3.12']['tests_passed']} | {metrics['3.12']['branch_coverage_percent']:.2f}% |
          | 3.13 | {metrics['3.13']['tests_passed']} | {metrics['3.13']['branch_coverage_percent']:.2f}% |

          Python 3.12 reverse and fixed-seed order-independence passed. Ruff, exact formatter,
          strict mypy, source audit, high/high Bandit, six-target locked dependency audit,
          distribution build, clean Wheel install, CLI demo and MCP checks passed.

          This report qualifies software control-plane and offline build contracts only. It does
          not prove native Aspen/HYSYS flowsheet construction, thermodynamic correctness,
          equipment sizing, process safety or human engineering acceptance.
          """
          Path("docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md").write_text(
              report.replace("          ", ""), encoding="utf-8"
          )
          matrix = {
              "schema": "aspenops.main-single-branch-qualification/v1",
              "decision": "PASS_CONTROL_PLANE_AND_BUILD_CONTRACTS",
              "registration_sha": registration,
              "qualification_run_id": run_id,
              "branch_policy": "MAIN_ONLY",
              "python_matrix": metrics,
              "python_312_order_independence": "PASS",
              "linux_quality_build_wheel_mcp": "PASS",
              "windows_control_plane": "PASS",
              "six_target_dependency_audit": "PASS",
              "real_simulator_status": "PENDING_REAL_ASPEN_CERTIFICATION",
          }
          Path("docs/MAIN_SINGLE_BRANCH_VALIDATION.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:START -->"
          end = "<!-- MAIN_SINGLE_BRANCH_QUALIFICATION:END -->"
          block = f"""{start}

          ### 最新单一主干自动资格

          - 验证提交：`{registration}`；
          - 资格工作流：`{run_id}`；
          - Python 3.11：{metrics['3.11']['tests_passed']} passed，{metrics['3.11']['branch_coverage_percent']:.2f}% branch coverage；
          - Python 3.12：{metrics['3.12']['tests_passed']} passed，{metrics['3.12']['branch_coverage_percent']:.2f}% branch coverage，并通过顺序独立性；
          - Python 3.13：{metrics['3.13']['tests_passed']} passed，{metrics['3.13']['branch_coverage_percent']:.2f}% branch coverage；
          - 六组合冻结依赖审计、Linux quality/build/Wheel/MCP 与 Windows control plane：通过；
          - 详细证据：[single-main qualification](docs/MAIN_SINGLE_BRANCH_QUALIFICATION.md)；
          - 真实 Aspen：`PENDING_REAL_ASPEN_CERTIFICATION`。

          {end}""".replace("          ", "")
          needle = "**已验证归档基线**只证明对应提交和对应 Actions 运行。"
          if start in readme and end in readme:
              prefix, rest = readme.split(start, 1)
              _, suffix = rest.split(end, 1)
              readme = prefix + block + suffix
          elif needle in readme:
              readme = readme.replace(needle, block + "\n\n" + needle, 1)
          else:
              raise RuntimeError("README qualification insertion point is missing")
          readme_path.write_text(readme, encoding="utf-8")
          PY
      - name: Commit the clean main-only state
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-single-branch-qualification-once.yml
          rm -f \
            docs/MAIN_SINGLE_BRANCH_BLOCKER.md \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.json \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.md \
            docs/MAIN_RUN_LOCATOR.json
          git add -A
          git commit -m "chore: finalize single-main qualification"
          git push origin HEAD:main
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Close stacked PRs and delete feature branches
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          set -euo pipefail
          for pr in 103 104 105 106 107 108 109 110; do
            state="$(gh pr view "$pr" --repo SUNHAOJUN22/AspenOps-Agent --json state --jq .state)"
            if [[ "$state" == "OPEN" ]]; then
              gh pr close "$pr" --repo SUNHAOJUN22/AspenOps-Agent \
                --comment "Consolidated onto the single main branch at ${FINAL_SHA}."
            fi
          done
          branches=(
            feature/aspenops-fresh-runtime-authorization
            feature/aspenops-natural-language-flowsheet-v3
            feature/aspenops-process-requirement-ir-v2
            feature/aspenops-qualified-licensed-link
            feature/aspenops-revocation-witness
            feature/aspenops-runtime-profile-qualification
            feature/aspenops-signed-revocation-policy
            feature/aspenops-v15-compilation-contracts
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Require the final standard main workflows to pass
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh run list --repo SUNHAOJUN22/AspenOps-Agent \
              --commit "$FINAL_SHA" \
              --limit 20 \
              --json databaseId,workflowName,status,conclusion,event \
              > /tmp/final-runs.json
            state="$(python - <<'PY'
          import json
          from pathlib import Path

          runs = json.loads(Path("/tmp/final-runs.json").read_text(encoding="utf-8"))
          required = {"CI", "Windows control-plane contracts"}
          selected = {item["workflowName"]: item for item in runs if item["workflowName"] in required}
          if set(selected) != required or any(item["status"] != "completed" for item in selected.values()):
              print("waiting")
          elif all(item["conclusion"] == "success" for item in selected.values()):
              print("success")
          else:
              print("failure")
          PY
          )"
            if [[ "$state" == "success" ]]; then
              cat /tmp/final-runs.json
              exit 0
            fi
            if [[ "$state" == "failure" ]]; then
              cat /tmp/final-runs.json
              exit 1
            fi
            sleep 10
          done
          cat /tmp/final-runs.json
          echo "Final main workflows did not complete within the bounded monitor window" >&2
          exit 1

  blocker:
    name: Record fail-closed qualification blocker
    if: ${{ always() && (needs.linux.result != 'success' || needs.windows.result != 'success') }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRATION_SHA: ${{ github.sha }}
      LINUX_RESULT: ${{ needs.linux.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Capture failed logs and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REGISTRATION_SHA"
          gh run view "$GITHUB_RUN_ID" --repo SUNHAOJUN22/AspenOps-Agent --log-failed \
            > /tmp/failed.log 2>&1 || true
          python - <<'PY'
          import os
          from pathlib import Path

          log = Path("/tmp/failed.log").read_text(encoding="utf-8", errors="replace")
          if len(log) > 200_000:
              log = log[-200_000:]
          report = f"""# AspenOps single-main qualification blocker

          - decision: `FAIL_WITH_BLOCKERS`;
          - registration SHA: `{os.environ['REGISTRATION_SHA']}`;
          - workflow run: `{os.environ['GITHUB_RUN_ID']}`;
          - Linux result: `{os.environ['LINUX_RESULT']}`;
          - Windows result: `{os.environ['WINDOWS_RESULT']}`;
          - real simulator executed: `false`;
          - certification: `PENDING_REAL_ASPEN_CERTIFICATION`.

          ## Failed logs

          ```text
          {log}
          ```
          """
          Path("docs/MAIN_SINGLE_BRANCH_BLOCKER.md").write_text(
              report.replace("          ", ""), encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-single-branch-qualification-once.yml
          git add docs/MAIN_SINGLE_BRANCH_BLOCKER.md
          git commit -m "test: record single-main qualification blocker"
          git push origin HEAD:main
