name: AspenOps Cache Materialization Audit Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-cache-materialization-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.title == 'ASPENOPS_CACHE_MATERIALIZATION_AUDIT_V1_20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply reviewed files, benchmark and qualify
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/cache-materialization-audit-once.yml
          PARTS=.github/pool-efficiency-parts
          E=var/cache-materialization-audit
          TEMP_WORKFLOWS=(
            .github/workflows/pool-efficiency-audit-once.yml
            .github/workflows/pool-efficiency-audit-finalize-once.yml
            .github/workflows/pool-efficiency-audit-pass-once.yml
            .github/workflows/pool-efficiency-audit-valid-once.yml
            .github/workflows/pool-efficiency-audit-files-once.yml
            "$SELF"
          )
          rm -rf "$E" dist /tmp/aspenops-cache-wheel
          mkdir -p "$E"
          rm -f "${TEMP_WORKFLOWS[@]}"

          : > "$E/status.tsv"
          failed=0
          gate() {
            name="$1"; shift
            set +e
            "$@" >"$E/$name.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            [[ "$code" -eq 0 ]] || failed=1
          }

          gate apply-patch python "$PARTS/apply.py.txt"
          gate copy-test cp "$PARTS/test_pool_efficiency.py.txt" tests/test_pool_efficiency.py
          gate copy-benchmark cp "$PARTS/benchmark.py.txt" "$E/benchmark.py"
          rm -rf "$PARTS"

          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate ruff-fix uv run --python 3.12 ruff check --fix src/aspenops_nexus/pool.py tests/test_pool_efficiency.py
          gate format-fix uv run --python 3.12 ruff format src/aspenops_nexus/pool.py tests/test_pool_efficiency.py
          gate focused-tests uv run --python 3.12 pytest -W error::ResourceWarning tests/test_pool_efficiency.py --junitxml="$E/focused-junit.xml"
          gate performance-benchmark uv run --python 3.12 python "$E/benchmark.py"
          gate lock-check uv lock --check
          gate dependency-audit bash -lc '
            set -euo pipefail
            export UV_PREVIEW_FEATURES=json-output
            bad=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem=var/cache-materialization-audit/audit-${platform}-${version}
                uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json >"$stem.json" 2>"$stem.log" || bad=1
                python -m json.tool "$stem.json" >/dev/null || bad=1
              done
            done
            exit "$bad"
          '
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit -r src scripts -lll -iii -f json -o var/cache-materialization-audit/bandit.json 2>var/cache-materialization-audit/bandit.log || status=$?
            python -m json.tool var/cache-materialization-audit/bandit.json >/dev/null
            exit "$status"
          '
          for version in 3.11 3.12 3.13; do
            floor=94.5
            [[ "$version" == 3.12 ]] && floor=95.0
            gate full-$version bash -lc "
              set -euo pipefail
              uv sync --python $version --frozen --extra dev --extra agent --extra signing
              uv run --python $version pytest -W error::ResourceWarning \
                --cov=aspenops_nexus --cov-branch \
                --cov-report=json:$E/coverage-$version.json \
                --junitxml=$E/junit-$version.xml \
                --cov-fail-under=$floor
            "
          done
          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py --seed 20260730 --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py examples/process-intent.example.json --canonical-output "$E/process-intent-canonical.json" --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py --repo-root . --output "$E/benchmark-smoke.json" --smoke
          gate performance-policy uv run --python 3.12 python scripts/compare_benchmarks.py --baseline var/benchmarks/baseline.json --after var/benchmarks/after.json --baseline-doc "$E/performance-baseline.md" --after-doc "$E/performance-after.md" --fail-on-stable-regression
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py --dist-dir dist --output "$E/wheel-metadata.json"
          cat > /tmp/aspenops-cache-wheel-check.py <<'PY'
          import inspect

          from aspenops_nexus.pool import CasePool

          source = inspect.getsource(CasePool._evaluate_many_locked)
          assert "cached_results" in source
          assert "return [item for item in output if item is not None]" in source
          PY
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project --format requirements.txt --output-file var/cache-materialization-audit/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-cache-wheel
            uv pip sync --python /tmp/aspenops-cache-wheel/bin/python --require-hashes var/cache-materialization-audit/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-cache-wheel/bin/python --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-cache-wheel/bin/python
            /tmp/aspenops-cache-wheel/bin/aspenops --version
            /tmp/aspenops-cache-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-cache-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-cache-wheel/bin/aspenops scheduler --help >/dev/null
            /tmp/aspenops-cache-wheel/bin/aspenops cancel --help >/dev/null
            /tmp/aspenops-cache-wheel/bin/aspenops optimize --help >/dev/null
            /tmp/aspenops-cache-wheel/bin/aspenops mcp --help >/dev/null
            /tmp/aspenops-cache-wheel/bin/python /tmp/aspenops-cache-wheel-check.py
          '
          gate diff-boundary python - <<'PY'
          import subprocess

          allowed = {
              ".github/pool-efficiency-parts/apply.py.txt",
              ".github/pool-efficiency-parts/benchmark.py.txt",
              ".github/pool-efficiency-parts/test_pool_efficiency.py.txt",
              ".github/workflows/cache-materialization-audit-once.yml",
              ".github/workflows/pool-efficiency-audit-files-once.yml",
              ".github/workflows/pool-efficiency-audit-finalize-once.yml",
              ".github/workflows/pool-efficiency-audit-once.yml",
              ".github/workflows/pool-efficiency-audit-pass-once.yml",
              ".github/workflows/pool-efficiency-audit-valid-once.yml",
              "docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json",
              "src/aspenops_nexus/pool.py",
              "tests/test_pool_efficiency.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit("Unexpected changed files: " + ", ".join(unexpected))
          PY

          if [[ "$failed" -ne 0 ]]; then
            cp "$E/status.tsv" /tmp/cache-status.tsv
            cp -r "$E" /tmp/cache-evidence
            git reset --hard "$BASE"
            rm -rf "$PARTS"
            rm -f "${TEMP_WORKFLOWS[@]}" docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json
            python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path("/tmp/cache-evidence")
          status = {}
          tails = {}
          for line in Path("/tmp/cache-status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)
              if int(code):
                  log = evidence / f"{name}.log"
                  if log.exists():
                      tails[name] = log.read_text(errors="replace").splitlines()[-120:]
          payload = {
              "schema": "aspenops.cache-materialization-blocker/v1",
              "decision": "FAIL",
              "source_changes_retained": False,
              "aspen_executed": False,
              "runtime_control_plane_changed": False,
              "hard_gates": status,
              "failure_tail": tails,
          }
          Path("docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            git add -A
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test: record cache materialization audit blocker'
            git push origin HEAD:main
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path("var/cache-materialization-audit")
          status = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)

          def junit(path: Path) -> dict[str, int | float]:
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  raise RuntimeError(f"No testsuite in {path}")
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          benchmark = json.loads((evidence / "benchmark.json").read_text())
          payload = {
              "schema": "aspenops.cache-materialization-audit-result/v1",
              "decision": "PASS",
              "qualification_run": {
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
              "hard_gates": status,
              "focused_tests": junit(evidence / "focused-junit.xml"),
              "benchmark": benchmark,
              "full_tests": {
                  version: junit(evidence / f"junit-{version}.xml")
                  for version in ("3.11", "3.12", "3.13")
              },
              "coverage_percent": {
                  version: json.loads(
                      (evidence / f"coverage-{version}.json").read_text()
                  )["totals"]["percent_covered"]
                  for version in ("3.11", "3.12", "3.13")
              },
              "source_files_changed": [
                  "src/aspenops_nexus/pool.py",
                  "tests/test_pool_efficiency.py",
              ],
              "preserved_contracts": [
                  "cache_key public call observability",
                  "cache-key bytes",
                  "result isolation",
                  "worker and runtime control semantics",
              ],
              "rejected_candidate": "batch runtime-identity reuse was rejected because it bypassed public cache_key call-count instrumentation",
              "aspen_executed": False,
              "parameter_estimation_executed": False,
              "dynamic_modeling_executed": False,
              "machine_learning_executed": False,
              "runtime_control_plane_changed": False,
              "qualification_boundary": "Pure Python cache-result materialization and portable package evidence; not licensed Aspen solve certification.",
          }
          Path("docs/POOL_EFFICIENCY_AUDIT_RESULT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          Path("docs/POOL_EFFICIENCY_AUDIT_RESULT.md").write_text(
              "# AspenOps Cache Materialization Audit\n\n"
              "**PASS**\n\n"
              "- Single persistent-cache hits no longer deep-copy a freshly decoded payload before parsing.\n"
              "- Duplicate persistent-cache results are parsed once per key and returned as isolated objects.\n"
              "- Redundant final dataclass shallow copies were removed.\n"
              "- Public cache-key call-count instrumentation remains unchanged.\n"
              "- Licensed Windows/Aspen engineering certification remains pending.\n",
              encoding="utf-8",
          )
          PY
          rm -f docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'perf: reduce persistent-cache result materialization overhead'
          git push origin HEAD:main
      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --repo '${{ github.repository }}' --comment 'Cache materialization audit finished. Inspect docs/POOL_EFFICIENCY_AUDIT_RESULT.json or docs/POOL_EFFICIENCY_AUDIT_BLOCKER.json on main.'