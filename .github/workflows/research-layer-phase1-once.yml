name: Research Layer P0 Once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-research-layer-p0-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct transparent P0 sources
        shell: bash
        run: |
          set -euo pipefail
          python .github/p0-qualify/prepare.py
          git rm -r \
            .github/rsl-source \
            .github/workflows/research-layer-phase1-once.yml
      - name: Qualify P0 and close the transaction
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          QUALIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          evidence_dir="var/research-layer-p0"
          status_file="$evidence_dir/status.tsv"
          rm -rf "$evidence_dir" dist
          mkdir -p "$evidence_dir"
          : > "$status_file"
          failed=0
          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" >"$evidence_dir/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$status_file"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          quality_paths=(
            .github/p0-qualify/prepare.py
            .github/p0-qualify/write_evidence.py
            scripts/audit_source_tree.py
            src/aspenops_nexus/research.py
            src/aspenops_nexus/research_common.py
            src/aspenops_nexus/research_data.py
            src/aspenops_nexus/research_parameters.py
            src/aspenops_nexus/research_runs.py
            src/aspenops_nexus/research_claims.py
            src/aspenops_nexus/research_objects.py
            src/aspenops_nexus/research_document.py
            src/aspenops_nexus/research_graph.py
            src/aspenops_nexus/research_validation.py
            tests/test_source_tree_audit.py
            tests/test_wheel_metadata_edges.py
            tests/test_research_study.py
            tests/test_research_schemas.py
            tests/test_research_contract_edges.py
            tests/test_research_examples.py
          )

          run_gate lock-check uv lock --check
          run_gate sync uv sync --frozen --extra dev --extra agent --extra signing
          run_gate ruff-fix uv run ruff check --fix --unsafe-fixes "${quality_paths[@]}"
          run_gate format-fix uv run ruff format "${quality_paths[@]}"
          run_gate ruff uv run ruff check .
          run_gate ruff-format uv run ruff format --check .
          run_gate mypy uv run mypy src
          run_gate compileall uv run python -m compileall -q src scripts
          run_gate source-audit uv run python scripts/audit_source_tree.py \
            --output "$evidence_dir/source-tree-audit.json"
          run_gate bandit bash -lc '
            set -euo pipefail
            uv tool run --isolated --from "bandit==1.9.4" bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high \
              --format json \
              --output var/research-layer-p0/bandit.json
            python -m json.tool var/research-layer-p0/bandit.json >/dev/null
          '
          run_gate p0-contract bash -lc '
            set -euo pipefail
            uv run python - <<"PY"
          from pathlib import Path
          from aspenops_nexus.research import ResearchStudyDocument

          root = Path(".")
          schemas = sorted((root / "src/aspenops_nexus/data").glob("research-*.schema.json"))
          assert len(schemas) == 9, [path.name for path in schemas]
          examples = [
              root / "examples/research-study.example.json",
              root / "examples/research-epdm-structure-only.example.json",
          ]
          for path in examples:
              report = ResearchStudyDocument.load(path).validate()
              assert report.status == "PASS", report.to_dict()
          source = "\n".join(
              path.read_text(encoding="utf-8")
              for path in sorted((root / "src/aspenops_nexus").glob("research*.py"))
          ).casefold()
          for forbidden in ("win32com", "aspenplusbackend(", "hyapp", "dispatch("):
              assert forbidden not in source, forbidden
          epdm = ResearchStudyDocument.load(examples[1])
          assert epdm.study.claim_ceiling == "STRUCTURE_ONLY"
          assert not epdm.parameters and not epdm.calibrations and not epdm.validations
          PY
          '
          run_gate focused-tests uv run pytest -W error::ResourceWarning \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_contract_edges.py \
            tests/test_research_examples.py \
            --junitxml="$evidence_dir/focused-junit.xml"
          run_gate full-pytest uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:"$evidence_dir/coverage.json" \
            --junitxml="$evidence_dir/full-junit.xml" \
            --cov-fail-under=95.0
          run_gate order uv run python scripts/run_test_order_gate.py \
            --seed 20260728 --output-dir "$evidence_dir/order"
          run_gate process-ir uv run python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$evidence_dir/process-intent-canonical.json" \
            --report-output "$evidence_dir/process-intent-report.json"
          run_gate mcp uv run python scripts/check_mcp.py
          run_gate build uv build
          run_gate wheel-metadata uv run python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$evidence_dir/wheel-metadata.json"
          run_gate demo uv run aspenops demo

          EVIDENCE_DIR="$evidence_dir" \
            QUALIFIED_SHA="$QUALIFIED_SHA" \
            RUN_ID="$RUN_ID" \
            RUN_ATTEMPT="$RUN_ATTEMPT" \
            python .github/p0-qualify/write_evidence.py

          git rm -r .github/p0-qualify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$failed" -ne 0 ]]; then
            git checkout "$BASE_SHA" -- \
              scripts/audit_source_tree.py \
              tests/test_source_tree_audit.py \
              tests/test_wheel_metadata_edges.py
            mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$QUALIFIED_SHA")
            for path in "${added[@]}"; do
              rm -rf -- "$path"
            done
            rm -f \
              src/aspenops_nexus/research_graph.py \
              tests/test_research_contract_edges.py \
              tests/test_research_examples.py
            mkdir -p docs
            mv docs/research-layer-p0-evidence.json \
              docs/research-layer-p0-blocker.json
            rm -f \
              docs/P0_PHASE_RESULT.json \
              docs/CLOSED_LOOP_VALIDATION_RESEARCH_P0.json \
              docs/CLOSED_LOOP_VALIDATION_RESEARCH_P0.md \
              docs/research-layer-p0-test-report.md \
              docs/research-layer-p0-coverage-summary.md
            git add -A
            git commit -m "test: record research platform P0 blocker"
            git push origin HEAD:main
            exit 1
          fi

          git add -A
          git commit -m "feat: establish P0 scientific governance layer"
          git push origin HEAD:main
