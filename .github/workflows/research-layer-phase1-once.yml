name: Research Layer Phase 1 Once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aspenops-research-layer-phase1-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct transparent staged sources
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .github/rsl-source/research_graph.py/part-00
            tail -n +3 .github/rsl-source/research_graph.py/part-01
            cat .github/rsl-source/research_graph.py/part-02
            cat .github/rsl-source/research_graph.py/part-03
          } > src/aspenops_nexus/research_graph.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aspenops_nexus/research_graph.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'status: Literal["PASS", "FAIL"] = (',
              'status = (',
          )
          path.write_text(text, encoding="utf-8")
          PY
          cat .github/rsl-source/test_research_contract_edges.py/part-* \
            > tests/test_research_contract_edges.py
          git rm -r .github/rsl-source .github/workflows/research-layer-phase1-once.yml
      - name: Qualify Phase 1 and close the transaction
        shell: bash
        env:
          BASE_SHA: 3b06f46a13c97bd42664ff890f3524629a304339
          QUALIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          evidence_dir="var/research-layer-phase1"
          status_file="$evidence_dir/status.tsv"
          rm -rf "$evidence_dir" dist
          mkdir -p "$evidence_dir"
          : > "$status_file"
          failed=0
          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" >"$evidence_dir/${name}.log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$status_file"
            if [[ "$code" -ne 0 ]]; then
              failed=1
            fi
          }

          run_gate lock-check uv lock --check
          run_gate sync uv sync --frozen --extra dev --extra agent --extra signing
          run_gate ruff-fix uv run ruff check --fix \
            src/aspenops_nexus/research.py \
            src/aspenops_nexus/research_common.py \
            src/aspenops_nexus/research_data.py \
            src/aspenops_nexus/research_parameters.py \
            src/aspenops_nexus/research_runs.py \
            src/aspenops_nexus/research_claims.py \
            src/aspenops_nexus/research_objects.py \
            src/aspenops_nexus/research_document.py \
            src/aspenops_nexus/research_graph.py \
            src/aspenops_nexus/research_validation.py \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_contract_edges.py
          run_gate format-fix uv run ruff format \
            src/aspenops_nexus/research.py \
            src/aspenops_nexus/research_common.py \
            src/aspenops_nexus/research_data.py \
            src/aspenops_nexus/research_parameters.py \
            src/aspenops_nexus/research_runs.py \
            src/aspenops_nexus/research_claims.py \
            src/aspenops_nexus/research_objects.py \
            src/aspenops_nexus/research_document.py \
            src/aspenops_nexus/research_graph.py \
            src/aspenops_nexus/research_validation.py \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_contract_edges.py
          run_gate ruff uv run ruff check .
          run_gate ruff-format uv run ruff format --check .
          run_gate mypy uv run mypy src
          run_gate compileall uv run python -m compileall -q src scripts
          run_gate source-audit uv run python scripts/audit_source_tree.py \
            --output "$evidence_dir/source-tree-audit.json"
          run_gate bandit bash -lc '
            set -euo pipefail
            uv tool run --isolated --from "bandit==1.9.4" bandit \
              --recursive src scripts \
              --severity-level high \
              --confidence-level high \
              --format json \
              --output var/research-layer-phase1/bandit.json
            python -m json.tool var/research-layer-phase1/bandit.json >/dev/null
          '
          run_gate focused-tests uv run pytest -W error::ResourceWarning \
            tests/test_research_study.py \
            tests/test_research_schemas.py \
            tests/test_research_contract_edges.py \
            --junitxml="$evidence_dir/focused-junit.xml"
          run_gate full-pytest uv run pytest -W error::ResourceWarning \
            --cov=aspenops_nexus \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:"$evidence_dir/coverage.json" \
            --junitxml="$evidence_dir/full-junit.xml" \
            --cov-fail-under=95.0
          run_gate order uv run python scripts/run_test_order_gate.py \
            --seed 20260728 --output-dir "$evidence_dir/order"
          run_gate process-ir uv run python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$evidence_dir/process-intent-canonical.json" \
            --report-output "$evidence_dir/process-intent-report.json"
          run_gate mcp uv run python scripts/check_mcp.py
          run_gate build uv build
          run_gate wheel-metadata uv run python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$evidence_dir/wheel-metadata.json"
          run_gate demo uv run aspenops demo

          FAILED="$failed" EVIDENCE_DIR="$evidence_dir" \
            QUALIFIED_SHA="$QUALIFIED_SHA" RUN_ID="$RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" \
            python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          statuses = {}
          for line in (root / "status.tsv").read_text(encoding="utf-8").splitlines():
              name, code = line.split("\t")
              statuses[name] = int(code)

          def junit(name: str) -> dict[str, object]:
              path = root / name
              if not path.exists():
                  return {}
              xml_root = ET.parse(path).getroot()
              suite = xml_root if "tests" in xml_root.attrib else xml_root.find("testsuite")
              if suite is None:
                  return {}
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          coverage = None
          coverage_path = root / "coverage.json"
          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text(encoding="utf-8"))["totals"][
                  "percent_covered"
              ]
          failure_tail = {}
          for name, code in statuses.items():
              if code:
                  path = root / f"{name}.log"
                  failure_tail[name] = path.read_text(
                      encoding="utf-8", errors="replace"
                  ).splitlines()[-100:]
          payload = {
              "schema": "aspenops.research-layer-phase1-evidence/v1",
              "qualified_parent_sha": os.environ["QUALIFIED_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python_runtime": platform.python_version(),
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "focused_junit": junit("focused-junit.xml"),
              "full_junit": junit("full-junit.xml"),
              "branch_coverage_percent": coverage,
              "gate_status": statuses,
              "overall": "PASS" if statuses and all(code == 0 for code in statuses.values()) else "FAIL",
              "failure_tail": failure_tail,
              "boundary": (
                  "Phase 1 validates schemas and scientific evidence relationships only. "
                  "It does not open Aspen, estimate parameters, or grant engineering qualification."
              ),
          }
          Path("docs/research-layer-phase1-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$failed" -ne 0 ]]; then
            mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$QUALIFIED_SHA")
            for path in "${added[@]}"; do
              rm -rf -- "$path"
            done
            rm -f src/aspenops_nexus/research_graph.py \
              tests/test_research_contract_edges.py
            mkdir -p docs
            mv docs/research-layer-phase1-evidence.json \
              docs/research-layer-phase1-blocker.json
            git add -A
            git commit -m "test: record research layer phase 1 blocker"
            git push origin HEAD:main
            exit 1
          fi

          git add -A
          git commit -m "feat: establish research study contract layer"
          git push origin HEAD:main
