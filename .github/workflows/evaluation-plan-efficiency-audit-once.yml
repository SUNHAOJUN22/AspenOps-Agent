name: AspenOps Evaluation Plan Efficiency Audit Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aspenops-evaluation-plan-efficiency-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.issue.title == 'ASPENOPS_EVALUATION_PLAN_EFFICIENCY_AUDIT_V1_20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Apply reviewed files, benchmark and qualify
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          SELF=.github/workflows/evaluation-plan-efficiency-audit-once.yml
          PARTS=.github/evaluation-plan-efficiency-parts
          TEST=tests/test_evaluation_plan_resolution.py
          E=var/evaluation-plan-efficiency
          rm -rf "$E" dist /tmp/aspenops-evaluation-plan-wheel
          mkdir -p "$E"
          rm -f docs/EVALUATION_PLAN_EFFICIENCY_BLOCKER.json

          : > "$E/status.tsv"
          failed=0
          gate() {
            name="$1"; shift
            set +e
            "$@" >"$E/$name.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$E/status.tsv"
            [[ "$code" -eq 0 ]] || failed=1
          }

          gate apply-patch python "$PARTS/apply.py.txt"
          gate copy-test cp "$PARTS/test_evaluation_plan_resolution.py.txt" "$TEST"
          gate copy-benchmark cp "$PARTS/benchmark.py.txt" "$E/benchmark.py"
          gate copy-wheel-smoke cp "$PARTS/wheel_smoke.py.txt" "$E/wheel_smoke.py"
          rm -rf "$PARTS"
          rm -f "$SELF"

          gate sync-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate ruff-fix uv run --python 3.12 ruff check --fix src/aspenops_nexus/evaluation_plan.py "$TEST"
          gate format-fix uv run --python 3.12 ruff format src/aspenops_nexus/evaluation_plan.py "$TEST"
          gate focused-tests uv run --python 3.12 pytest -W error::ResourceWarning \
            tests/test_evaluation_plan.py \
            tests/test_evaluation_plan_write_conflicts.py \
            tests/test_batch_resource_limits.py \
            "$TEST" \
            --junitxml="$E/focused-junit.xml"
          gate performance-benchmark uv run --python 3.12 python "$E/benchmark.py"
          gate lock-check uv lock --check
          gate dependency-audit bash -lc '
            set -euo pipefail
            export UV_PREVIEW_FEATURES=json-output
            bad=0
            for platform in linux windows; do
              for version in 3.11 3.12 3.13; do
                stem=var/evaluation-plan-efficiency/audit-${platform}-${version}
                uv audit --frozen --python-platform "$platform" --python-version "$version" --output-format json >"$stem.json" 2>"$stem.log" || bad=1
                python -m json.tool "$stem.json" >/dev/null || bad=1
              done
            done
            exit "$bad"
          '
          gate ruff uv run --python 3.12 ruff check .
          gate format uv run --python 3.12 ruff format --check .
          gate mypy uv run --python 3.12 mypy src
          gate compileall uv run --python 3.12 python -m compileall -q src scripts
          gate source-audit uv run --python 3.12 python scripts/audit_source_tree.py --output "$E/source-tree-audit.json"
          gate bandit bash -lc '
            set -euo pipefail
            status=0
            uv tool run --isolated --from bandit==1.9.4 bandit -r src scripts -lll -iii -f json -o var/evaluation-plan-efficiency/bandit.json 2>var/evaluation-plan-efficiency/bandit.log || status=$?
            python -m json.tool var/evaluation-plan-efficiency/bandit.json >/dev/null
            exit "$status"
          '
          gate full-3.11 uv run --python 3.11 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=json:"$E/coverage-3.11.json" --cov-fail-under=94.5 \
            --junitxml="$E/full-3.11.xml"
          gate full-3.12 uv run --python 3.12 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=json:"$E/coverage-3.12.json" --cov-fail-under=95.0 \
            --junitxml="$E/full-3.12.xml"
          gate full-3.13 uv run --python 3.13 pytest -W error::ResourceWarning \
            --cov=aspenops_nexus --cov-branch \
            --cov-report=json:"$E/coverage-3.13.json" --cov-fail-under=94.5 \
            --junitxml="$E/full-3.13.xml"
          gate restore-312 uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing
          gate order-312 uv run --python 3.12 python scripts/run_test_order_gate.py --output-dir "$E/order"
          gate process-ir uv run --python 3.12 python scripts/validate_process_ir.py \
            examples/process-intent.example.json \
            --canonical-output "$E/process-intent-canonical.json" \
            --report-output "$E/process-intent-report.json"
          gate mcp uv run --python 3.12 python scripts/check_mcp.py
          gate benchmark-smoke uv run --python 3.12 python scripts/run_benchmark_matrix.py \
            --repo-root . --output "$E/benchmark-smoke.json" --smoke
          gate performance-policy uv run --python 3.12 python scripts/compare_benchmarks.py \
            --baseline var/benchmarks/baseline.json \
            --after var/benchmarks/after.json \
            --baseline-doc "$E/performance-baseline.md" \
            --after-doc "$E/performance-after.md" \
            --fail-on-stable-regression
          gate build uv build
          gate wheel-metadata uv run --python 3.12 python scripts/check_wheel_metadata.py \
            --dist-dir dist --output "$E/wheel-metadata.json"
          gate wheel-smoke bash -lc '
            set -euo pipefail
            uv export --frozen --extra agent --no-default-groups --no-emit-project \
              --format requirements.txt \
              --output-file var/evaluation-plan-efficiency/runtime-requirements.txt
            uv venv --python 3.12 /tmp/aspenops-evaluation-plan-wheel
            uv pip sync --python /tmp/aspenops-evaluation-plan-wheel/bin/python --require-hashes \
              var/evaluation-plan-efficiency/runtime-requirements.txt
            uv pip install --python /tmp/aspenops-evaluation-plan-wheel/bin/python --offline --no-deps dist/*.whl
            uv pip check --python /tmp/aspenops-evaluation-plan-wheel/bin/python
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops --version
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops --help >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops demo >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops scheduler --help >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops cancel --help >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops optimize --help >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/aspenops mcp --help >/dev/null
            /tmp/aspenops-evaluation-plan-wheel/bin/python var/evaluation-plan-efficiency/wheel_smoke.py
          '
          gate diff-boundary python - <<'PY'
          import subprocess
          allowed = {
              "src/aspenops_nexus/evaluation_plan.py",
              "tests/test_evaluation_plan_resolution.py",
              ".github/workflows/evaluation-plan-efficiency-audit-once.yml",
              ".github/evaluation-plan-efficiency-parts/apply.py.txt",
              ".github/evaluation-plan-efficiency-parts/test_evaluation_plan_resolution.py.txt",
              ".github/evaluation-plan-efficiency-parts/benchmark.py.txt",
              ".github/evaluation-plan-efficiency-parts/wheel_smoke.py.txt",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {unexpected}")
          PY

          if [[ "$failed" -ne 0 ]]; then
            git reset --hard "$BASE"
            rm -rf "$PARTS"
            rm -f "$SELF" "$TEST"
            python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path("var/evaluation-plan-efficiency")
          status = {}
          tails = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)
              if int(code):
                  log = evidence / f"{name}.log"
                  if log.exists():
                      tails[name] = log.read_text(errors="replace").splitlines()[-160:]
          payload = {
              "schema": "aspenops.evaluation-plan-efficiency-blocker/v1",
              "decision": "FAIL",
              "hard_gates": status,
              "failure_tail": tails,
              "source_changes_retained": False,
              "runtime_control_plane_changed": False,
              "aspen_executed": False,
          }
          Path("docs/EVALUATION_PLAN_EFFICIENCY_BLOCKER.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            git add -A .github docs src/aspenops_nexus/evaluation_plan.py tests
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test: record evaluation-plan efficiency audit blocker'
            git push origin HEAD:main
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence = Path("var/evaluation-plan-efficiency")
          status = {}
          for line in (evidence / "status.tsv").read_text().splitlines():
              name, code = line.split("\t")
              status[name] = int(code)

          def junit(path: Path) -> dict[str, float | int]:
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  raise RuntimeError(f"No testsuite in {path}")
              return {
                  "tests": int(suite.attrib.get("tests", 0)),
                  "failures": int(suite.attrib.get("failures", 0)),
                  "errors": int(suite.attrib.get("errors", 0)),
                  "skipped": int(suite.attrib.get("skipped", 0)),
                  "time_seconds": float(suite.attrib.get("time", 0.0)),
              }

          coverage = {}
          full = {}
          for version in ("3.11", "3.12", "3.13"):
              coverage_data = json.loads((evidence / f"coverage-{version}.json").read_text())
              coverage[version] = float(coverage_data["totals"]["percent_covered"])
              full[version] = junit(evidence / f"full-{version}.xml")

          benchmark = json.loads((evidence / "benchmark.json").read_text())
          payload = {
              "schema": "aspenops.evaluation-plan-efficiency-result/v1",
              "decision": "PASS",
              "benchmark": benchmark,
              "focused_tests": junit(evidence / "focused-junit.xml"),
              "full_tests": full,
              "coverage_percent": coverage,
              "hard_gates": status,
              "source_files_changed": [
                  "src/aspenops_nexus/evaluation_plan.py",
                  "tests/test_evaluation_plan_resolution.py",
              ],
              "preserved_contracts": [
                  "declared read counts",
                  "unique read ordering",
                  "output binding order and units",
                  "constraint and balance semantics",
                  "physical identity and cache keys",
                  "worker and runtime control semantics",
              ],
              "qualification_boundary": "Pure Python EvaluationPlan compilation and portable package evidence; not licensed Aspen solve certification.",
              "runtime_control_plane_changed": False,
              "aspen_executed": False,
              "parameter_estimation_executed": False,
              "dynamic_modeling_executed": False,
              "machine_learning_executed": False,
              "external_gate": "PENDING_LICENSED_WINDOWS_ASPEN_ENGINEERING_CERTIFICATION",
              "qualification_run": {
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
          }
          Path("docs/EVALUATION_PLAN_EFFICIENCY_RESULT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          Path("docs/EVALUATION_PLAN_EFFICIENCY_RESULT.md").write_text(
              "# AspenOps Evaluation Plan Efficiency Audit\n\n"
              "**PASS**\n\n"
              f"- Duplicate-read compilation speedup: {benchmark['speedup']:.3f}x\n"
              f"- Declared references: {benchmark['declared_read_references']}\n"
              f"- Unique nodes: {benchmark['unique_read_nodes']}\n"
              "- Runtime control plane changed: no\n"
              "- Licensed Windows/Aspen engineering certification: pending\n",
              encoding="utf-8",
          )
          PY

          rm -f docs/EVALUATION_PLAN_EFFICIENCY_BLOCKER.json
          git add -A .github docs src/aspenops_nexus/evaluation_plan.py tests/test_evaluation_plan_resolution.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'perf: deduplicate evaluation-plan node resolution'
          git push origin HEAD:main
      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --reason completed --comment "Evaluation-plan efficiency audit finished. Inspect docs/EVALUATION_PLAN_EFFICIENCY_RESULT.json or docs/EVALUATION_PLAN_EFFICIENCY_BLOCKER.json on main."
