name: Apply skill-native V15 fix 2
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skill_native_v15_fix2.py
      - .github/workflows/apply-skill-native-v15-fix2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aspenops-skill-native-v15
  cancel-in-progress: false
jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.16'
          python-version: '3.12'
      - run: python scripts/apply_skill_native_v15_fix2.py
      - shell: bash
        run: rm -f scripts/apply_skill_native_v15.py scripts/apply_skill_native_v15_fix1.py scripts/apply_skill_native_v15_fix2.py .github/workflows/apply-skill-native-v15.yml .github/workflows/apply-skill-native-v15-fix1.yml .github/workflows/apply-skill-native-v15-fix2.yml
      - run: uv sync --frozen --extra dev --extra agent --extra signing
      - run: uv run python scripts/validate_skill.py --root . --report artifacts/skill-validation-v15.json
      - run: uv run pytest tests/test_scientific_contracts_v15.py -q
      - run: uv run ruff check src/aspenops_nexus/scientific_contracts_v15.py tests/test_scientific_contracts_v15.py scripts/validate_skill.py
      - run: uv run mypy src/aspenops_nexus/scientific_contracts_v15.py
      - name: Commit verified V15 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finalize AspenOps skill-native V15'
          git push origin HEAD:main
