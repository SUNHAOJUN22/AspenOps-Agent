name: V4 exact active-runner candidate export once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-active-runner-export-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-active-runner-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
      - name: Install exact AspenOps environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
      - name: Apply browser-inclusive active-runner transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_six_repository_active_gate.py')
          text = runner.read_text(encoding='utf-8')
          old = '''        ("npm", "run", "test:science"),
        ("npm", "run", "build"),
    ),
'''
          new = '''        ("npm", "run", "test:science"),
        ("npm", "run", "build"),
        ("npm", "run", "test:ui"),
    ),
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one ResinDB command tail, found {text.count(old)}')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('tests/test_six_repository_active_runner.py')
          test.write_text(
              '''from __future__ import annotations

import runpy
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
NAMESPACE = runpy.run_path(str(ROOT / "scripts" / "run_six_repository_active_gate.py"))
COMMANDS = NAMESPACE["COMMANDS"]


def test_resindb_active_cycle_includes_real_browser_gate() -> None:
    commands = COMMANDS["resindb"]

    assert commands[-2] == ("npm", "run", "build")
    assert commands[-1] == ("npm", "run", "test:ui")
    assert commands.count(("npm", "run", "test:ui")) == 1


def test_all_active_commands_are_immutable_argument_vectors() -> None:
    forbidden = ("&&", "||", ";", "shell=True")

    for group in COMMANDS.values():
        assert isinstance(group, tuple)
        assert group
        for command in group:
            assert isinstance(command, tuple)
            assert command
            assert all(isinstance(argument, str) and argument for argument in command)
            assert not any(token in argument for token in forbidden for argument in command)
''',
              encoding='utf-8',
              newline='\n',
          )
          for controller in (
              Path('.github/workflows/v4-active-runner-hardening-once.yml'),
              Path('.github/workflows/v4-active-runner-export-once.yml'),
          ):
              controller.unlink(missing_ok=False)
          PY
          uv run ruff format scripts/run_six_repository_active_gate.py tests/test_six_repository_active_runner.py
          git diff --check
      - name: Create exact controller-free candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: include ResinDB browser gate in active qualification'
          echo 'sha='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Qualify exact AspenOps candidate
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/refresh_current_main_readme.py --check
          uv run python -m py_compile scripts/run_six_repository_active_gate.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -W error::ResourceWarning -q
          uv run python scripts/verify_delivery.py --root . --output /tmp/aspenops-v4-delivery.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/aspenops-v4-delivery.json').read_text(encoding='utf-8'))
          if report.get('status') != 'PASS':
              raise SystemExit(json.dumps(report, indent=2, sort_keys=True))
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.y*ml'))
          expected = [
              'ci.yml',
              'generate-performance-evidence.yml',
              'licensed-aspen-certification.yml',
              'windows-control-plane.yml',
          ]
          if workflows != expected:
              raise SystemExit(f'unexpected permanent workflows: {workflows}')
          PY
          git ls-remote --heads origin > /tmp/aspen-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/aspen-v4-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
          git diff --exit-code
          git diff --check
      - name: Package exact qualified AspenOps candidate
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/aspen-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          git archive --format=tar.gz --output "$bundle/candidate.tar.gz" HEAD
          printf '%s\n' \
            '.github/workflows/v4-active-runner-hardening-once.yml' \
            '.github/workflows/v4-active-runner-export-once.yml' \
            > "$bundle/DELETIONS.txt"
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload exact qualified AspenOps candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspen-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_ASPENOPS_EXACT_EXPORT outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded controllers=removed resindb_browser=active-cycle argv=immutable branch=main-only"
