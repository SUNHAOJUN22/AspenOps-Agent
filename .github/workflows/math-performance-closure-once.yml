name: Math and performance closure final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/math-performance-closure-once.yml

permissions:
  contents: write

concurrency:
  group: math-performance-closure-final
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: 34d82c31ada6831247a2fd74da582083e8f71e0b
      TRUSTED_HEAD: fa6c3123ea0df3aaf1c8fd8d993483ef66dc18e5
      WORKFLOW_PATH: .github/workflows/math-performance-closure-once.yml
    steps:
      - name: Checkout registration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify trusted source tree and recover audited helpers
        shell: bash
        run: |
          set -euo pipefail
          echo verify-baseline > /tmp/math-performance-stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git merge-base "$BASE_SHA" "$TRUSTED_HEAD")" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" "$TRUSTED_HEAD")"
          test "$(git diff --name-only "$TRUSTED_HEAD" HEAD)" = "$WORKFLOW_PATH"
          git diff --check "$TRUSTED_HEAD" HEAD
          git show 091f8a5f7747763fddd01742cfd6761a120ef1cd:.github/math-performance-closure/benchmark.py \
            > /tmp/math-performance-benchmark.py
          git show 1643d3b1e447671b24f1dc0cc159c964eeae57dc:.github/math-performance-closure/closure.py \
            > /tmp/math-performance-closure.py
          python -m py_compile \
            /tmp/math-performance-benchmark.py \
            /tmp/math-performance-closure.py

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Sync frozen baseline environment
        shell: bash
        run: |
          set -euo pipefail
          echo sync-baseline > /tmp/math-performance-stage
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev --extra agent --extra signing

      - name: Measure current dispatch baseline
        shell: bash
        run: |
          set -euo pipefail
          echo benchmark-baseline > /tmp/math-performance-stage
          uv run python /tmp/math-performance-benchmark.py \
            --output /tmp/dispatch-before.json
          cat /tmp/dispatch-before.json

      - name: Apply mathematical and dispatch improvements
        shell: bash
        run: |
          set -euo pipefail
          echo apply-improvements > /tmp/math-performance-stage
          uv run python /tmp/math-performance-closure.py apply
          uv run ruff check --fix \
            src/aspenops_nexus/pool.py \
            src/aspenops_nexus/evaluation.py \
            tests/test_math_performance_closure.py
          uv run ruff format \
            src/aspenops_nexus/pool.py \
            src/aspenops_nexus/evaluation.py \
            tests/test_math_performance_closure.py
          git diff --check

      - name: Measure optimized dispatch and enforce policy
        shell: bash
        run: |
          set -euo pipefail
          echo benchmark-optimized > /tmp/math-performance-stage
          uv run python /tmp/math-performance-benchmark.py \
            --output /tmp/dispatch-after.json
          uv run python /tmp/math-performance-closure.py compare \
            --before /tmp/dispatch-before.json \
            --after /tmp/dispatch-after.json \
            --output /tmp/performance.json
          cat /tmp/performance.json

      - name: Run focused mathematical and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          echo focused-tests > /tmp/math-performance-stage
          uv run pytest \
            -W error::ResourceWarning \
            -W error::pytest.PytestUnraisableExceptionWarning \
            tests/test_math_performance_closure.py \
            tests/test_finite_aggregation.py \
            tests/test_runtime_closure.py \
            tests/test_cache.py \
            tests/test_scheduler_edge_cases.py \
            --junitxml=/tmp/focused.xml

      - name: Run formatting typing compile and security gates
        shell: bash
        run: |
          set -euo pipefail
          echo quality-gates > /tmp/math-performance-stage
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python -m compileall -q src tests scripts
          uvx --from bandit==1.8.6 bandit \
            -q -f json -o /tmp/bandit-all.json -r src/aspenops_nexus || true
          uvx --from bandit==1.8.6 bandit \
            -q -lll -iii -r src/aspenops_nexus

      - name: Run full Python test matrix with coverage
        shell: bash
        run: |
          set -euo pipefail
          echo full-test-matrix > /tmp/math-performance-stage
          for version in 3.11 3.12 3.13; do
            env -u UV_PYTHON uv python install "$version"
            rm -rf .venv
            env -u UV_PYTHON uv sync --python "$version" --frozen \
              --extra dev --extra agent --extra signing
            tracer=()
            if [[ "$version" == "3.13" ]]; then
              tracer=(env PYTHONTRACEMALLOC=10)
            fi
            "${tracer[@]}" env -u UV_PYTHON uv run --python "$version" pytest \
              -W error::ResourceWarning \
              -W error::pytest.PytestUnraisableExceptionWarning \
              --cov=aspenops_nexus \
              --cov-report="json:/tmp/coverage-$version.json" \
              --junitxml="/tmp/junit-$version.xml"
          done

      - name: Audit dependencies build and smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          echo package-security > /tmp/math-performance-stage
          rm -rf .venv dist build
          env -u UV_PYTHON uv sync --python 3.12 --frozen \
            --extra dev --extra agent --extra signing
          env -u UV_PYTHON uv export --python 3.12 --frozen --all-extras --no-dev \
            --format requirements-txt --no-hashes \
            > /tmp/runtime-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit \
            -r /tmp/runtime-requirements.txt
          uv run python -m build
          uv venv --python 3.12 /tmp/aspenops-wheel-smoke
          uv pip install --python /tmp/aspenops-wheel-smoke/bin/python \
            --no-deps dist/*.whl
          /tmp/aspenops-wheel-smoke/bin/aspenops --help \
            > /tmp/aspenops-help.txt
          /tmp/aspenops-wheel-smoke/bin/aspenops-mcp --help \
            > /tmp/aspenops-mcp-help.txt

      - name: Generate evidence and publish qualified changes
        shell: bash
        run: |
          set -euo pipefail
          echo publish-qualified > /tmp/math-performance-stage
          uv run python /tmp/math-performance-closure.py report \
            --performance /tmp/performance.json
          rm -f "$WORKFLOW_PATH"
          rm -f docs/MATH_PERFORMANCE_CLOSURE_BLOCKER.json
          allowed='^(src/aspenops_nexus/(pool|evaluation)\.py|tests/test_math_performance_closure\.py|docs/MATH_PERFORMANCE_CLOSURE_RESULT\.(json|md)|\.github/workflows/math-performance-closure-once\.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          git diff --check
          git add -A
          git commit -m "perf: harden math and reduce dispatch overhead"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main

      - name: Publish fail-closed blocker
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cat /tmp/math-performance-stage 2>/dev/null || echo unknown)"
          export FAILED_STAGE="$stage"
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          rm -f "$WORKFLOW_PATH"
          mkdir -p docs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "aspenops.math-performance-closure-blocker/v1",
              "decision": "BLOCKED",
              "source_baseline": os.environ["BASE_SHA"],
              "registration_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "failed_stage": os.environ["FAILED_STAGE"],
              "source_changes_retained": False,
              "aspen_executed": False,
          }
          Path("docs/MATH_PERFORMANCE_CLOSURE_BLOCKER.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git add -A
          git commit -m "test: record math performance closure blocker"
          git fetch --no-tags origin main
          if test "$(git rev-parse origin/main)" = "$GITHUB_SHA"; then
            git push origin HEAD:main
          fi
