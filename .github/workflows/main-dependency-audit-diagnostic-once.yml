name: Main dependency audit diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-dependency-audit-diagnostic-once.yml

permissions:
  contents: write

concurrency:
  group: aspenops-main-dependency-audit-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Capture all six audit outcomes
        shell: bash
        env:
          UV_PREVIEW_FEATURES: json-output
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          mkdir -p /tmp/audits
          for platform in linux windows; do
            for version in 3.11 3.12 3.13; do
              stem="/tmp/audits/${platform}-py${version}"
              set +e
              uv audit --frozen \
                --python-platform "$platform" \
                --python-version "$version" \
                --output-format json > "${stem}.json" 2> "${stem}.log"
              status=$?
              set -e
              printf '%s\n' "$status" > "${stem}.status"
            done
          done
      - name: Publish diagnostic and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          records = []
          for platform in ("linux", "windows"):
              for version in ("3.11", "3.12", "3.13"):
                  stem = Path(f"/tmp/audits/{platform}-py{version}")
                  raw = stem.with_suffix(".json").read_text(encoding="utf-8", errors="replace")
                  error = stem.with_suffix(".log").read_text(encoding="utf-8", errors="replace")
                  status = int(stem.with_suffix(".status").read_text().strip())
                  try:
                      parsed = json.loads(raw)
                  except json.JSONDecodeError:
                      parsed = None
                  records.append({
                      "platform": platform,
                      "python": version,
                      "exit_code": status,
                      "json_valid": parsed is not None,
                      "result": parsed,
                      "stdout": raw if parsed is None else None,
                      "stderr": error,
                  })
          payload = {
              "schema": "aspenops.main-dependency-audit-diagnostic/v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "records": records,
          }
          Path("docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          lines = [
              "# AspenOps main dependency-audit diagnostic",
              "",
              f"- source SHA: `{payload['source_sha']}`;",
              f"- workflow run: `{payload['run_id']}`;",
              "- real Aspen executed: `false`;",
              "",
              "| Platform | Python | Exit | JSON | Stderr |",
              "|---|---:|---:|---|---|",
          ]
          for item in records:
              stderr = item["stderr"].strip().replace("|", "\\|").replace("\n", " ")
              if len(stderr) > 400:
                  stderr = stderr[:400] + "...[truncated]"
              lines.append(
                  f"| {item['platform']} | {item['python']} | {item['exit_code']} | "
                  f"{item['json_valid']} | {stderr or '-'} |"
              )
          Path("docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-dependency-audit-diagnostic-once.yml
          git add docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.json \
            docs/MAIN_DEPENDENCY_AUDIT_DIAGNOSTIC.md
          git commit -m "test: record dependency audit diagnostic"
          git push origin HEAD:main
