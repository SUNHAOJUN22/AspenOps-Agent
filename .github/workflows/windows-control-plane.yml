name: Windows control-plane contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force var/ci | Out-Null
          uv sync --extra dev --extra windows --extra agent *>&1 |
            Tee-Object -FilePath var/ci/sync.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff
        shell: pwsh
        run: |
          uv run ruff check src tests *>&1 |
            Tee-Object -FilePath var/ci/ruff.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict mypy
        shell: pwsh
        run: |
          uv run mypy src *>&1 |
            Tee-Object -FilePath var/ci/mypy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Process and backend contracts
        shell: pwsh
        run: |
          uv run pytest -W error::ResourceWarning `
            tests/test_windows_job.py `
            tests/test_windows_job_edges.py `
            tests/test_aspen_process_ownership.py `
            tests/test_convergence.py `
            tests/test_backends_convergence.py `
            tests/test_v2_reliability.py `
            tests/test_singleflight.py `
            tests/test_worker_contracts.py *>&1 |
            Tee-Object -FilePath var/ci/contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-control-plane-diagnostics
          path: var/ci
          if-no-files-found: ignore
