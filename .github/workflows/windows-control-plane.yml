name: Windows control-plane contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspenops-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-contracts:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile and sync frozen dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force var/ci | Out-Null
          uv lock --check *>&1 |
            Tee-Object -FilePath var/ci/uv-lock.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev --extra windows --extra agent --extra signing *>&1 |
            Tee-Object -FilePath var/ci/uv-sync.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath scripts/setup_windows.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List * | Out-String |
              Tee-Object -FilePath var/ci/powershell-parse.log
            throw "PowerShell parser found errors in scripts/setup_windows.ps1"
          }
          "PowerShell syntax OK" | Set-Content var/ci/powershell-parse.log
      - name: Exercise PowerShell bootstrap helpers
        shell: pwsh
        run: |
          . ./scripts/setup_windows.ps1 -LibraryMode

          $contractRoot = Join-Path $env:RUNNER_TEMP "aspenops-bootstrap-contracts"
          Remove-Item -LiteralPath $contractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $contractRoot | Out-Null

          $valid = Join-Path $contractRoot "valid.env"
          @(
            "ASPENOPS_BACKEND=mock"
            'QUOTED_VALUE="hello world"'
          ) | Set-Content -LiteralPath $valid
          Import-DotEnv -Path $valid
          if ($env:ASPENOPS_BACKEND -ne "mock") {
            throw "Valid dotenv backend value was not imported"
          }
          if ($env:QUOTED_VALUE -ne "hello world") {
            throw "Quoted dotenv value was not normalized"
          }

          $secret = "DO_NOT_ECHO_SECRET"
          $duplicate = Join-Path $contractRoot "duplicate.env"
          @(
            "SECRET_VALUE=$secret"
            "secret_value=second"
          ) | Set-Content -LiteralPath $duplicate
          $duplicateRejected = $false
          try {
            Import-DotEnv -Path $duplicate
          } catch {
            $message = $_.Exception.Message
            if ($message -match [regex]::Escape($secret)) {
              throw "Duplicate dotenv failure leaked a raw secret"
            }
            if ($message -notmatch "Duplicate environment variable at line 2") {
              throw
            }
            $duplicateRejected = $true
          }
          if (-not $duplicateRejected) {
            throw "Duplicate dotenv variable was accepted"
          }

          $unbalanced = Join-Path $contractRoot "unbalanced.env"
          ('SECRET_VALUE="' + $secret) | Set-Content -LiteralPath $unbalanced
          $unbalancedRejected = $false
          try {
            Import-DotEnv -Path $unbalanced
          } catch {
            $message = $_.Exception.Message
            if ($message -match [regex]::Escape($secret)) {
              throw "Unbalanced dotenv failure leaked a raw secret"
            }
            if ($message -notmatch "Unbalanced quoted value at line 1") {
              throw
            }
            $unbalancedRejected = $true
          }
          if (-not $unbalancedRejected) {
            throw "Unbalanced dotenv value was accepted"
          }

          $script:versions = @(
            [version]"0.11.14"
            [version]"0.11.14"
            [version]"0.11.14"
            [version]"0.11.16"
          )
          $script:versionIndex = 0
          $script:selfUpdateCalled = $false
          $script:wingetVerbs = @()
          function Get-UvVersion {
            $value = $script:versions[$script:versionIndex]
            $script:versionIndex += 1
            return $value
          }
          function Try-UvSelfUpdate {
            $script:selfUpdateCalled = $true
            return $false
          }
          function Invoke-WingetUv {
            param([string]$Verb)
            $script:wingetVerbs += $Verb
            return $true
          }

          $resolvedVersion = Ensure-UvVersion
          if ($resolvedVersion -ne [version]"0.11.16") {
            throw "Upgrade fallback did not reach the required uv version"
          }
          if (-not $script:selfUpdateCalled) {
            throw "Standalone uv self-update path was not attempted"
          }
          if (($script:wingetVerbs -join ",") -ne "upgrade,install") {
            throw "winget upgrade/install fallback order was not preserved"
          }

          "PowerShell bootstrap contracts passed" |
            Set-Content var/ci/powershell-contracts.log
      - name: Ruff
        shell: pwsh
        run: |
          uv run ruff check . *>&1 |
            Tee-Object -FilePath var/ci/ruff.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff format
        shell: pwsh
        run: |
          uv run ruff format --check . *>&1 |
            Tee-Object -FilePath var/ci/ruff-format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict mypy
        shell: pwsh
        run: |
          uv run mypy src *>&1 |
            Tee-Object -FilePath var/ci/mypy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Process, scheduler, archive, backend, certification, and workflow contracts
        shell: pwsh
        run: |
          uv run pytest -W error::ResourceWarning `
            tests/test_windows_job.py `
            tests/test_windows_job_edges.py `
            tests/test_aspen_process_ownership.py `
            tests/test_batch_backend_default.py `
            tests/test_cli_output_policy.py `
            tests/test_config_registry_edge_cases.py `
            tests/test_config_resource_budgets.py `
            tests/test_documentation_contracts.py `
            tests/test_artifact_upload_governance.py `
            tests/test_real_backend_state_policy.py `
            tests/test_licensed_path_gate.py `
            tests/test_convergence.py `
            tests/test_backends_convergence.py `
            tests/test_v2_reliability.py `
            tests/test_singleflight.py `
            tests/test_worker_contracts.py `
            tests/test_worker_protocol_hardening.py `
            tests/test_pool_manager_creation.py `
            tests/test_scheduler_active_leases.py `
            tests/test_provenance_zip_safety.py `
            tests/test_archive_safety_complete.py `
            tests/test_licensed_bundle_integrity.py `
            tests/test_licensed_certification_cli.py `
            tests/test_licensed_certification_workflow.py `
            tests/test_workflow_governance.py `
            tests/test_wheel_smoke_governance.py `
            --junitxml=var/ci/windows-contracts.xml `
            --durations=20 *>&1 |
            Tee-Object -FilePath var/ci/contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows CLI smoke
        shell: pwsh
        run: |
          uv run aspenops --version *>&1 |
            Tee-Object -FilePath var/ci/cli-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops --help *> var/ci/cli-help.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run aspenops doctor *> var/ci/doctor.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-control-plane-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
