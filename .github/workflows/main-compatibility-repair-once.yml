name: Main compatibility repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-compatibility-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - name: Remove the one-time workflow from the test worktree
        shell: bash
        run: rm -f .github/workflows/main-compatibility-repair-once.yml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Repair README, lock evidence and precise drift assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          needle = "## 自动测试与质量门\n\n![自动测试矩阵]"
          block = """## 自动测试与质量门

          ### 可重跑、失败关闭的测试证据

          标准 workflow 使用以下稳定令牌和命名合同：

          ```text
          github.run_id
          github.run_attempt
          if-no-files-found: error
          scripts/render_test_dashboard.py
          test-dashboard-quality.html
          test-dashboard-windows.html
          test-dashboard-licensed.html
          ```

          artifact 名称绑定 `github.run_id` 与 `github.run_attempt`，避免不同 rerun/attempt
          相互覆盖；缺少证据时 `if-no-files-found: error` 必须失败。测试仪表板由
          `scripts/render_test_dashboard.py` 生成，分别输出 Linux quality、Windows 和
          licensed Mock 范围的 HTML/SVG 证据。

          ![自动测试矩阵]""".replace("          ", "")
          if needle not in readme:
              raise RuntimeError("README automated-test insertion point is missing")
          readme_path.write_text(readme.replace(needle, block, 1), encoding="utf-8")

          test_path = Path("tests/test_runtime_execution_authorization.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = 'with pytest.raises(ValueError, match="does not match"):'
          new = 'with pytest.raises(ValueError, match="evidence hash changed"):'
          if test_text.count(old) != 1:
              raise RuntimeError("Expected one legacy runtime-authorization assertion")
          test_path.write_text(test_text.replace(old, new, 1), encoding="utf-8")

          def normalized_sha(path: Path) -> str:
              payload = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              return hashlib.sha256(payload).hexdigest()

          evidence_path = Path("docs/lock-sync-evidence.json")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          evidence.update(
              {
                  "hash_normalization": "text-newlines-lf",
                  "lock_check": "PASS",
                  "mcp_requirement": "mcp>=1.9,<2",
                  "pyproject_sha256": normalized_sha(Path("pyproject.toml")),
                  "source_sha": "main-cryptography-50-security-refresh",
                  "uv_lock_sha256": normalized_sha(Path("uv.lock")),
                  "uv_version": subprocess.check_output(
                      ["uv", "--version"], text=True
                  ).strip(),
              }
          )
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run exact compatibility gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev --extra agent --extra signing
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -W error::ResourceWarning \
            tests/test_artifact_upload_governance.py \
            tests/test_test_dashboard.py \
            tests/test_ci_closure_gates.py \
            tests/test_runtime_execution_authorization.py \
            tests/test_phase7_coverage_closure.py
      - name: Commit compatibility repairs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-compatibility-repair-once.yml
          git add README.md docs/lock-sync-evidence.json \
            tests/test_runtime_execution_authorization.py
          git commit -m "fix: align README and lock evidence with security refresh"
          git push origin HEAD:main
