[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aspenops-nexus"
version = "1.0.0"
description = "A deterministic, process-isolated and license-aware Aspen execution fabric for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SUNHAOJUN22"}]
keywords = ["aspen-plus", "hysys", "mcp", "codex", "claude-code", "process-simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
windows = ["pywin32>=306; platform_system == 'Windows'"]
agent = ["mcp>=1.9"]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-psutil>=5.9",
  "types-pywin32>=306",
]

[project.scripts]
aspenops = "aspenops_nexus.cli:main"
aspenops-mcp = "aspenops_nexus.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aspenops_nexus"]

[tool.hatch.build]
include = [
  "src/aspenops_nexus/**/*.py",
  "src/aspenops_nexus/data/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aspenops_nexus/cache.py" = ["E501"]
"src/aspenops_nexus/pool.py" = ["E501"]
"src/aspenops_nexus/scheduler.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aspenops_nexus"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["aspen_real: requires licensed Windows Aspen installation"]
