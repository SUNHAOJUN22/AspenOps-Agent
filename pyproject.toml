[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aspenops-agent"
dynamic = ["version"]
description = "A deterministic, process-isolated, license-aware Aspen Plus and HYSYS execution runtime for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SUNHAOJUN22"}]
keywords = ["aspen-plus", "hysys", "mcp", "codex", "claude-code", "process-simulation", "digital-twin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
windows = ["pywin32>=306; platform_system == 'Windows'"]
agent = ["mcp>=1.9"]
report = ["matplotlib>=3.9", "reportlab>=4.2"]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-psutil>=5.9",
  "types-pywin32>=306",
]

[project.scripts]
aspenops = "aspenops.cli:main"
aspenops-mcp = "aspenops.mcp_server:main"

[tool.hatch.version]
path = "src/aspenops/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aspenops"]

[tool.hatch.build]
include = [
  "src/aspenops/**/*.py",
  "src/aspenops/data/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aspenops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["aspen_real: requires licensed Windows Aspen installation"]
